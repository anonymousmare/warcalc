<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLOP Sat Loss</title>
<style>
/* the house look, Warcalc's Grey theme */
:root{
  color-scheme:dark;
  --bg:#272b30; --text:#c8c8c8; --text-dim:#8b9198; --strong:#fff;
  --sunken:#1c1e22; --raised:#2e3338; --border:#1c1e22; --border-soft:rgba(0,0,0,.6);
  --accent:#4ab9db;
  --btn-default-a:#484e55; --btn-default-b:#313539;
  --btn-info-a:#74cae3; --btn-info-b:#4ab9db;
  --btn-ink:#fff; --btn-shadow:0 -1px 0 rgba(0,0,0,.4);
  --input-bg:#fff; --input-ink:#22262a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --neg:#f17a77;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);padding:20px 16px}
.wrap{max-width:1100px;margin:0 auto}

.picks{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.btn{
  flex:1 1 auto;border:1px solid var(--border-soft);border-radius:4px;
  padding:6px 10px;font:500 13px var(--font);color:var(--btn-ink);cursor:pointer;white-space:nowrap;
  text-shadow:var(--btn-shadow);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.btn:hover{filter:brightness(1.14)}
.btn:active{filter:brightness(.9)}
.btn:focus-visible{outline:2px solid var(--btn-info-a);outline-offset:1px}
.btn.active{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}

.count{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 6px}
.count label{color:var(--text-dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.count input{
  width:140px;text-align:center;font:600 18px var(--font);padding:5px 8px;
  background:var(--input-bg);color:var(--input-ink);border:1px solid var(--border-soft);border-radius:3px;
}
.count input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.note{text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:14px}

.panel{background:var(--raised);border:1px solid var(--border);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:4px 12px;text-align:right}
th{position:sticky;top:0;background:var(--sunken);color:var(--strong);font-weight:600;font-size:12px;
  letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border-soft)}
td:first-child,th:first-child{text-align:center}
tbody tr:nth-child(even){background:rgba(0,0,0,.12)}
td.loss{color:var(--neg)}
td.zero{color:var(--text-dim)}
tr.cap td{border-bottom:1px solid var(--text-dim)}
tr.you td{background:var(--btn-info-b);color:#fff;font-weight:700}
.scroll{max-height:70vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="picks" id="picks" role="group" aria-label="Building"></div>

  <div class="count">
    <label for="n">How many you have</label>
    <input type="number" id="n" min="0" step="1" value="0" inputmode="numeric">
  </div>
  <p class="note" id="note"></p>

  <div class="panel">
    <div class="scroll" id="scroll">
      <table>
        <thead><tr><th>Number</th><th>Total penalty</th><th>Total loss</th><th>Increase</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// [label, sat each building costs on its own, soft cap, divisor]
// past the soft cap the environment costs roundup((n − cap)² / divisor) more
const KINDS = [
  ["Basic mines",            2, 10, 10],
  ["Mech mines",             1, 20,  5],
  ["Coffee farms",           1, 15, 10],
  ["Plastic factories",      1,  7,  5],
  ["Frackers/combusts",      2,  5,  5],
  ["Basic factories",        1, 20, 10],
  ["Advanced factories",     1,  5,  5],
  ["Barracks/DNA",           0,  1,  1]
];
const $ = id => document.getElementById(id);
const penalty = (n, cap, div) => n > cap ? Math.ceil((n - cap) ** 2 / div) : 0;
const fmt = v => v.toLocaleString();

let pick = 0;
try { const s = +localStorage.getItem("satloss.pick"); if (s >= 0 && s < KINDS.length) pick = s; } catch (e) {}

$("picks").innerHTML = KINDS.map((k, i) => `<button class="btn" type="button" data-i="${i}">${k[0]}</button>`).join("");
$("picks").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  pick = +b.dataset.i;
  try { localStorage.setItem("satloss.pick", pick); } catch (e) {}
  render(true);
});
$("n").addEventListener("input", () => render(true));

function render(jump) {
  const [label, per, cap, div] = KINDS[pick];
  document.querySelectorAll("#picks .btn").forEach((b, i) => {
    b.classList.toggle("active", i === pick);
    b.setAttribute("aria-pressed", i === pick);
  });
  const have = Math.max(0, Math.floor(+$("n").value || 0));
  const start = have > 0 ? Math.min(cap, have) : cap;
  const end = have > 200 ? have + 25 : 200;
  $("note").textContent = `${label}: soft cap ${cap}, ${per} sat each, ` +
    `penalty past the cap is roundup((n − ${cap})² / ${div})`;

  const loss = n => per * n + penalty(n, cap, div);
  let html = "";
  for (let n = start; n <= end; n++) {
    const p = penalty(n, cap, div), t = loss(n), inc = n > 0 ? t - loss(n - 1) : 0;
    const cls = [n === have ? "you" : "", n === cap ? "cap" : ""].join(" ").trim();
    html += `<tr${cls ? ` class="${cls}"` : ""}${n === have ? ' id="you"' : ""}>` +
      `<td>${n}</td>` +
      `<td class="${p ? "loss" : "zero"}">${fmt(p)}</td>` +
      `<td class="${t ? "loss" : "zero"}">${fmt(t)}</td>` +
      `<td class="${inc ? "loss" : "zero"}">+${fmt(inc)}</td></tr>`;
  }
  $("rows").innerHTML = html;

  const row = $("you"), box = $("scroll");
  if (jump) box.scrollTop = row ? row.offsetTop - box.clientHeight / 2 + row.offsetHeight / 2 : 0;
}
render(false);
</script>
</body>
</html>
