      const mid = (lo + hi) >> 1;                      // then walk it back down
      rows[cheap].size = mid;
      const t = check();
      calls++;
      if (t && t.ok){ hi = mid; v = t; } else lo = mid;
    }
    rows[cheap].size = hi;
    v = check();
    calls++;
  }

  /* shave any slack back off, priciest stack first, by bisection */
  const order = rows.map((u, i) => i).sort((a, b) => leaned(rows[b]) - leaned(rows[a]));
  for (const i of order){
    if (!rows[i].size || calls > 120 || Date.now() > deadline) continue;
    const keep = rows[i].size;
    rows[i].size = 0;                       // can the stack go entirely?
    let t = check();
    calls++;
    if (t && t.ok){ v = t; repaired = true; continue; }
    let lo = 0, hi = keep;                  // lo fails, hi passes
    while (lo + 1 < hi && calls < 120 && Date.now() < deadline){
      const mid = (lo + hi) >> 1;
      rows[i].size = mid;
      t = check();
      calls++;
      if (t && t.ok){ hi = mid; v = t; } else lo = mid;
    }
    rows[i].size = hi;
    if (hi < keep) repaired = true;
  }
  rows = rows.filter(u => u.size > 0);    // the last check is of the rows handed back
  v = check() || v;
  calls++;
  return {rows, v, calls, ok:true, repaired};
}

/* ---- run ---------------------------------------------------------- */
let solveBusy = false, solveHalt = false, solveLast = null;

/* Handing control back with setTimeout(0) is fine while the tab is on top,
   but a background tab clamps timers to one a second (and after five minutes
   Chrome drops that to one a minute), which used to leave the search crawling
   the moment you switched away. A MessageChannel task is not throttled, so
   the loop keeps full speed hidden. Hidden, it also takes much longer slices:
   nothing is being painted, so there is no one to hand the frame back to. */
const solveYield = (() => {
  if (typeof MessageChannel !== "function") return cb => setTimeout(cb, 0);
  const chan = new MessageChannel();
  let waiting = [];
  chan.port1.onmessage = () => { const q = waiting; waiting = []; for (const cb of q) cb(); };
  return cb => { waiting.push(cb); chan.port2.postMessage(0); };
})();
const breathe = () => new Promise(solveYield);
const sliceMs = () => (document.hidden ? 250 : 30);

/* a search that finishes while you are off in another tab says so in the
   title, since the page itself is not on screen to be noticed */
let solveTitle = null;
function flagDone(text){
  if (!document.hidden || solveTitle) return;
  solveTitle = document.title;
  document.title = `${text} — ${solveTitle}`;
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && solveTitle){ document.title = solveTitle; solveTitle = null; }
});

function solveTypeBoxes(){
  return [...document.querySelectorAll("[data-solve-type]")];
}
function solveLeanBoxes(){

}

function syncSolveSide(){

  const aliLean = document.querySelector('[data-solve-lean="Alicorns"]');

    ali.disabled = side !== "defender";
    if (side !== "defender") ali.checked = false;
    ali.parentElement.style.opacity = side === "defender" ? "1" : ".4";

  if (aliLean) aliLean.disabled = side !== "defender";

/* ---- nation lean ---------------------------------------------------
   Six numbers and the preset that most recently filled them in. They
   outlive the tab: which nation you play for is not something to retype
   every time you open the calculator. */
const LS_LEAN = "warcalc.solverLean";

function readLean(){
  const lean = {};
  solveLeanBoxes().forEach(b => { lean[b.dataset.solveLean] = leanOf({x: b.value}, "x"); });
  SOLVE_TYPES.forEach(t => { if (!(t in lean)) lean[t] = 1; });
  return lean;
}

/* paint the cells, name whichever nation the numbers add up to, and save */
function paintLean(save){
  const lean = readLean();
  const key = matchNation(lean);
  const sel = document.getElementById("solveNation");
  if (sel) sel.value = key;
  const note = document.getElementById("solveNationNote");
  if (note) note.textContent = (NATIONS[key] || {}).note || "";
  solveLeanBoxes().forEach(b => {
    const cell = b.closest(".solve-type");
    if (!cell) return;
    const v = lean[b.dataset.solveLean];
    cell.classList.toggle("lean-plenty", v < 1);
    cell.classList.toggle("lean-scarce", v > 1);
  });
  if (save !== false) store.set(LS_LEAN, {nation: key, lean});
  return lean;
}

function applyNation(key, save){
  if (key === "custom") return paintLean(save);
  const lean = nationLean(key);
  solveLeanBoxes().forEach(b => { b.value = String(lean[b.dataset.solveLean]); });
  return paintLean(save);
}

function setupLean(){
  const sel = document.getElementById("solveNation");
  sel.innerHTML = Object.entries(NATIONS)
    .map(([k, n]) => `<option value="${esc(k)}">${esc(n.name)}</option>`).join("");
  sel.addEventListener("change", () => applyNation(sel.value));
  solveLeanBoxes().forEach(b => {
    b.addEventListener("change", () => { b.value = String(leanOf({x: b.value}, "x")); paintLean(); });
    b.addEventListener("input", () => paintLean());
  });
  document.getElementById("btnLeanEven").addEventListener("click", () => applyNation("even"));

  const saved = store.get(LS_LEAN, null);
  if (saved && saved.lean){
    solveLeanBoxes().forEach(b => { b.value = String(leanOf(saved.lean, b.dataset.solveLean)); });
  }
  paintLean(false);
}

/* ---- limits --------------------------------------------------------
   Ceilings per resource, of two kinds; a blank box is no ceiling, and one
   checkbox sets them all aside without losing the numbers. Kept across
   visits like the lean.
   The battle upkeep budget is what the force eats over the whole fight.
   The equipment resources are the stock its gear is built from, counted the
   way the recipes call for them: a Precision Part is a Precision Part, not
   the gems and copper it was crafted from. */
const LS_BUDGET = "warcalc.solverBudget";
const LS_STOCK = "warcalc.solverStock";
const LS_LIMITS_OFF = "warcalc.solverLimitsOff";
const BUDGET_RES = RES_ORDER.filter(k =>
  Object.values(UNIT_COST).some(uc => (uc.upkeep || {})[k]));
const STOCK_RES = RES_ORDER.filter(k =>
  [WEAPON_COST, ARMOR_COST].some(t => Object.values(t).some(g => (g.res || {})[k])));
const solveBudgetBoxes = () => [...document.querySelectorAll("[data-solve-budget]")];
const solveStockBoxes = () => [...document.querySelectorAll("[data-solve-stock]")];
const limitsOff = () => !!document.getElementById("solveLimitsOff")?.checked;

/* what the boxes hold, whether or not the limits are switched on */
function readLimitBoxes(boxes, key){
  const out = {};
  boxes.forEach(b => {
    const v = parseFloat(b.value);
    if (b.value.trim() !== "" && isFinite(v) && v >= 0) out[b.dataset[key]] = v;
  });
  return out;
}
const readBudget = () => limitsOff() ? {} : readLimitBoxes(solveBudgetBoxes(), "solveBudget");
const readStock  = () => limitsOff() ? {} : readLimitBoxes(solveStockBoxes(), "solveStock");

/* what one troop of a loadout takes out of the equipment stock */
function gearUse(type, weapon, armor){
  return addRes(addRes({}, gearCost("weapon", weapon).res), gearCost("armor", armor).res);
}

/* Every limit that is linear in the starting sizes, as one list: the first
   tick's upkeep (a floor on the whole fight's, since that tick bills the whole
   starting force) and the stock the gear is built from. use[i] is what one
   troop of subset[i] takes. */
function capsFor(subset, o){
  const caps = [];
  for (const k of Object.keys(o.budget || {})){
    const use = subset.map(c => ((UNIT_COST[c.type] || {}).upkeep || {})[k] || 0);
    if (use.some(v => v > 0)) caps.push({k, lim: o.budget[k], use, upkeep: true});
  }
  for (const k of Object.keys(o.stock || {})){
    const use = subset.map(c => gearUse(c.type, c.weapon, c.armor)[k] || 0);
    if (use.some(v => v > 0)) caps.push({k, lim: o.stock[k], use});
  }
  return caps;
}
/* the first cap these sizes break, or null */
const overCaps = (caps, sizes) => {
  for (const cap of caps){
    let used = 0;
    for (let i = 0; i < sizes.length; i++) used += sizes[i] * cap.use[i];
    if (used > cap.lim + 1e-9) return cap.k;
  }
  return null;
};

/* the heading says how many limits are set, or that they are off */
function paintLimits(){
  const off = limitsOff();
  const n = Object.keys(readLimitBoxes(solveBudgetBoxes(), "solveBudget")).length
          + Object.keys(readLimitBoxes(solveStockBoxes(), "solveStock")).length;
  document.getElementById("solveLimitSets").classList.toggle("off", off);
  document.getElementById("solveLimitsNote").textContent =
    off ? (n ? `· off (${n} set)` : "· off") : n ? `· ${n} set` : "· none";
}

function setupLimits(){
  const boxes = (id, list, attr, saved, title) => {
    document.getElementById(id).innerHTML = list.map(k => `
      <label title="${esc(title(RESOURCES[k].name.toLowerCase()))} — leave blank for no limit">
        ${resIcon(k)}
        <input type="number" min="0" step="1000" placeholder="no limit" data-${attr}="${k}"
          value="${saved[k] != null ? esc(saved[k]) : ""}"></label>`).join("");
  };
  boxes("solveBudget", BUDGET_RES, "solve-budget", store.get(LS_BUDGET, null) || {},
        r => `Most ${r} the force may eat over the whole fight, every tick billed on the troops standing at its start`);
  boxes("solveStock", STOCK_RES, "solve-stock", store.get(LS_STOCK, null) || {},
        r => `Most ${r} the force's weapons and armour may take to build`);
  const off = document.getElementById("solveLimitsOff");
  off.checked = store.get(LS_LIMITS_OFF, false) === true;
  solveBudgetBoxes().forEach(b => {
    b.addEventListener("change", () => store.set(LS_BUDGET, readLimitBoxes(solveBudgetBoxes(), "solveBudget")));
    b.addEventListener("input", paintLimits);
  });
  solveStockBoxes().forEach(b => {
    b.addEventListener("change", () => store.set(LS_STOCK, readLimitBoxes(solveStockBoxes(), "solveStock")));
    b.addEventListener("input", paintLimits);
  });
  off.addEventListener("change", () => { store.set(LS_LIMITS_OFF, off.checked); paintLimits(); });
  paintLimits();
}

function readSolveOpts(){
  const side = document.getElementById("solveSide").value;
  const goal = document.getElementById("solveGoal").value;
  const objective = document.getElementById("solveMin").value;
  const deep = document.getElementById("solveAlgo").value !== "classic";
  const table = deep ? DEEP_EFFORT : SOLVE_EFFORT;
  const eff = table[document.getElementById("solveEffort").value] || table.normal;
  const ticks = clampInt(document.getElementById("solveTicks").value, 1, 20);
  return Object.assign({
    side, goal, objective, ticks,
    types: solveTypeBoxes().filter(c => c.checked && !c.disabled).map(c => c.value),
    lean: readLean(),
    budget: readBudget(),
    stock: readStock(),
    training: clampInt(document.getElementById("solveTrain").value, 0, TRAIN_UNCAPPED),
    maxStacks: clampInt(document.getElementById("solveStacks").value, 1, MAX_SOLVE_STACKS),
    minSurvivors: Math.max(1, clampInt(document.getElementById("solveSurv").value, 1, 1e9)),
    algo: ({classic: "classic", ce: "ce"})[document.getElementById("solveAlgo").value] || "deep",
    /* over several ticks armour earns its keep even on a pure wipe: a troop
       that lives through this tick fires again in the next one */
    useArmor: ticks > 1 || goal !== "wipe" || objective !== "upfront"
  }, eff);
}

function solveProgress(st){
  if (!st || !st.phase) return;
  const pct = st.phase === 1 ? (st.at / Math.max(1, st.of)) * 55
                             : 55 + (st.at / Math.max(1, st.of)) * 42;
  document.getElementById("solveBar").style.width = pct.toFixed(1) + "%";
  document.getElementById("solveMsg").textContent =
    st.msg        ? st.msg
    : st.phase !== 1 ? `Refining the shortlist — ${st.at + 1} of ${st.of}`
    : st.level    ? `Growing forces — up to ${st.level} of ${st.K} stacks · ${st.tried.toLocaleString("en-US")} combinations tried`
                  : `Sizing loadout combinations — ${Math.round(st.at).toLocaleString("en-US")} of ${st.of.toLocaleString("en-US")}`;
}

async function runSolver(){
  if (solveBusy) return;
  const opts = readSolveOpts();
  const foeSide = opts.side === "defender" ? "attacker" : "defender";
  /* reinforcements miss the first tick and join the rest on the second, at the
     back of the list — the order the battle view lines them up in, and the
     order that settles any tie in who gets shot first */
  const foeAll = readSide(foeSide);
  const foeRows = foeAll.filter(u => !u.reserve).concat(foeAll.filter(u => u.reserve));
  if (!foeRows.length){
    alert(`Add some ${foeSide}s first — the solver needs something to solve against.`);
    return;
  }
  if (foeRows.some(u => u.size < 1)){ alert("Every unit on the fixed side needs a size of at least 1."); return; }
  if (!opts.types.length){ alert("Allow at least one unit type."); return; }
  if (opts.goal !== "survive" && opts.ticks < 2 && foeRows.some(u => u.reserve)){
    alert(`The ${foeSide}s' reinforcements only join on tick 2, so they cannot be wiped in one tick. Allow two ticks or more.`);
    return;
  }

  const bonus = document.getElementById("defBonus").value;
  const bonusYes = bonus === "Yes";
  const bonusOwn = opts.side === "attacker" ? bonusYes : false;
  const bonusFoe = opts.side === "attacker" ? false : bonusYes;

  solveBusy = true; solveHalt = false;
  document.getElementById("solveProg").style.display = "";
  document.getElementById("btnSolveStop").style.display = "";
  document.getElementById("btnSolve").disabled = true;
  document.getElementById("solveBar").style.width = "0%";
  document.getElementById("solveMsg").textContent = "Working out which loadouts are worth trying…";
  document.getElementById("solveOut").innerHTML = "";

  const started = performance.now();
  let last = null, tick = performance.now();
  try {
    const gen = opts.algo === "classic" ? solveGen : opts.algo === "ce" ? ceSolveGen : deepSolveGen;
    for (const st of gen(opts, foeRows, bonusOwn, bonusFoe)){
      if (solveHalt) break;
      if (st && st.done) last = st;
      else if (st) solveProgress(st);
      if (performance.now() - tick > sliceMs()){
        await breathe();
        tick = performance.now();
      }
    }
  } catch(e){
    console.error(e);
    document.getElementById("solveOut").innerHTML =
      `<div class="note warn"><strong>Search stopped.</strong> ${esc(e.message)}</div>`;
  }

  /* replay the answers through the real engine */
  let verified = 0;
  if (last && last.results && !solveHalt){
    document.getElementById("solveBar").style.width = "97%";
    document.getElementById("solveMsg").textContent = "Checking the answers against the full battle engine…";
    await breathe();
    const deadline = Date.now() + (opts.ticks > 1 ? 20000 : 12000);
    const keep = [];
    for (const sol of last.results){
      if (Date.now() > deadline){
        const v = realCheck(sol.live.map(l => ({type:l.c.type, weapon:l.c.weapon, armor:l.c.armor,
          size:l.size, training:opts.training})), foeRows, opts.side, bonus, opts.goal,
          opts.minSurvivors, opts.ticks, opts.budget, opts.stock);
        if (v){ sol.upTotal = v.up; sol.ticks = v.ticks; }
        keep.push(sol);
        continue;
      }
      await breathe();
      const rows = sol.live.map(l => ({type:l.c.type, weapon:l.c.weapon, armor:l.c.armor,
                                       size:l.size, training:opts.training}));
      const fix = verifyAndRepair(rows, foeRows, opts.side, bonus, opts.goal,
                                  opts.minSurvivors, deadline, opts.ticks, opts.lean, opts.budget, opts.stock);
      if (!fix || !fix.ok) continue;
      sol.live = fix.rows.map((u, i) => ({c:{type:u.type, weapon:u.weapon, armor:u.armor,
        bits: troopBits(u)}, size:u.size, lost: fix.v.lost[i] ?? 0}));
      sol.troops = fix.rows.reduce((s, u) => s + u.size, 0);
      sol.upfront = solveCosts(fix.rows).total;
      sol.burned = fix.rows.reduce((s, u, i) => s + (fix.v.lost[i] || 0) * troopBits(u), 0);
      sol.metric = opts.objective === "upfront" ? sol.upfront
                 : opts.objective === "losses" ? sol.burned : sol.upfront + sol.burned;
      /* the same two sums again, each stack weighed by what its type costs
         this nation — the answers are ranked on these, quoted on the ones above */
      const wUp = fix.rows.reduce((t, u) => t + solveCosts([u]).total * leanOf(opts.lean, u.type), 0);
      const wBurn = fix.rows.reduce((t, u, i) =>
        t + (fix.v.lost[i] || 0) * troopBits(u) * leanOf(opts.lean, u.type), 0);
      sol.score = opts.objective === "upfront" ? wUp
                : opts.objective === "losses" ? wBurn : wUp + wBurn;
      sol.wipes = fix.v.wipe; sol.left = fix.v.left; sol.verified = true;
      sol.ticks = fix.v.ticks || 1; sol.tickLog = fix.v.log || null; sol.upTotal = fix.v.up;
      verified++;
      keep.push(sol);
    }
    keep.sort((a, b) => (a.score ?? a.metric) - (b.score ?? b.metric)
                     || a.metric - b.metric || a.live.length - b.live.length);
    last.results = keep;
    last.verified = verified;
  }

  solveBusy = false;
  document.getElementById("solveProg").style.display = "none";
  document.getElementById("btnSolveStop").style.display = "none";
  document.getElementById("btnSolve").disabled = false;
  flagDone(last && last.results && last.results.length ? "✓ solved" : "✓ done");

  if (solveHalt && !last){
    document.getElementById("solveOut").innerHTML = `<div class="note">Search stopped.</div>`;
    return;
  }
  if (!last) return;
  if (last.error){
    document.getElementById("solveOut").innerHTML = `<div class="note warn">${esc(last.error)}</div>`;
    return;
  }
  renderSolutions(last, opts, bonus, (performance.now() - started) / 1000);
}

/* ---- output ------------------------------------------------------- */
function solRows(sol, training){
  return sol.live.map(l => ({type:l.c.type, weapon:l.c.weapon, armor:l.c.armor,
                             size:l.size, training}));
}

/* tick-by-tick trace of a plan that takes more than one exchange */
function tickTable(sol){
  const log = sol.tickLog;
  if (!log || log.length < 2) return "";
  const n = v => (v || 0).toLocaleString("en-US");
  return `
    <details class="cost-drop" style="margin-top:12px" open>
      <summary>Tick by tick</summary>
      <div class="cost-body">
        <table class="tick-table">
          <thead><tr><th>Tick</th><th class="n">Enemy killed</th><th class="n">Enemy left</th>
            <th class="n">Your dead</th><th class="n">Yours left</th></tr></thead>
          <tbody>${log.map(t => `
            <tr${t.foeLeft === 0 ? ' class="tick-wipe"' : ""}>
              <td>${t.tick}</td><td class="n">${n(t.foeKilled)}</td><td class="n">${n(t.foeLeft)}</td>
              <td class="n">${n(t.ownKilled)}</td><td class="n">${n(t.ownLeft)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    </details>`;
}

function renderSolutions(out, opts, bonus, secs){
  const el = document.getElementById("solveOut");
  if (!out.results || !out.results.length){
    el.innerHTML = `<div class="note warn">No solution found</div>`;
    return;
  }
  solveLast = {results: out.results, training: opts.training, side: opts.side};

  const goalName = {upfront:"up-front ฿", losses:"฿ burned", both:"up front + burned ฿"}[opts.objective];
  const sideWord = opts.side === "defender" ? "defence" : "attack";

  /* with a lean on, the order is not the order of the prices on screen,
     so the number the ranking actually used is shown beside them */
  const leaning = leanActive(opts.lean);
  const nation = matchNation(opts.lean);
  const leanNote = !leaning ? "" : `
    <div class="small muted" style="margin:0 0 8px">
      Ranked for <b>${esc((NATIONS[nation] || {}).name || "a custom lean")}</b> —
      ${SOLVE_TYPES.filter(t => leanOf(opts.lean, t) !== 1)
        .map(t => `${esc(t)} &times;${leanOf(opts.lean, t)}`).join(" · ")}.

/* ===================================================================
   9b. REFERENCE OVERLAYS — three cheat sheets that float over the page
       instead of taking it over: F the stat table, G weapon build
       costs, H armor build costs. Drag one anywhere and it stays there.
   =================================================================== */

const LS_REFPOS = "warcalc.refPos";

/* every stat is quoted against the same five columns, in the same order */
const REF_COLS   = TYPE_NUMS.map(n => TYPES[n]);
const TYPE_LABEL = {cavalry:"Cavalry", tanks:"Tanks", pegasi:"Pegasi", unicorns:"Unicorns", naval:"Naval"};
const REF_GROUPS = ["Cavalry","Tanks","Pegasi","Unicorns","Naval"];

/* what a category can actually field, minus the Scrounged fallback */
const realGear = (type, kind) =>
  LOADOUTS[type][kind === "weapon" ? "weapons" : "armor"].filter(k => !SCROUNGED[k]);

/* a weapon is best where it hits hardest, armor where it soaks the most.
   Gear that is flat across the board has no speciality worth marking. */
function bestCols(def, kind){
  const vals = REF_COLS.map(c => Number(def[c]));
  const hi = Math.max(...vals), lo = Math.min(...vals);
  if (hi === lo) return {};
  const want = kind === "weapon" ? hi : lo;
  const out = {};
  REF_COLS.forEach((c, i)=>{ if (vals[i] === want) out[c] = 1; });
  return out;
}

/* name pushed right against its portrait, so a column of them lines up.
   The name carries its owner's colour, which is what tells the runs of
   cavalry / tanks / pegasi gear apart now that the headings are gone. */
const gearCell = (key, type) =>
  `<span class="gear-cell t-${type.toLowerCase()}"><span class="g-name">${esc(label(key))}</span>${gearImg(key)}</span>`;

/* every category's gear in one run, a rule drawn where one type hands over
   to the next */
function refRows(kind, row){
  return REF_GROUPS.map((type, g) => realGear(type, kind).map((k, i)=>
    `<tr${g && !i ? ' class="grp-start"' : ""}><td>${gearCell(k, type)}</td>${row(k)}</tr>`
  ).join("")).join("");
}

const typeHead = () => `<thead><tr><th></th>${REF_COLS.map(c=>
  `<th class="num ref-th-type t-${c}">${TYPE_LABEL[c]}</th>`).join("")}</tr></thead>`;

function statTable(kind){
  const defs = kind === "weapon" ? WEAPON_DEFS : ARMOR_DEFS;
  return `<table class="ref-table">${typeHead()}<tbody>${refRows(kind, k=>{
    const d = defs[k] || {};
    const best = bestCols(d, kind);
    return REF_COLS.map(c=>
      `<td class="num${best[c] ? " ref-best" : ""}">${Number(d[c]).toFixed(2)}</td>`).join("");
  })}</tbody></table>`;
}

/* damage dealt on top, damage taken below */
const buildStatsRef = () => statTable("weapon") + statTable("armor");

const buildCostRef = kind =>
  `<table class="ref-table"><thead><tr>
      <th></th><th class="num">Build ${BIT}</th><th class="res">Resources</th>
    </tr></thead><tbody>${refRows(kind, k=>{
      const c = gearCost(kind, k);
      return `<td class="num">${bits(c.bits)}</td><td class="res">${resChips(c.res)}</td>`;
    })}</tbody></table>`;

const REFS = {
  stats: {title:"Weapon & armor stats", width:540, build:()=>buildStatsRef()},
  wcost: {title:"Weapon build costs",   width:420, build:()=>buildCostRef("weapon")},
  acost: {title:"Armor build costs",    width:420, build:()=>buildCostRef("armor")}
};

const refEls = {};
let refZ = 60;

const refPos = () => store.get(LS_REFPOS, {}) || {};

/* an overlay never gets dragged off the edge, and never stays off it */
function placeRef(el, x, y, save){
  const px = Math.max(4, Math.min(x, window.innerWidth  - el.offsetWidth  - 4));
  const py = Math.max(4, Math.min(y, window.innerHeight - el.offsetHeight - 4));
  el.style.left = px + "px";
  el.style.top  = py + "px";
  if (save){
    const all = refPos();
    all[el.dataset.ref] = {x:px, y:py};
    store.set(LS_REFPOS, all);
  }
}

/* drag by the title bar; the close button keeps its own click */
function dragRef(el, handle){
  let dx = 0, dy = 0, on = false;
  handle.addEventListener("pointerdown", e=>{
    if (e.button !== 0 || e.target.closest(".ovl-x")) return;
    const r = el.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    on = true;
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  handle.addEventListener("pointermove", e=>{
    if (on) placeRef(el, e.clientX - dx, e.clientY - dy, false);
  });
  const drop = e=>{
    if (!on) return;
    on = false;
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
    placeRef(el, el.offsetLeft, el.offsetTop, true);
  };
  handle.addEventListener("pointerup", drop);
  handle.addEventListener("pointercancel", drop);
}

/* the tables never change, so each overlay is built once and then kept */
function makeRef(id){
  const spec = REFS[id];
  const el = document.createElement("div");
  el.className = "ovl";
  el.dataset.ref = id;
  el.style.width = spec.width + "px";
  el.innerHTML = `<div class="ovl-head">
      <h3>${esc(spec.title)}</h3><span class="spacer"></span>
      <button class="ovl-x" title="Close  (Esc)">×</button>
    </div>
    <div class="ovl-body">${spec.build()}</div>`;
  document.body.appendChild(el);
  el.querySelector(".ovl-x").addEventListener("click", ()=>toggleRef(id, false));
  el.addEventListener("pointerdown", ()=>{ el.style.zIndex = ++refZ; });
  dragRef(el, el.querySelector(".ovl-head"));
  refEls[id] = el;
  return el;
}

const refIsOpen = id => !!refEls[id] && refEls[id].classList.contains("open");

function toggleRef(id, want){
  if (!REFS[id]) return;
  const el = refEls[id] || makeRef(id);
  const open = want === undefined ? !el.classList.contains("open") : !!want;
  el.classList.toggle("open", open);
  if (open){
    el.style.zIndex = ++refZ;
    const saved = refPos()[id];
    placeRef(el, saved ? saved.x : (window.innerWidth - el.offsetWidth) / 2,
                 saved ? saved.y : 54, false);
  }
  document.querySelectorAll(`.ref-btn[data-ref="${id}"]`)
    .forEach(b => b.classList.toggle("on", open));
}

document.querySelectorAll(".ref-btn").forEach(b =>
  b.addEventListener("click", ()=>toggleRef(b.dataset.ref)));

/* deliberately outside the Q W E R toggle: these are a reference card you
   flip up, not a jump, so they answer whether or not jumping is switched on */
const REF_KEYS = {f:"stats", g:"wcost", h:"acost"};

document.addEventListener("keydown", e=>{
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (typingIn(e.target) || typingIn(document.activeElement)) return;
  const key = String(e.key).toLowerCase();
  if (key === "escape"){                       // Esc closes whichever is on top
    const top = Object.keys(REFS).filter(refIsOpen)
      .sort((a,b)=> (+refEls[b].style.zIndex || 0) - (+refEls[a].style.zIndex || 0))[0];
    if (top){ e.preventDefault(); toggleRef(top, false); }
    return;
  }
  if (!REF_KEYS[key]) return;
  e.preventDefault();
  toggleRef(REF_KEYS[key]);
});

/* a window that shrinks out from under an overlay pulls it back into view */
window.addEventListener("resize", ()=>{
  Object.values(refEls).forEach(el=>{
    if (el.classList.contains("open")) placeRef(el, el.offsetLeft, el.offsetTop, false);
  });
});


/* ===================================================================
   10. COUNTER FINDER — the two answers to one enemy unit:
       the cheapest way to kill it, and the cheapest way to eat its punch
   =================================================================== */

const ctrEl = id => document.getElementById(id);
let ctrBusy = false, ctrHalt = false, ctrLast = null;

/* both sides of the fight get searched at once, so every unit type is a
   legal target — alicorns included, since they can stand as defenders */
const CTR_TARGET_TYPES = ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"];

function fillCounterTypes(){
  const sel = ctrEl("ctrType");
  const keep = sel.value;
  sel.innerHTML = CTR_TARGET_TYPES.map(t=>`<option value="${t}">${t}</option>`).join("");
  sel.value = CTR_TARGET_TYPES.includes(keep) ? keep : CTR_TARGET_TYPES[0];
  fillLoadout(sel.value, ctrEl("ctrWeapon"), ctrEl("ctrArmor"));
  paintCounterTarget();
}

function counterTarget(){
  return {
    type: ctrEl("ctrType").value,
    weapon: ctrEl("ctrWeapon").value || "ScroungedWeapons",
    armor: ctrEl("ctrArmor").value || "ScroungedArmor",
    size: Math.max(1, clampInt(ctrEl("ctrSize").value, 1, 1e9)),
    training: clampInt(ctrEl("ctrTrain").value, 0, TRAIN_UNCAPPED)
  };
}

function paintCounterTarget(){
  const t = counterTarget();
  ctrEl("ctrSprite").innerHTML =
    buildSprite(t.type, t.weapon, t.armor, true, {size:t.size, training:t.training});
}

/* the target and the shared settings; each column then picks its own side */
function readCounterBase(){
  return {
    foe: counterTarget(),
    bonus: ctrEl("ctrBonus").value,
    bonusYes: ctrEl("ctrBonus").value === "Yes",
    training: clampInt(ctrEl("ctrMyTrain").value, 0, TRAIN_UNCAPPED)
  };
}

/* mode "kill":   you charge them — cheapest force that wipes them out.
   mode "absorb": they charge you — cheapest force that eats the whole punch and
                  is still standing afterwards, i.e. the smallest wall that holds,
                  ranked by what it costs plus what it loses doing it. */
function counterOpts(base, mode){
  const side = mode === "kill" ? "attacker" : "defender";
  return {
    mode, side,
    /* killing means wiping them out; absorbing only means outlasting the hit,
       so the absorb column is sized to the minimum that survives, not to the
       much bigger force it would take to kill them back */
    goal: mode === "kill" ? "wipe" : "survive",
    bonus: base.bonus,
    foe: base.foe,
    training: base.training,
    /* alicorns are never offered as an answer — they are a target only */
    types: ["Cavalry","Tanks","Pegasi","Unicorns","Naval"],
    resValue: 0,
    /* armour buys nothing on a one-tick charge, but it is the whole point
       of the force that has to stand there and take the hit */
    useArmor: mode === "absorb",
    /* the defender bonus scales down whoever is attacking into it */
    bonusOwn: side === "attacker" ? base.bonusYes : false,
    bonusFoe: side === "attacker" ? false : base.bonusYes,
    minSurvivors: 1, ticks: 1
  };
}

/* alicorns never attack, so there is nothing of theirs to absorb */
const ctrAbsorbImpossible = base => base.foe.type === "Alicorns";

async function searchCounters(o, onProg){
  const foeProfiles = [solProfile(o.foe)];
  const so = {goal:o.goal, minSurvivors:1, bonusOwn:o.bonusOwn, bonusFoe:o.bonusFoe,
              ticks:1, wantLosses:true};

  const cands = buildCandidates({types:o.types, useArmor:o.useArmor, resValue:o.resValue,
                                 training:o.training, goal:o.goal},
                                foeProfiles, o.bonusOwn, o.bonusFoe);
  if (!cands.length) return {results:[], candCount:0};

  /* what the target throws at one troop of this loadout, over the whole fight */
  const incoming = c => foeProfiles.reduce((s, f, j) => s + f.size * c.incoming[j], 0);

  const rough = [];
  let tick = performance.now();
  for (let i = 0; i < cands.length; i++){
    if (ctrHalt) break;
    const c = cands[i];
    const size = soloSize(c, foeProfiles, so);
    if (size > 0){
      const upfront = size * c.bits;
      /* the absorb column shortlists on cost + the value it expects to lose,
         so armour that keeps troops alive can pay for itself */
      const estLost = Math.min(size, Math.ceil(incoming(c)));
      rough.push({c, size, rank: o.mode === "absorb" ? upfront + estLost * c.bits : upfront});
    }
    if (performance.now() - tick > sliceMs()){
      onProg((i + 1) / cands.length * 0.7, `Sizing loadouts — ${i + 1} of ${cands.length}`);
      await breathe();
      tick = performance.now();
    }
  }

  rough.sort((a, b) => a.rank - b.rank);

  /* the fast search adds a whole block of hits at once and the real engine adds
     them one by one, so the front runners get replayed through simulate() and
     trimmed to the size that genuinely does the job */
  const shortlist = rough.slice(0, o.mode === "absorb" ? 14 : 12);
  const deadline = Date.now() + 15000;
  const done = [];
  for (let i = 0; i < shortlist.length; i++){
    if (ctrHalt) break;
    onProg(0.7 + (i + 1) / shortlist.length * 0.29,
           `Checking against the full battle engine — ${i + 1} of ${shortlist.length}`);
    await breathe();
    const {c} = shortlist[i];
    const rows = [{type:c.type, weapon:c.weapon, armor:c.armor,
                   size:shortlist[i].size, training:o.training}];
    const fix = verifyAndRepair(rows, [o.foe], o.side, o.bonus, o.goal, 1, deadline, 1);
    if (!fix || !fix.ok || !fix.rows.length) continue;
    const row = fix.rows[0];
    const lost = fix.v.lost[0] || 0;
    const metric = row.size * c.bits;
    const burned = lost * troopBits(row);
    done.push({c, row, size: row.size, lost, metric, burned,
               rank: o.mode === "absorb" ? metric + burned : metric,
               costs: solveCosts([row]),
               left: fix.v.left, wipes: fix.v.wipe});
  }

  done.sort((a, b) => a.rank - b.rank || a.metric - b.metric || a.size - b.size);
  return {results: done, candCount: cands.length};
}

async function runCounter(){
  if (ctrBusy) return;
  const base = readCounterBase();
  if (!base.foe.type){ alert("Pick a unit type first."); return; }

  const jobs = [{mode:"kill", opts:counterOpts(base, "kill")}];
  if (!ctrAbsorbImpossible(base)) jobs.push({mode:"absorb", opts:counterOpts(base, "absorb")});

  ctrBusy = true; ctrHalt = false;
  ctrEl("btnCounter").disabled = true;
  ctrEl("btnCounterStop").style.display = "";
  ctrEl("ctrProg").style.display = "";
  ctrEl("ctrBar").style.width = "0%";
  ctrEl("ctrOut").innerHTML = "";

  const started = performance.now();
  const runs = {};
  for (let j = 0; j < jobs.length; j++){
    const {mode, opts} = jobs[j];
    const lead = mode === "kill" ? "Killing them" : "Absorbing them";
    const onProg = (frac, msg) => {
      ctrEl("ctrBar").style.width = ((j + frac) / jobs.length * 100).toFixed(1) + "%";
      ctrEl("ctrMsg").textContent = `${lead} — ${msg}`;
    };
    onProg(0, "starting");
    await breathe();
    runs[mode] = Object.assign({opts}, await searchCounters(opts, onProg));
    if (ctrHalt) break;
  }

  ctrBusy = false;
  ctrEl("btnCounter").disabled = false;
  ctrEl("btnCounterStop").style.display = "none";
  ctrEl("ctrProg").style.display = "none";
  flagDone("✓ counters");

  const anything = Object.keys(runs).some(k => runs[k].results.length);
  if (!anything){
    ctrEl("ctrOut").innerHTML = `<div class="panel"><div class="note warn">${ctrHalt
      ? "Search stopped." : "Nothing found."}</div></div>`;
    return;
  }
  ctrLast = {runs, base};
  renderCounters(runs, base, (performance.now() - started) / 1000);
}

function counterCard(r, i, o, mode){
  const u = r.row;
  const absorb = mode === "absorb";
  /* the absorb column is ranked on what it costs plus what it loses, so that
     is the number the card leads with — otherwise the order reads as noise */
  const headline = absorb ? r.metric + r.burned : r.metric;
  const left = Math.max(0, r.size - r.lost);
  return `
    <div class="well" style="margin-bottom:12px">
      <div class="panel-head" style="margin-bottom:10px">
        <span class="ctr-rank${i === 0 ? " top" : ""}">${i + 1}</span>
        <span class="bits" style="font-size:15px">${money(headline)}</span>
        ${absorb ? "" : `<span class="small muted">${money(headline / o.foe.size)} each</span>`}
        <span class="spacer"></span>
        <span class="small muted">Send to:</span>
        <button class="btn btn-xs btn-danger" data-ctr-send="${mode}:${i}:attacker">Attackers</button>
        <button class="btn btn-xs btn-info" data-ctr-send="${mode}:${i}:defender">Defenders</button>
      </div>
      <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
        <div class="surv-card ${absorb ? "surv-def" : "surv-atk"}" style="min-width:118px"
          ${pickAttrs(u.type, u.weapon, u.armor, r.size, u.training)}>
          ${buildSprite(u.type, u.weapon, u.armor, true, {size:u.size, training:u.training,
              left: r.lost ? left : null})}
          <div class="small mono card-gear"><span>${esc(label(absorb ? u.armor : u.weapon))}</span></div>
          <div class="mono" style="margin-top:4px;font-size:15px"><b>${left.toLocaleString("en-US")}</b>
            <span class="muted small">/ ${r.size.toLocaleString("en-US")}</span></div>
          <div class="small muted mono">${esc(u.type)}</div>
          ${r.lost ? `<span class="surv-lost">-${r.lost.toLocaleString("en-US")}</span>` : ""}
        </div>
        <div style="flex:1 1 220px;min-width:210px">
          <div class="cost-row"><span class="cost-label">Raise army</span>
            <span class="cost-val bits">${money(r.costs.hire)}</span></div>
          <div class="cost-row"><span class="cost-label">Equipment ${BIT}</span>
            <span class="cost-val bits">${money(r.costs.gearBits + r.costs.craftBits)}</span></div>
          <div class="cost-row"><span class="cost-label">Resources</span>
            <span class="cost-val">${resChips(r.costs.gearRes)}</span></div>
          <div class="cost-row"><span class="cost-label">Upkeep / 12 h</span>
            <span class="cost-val">${resChips(r.costs.upkeep)}</span></div>
          <div class="cost-row" style="margin-top:6px;padding-top:7px;border-top:1px solid rgba(var(--lo),.35)">
            <span class="cost-label" style="color:var(--text)">Total</span>
            <span class="cost-val bits" style="font-size:13px">${money(r.costs.total)}</span></div>
          ${satRow(r.size)}
        </div>
      </div>
      ${ctrPerTroop(u, o, absorb)}
    </div>`;
}

/* what one troop of the answer does to them, or how much of their punch it
   soaks — the defender bonus, when it applies, shown as its own factor */
function ctrPerTroop(u, o, absorb){
  const f3 = x => (+x.toFixed(3)).toString();
  const bonus = absorb ? o.bonusFoe : o.bonusOwn;
  const [src, dst] = absorb ? [o.foe, u] : [u, o.foe];
  const S = buildUnit(Object.assign({name:""}, src), 1, true);
  const D = buildUnit(Object.assign({name:""}, dst), 2, false);
  const w = S.dmg[TYPES[D.type]], a = D.arm[TYPES[S.type]];
  const raw = hitDamage(solProfile(src), solProfile(dst), false);
  const hit = bonus ? raw * 0.75 : raw;
  /* a training gap scales every hit too, so it gets its own factor */
  const tf = Math.pow(1.5, (S.training - D.training) / 20);
  const gear = (k, v) => `${gearImg(k, true)} ${esc(label(k))} (${f3(v)})`;
  let sum = `${gear(src.weapon, w)} vs ${gear(dst.armor, a)}${tf !== 1 ? ` × ${f3(tf)} training` : ""}`;
  if (bonus) sum = `(${sum}) × 0.75`;
  return `<div class="ctr-1x"><span class="ctr-1x-lab">1x</span>${sum} = <b class="mono">${f3(hit)}</b></div>`;
}

function counterColumn(run, mode, base){
  const kill = mode === "kill";
  const head = kill ? "Killing" : "Absorb";

  let body;
  if (!run && !kill && ctrAbsorbImpossible(base)){
    body = `<div class="note">Alicorns never attack.</div>`;
  } else if (!run){
    body = `<div class="note warn">Search stopped.</div>`;
  } else if (!run.results.length){
    body = `<div class="note warn">${ctrHalt ? "Search stopped." : "Nothing found."}</div>`;
  } else {
    const top = run.results.slice(0, 3), rest = run.results.slice(3);
    body = top.map((r, i)=>counterCard(r, i, run.opts, mode)).join("")
      + (rest.length ? `
        <details class="cost-drop">
          <summary>Runners-up (${rest.length})</summary>
          <div class="cost-body">${rest.map((r, i)=>counterCard(r, i + 3, run.opts, mode)).join("")}</div>
        </details>` : "");
  }

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${head}</h2>
      </div>
      ${body}
    </div>`;
}

function renderCounters(runs, base, secs){
  ctrEl("ctrOut").innerHTML = `
    <div class="ctr-split">
      ${counterColumn(runs.kill, "kill", base)}
      ${counterColumn(runs.absorb, "absorb", base)}
    </div>`;

  ctrEl("ctrOut").querySelectorAll("[data-ctr-send]").forEach(b=>
    b.addEventListener("click", ()=>sendCounterToBattle(b.dataset.ctrSend, b)));
}

/* add the answer to a side of the battle tab, and nothing more */
function sendCounterToBattle(key, btn){
  if (!ctrLast) return;
  const [mode, idx, side] = key.split(":");
  const r = ctrLast.runs[mode]?.results[+idx];
  if (!r) return;
  makeRow(side, r.row);
  refreshCounts();
  scheduleSave();
  if (btn){                                // a moment of "Added" so the click shows
    clearTimeout(btn._added);
    btn.dataset.label ??= btn.textContent;
    btn.textContent = "Added";
    btn._added = setTimeout(()=>{ btn.textContent = btn.dataset.label; }, 1000);
  }
}

/* clicking any unit card loads that unit as the counter target, without

document.addEventListener("click", e=>{

});

/* the number boxes carry thousands commas; they are put back as you type,
   keeping the caret after the same digit */
function gsCommas(el){
  const raw = el.value, at = el.selectionStart ?? raw.length;
  const digitsBefore = raw.slice(0, at).replace(/[^\d.]/g, "").length;
  let clean = raw.replace(/[^\d.]/g, "");
  const dot = clean.indexOf(".");
  if (dot >= 0) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, "");
  const [whole, frac] = clean.split(".");
  const out = (whole ? Number(whole).toLocaleString("en-US") : (frac != null ? "0" : "")) +
              (frac != null ? "." + frac : "");
  if (out === raw) return;
  el.value = out;
  let seen = 0, pos = 0;
  while (pos < out.length && seen < digitsBefore){ if (/[\d.]/.test(out[pos])) seen++; pos++; }
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}

  gs.comps = gs.comps.filter(n => armies[n]);
  gsEl("gsComps").innerHTML = names.map(n=>`<span class="mark-chip${gs.comps.includes(n) ? " on" : ""}"
      data-gs-comp="${esc(n)}"><span class="n">${esc(n)}</span></span>`).join("");
  /* slips come out in the order they were picked, and take reserves in that order */
  return gs.comps.map(n => ({name: n, units: armies[n]}));
}

/* one army's bill; reserves it draws on are taken out of resvLeft */
function gsBill(units, resvLeft){
  let hire = 0, gearBits = 0, troops = 0;
  const upkeep = {}, need = {}, res = {}, used = {};
  units.forEach(u=>{
    const n = gsNum(u.size);
    troops += n;
    const uc = UNIT_COST[u.type] || {hire:0, upkeep:{}};
    hire += uc.hire * n;
    addRes(upkeep, uc.upkeep, n);
    [u.weapon, u.armor].forEach(k=>{ if (k && !SCROUNGED[k]) need[k] = (need[k] || 0) + n; });
  });
  GS_GEAR.filter(k => need[k] > 0).forEach(k=>{
    const from = Math.min(need[k], resvLeft[k] || 0);
    if (from){ used[k] = from; resvLeft[k] -= from; }
    const c = gearCost(k in WEAPON_COST ? "weapon" : "armor", k);
    gearBits += c.bits * (need[k] - from);
    addRes(res, c.res, need[k] - from);
  });
  res.bits = hire + gearBits;
  return {hire, gearBits, troops, upkeep, res, used};
}

function gsMerge(bills){
  const t = {hire:0, gearBits:0, troops:0, upkeep:{}, res:{}, used:{}};
  bills.forEach(b=>{
    t.hire += b.hire; t.gearBits += b.gearBits; t.troops += b.troops;
    addRes(t.upkeep, b.upkeep); addRes(t.res, b.res); addRes(t.used, b.used);
  });
  return t;
}

/* the amount, then what share it is, faded, in brackets */
function gsAmtPct(need, have){
  if (!(have > 0)) return `<span class="bad">${money(need)}</span> <span class="pc">(∞)</span>`;
  const p = need / have * 100;
  const t = p < 1 ? "<1%" : Math.round(p).toLocaleString("en-US") + "%";
  const cls = p > 100 ? "bad" : p >= 80 ? "warn" : "";
  return `<span class="${cls}">${money(need)}</span> <span class="pc">(${t})</span>`;
}

const gsRow = (l, v, cls) =>
  `<div class="slip-l${cls ? " " + cls : ""}"><span>${l}</span><span class="v">${v}</span></div>`;

let gsPicker = null;                                   // which ticket has its colours open
function gsDots(key){
  const cur = GS_PAPER[gs.colors[key]] ? gs.colors[key] : GS_PAPER_DEFAULT;
  const pop = gsPicker === key ? `<div class="slip-pop">${Object.entries(GS_PAPER).map(([id, c])=>
    `<button type="button" class="slip-dot${cur === id ? " on" : ""}" title="${id}"
       style="background:${c.paper}" data-gs-color="${id}" data-gs-slip="${esc(key)}"></button>`).join("")}</div>` : "";
  return `<button type="button" class="slip-color${pop ? " open" : ""}" title="Colour"
      data-gs-pick="${esc(key)}" style="background:${GS_PAPER[cur].paper}"></button>${pop}`;
}

function gsPaper(key){
  const pc = GS_PAPER[gs.colors[key]] || GS_PAPER[GS_PAPER_DEFAULT];
  return `--paper:${pc.paper};--ink:${pc.ink}`;
}

/* the pieces a slip is made of; the totals ticket lays the same ones out wide */
function gsBillHTML(b){
  return gsRow("Hire", money(b.hire)) + gsRow("Gear", money(b.gearBits)) +
    gsRow(`${gsIcon("bits")} Total`, money(b.res.bits), "slip-tot") +
    GS_COST.filter(k => k !== "bits" && b.res[k] > 0)
      .map(k => gsRow(`${gsIcon(k)} ${esc(gsName(k))}`, money(b.res[k]))).join("");
}

/* gear taken off the reserves rather than built */
function gsWriteoffHTML(b){
  const used = Object.entries(b.used);
  return used.length ? `<div class="slip-sub">Writeoffs</div>` + used.map(([k, n]) =>
    gsRow(`${gearImg(k)} ${esc(gsShort(k))}`, n.toLocaleString("en-US"))).join("") : "";
}

function gsStockHTML(b){
  const rows = GS_COST.filter(k => b.res[k] > 0).map(k=>{
    const have = gsNum(gs.stock[k]), prod = gsNum(gs.prod[k]);
    const turns = b.res[k] > have && prod > 0 ? Math.ceil((b.res[k] - have) / prod) : null;
    return gsRow(`${gsIcon(k)} ${esc(gsName(k))}${turns == null ? ""
      : ` <span class="t">+${turns.toLocaleString("en-US")} turns</span>`}`, gsAmtPct(b.res[k], have));
  }).join("");
  return `<div class="slip-sub">Stockpile</div>${rows || gsRow("—", "")}`;
}

/* upkeep, and the share of production it eats; past 100% the stockpile
   makes up the gap, and the row says how many ticks of the chosen view it lasts */
function gsUpkeepHTML(b){
  const rows = GS_UPKEEP.filter(k => b.upkeep[k] > 0).map(k=>{
    const prod = gsNum(gs.prod[k]) * gs.upx;
    const gap = b.upkeep[k] - prod;
    let left = "";
    if (gap > 0){
      const n = Math.floor(gsNum(gs.stock[k]) / gap);
      left = ` <span class="t">${n.toLocaleString("en-US")} tick${n === 1 ? "" : "s"}</span>`;
    }
    return gsRow(`${gsIcon(k)} ${esc(gsName(k))}${left}`, gsAmtPct(b.upkeep[k], prod));
  }).join("");
  return rows ? `<div class="slip-sub">Upkeep <button type="button" class="slip-x" data-gs-upx>×${gs.upx}</button></div>${rows}` : "";
}

function gsUnitHTML(raw){
  const u = Object.assign({}, raw, {weapon: raw.weapon || "ScroungedWeapons", armor: raw.armor || "ScroungedArmor"});
  const n = gsNum(u.size);
  const gear = k => `<span class="g${SCROUNGED[k] ? " none" : ""}" title="${esc(label(k))}">${gearImg(k)}<span class="gn">${esc(gsShort(k))}</span></span>`;
  return `<div class="slip-u" ${tipAttrs(u.type, u.weapon, u.armor, n, u.training ?? 0)}>
      <div class="slip-u1"><span class="q">${n.toLocaleString("en-US")}</span><span class="nm">${esc(u.type)}</span>
        <span class="tr">T${clampInt(u.training ?? 0, 0, TRAIN_UNCAPPED)}</span></div>
      <div class="slip-u2">${gear(u.weapon)}<span class="plus">+</span>${gear(u.armor)}</div></div>`;
}

function gsSlip(c, b){
  const wo = gsWriteoffHTML(b);
  return `<div class="slip" style="${gsPaper(c.name)}">
      ${gsDots(c.name)}
      <div class="slip-name">${esc(c.name)}</div>
      <div class="slip-meta">${b.troops.toLocaleString("en-US")} troops · sat ${satCost(b.troops).toLocaleString("en-US")}</div>
      <div class="slip-cut"></div>
      ${c.units.map(gsUnitHTML).join("")}
      <div class="slip-cut"></div>
      ${gsBillHTML(b)}
      ${wo ? `<div class="slip-cut"></div>${wo}` : ""}
      <div class="slip-cut double"></div>
      ${gsStockHTML(b)}
      ${gsUpkeepHTML(b)}
    </div>`;
}

/* every army at once, on one wide ticket */
function gsTotal(comps, bills, t){
  const armies = comps.map((c, i)=>gsRow(esc(c.name), bills[i].troops.toLocaleString("en-US"))).join("");
  return `<div class="slip slip-wide" style="${gsPaper(GS_TOTAL)}">
      <div class="slip-wide-head">
        <div class="slip-name">Total</div>
        <div class="slip-meta">${t.troops.toLocaleString("en-US")} troops · sat ${satCost(t.troops).toLocaleString("en-US")}</div>
        ${gsDots(GS_TOTAL)}
      </div>
      <div class="slip-cut"></div>
      <div class="slip-cols">
        <div><div class="slip-sub">Armies</div>${armies}</div>
        <div><div class="slip-sub">Bill</div>${gsBillHTML(t)}</div>
        <div>${gsWriteoffHTML(t)}</div>
        <div>${gsStockHTML(t)}</div>
        <div>${gsUpkeepHTML(t)}</div>
      </div>
      ${gsGearTotalsHTML(comps)}
    </div>`;
}

/* every piece of gear the picked armies carry. With some of it in the
   reserve stockpile, the part still to build leads and the whole count follows
   in brackets; with the box ticked the stockpile is ignored outright */
function gsGearTotalsHTML(comps){
  const need = {};
  comps.forEach(c => c.units.forEach(u => [u.weapon, u.armor].forEach(k=>{
    if (k && !SCROUNGED[k]) need[k] = (need[k] || 0) + gsNum(u.size);
  })));
  const haveOf = k => gs.gearAll ? 0 : Math.max(0, Math.floor(gsNum(gs.resv[k])));
  const kept = GS_GEAR.filter(k => need[k] > 0);
  const rows = kept.map(k=>{
    const have = haveOf(k);
    const build = Math.max(0, need[k] - have);
    const tip = have > 0 ? ` <span class="pc gs-got" data-tip-key="${regTip(
      `Got ${have.toLocaleString("en-US")} stockpiled`, "gs")}">(${need[k].toLocaleString("en-US")})</span>` : "";
    return gsRow(`${gearImg(k)} ${esc(gsShort(k))}`, build.toLocaleString("en-US") + tip);
  });
  if (!rows.length) return "";
  /* a plain list to paste: what to build, and with a stockpile, how much of
     the whole count it already covers */
  const list = kept.map(k=>{
    const have = Math.min(haveOf(k), need[k]);
    return `${label(k)} **${(need[k] - have).toLocaleString("en-US")}**` +
      (have > 0 ? ` (${have.toLocaleString("en-US")}/${need[k].toLocaleString("en-US")} Stockpiled)` : "");
  }).join("\n");
  /* the builder's build line for the lot — less what the reserves already
     hold, unless the box says to build everything */
  const items = GS_GEAR.map(k=>{
    const n = gs.gearAll ? need[k] || 0 : Math.max(0, (need[k] || 0) - Math.floor(gsNum(gs.resv[k])));
    return n > 0 ? `${bq(label(k))}:${n}` : "";
  }).filter(Boolean);
  const line = items.length ? `build ${items.join(" ")}` : "";
  return `<div class="slip-cut"></div>
      <div class="slip-gear-head"><div class="slip-sub">Equipment</div>
        ${line ? `<button class="bp-btn txt-btn u-builder" title="Copy the army-builder line that builds this gear"
          data-units-copy="${esc(line)}">Builder Gear Copy</button>`
          : `<span class="small" style="opacity:.6">all covered by the stockpile</span>`}
        <label class="slip-chk"><input type="checkbox" data-gs-gearall${gs.gearAll ? " checked" : ""}>
          Don't account for stockpiled equipment</label>
        <button class="bp-btn u-copy" title="Copy the equipment as a list"
          data-units-copy="${esc(list).replace(/\n/g, "&#10;")}">${iconSvg("copy")}</button></div>
      <div class="slip-gear">${rows.join("")}</div>`;
}

/* ---- the reader ----
   100% bars split by army: what each resource goes to, and who fields which
   unit types and gear. An army's bar wears its own ticket colour, muted */
const GS_CHART  = GS_COST.map(k => ({id: k, k, up: false}))
  .concat(GS_UPKEEP.map(k => ({id: "up:" + k, k, up: true})));

/* a slip's paper, lifted toward its ink so it reads on the panel */
function gsMute(key){
  const pc = GS_PAPER[gs.colors[key]] || GS_PAPER[GS_PAPER_DEFAULT];
  const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const [p, k] = [h(pc.paper), h(pc.ink)];
  return "#" + p.map((v, i) => Math.round(v * .72 + k[i] * .28).toString(16).padStart(2, "0")).join("");
}

function gsChart(comps, bills){
  if (comps.length < 2) return "";
  const series = comps.map(c => ({name: c.name, color: gsMute(c.name)}));
  const pct = pc => pc < 1 ? "<1%" : Math.round(pc) + "%";

  const bar = (shares, tipFor) => `<div class="gs-cbar">${series.map((s, j)=>{
    const p = shares[j];
    if (!(p > 0)) return "";
    const pc = p * 100;
    return `<div class="gs-seg" style="flex:${p} 1 0;background:${s.color}" data-tip-key="${regTip(tipFor(s, j, pc), "gs")}">${
      pc >= 7 ? `<span>${esc(s.name)} ${pct(pc)}</span>` : ""}</div>`;
  }).join("")}</div>`;

  /* one row: its label, its total, and the split */
  const line = (lab, vals, iconHTML) => {
    const tot = vals.reduce((a, b) => a + b, 0);
    return `<div class="gs-crow"><div class="gs-clab">${lab}<span class="v">${money(tot)}</span></div>
      ${bar(vals.map(v => tot ? v / tot : 0), (s, j, pc) =>
        `<b>${esc(s.name)}</b><br>${iconHTML} ${money(vals[j])} of ${money(tot)} · ${pct(pc)}`)}</div>`;
  };
  const sec = (id, title, inner) => inner ? `<details class="gs-sub" data-gs-sec="${id}"${gs.reader[id] ? " open" : ""}>
      <summary>${title}</summary>${inner}</details>` : "";

  /* resources, with an overall bar averaging each army's share of the ones switched on */
  const amt = (r, i) => (r.up ? bills[i].upkeep[r.k] : bills[i].res[r.k]) || 0;
  const live = GS_CHART.filter(r => bills.some((_, i) => amt(r, i) > 0));
  const on = live.filter(r => !gs.chartOff.includes(r.id));
  const shares = on.map(r=>{
    const vals = comps.map((_, i) => amt(r, i)), tot = vals.reduce((a, b) => a + b, 0);
    return vals.map(v => tot ? v / tot : 0);
  });
  const overall = series.map((_, j) => shares.length ? shares.reduce((a, row) => a + row[j], 0) / shares.length : 0);
  const toggles = live.map(r=>`<button type="button" class="gs-rtog${gs.chartOff.includes(r.id) ? " off" : ""}"
      data-gs-chart="${r.id}" title="${esc(gsName(r.k))}${r.up ? " upkeep" : ""}">${gsIcon(r.k)}${r.up ? `<span class="up">up</span>` : ""}</button>`).join("");
  const resHTML = live.length ? `<div class="gs-chart-bar">${toggles}</div>
    ${on.length ? `<div class="gs-crow all"><div class="gs-clab"><b>Overall</b><span class="v">avg of ${on.length}</span></div>
      ${bar(overall, (s, j, pc) => `<b>${esc(s.name)}</b><br>${pct(pc)} average share over the
        ${on.length} resource${on.length === 1 ? "" : "s"} switched on`)}</div>` +
      on.map(r => line(`${gsIcon(r.k)} ${esc(gsName(r.k))}${r.up ? ` <span class="small muted">upkeep</span>` : ""}`,
        comps.map((_, i) => amt(r, i)), gsIcon(r.k))).join("")
      : `<div class="small muted">Every resource is switched off — click an icon to bring it back.</div>`}` : "";

  /* troops by unit type, and troops carrying each piece of gear */
  const count = (keyOf) => {
    const m = {};
    comps.forEach((c, i) => c.units.forEach(u=>{
      const k = keyOf(u);
      if (!k) return;
      (m[k] = m[k] || comps.map(() => 0))[i] += gsNum(u.size);
    }));
    return m;
  };
  const byType = count(u => u.type);
  const typesHTML = UNIT_ORDER.filter(g => byType[g.type]).map(g =>
    line(`<span class="g-name t-${g.type.toLowerCase()}">${esc(g.type)}</span>`, byType[g.type], "")).join("");
  const gearHTML = kind => {
    const m = count(u => { const k = u[kind]; return k && !SCROUNGED[k] ? k : null; });
    const costs = kind === "weapon" ? WEAPON_COST : ARMOR_COST;
    return UNIT_ORDER.flatMap(g => g.gear.filter(k => k in costs && m[k]).map(k =>
      line(`${gearImg(k)}<span class="g-name t-${g.type.toLowerCase()}">${esc(label(k))}</span>`, m[k], gearImg(k)))).join("");
  };

  return `<div class="gs-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` +
    sec("res", "Resources", resHTML) + sec("types", "Unit types", typesHTML) +
    sec("weapons", "Weapons", gearHTML("weapon")) + sec("armor", "Armour", gearHTML("armor"));
}

/* ---- stockpile in and out, as plain "Name: amount" lines ---- */
/* the reserves only list the gear there is some of */
function gsExportText(){
  const sec = (title, bucket, keys) => [title].concat(keys.map(k => `${gsName(k)}: ${gsFmt(gsNum(gs[bucket][k]))}`));
  const resv = ["Reserves"].concat(GS_GEAR.filter(k => gsNum(gs.resv[k]) > 0)
    .map(k => `${label(k)}: ${gsFmt(gsNum(gs.resv[k]))}`));
  return sec("Stockpile", "stock", GS_STOCK).concat([""], sec("Production / turn", "prod", GS_PROD), [""], resv).join("\n");
}

/* a section a paste names replaces that section; a paste with no headings is the stockpile */
function gsImportText(txt){
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  const byName = k => (bucket === "resv" ? [label(k), k] : [gsName(k), k]).map(norm);
  let bucket = "stock", keys = GS_STOCK, n = 0;
  const seen = {};
  const bad = [];
  txt.split(/\r?\n/).forEach(line=>{
    const l = line.trim();
    if (!l) return;
    if (/^production/i.test(l)){ bucket = "prod"; keys = GS_PROD; return; }
    if (/^stock/i.test(l)){ bucket = "stock"; keys = GS_STOCK; return; }
    /* only the gear there is some of is written out, so the heading alone clears the rest */
    if (/^reserve/i.test(l)){ bucket = "resv"; keys = GS_GEAR; seen.resv = true; gs.resv = {}; n++; return; }
    const m = l.match(/^(.+?)\s*[:=]\s*([\d,.\s]*)$/);
    const want = m && norm(m[1]);
    const k = m && keys.find(k => byName(k).includes(want));
    if (!k){ bad.push(l); return; }
    if (!seen[bucket]){ seen[bucket] = true; gs[bucket] = {}; }
    const v = gsNum(m[2].replace(/\s/g, ""));
    if (v) gs[bucket][k] = v;
    n++;
  });
  return {n, bad};
}

function gsModal(title, bodyHTML, footHTML){
  closeModal();
  const wrap = document.createElement("div");
  wrap.className = "modal-wrap";
  wrap.id = "modalWrap";
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">${footHTML}</div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e=>{ if (e.target === wrap || e.target.closest("[data-modal-close]")) closeModal(); });
  return wrap;
}

function gsShowExport(){
  const w = gsModal("Export stockpile and reserves",
    `<textarea class="gs-io-text" id="gsIoText" readonly spellcheck="false"></textarea>`,
    `<span class="small muted" id="gsIoMsg"></span><span class="spacer"></span>
     <button class="btn btn-xs btn-primary" id="gsIoCopy">Copy</button>
     <button class="btn btn-xs" data-modal-close>Close</button>`);
  const ta = w.querySelector("#gsIoText");
  ta.value = gsExportText();
  ta.select();
  w.querySelector("#gsIoCopy").addEventListener("click", ()=>{
    ta.select();
    const done = ()=>{ w.querySelector("#gsIoMsg").textContent = "Copied."; };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(done, ()=>{ document.execCommand("copy"); done(); });
    else { document.execCommand("copy"); done(); }
  });
}

function gsShowImport(){
  const w = gsModal("Import stockpile and reserves",
    `<div class="small muted" style="margin-bottom:6px">Paste an exported stockpile. Sections it names are
       replaced; anything else is left alone.</div>
     <textarea class="gs-io-text" id="gsIoText" spellcheck="false" placeholder="Stockpile\nApples: 1,200\n…"></textarea>`,
    `<span class="small muted" id="gsIoMsg"></span><span class="spacer"></span>
     <button class="btn btn-xs btn-primary" id="gsIoGo">Import</button>
     <button class="btn btn-xs" data-modal-close>Cancel</button>`);
  const ta = w.querySelector("#gsIoText");
  ta.focus();
  w.querySelector("#gsIoGo").addEventListener("click", ()=>{
    const r = gsImportText(ta.value);
    if (!r.n){ w.querySelector("#gsIoMsg").textContent = "Nothing in there I could read."; return; }
    gsSave();
    gsInputs("gsStock", "stock", GS_STOCK);
    gsInputs("gsProd", "prod", GS_PROD);
    gsReserves();
    gsStrip();
    renderGrand();
    if (r.bad.length) w.querySelector("#gsIoMsg").textContent =
      `Imported ${r.n}; skipped ${r.bad.length} line${r.bad.length === 1 ? "" : "s"}: ${r.bad.slice(0, 3).join(" · ")}`;
    else closeModal();
  });
}

function renderGrand(){
  clearTips("gs");
  const comps = gsComps();
  const resvLeft = {};
  GS_GEAR.forEach(k=>{ resvLeft[k] = Math.floor(gsNum(gs.resv[k])); });
  const bills = comps.map(c => gsBill(c.units, resvLeft));
  gsEl("gsWide").checked = gs.wide;
  gsEl("gsFocus").checked = gs.focus;
  gsEl("viewGrand").classList.toggle("gs-focus", gs.focus);
  gsEl("gsOut").innerHTML = comps.length
    ? `<div class="gs-slips${gs.wide ? " wide" : ""}">${comps.map((c, i) => gsSlip(c, bills[i])).join("")}</div>` : "";
  gsEl("gsTotal").innerHTML = comps.length ? gsTotal(comps, bills, gsMerge(bills)) : "";
  const reader = gsChart(comps, bills);
  gsEl("gsChartBody").innerHTML = reader;
  gsEl("gsChart").classList.toggle("none", !reader);
}

/* ---- grand strategy wiring ---- */
gsInputs("gsStock", "stock", GS_STOCK);
gsInputs("gsProd", "prod", GS_PROD);
gsReserves();
gsStrip();
gsEl("gsReserves").open = false;                        // every visit opens with the reserves folded
gsEl("gsChart").open = store.get(LS_GRAND + ".readerOpen", false) === true;
/* toggle does not bubble, so the sections inside are caught on the way down */
gsEl("gsChart").addEventListener("toggle", e=>{
  const d = e.target;
  if (d === gsEl("gsChart")) store.set(LS_GRAND + ".readerOpen", d.open);
  else if (d.dataset?.gsSec){ gs.reader[d.dataset.gsSec] = d.open; gsSave(); }
}, true);

gsEl("viewGrand").addEventListener("input", e=>{
  const i = e.target.closest("[data-gs-bucket]");
  if (!i) return;
  gsCommas(i);
  const v = gsNum(i.value);
  if (v) gs[i.dataset.gsBucket][i.dataset.gsKey] = v;
  else delete gs[i.dataset.gsBucket][i.dataset.gsKey];
  gsSave();
  if (i.dataset.gsBucket === "prod") gsStrip();
  renderGrand();
});

gsEl("viewGrand").addEventListener("click", e=>{
  const chip = e.target.closest("[data-gs-comp]");
  if (chip){
    const n = chip.dataset.gsComp, i = gs.comps.indexOf(n);
    if (i >= 0) gs.comps.splice(i, 1); else gs.comps.push(n);
    gsSave();
    renderGrand();
    return;
  }
  const pick = e.target.closest("[data-gs-pick]");
  if (pick){
    gsPicker = gsPicker === pick.dataset.gsPick ? null : pick.dataset.gsPick;
    renderGrand();
    return;
  }
  const dot = e.target.closest("[data-gs-color]");
  if (dot){
    gs.colors[dot.dataset.gsSlip] = dot.dataset.gsColor;
    gsPicker = null;
    gsSave();
    renderGrand();
    return;
  }
  const tog = e.target.closest("[data-gs-chart]");
  if (tog){
    const id = tog.dataset.gsChart, i = gs.chartOff.indexOf(id);
    if (i >= 0) gs.chartOff.splice(i, 1); else gs.chartOff.push(id);
    gsSave();
    renderGrand();
    return;
  }
  if (e.target.closest("[data-gs-upx]")){
    gs.upx = gs.upx === 1 ? GS_TICKS : 1;
    gsSave();
    renderGrand();
  }
});

document.addEventListener("warcalc:presets", renderGrand);

/* a click anywhere else puts an open colour picker away */
document.addEventListener("click", e=>{
  if (gsPicker == null || e.target.closest(".slip-pop,[data-gs-pick]")) return;
  gsPicker = null;
  renderGrand();
});

document.addEventListener("change", e=>{
  if (!e.target.matches?.("[data-gs-gearall]")) return;
  gs.gearAll = e.target.checked;
  gsSave();
  renderGrand();
});
gsEl("gsFocus").addEventListener("change", ()=>{
  gs.focus = gsEl("gsFocus").checked;
  gsSave();
  renderGrand();
});
gsEl("gsColours").addEventListener("click", ()=>{
  gs.comps.forEach((n, i)=>{ gs.colors[n] = GS_PAPER_CYCLE[i % GS_PAPER_CYCLE.length]; });
  gsSave();
  renderGrand();
});
gsEl("gsExport").addEventListener("click", gsShowExport);
gsEl("gsImport").addEventListener("click", gsShowImport);

gsEl("gsWide").addEventListener("change", ()=>{
  gs.wide = gsEl("gsWide").checked;
  gsSave();
  renderGrand();
});


restoreAutosave();
refreshPresetSelects();
refreshCounts();
showTab(store.get(LS_TAB, "battle"));
refreshJumpDock();
autosaveArmed = true;
loadFromHash();
addEventListener("hashchange", loadFromHash);
addEventListener("keydown", e=>{ if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
