<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CurioCalc 2.11 — CLOP</title>
<style>
:root{
  --bg:#272b30;
  --text:#c8c8c8;
  --text-dim:#8b9198;
  --sunken:#1c1e22;
  --raised:#2e3338;
  --border:#1c1e22;
  --border-soft:rgba(0,0,0,.6);
  --link:#ffffff;

  --btn-default-a:#484e55; --btn-default-b:#313539;
  --btn-primary-a:#8a9196; --btn-primary-b:#70787d;
  --btn-success-a:#78cc78; --btn-success-b:#53be53;
  --btn-info-a:#74cae3;    --btn-info-b:#4ab9db;
  --btn-warning-a:#faa123; --btn-warning-b:#e48806;
  --btn-danger-a:#f17a77;  --btn-danger-b:#ec4d49;
  --btn-ink:#fff; --btn-ink-dim:rgba(255,255,255,.72); --btn-shadow:0 -1px 0 rgba(0,0,0,.4);
  --btn-default-ink:var(--btn-ink); --btn-default-ink-dim:var(--btn-ink-dim); --btn-default-shadow:var(--btn-shadow);   /* the plain grey button's own */
  --chip-x:rgba(255,255,255,.6);

  /* the theme picker in the gear drawer swaps these; Grey is the house look */
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --head-font:var(--font);
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  --strong:#fff;
  --faint:#5d6168; --faint-2:#6e7378; --rule-dim:#8a8f98;  --sw-ink:#d4d8dd;
  --input-bg:#fff; --input-ink:#22262a;
  --hi:255,255,255;   /* hairlines and washes drawn lighter than the panel */
  --lo:0,0,0;         /* rules, wells and shadows drawn darker than it */
  --accent:#4ab9db;
  --atk:#f17a77; --atk-rgb:241,122,119; --atk-deep:#b04542; --atk-lost:#a8514f;
  --def:#74cae3; --def-rgb:116,202,227; --def-deep:#3a7fa0; --def-lost:#4f8a9c;
  --good:#78cc78; --good-rgb:120,204,120;
  --warn:#faa123; --warn-rgb:250,161,35;
  --gold:#e2c760; --gold-rgb:226,199,96; --gold-dim:#8f7830; --gold-hov:#b09540; --gold-box:#b8972a; --gold-train:#b8962e;
  --tone-b-rgb:92,168,226; --tone-c-rgb:162,116,226; --grey-rgb:120,126,134;
  --paper-atk:#321f27; --ink-atk:#e3ccd4;
  --paper-def:#1c2531; --ink-def:#cbd9e7;
  --paper-moss:#1f2b24; --ink-moss:#cddfd2;
  --surv-atk:#241a1a; --surv-def:#1a2026; --worth-bg:#22252a;
  --opt-wine:#c46a86; --opt-wine-hov:#e08aa4; --opt-wine-box:#8e2f4f;
  --opt-blue:#6fa8dc; --opt-blue-hov:#94c2ec; --opt-blue-box:#3b78b5;
  --opt-purple:#a58bd8; --opt-purple-hov:#c0aaf0; --opt-purple-box:#7453b8;
  --t-cav:#FF0000; --t-tank:#0076FF; --t-peg:#FF6EC7; --t-uni:#00FF21; --t-nav:#00FFFF;
}

/* ===================== themes =====================
   Picked from the gear drawer and kept in this browser. Each sets the
   house variables above, then dresses up what variables alone can't reach.
   Light themes flip --hi to a dark ink and soften --lo, so the hairlines and
   washes drawn for a dark page still read on a pale one. */
/* a painted page background is laid once down the page, never tiled */
[data-theme] body{min-height:100vh;background-repeat:no-repeat}
/* buttons and dropdowns wear the theme's type too (Grey leaves them as they were) */
[data-theme] :where(button,select){font-family:var(--font)}
@font-face{font-family:"Lovelt";src:url("https://files.catbox.moe/h1xvtm.ttf") format("truetype");font-display:swap}

/* ---- White: Bootstrap 3 with its gradients ---- */
:root[data-theme="white"]{
  color-scheme:light;
  --bg:#fff; --text:#333; --text-dim:#777; --strong:#333; --faint:#999; --faint-2:#999; --rule-dim:#999; --sw-ink:#555;

  --btn-default-a:#fff; --btn-default-b:#e0e0e0;
  --btn-primary-a:#428bca; --btn-primary-b:#2d6ca2;
  --btn-success-a:#5cb85c; --btn-success-b:#419641;
  --btn-info-a:#5bc0de;    --btn-info-b:#2aabd2;
  --btn-warning-a:#f0ad4e; --btn-warning-b:#eb9316;
  --btn-danger-a:#d9534f;  --btn-danger-b:#c12e2a;
  --btn-ink:#fff; --btn-shadow:0 -1px 0 rgba(0,0,0,.2);
  --btn-default-ink:#333; --btn-default-ink-dim:#777; --btn-default-shadow:0 1px 0 #fff; --chip-x:#999;
  --input-bg:#fff; --input-ink:#555;
  --hi:0,0,0; --lo:110,110,110;
  --accent:#428bca;
  --atk:#c9302c; --atk-rgb:217,83,79; --atk-deep:#a94442; --atk-lost:#a94442;
  --def:#2a7fa8; --def-rgb:91,192,222; --def-deep:#31708f; --def-lost:#31708f;
  --good:#3c8d3c; --good-rgb:92,184,92;
  --warn:#d58512; --warn-rgb:240,173,78;
  --gold:#a07a12; --gold-rgb:240,196,25; --gold-dim:#8a6d3b; --gold-hov:#6b5329; --gold-box:#c09853; --gold-train:#8a6d3b;
  --paper-atk:#f2dede; --ink-atk:#a94442;
  --paper-def:#d9edf7; --ink-def:#31708f;
  --paper-moss:#dff0d8; --ink-moss:#3c763d;
  --surv-atk:#fbf0f0; --surv-def:#eef6fb; --worth-bg:#f5f5f5;
  --opt-wine:#a94466; --opt-wine-hov:#c9567f; --opt-wine-box:#a94466;
  --opt-blue:#337ab7; --opt-blue-hov:#23527c; --opt-blue-box:#337ab7;
  --opt-purple:#6f42c1; --opt-purple-hov:#59339d; --opt-purple-box:#6f42c1;
  --t-cav:#d00; --t-tank:#0060d0; --t-peg:#d6339a; --t-uni:#14a020; --t-nav:#0a9a9a;
}
[data-theme="white"] .tabstrip{background-image:linear-gradient(#fff,#f8f8f8);border-bottom-color:#e7e7e7;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 5px rgba(0,0,0,.075)}
[data-theme="white"] .panel{box-shadow:0 1px 2px rgba(0,0,0,.05)}
[data-theme="white"] .panel > .panel-head:first-child{margin:-14px -14px 12px;padding:9px 14px;border-radius:3px 3px 0 0;
  background-image:linear-gradient(#f5f5f5,#e8e8e8);border-bottom-color:#ddd}
[data-theme="white"] .well{background-image:linear-gradient(#e8e8e8,#f5f5f5);border-color:#dcdcdc;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.05),0 1px 0 rgba(255,255,255,.1)}
[data-theme="white"] .btn{border-color:#ccc}
[data-theme="white"] :is(.btn-primary,.btn-success,.btn-info,.btn-warning,.btn-danger){border-color:rgba(0,0,0,.18)}
[data-theme="white"] .tab.active{background-image:linear-gradient(#ebebeb,#f3f3f3);box-shadow:inset 0 3px 9px rgba(0,0,0,.075)}

/* ---- Black: Bootswatch Cyborg ---- */

  --bg:#060606; --text:#888; --text-dim:#6f6f6f; --strong:#fff; --faint:#555; --faint-2:#555; --rule-dim:#666; --sw-ink:#bbb;

  --def:#2a9fd6; --def-rgb:42,159,214; --def-deep:#1f79a3; --def-lost:#2386b4;
  --good:#77b300; --good-rgb:119,179,0;
  --warn:#f80; --warn-rgb:255,136,0;
  --gold:#e6c229; --gold-rgb:230,194,41; --gold-dim:#9a8420; --gold-hov:#c2a52a; --gold-box:#c9a619; --gold-train:#a8901f;

[data-theme="optimal"] h1,[data-theme="optimal"] h2{color:#ff9fff;font-weight:400}
[data-theme="optimal"] h3{font-family:var(--font);font-weight:700}
[data-theme="optimal"] .tabstrip{background:#000;border-bottom-color:#ff9fff;box-shadow:0 .25rem .5rem rgba(255,159,255,.25)}
[data-theme="optimal"] .tab.active{border-bottom-color:#ff9fff}

[data-theme="optimal"] .panel{border-radius:.25rem;box-shadow:0 .25rem .5rem 0 #ff9fff}
[data-theme="optimal"] .well{border-color:#ff9fff;box-shadow:0 0 .5rem .01rem rgba(255,159,255,.5)}
[data-theme="optimal"] input,[data-theme="optimal"] select,[data-theme="optimal"] textarea{border-color:#fff}
[data-theme="optimal"] :is(input,textarea)::placeholder{color:#5b375b}
[data-theme="optimal"] :is(.btn,.badge,.mark-chip,.ctr-rank,.gs-colours){border:1px solid #ff9fff;
  box-shadow:0 0 .5rem .05rem rgba(255,159,255,.5)}
[data-theme="optimal"] :is(.btn,.mark-chip,.gs-colours,.hk-btn):hover{background-image:none;background-color:#5b375b;filter:none}
[data-theme="optimal"] .btn:active{background-image:none;background-color:#ff9fff;color:#000}
[data-theme="optimal"] :is(.btn-danger,.badge-danger){border-color:#fff;box-shadow:0 0 .25rem .1rem rgba(255,255,255,.5)}
[data-theme="optimal"] :is(.btn-success,.mark-chip.on,.ctr-rank.top){background-image:none;background-color:#5b375b}
[data-theme="optimal"] .badge-info{color:#a9d8ff;border-color:#a9d8ff;box-shadow:0 0 .4rem rgba(169,216,255,.5)}
[data-theme="optimal"] .badge-danger{color:#ff7aa2}
[data-theme="optimal"] .hk-btn{border-color:#ff9fff;background-image:none;background-color:#000}
[data-theme="optimal"] ::selection{background:#ff9fff;color:#000}

  linear-gradient(180deg,#b9e8ff,#6eb9f6 1400px,#d9f8ff 2600px) #d9f8ff}
[data-theme="rainbow"] .tabstrip{background:linear-gradient(#d9ecff,#8fbff5 58%,#6da5ed);border-bottom:3px solid;
  border-image:linear-gradient(90deg,#ee4144,#f37033,#fdf6af,#62bc4d,#1e98d3,#672f89) 1}
[data-theme="rainbow"] .tabstrip{--text-dim:#1b3c72;--strong:#052c7c;--raised:#eff8ff}
[data-theme="rainbow"] .tab,[data-theme="rainbow"] .tab-brand{font-weight:700}
[data-theme="rainbow"] .tab:hover,[data-theme="rainbow"] .tab.active{text-shadow:0 1px 0 rgba(255,255,255,.8)}
[data-theme="rainbow"] .tab.active{border-bottom-color:#ff4fc8}
[data-theme="rainbow"] .tab-brand{font:400 10px/1 "Press Start 2P","Courier New",monospace;color:#102d66}
[data-theme="rainbow"] .panel{border:2px solid #72b6f1;border-radius:8px;background:rgba(239,250,255,.92);
  box-shadow:0 4px 14px rgba(11,79,160,.28),inset 0 0 0 2px rgba(255,255,255,.78)}
[data-theme="rainbow"] .panel > .panel-head:first-child{margin:-12px -12px 12px;padding:6px 10px;border-radius:6px;
  border:1px solid #8bd0ff;background:linear-gradient(#7cc9ff,#3f96e9);
  --text:#fff;--text-dim:#e5f8ff;--strong:#fff;--sunken:#eff8ff;--border-soft:rgba(5,44,124,.35)}
[data-theme="rainbow"] .panel > .panel-head:first-child h2{color:#fff;text-transform:uppercase;font-weight:700;letter-spacing:.02em;
  text-shadow:-1px -1px 0 #2066c3,1px -1px 0 #2066c3,-1px 1px 0 #2066c3,1px 1px 0 #2066c3,0 2px 0 #174d9a}
[data-theme="rainbow"] .panel > .panel-head:first-child :is(.ap-sel,.bp-sel){color:#063a94}
[data-theme="rainbow"] h2{color:#1d69c7;font-weight:700}
[data-theme="rainbow"] .well{border:2px solid #9bd8ff;border-radius:6px}
[data-theme="rainbow"] .log,[data-theme="rainbow"] .mono{font-weight:700}
[data-theme="rainbow"] .btn{border-color:#4d8bdc;border-radius:6px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6)}
[data-theme="rainbow"] input,[data-theme="rainbow"] select,[data-theme="rainbow"] textarea{border-color:#74aeea}
[data-theme="rainbow"] ::selection{background:#ff4fc8;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:var(--font-size,14px)/1.45 var(--font);
  padding:20px;
}
h1,h2,h3{margin:0 0 10px;font-weight:500;color:var(--strong);letter-spacing:.01em;font-family:var(--head-font)}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:15px;color:var(--text)}
a{color:var(--link)}
.mono{font-family:var(--mono)}
.muted{color:var(--text-dim)}
.small{font-size:12px}

/* ---------- surfaces ---------- */
.panel{
  background:var(--raised);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px;
  margin-bottom:16px;
}
.well{
  background:var(--sunken);
  border:1px solid var(--border-soft);
  border-radius:4px;
  padding:12px;
}
.panel-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border-soft);
}
.panel-head h2{margin:0;flex:0 0 auto}
.spacer{flex:1 1 auto}

/* ---------- controls ---------- */
.btn{
  display:inline-block;border:1px solid var(--border-soft);border-radius:4px;
  padding:5px 12px;font-size:13px;font-weight:500;color:var(--btn-default-ink);cursor:pointer;
  text-shadow:var(--btn-default-shadow);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.btn:hover{filter:brightness(1.14)}
.btn:active{filter:brightness(.9)}
.btn:focus-visible{outline:2px solid var(--def);outline-offset:1px}
.btn-primary{background-image:linear-gradient(to bottom,var(--btn-primary-a),var(--btn-primary-b))}
.btn-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.btn-info{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}
.btn-warning{background-image:linear-gradient(to bottom,var(--btn-warning-a),var(--btn-warning-b))}
.btn-danger{background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b))}
.btn-primary,.btn-success,.btn-info,.btn-warning,.btn-danger{color:var(--btn-ink);text-shadow:var(--btn-shadow)}
.btn-xs{padding:2px 8px;font-size:12px}

.badge{
  display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600;color:var(--btn-default-ink);
  text-shadow:var(--btn-default-shadow);border:1px solid var(--border-soft);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.badge-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.badge-danger{background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b))}
.badge-info{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}
.badge-warning{background-image:linear-gradient(to bottom,var(--btn-warning-a),var(--btn-warning-b))}
.badge-success,.badge-danger,.badge-info,.badge-warning{color:var(--btn-ink);text-shadow:var(--btn-shadow)}

input,select,textarea{
  background:var(--input-bg);color:var(--input-ink);border:1px solid var(--border-soft);border-radius:3px;
  padding:4px 6px;font:13px/1.3 inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=number]{width:100%}
select{width:100%}
textarea{width:100%;min-height:170px;font-family:var(--mono);font-size:12px}
label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:3px}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;text-align:left;vertical-align:middle}
thead th{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);
  font-weight:600;border-bottom:1px solid var(--border-soft);
}
tbody tr{border-bottom:1px solid rgba(var(--lo),.35)}
tbody tr:last-child{border-bottom:none}

.force-table td{padding:6px 5px}
.col-sprite{width:86px}
.col-name{width:100px}
.col-type{width:112px}
.col-weapon{width:150px}
.col-armor{width:130px}
.col-size{width:72px}
.col-train{width:44px}
.force-table .uname{width:100%}
/* the default training for new rows, tucked beside the unit count */
.barracks{display:inline-flex;align-items:center;gap:4px;margin:0 0 0 6px;
  font-size:11px;font-weight:400;color:var(--text-dim);text-transform:none;letter-spacing:0}
.barracks input{width:30px;padding:1px 3px;font-size:11px;-moz-appearance:textfield;appearance:textfield}
.barracks input::-webkit-inner-spin-button,.barracks input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.barracks .uncap{width:auto;margin:0 0 0 2px;padding:0}
/* training is two digits at most, so its box drops the spinner and keeps the room */
.force-table .training{padding-left:4px;padding-right:2px;-moz-appearance:textfield;appearance:textfield}
.force-table .training::-webkit-inner-spin-button,
.force-table .training::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.col-del{width:34px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- sprite ---------- */
.sprite{
  width:80px;height:50px;display:block;object-fit:contain;
  background:var(--sunken);border:1px solid var(--border-soft);border-radius:3px;
}
.sprite-lg{width:80px;height:50px;margin:0 auto}
.sprite-missing.sprite-lg{margin:0 auto}
.sprite-missing{
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:20px;font-weight:600;
}
.sprite-missing.sprite-lg{font-size:20px}

/* the front-line / reinforcement switch: a bare - and + tucked above the
   type selector, shown while the sprite or type cell is hovered, taking no
   room so the row never grows */
.force-table td.col-sprite,.force-table td.col-type{position:relative}
.reinf-sw{position:absolute;left:5px;top:3px;display:none;gap:3px;line-height:1}
.force-table tr:has(td.col-sprite:hover, td.col-type:hover) .reinf-sw{display:flex}
.reinf-sw button{
  all:unset;cursor:pointer;position:relative;width:12px;height:12px;opacity:.45;
  border-radius:50%;background:rgba(var(--grey-rgb),.14);font-size:0;color:var(--sw-ink);
}
/* the - and + are drawn as bars so they sit dead centre in the circle */
.reinf-sw button::before,.reinf-sw button[data-reinf="1"]::after{
  content:"";position:absolute;left:50%;top:50%;background:currentColor;
  width:6px;height:1.5px;transform:translate(-50%,-50%);
}
.reinf-sw button[data-reinf="1"]::after{width:1.5px;height:6px}
.reinf-sw button:hover,.reinf-sw button.on{opacity:1}
/* the same bare - and + beside the Tr heading step every row's training */
.force-table th.col-train{position:relative}
.tr-sw{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:none;gap:3px;line-height:1}
.force-table th.col-train:hover .tr-sw{display:flex}
.tr-sw button{
  all:unset;cursor:pointer;position:relative;width:12px;height:12px;opacity:.45;
  border-radius:50%;background:rgba(var(--grey-rgb),.14);font-size:0;color:var(--sw-ink);
}
.tr-sw button::before,.tr-sw button[data-step="1"]::after{
  content:"";position:absolute;left:50%;top:50%;background:currentColor;
  width:6px;height:1.5px;transform:translate(-50%,-50%);
}
.tr-sw button[data-step="1"]::after{width:1.5px;height:6px}
.tr-sw button:hover{opacity:1}
/* a reinforcement sits out tick 1: drained of colour and tabbed in a touch */
tr.reserve .spriteSlot{display:block;transform:translateX(4px)}
tr.reserve .spriteSlot .sprite{filter:grayscale(1);opacity:.8}
tr.reserve td.col-sprite::before{
  content:"";position:absolute;left:2px;top:8px;bottom:8px;width:2px;border-radius:1px;
  background:rgba(var(--gold-rgb),.55);
}

/* ---------- log ---------- */
.log{
  max-height:320px;overflow:auto;font-family:var(--mono);
  font-size:12px;line-height:1.6;
}
.log.log-full{max-height:none;overflow:visible}
.log-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.log-head h3{margin:0}
.log div{padding:2px 0;border-bottom:1px solid rgba(var(--lo),.25)}
.log b{color:var(--strong);font-weight:600}
.unit-ref{font-weight:600;cursor:help;border-bottom:1px dotted currentColor}
/* the exchange log's Use icons / Use names boxes, centred on the Resolve / Clear buttons */
.run-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.log-opt{margin:0}
.ref-ic,.ref-nick{display:none}
/* Use icons shows the piece in play; Show weapon and armor shows both, weapon first */
body.log-icons:not(.log-both) .ref-one{display:inline-block;vertical-align:-3px;margin-right:4px}
body.log-icons.log-both:not(.log-both-named) .ref-both{display:inline-flex;gap:2px;vertical-align:-3px;margin-right:4px}
/* Only for named units: both pieces on the named, the one in play on the rest */
/* a name only counts while Use names is showing it */
body.log-icons.log-both.log-both-named .ref-one:not(.ref-named),
body.log-icons.log-both.log-both-named:not(.log-names) .ref-one{display:inline-block;vertical-align:-3px;margin-right:4px}
body.log-icons.log-both.log-both-named.log-names .ref-both.ref-named{display:inline-flex;gap:2px;vertical-align:-3px;margin-right:4px}
/* the one swinging reads armour then weapon, so the weapon sits against its
   name; the setting in the gear drawer puts it back to weapon first */
body:not(.icons-wa) .ref-both.ref-swing{flex-direction:row-reverse}
body.log-icons .ref-ic .gear-img{width:auto;max-width:32px;flex:none}
#logBothWrap,#logBothNamedWrap{display:none}
body.log-icons #logBothWrap,body.log-icons.log-both #logBothNamedWrap{display:inline-flex}
/* each box and the one it opens share a colour: wine for the gear pair,
   blue for the names pair */
.log-opt.opt-wine{color:var(--opt-wine)}
.log-opt.opt-wine:hover{color:var(--opt-wine-hov)}
.log-opt.opt-wine input{accent-color:var(--opt-wine-box)}
.log-opt.opt-blue{color:var(--opt-blue)}
.log-opt.opt-blue:hover{color:var(--opt-blue-hov)}
.log-opt.opt-blue input{accent-color:var(--opt-blue-box)}
.log-opt.opt-yellow{color:var(--gold-dim)}
.log-opt.opt-yellow:hover{color:var(--gold-hov)}
.log-opt.opt-yellow input{accent-color:var(--gold-box)}
.log-opt.opt-purple{color:var(--opt-purple)}
.log-opt.opt-purple:hover{color:var(--opt-purple-hov)}
.log-opt.opt-purple input{accent-color:var(--opt-purple-box)}
/* Defender vertical align (off to start): the swinging half of every exchange takes the
   width of the log's widest, so the ones struck line up down one edge */
body.log-dalign .xlog{display:grid;grid-template-columns:max-content minmax(0,1fr)}
body.log-dalign .xlog > *{grid-column:1 / -1}
body.log-dalign .xlog > .xr{display:grid;grid-template-columns:subgrid;align-items:baseline}
/* the columns say who hit whom, so "hit" goes; its room stays as a gap,
   ruled across in the swinger's colour, stopping 10px short of either unit */
body.log-dalign .xlog .xatk{display:flex;align-items:baseline}
body.log-dalign .xlog .xhit{flex:1;min-width:40px;font-size:0;align-self:stretch;display:flex;align-items:center}
body.log-dalign .xlog .xhit::after{content:"";flex:1;height:1px;margin:0 10px;opacity:.33}
body.log-dalign .xlog .xr-atk .xhit::after{background:var(--atk)}
body.log-dalign .xlog .xr-def .xhit::after{background:var(--def)}
/* Align damage too: the damage takes a column of its own, "for" dropped,
   at least 30px clear of the one struck, with a grey rule across the gap */
body.log-dalign.log-ddmg .xlog{grid-template-columns:max-content max-content minmax(0,1fr)}
body.log-dalign.log-ddmg .xlog .xrest{display:contents}
body.log-dalign.log-ddmg .xlog .xfor{display:none}
body.log-dalign.log-ddmg .xlog .xdef{display:flex;align-items:center}
body.log-dalign.log-ddmg .xlog .xdef::after{content:"";flex:1;min-width:10px;height:1px;margin:0 10px;
  align-self:center;background:var(--rule-dim);opacity:.33}
/* every icon slot is as wide as the widest picture it can hold — weapons
   run to 24px, armour to 32 — so the names line up down the log whatever
   gear they carry, and each picture sits centred in its own slot */
body.log-dalign .xlog .ref-one{width:32px;text-align:center}
body.log-dalign .xlog .ref-one.ref-swing{width:24px}
body.log-dalign .xlog .ref-both{width:58px}
/* the pair is always written weapon then armour, whichever way round it shows */
body.log-dalign .xlog .ref-both .gear-img{width:24px;max-width:none;object-position:center}
body.log-dalign .xlog .ref-both .gear-img + .gear-img{width:32px}
body.log-names .ref-nick{display:inline}
body.log-names .unit-ref:has(.ref-nick) .ref-sys{display:none}
/* Cleaner Exchange Log: "ACFU + Bigdog 40" in place of the system name;
   a unit's own name still wins when Use names is on */
.ref-kit{display:none}
body.log-clean .ref-sys{display:none}
body.log-clean .ref-kit{display:inline}
body.log-clean.log-names .unit-ref:has(.ref-nick) .ref-kit{display:none}
/* Numbers with names: the unit's size after its name, in white.
   The clean log always carries it, unless a name stands in and the box is off */
.ref-num{display:none;margin-left:4px;font-weight:500}
body.log-names.log-nums .unit-ref:has(.ref-nick) .ref-num,
body.log-clean .ref-num{display:inline}
body.log-clean.log-names:not(.log-nums) .unit-ref:has(.ref-nick) .ref-num{display:none}
.ref-num{color:var(--strong)}
/* Show hits and size changes: the one struck reads (before→after) */
.ref-num .n-chg{display:none}
body.log-clean.log-hits .ref-num:has(.n-chg) .n-plain{display:none}
body.log-clean.log-hits .ref-num .n-chg{display:inline}
body.log-clean.log-hits.log-names:not(.log-nums) .unit-ref:has(.ref-nick) .ref-num:has(.n-chg){display:inline}
/* Attacker dmg leftwards: the swinger's size goes in front of its name. The
   size is written twice and this picks which one shows; both copies obey
   the rules above about when a size shows at all */
.ref-num.ref-lead{margin:0 4px 0 0;font-variant-numeric:tabular-nums}
/* with the defenders lined up, the swinger's size is padded out to the
   log's widest with figure spaces, so the names after it line up too */
.lead-pad{display:none}
body.log-dalign .xlog .lead-pad{display:inline}
body:not(.log-alead) .ref-num.ref-lead,
body.log-alead .unit-ref.ref-swinger > .ref-num:not(.ref-lead){display:none !important}
.n-chg .n-was,.n-chg .n-arr{color:var(--faint)}
.n-chg .n-arr{margin:0 1px}
/* Show training / hits: a yellow figure tucked against its icon */
.ref-train,.ref-ammo{display:none;color:var(--gold-dim);font-weight:600;white-space:nowrap}
.ref-ammo .n-was,.ref-ammo .n-arr{color:var(--faint)}
.ref-ammo .n-arr{margin:0 1px}
body.log-clean.log-train .ref-train{display:inline;margin-left:5px}
/* the hits stand in a column of their own down the left, ruled off from the
   exchange, as wide as the log's widest figure (--ammo-ch, set per log) */
body.log-clean.log-hits .ref-ammo{display:inline-block;box-sizing:content-box;
  width:calc(17px + var(--ammo-ch, 7) * 1ch + 1ch);font-variant-numeric:tabular-nums;
  padding-right:6px;margin-right:7px;border-right:1px solid rgba(var(--hi),.14)}
.ref-train img,.ref-ammo img{width:16px;height:16px;vertical-align:-3px;margin-right:1px;opacity:.33}
#logNumsWrap,#logTrainWrap,#logHitsWrap,#logDDmgWrap{display:none}
body.log-dalign #logDDmgWrap{display:inline-flex}
body.log-names #logNumsWrap{display:inline-flex}
body.log-clean #logTrainWrap,body.log-clean #logHitsWrap{display:inline-flex}
.log .unspent{color:var(--gold);border-bottom:none}
.log .unspent b{color:var(--gold)}
body.no-unspent .log .unspent{display:none}
.log .unspent .us-row{display:block;padding:1px 0 0 14px}
.ref-atk{color:var(--atk)}
.ref-def{color:var(--def)}
.ref-size{color:var(--strong)}

#tip{
  position:fixed;z-index:999;display:none;pointer-events:none;
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  padding:10px;min-width:230px;max-width:400px;box-shadow:0 8px 22px rgba(var(--lo),.6);
}
#tip.tip-wide{max-width:none}
/* a unit that lost troops: what it went in as, drained of colour, beside
   what is left of it */
.tip-dual{display:flex;gap:18px;align-items:flex-start}
.tip-dual > div{flex:0 0 auto;min-width:230px}
.tip-was{filter:grayscale(1);opacity:.6}
.tip-now{position:relative}
.tip-now::before{
  content:"";position:absolute;left:-10px;top:0;bottom:0;width:1px;background:var(--border-soft);
}
.tip-gone{padding:18px 0;text-align:center;color:var(--atk);font-weight:700;letter-spacing:.12em}
.tip-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.tip-head > div{line-height:1.15}
.tip-head > div > div{margin-top:1px}
.tip-title{color:var(--strong);font-weight:600;font-size:13px;line-height:1.2}
.tip-math td{font-size:12px;padding:1px 4px}
.tip-math tbody tr{border:none}
.tip-math .n{text-align:right;font-family:var(--mono)}
.tip-math .tot td{border-top:1px solid var(--border-soft);padding-top:4px;color:var(--strong)}
.dmg-ref{cursor:pointer;border-bottom:1px dotted currentColor}
/* a damage figure clicked open: the breakdown pinned in place, with what
   the swinger could have carried on its left and what the struck side
   could have worn on its right, each beside its own unit */
#dmgPin{
  position:fixed;z-index:59;display:none;   /* under the F / G / H helpers (60 up) */
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  padding:10px 12px;box-shadow:0 10px 28px rgba(var(--lo),.65);
  max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;
}
/* the three always sit side by side; on a narrow screen the compares give up
   width first, and past that the window scrolls sideways */
.pinbox .pin-cols{display:flex;gap:22px;align-items:stretch;flex-wrap:nowrap}
.pinbox .pin-col{flex:0 1 auto;width:330px;min-width:250px;position:relative}
.pinbox .pin-mid{width:230px;flex-shrink:0;display:flex;flex-direction:column}
/* whatever height the side panels leave under the prompt, the picture fills;
   with none left over it takes none */
/* the compares stack their rows so a picture can take what is left at the foot */
.pinbox .cmp-weapon,.pinbox .cmp-armor{display:flex;flex-direction:column}
.pinbox .pin-art{flex:1 1 0;min-height:0;position:relative;margin-top:10px}
.pinbox .pin-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;
  pointer-events:none;user-select:none;opacity:.25}
body.no-pin-art .pinbox .pin-art{display:none}
.pinbox .pin-col + .pin-col::before{
  content:"";position:absolute;left:-11px;top:0;bottom:0;width:1px;background:var(--border-soft);
}
.pinbox .pin-close{position:absolute;top:2px;right:3px;z-index:2;background:none;border:none;
  color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px}
.pinbox .pin-close:hover{color:var(--strong)}
/* the compare panels wear the Grand Strategy ticket papers: navy for the
   armour being struck, wine for the weapon swinging */
.pinbox .pin-col.cmp-armor,.pinbox .pin-col.cmp-weapon{padding:8px 9px;border-radius:3px}
/* each compare wears its unit's side: wine for the invader, navy for the defender */
.pinbox .pin-col.bg-inv{background:var(--paper-atk)}
.pinbox .pin-col.bg-def{background:var(--paper-def)}
.pinbox .cmp-armor::before,.pinbox .cmp-weapon::before,.pinbox .pin-mid::before{display:none}
.pinbox .tip-title + .cmp-tag{margin-top:8px}
.pinbox .pin-col > .tip-title{text-align:center}
/* a mouse with its left button lit: the figure under it opens up on a click */
.m1-ic{display:inline-block;vertical-align:middle;color:var(--text-dim)}
.tip-title-m1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pinbox .tip-title-m1{display:block}
.pinbox .tip-title-m1 .m1-ic{display:none}
.m1-more{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:12px;
  padding-top:8px;border-top:1px solid var(--border-soft);cursor:pointer;
  font-size:11px;color:var(--text-dim);user-select:none}
.m1-more:hover,.m1-more:hover .m1-ic{color:var(--strong)}
/* m1 again: the compares widen to show what each swap does to the bill */
.pinbox.pin-wide .cmp-armor,.pinbox.pin-wide .cmp-weapon{width:540px;min-width:380px}
/* armour's fifth column, raise / skim, pulled out by the tab down its right edge */
.cmp-hold,.hold-tab{display:none}
.pinbox.pin-wide .cmp-armor{padding-right:22px}
.pinbox.pin-wide .hold-tab{display:flex;align-items:center;justify-content:center;position:absolute;
  top:0;right:0;bottom:0;width:14px;border:none;border-left:1px solid var(--border-soft);
  background:rgba(var(--lo),.18);color:var(--text-dim);font-size:13px;cursor:pointer;padding:0;border-radius:0 3px 3px 0}
.pinbox.pin-wide .hold-tab:hover{background:rgba(var(--hi),.06);color:var(--strong)}
/* weapon's matching column opens the other way, from a tab down its left edge */
.pinbox.pin-wide .cmp-weapon{padding-left:22px}
.pinbox.pin-wide .cmp-weapon .hold-tab{right:auto;left:0;border-left:none;border-right:1px solid var(--border-soft);
  border-radius:3px 0 0 3px}
.cmp-wpar{display:none}
.pinbox.pin-wide .cmp-weapon.hold-open{width:760px;min-width:540px}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-row{grid-template-columns:200px auto 1fr auto 190px}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-wpar{display:block;grid-column:1;grid-row:1 / span 5;align-self:stretch;
  padding-right:9px;border-right:1px solid var(--border-soft);font-size:11px;line-height:1.5}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-ic,
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-dmg-k{grid-column:2}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-name{grid-column:3}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-stat{grid-column:4}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-cost,
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-dmg{grid-column:3 / span 2}
.pinbox.pin-wide .cmp-weapon.hold-open .cmp-x{grid-column:5}
.pinbox.pin-wide .cmp-armor.hold-open{width:760px;min-width:540px}
.pinbox.pin-wide .cmp-armor.hold-open .cmp-row{grid-template-columns:auto 1fr auto 190px 200px}
.pinbox.pin-wide .cmp-armor.hold-open .cmp-hold{display:block;grid-column:5;grid-row:1 / span 5;align-self:stretch;
  padding-left:9px;border-left:1px solid var(--border-soft);font-size:11px;line-height:1.5}
.cmp-x{display:none}
/* spare rows above and below share the height of a long list, so the
   left side sits packed together in the middle of its row */
.pinbox.pin-wide .cmp-row{grid-template-columns:auto 1fr auto 190px;grid-template-rows:1fr auto auto auto 1fr}
.pinbox.pin-wide .cmp-ic{grid-row:2 / span 2}
.pinbox.pin-wide .cmp-name,.pinbox.pin-wide .cmp-stat{grid-row:2}
.pinbox.pin-wide .cmp-cost{grid-row:3}
.pinbox.pin-wide .cmp-dmg,.pinbox.pin-wide .cmp-dmg-k{grid-row:4}
.pinbox.pin-wide .cmp-x{display:block;grid-column:4;grid-row:1 / span 5;align-self:stretch;
  padding-left:9px;border-left:1px solid var(--border-soft);font-size:11px;line-height:1.5}
.sz{display:flex;gap:5px;align-items:flex-start}
.sz-k{display:flex;flex-direction:column;min-width:30px;flex:none}
.sz-n{font-size:14px;line-height:1.15;font-family:var(--mono)}
.sz-v .cx-res{padding-left:0}
.sz-gap{height:8px}
.cmp-par{color:var(--gold)}
.tl{font-size:12px;padding:1px 0;white-space:nowrap}
.tl .gear-img{vertical-align:-3px}
.gtag{white-space:nowrap}
.gtag .gear-img{width:auto;max-width:32px;vertical-align:-3px;margin-right:3px;object-position:center}
.tl.tot{border-top:1px solid var(--border-soft);margin-top:3px;padding-top:3px}
.tl-hr{border-top:1px solid rgba(var(--hi),.09);margin:5px 0}
.cmp-warn{grid-column:1 / -1;justify-self:end;margin-right:4px;font-size:10px;color:var(--gold);cursor:help;
  border-bottom:1px dotted currentColor;margin-top:2px;line-height:1.3}
.pinbox.pin-wide .cmp-warn{grid-row:6}
.cmp-warn.cmp-warn-full{color:var(--atk)}
.ml-box{margin-top:6px;font-size:12px}
.ml{padding:2px 4px;white-space:nowrap}
.ml-cur{background:rgba(var(--gold-rgb),.14);border-left:2px solid var(--gold)}
.cx-hits{margin-left:auto;color:var(--text-dim);font-size:10px}
.cx-act{color:var(--text-dim);font-size:9.5px;margin-left:3px}
.sz-act{margin-left:0;font-family:var(--mono)}
.cx-upk .muted{font-size:9px;margin-left:1px}
.cx-line{display:flex;flex-wrap:wrap;align-items:center;gap:0 5px}
.cx-k{color:var(--text-dim);width:30px;flex:none;line-height:1.15}
.cx-line b{font-weight:600;font-family:var(--mono)}
.cx-net{border-top:1px solid var(--border-soft);margin-top:2px;padding-top:2px}
.cx-res{display:flex;flex-direction:column;align-items:flex-start;padding-left:35px}
.cx-chip{white-space:nowrap;font-family:var(--mono)}
.cx-chip .res-icon{vertical-align:-3px}
/* the two units squared up under the breakdown */
.pin-vs{display:flex;align-items:flex-start;justify-content:center;gap:12px;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft)}
.pin-unit{display:flex;flex-direction:column;align-items:center;text-align:center;
  font-size:11px;line-height:1.35;min-width:0;width:96px}
.pin-unit .sprite{margin:3px 0 4px}
/* name and size hold one line each, so both sprites start at the same height */
.pin-unit .pu-name,.pin-unit .pu-size,.pin-unit .pu-left{height:15px;line-height:15px;white-space:nowrap}
.pin-unit .pu-was{color:var(--text-dim);font-weight:400}
.pin-unit .pu-left{font-size:10px;color:var(--gold)}
.pin-unit .pu-name{max-width:100%;overflow:hidden;color:var(--text)}
/* a name too long for the slot trails off into the background */
.pin-unit .pu-name.pu-fade{text-align:left;align-self:stretch;
  -webkit-mask-image:linear-gradient(to right,#000 70%,transparent);
  mask-image:linear-gradient(to right,#000 70%,transparent)}
/* the piece the comparison is not about sits back */
.pin-unit.side-atk .pu-gear.pu-off,.pin-unit.side-def .pu-gear.pu-off{color:var(--faint-2)}
.pin-unit.side-atk .sprite{border:1px solid var(--atk)}
.pin-unit.side-def .sprite{border:1px solid var(--def)}
.pin-unit.side-atk .pu-gear{color:var(--atk-deep)}
.pin-unit.side-def .pu-gear{color:var(--def-deep)}
.pin-unit .pu-size{color:var(--strong);font-weight:600;font-family:var(--mono)}
.pin-unit .pu-train{color:var(--gold-train)}
.pin-unit .pu-upk{display:flex;flex-direction:column;align-items:center;margin-top:2px;font-size:11px}
.pin-unit .pu-upk .muted{font-size:9px;margin-left:1px}
.pin-vs-word{color:var(--text-dim);font-weight:700;font-size:12px;letter-spacing:.06em;
  margin-top:65px;line-height:16px}
.cmp-row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;
  padding:6px 0;border-top:1px solid var(--border-soft)}
/* the icon sits beside the name and cost; under it, level with the damage, a DMG: label */
.cmp-row .cmp-ic{grid-row:span 2;align-self:center}
.cmp-name{font-weight:600;font-size:12px;color:var(--strong)}
.cmp-stat{font-family:var(--mono);font-size:12px;text-align:right}
.cmp-cost{grid-column:2 / span 2;font-size:11px}
.cmp-cost .res-chip{font-size:11px}
.cmp-cost .cmp-res{display:block}
/* fully spread out, the costs list one resource to a line like everything beside them */
.pinbox.pin-wide .cmp-cost .cmp-res{display:flex;flex-direction:column;align-items:flex-start}
.pinbox.pin-wide .cmp-cost .res-chip{margin:0}

/* one piece's cost, in grey, under the whole stack's */
.cmp-one{display:block;color:var(--text-dim);font-size:10px;margin-top:1px}
.cmp-one > span{display:block}
.cmp-one .res-icon{filter:saturate(.75);opacity:.7}
.cmp-cur .cmp-one{color:var(--text-dim)}
/* the weapon an armour row's dead take with them, greyed under the armour */
.cmp-ic{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.cmp-ic .gear-img{flex:none}
.cmp-wpn .gear-img{filter:grayscale(.75)}
#tip .w{color:var(--strong)}
#tip .mono-ic .res-icon{filter:grayscale(1)}
#tip .tip-gear .gear-img{vertical-align:-3px;margin-right:4px}
/* figures in the wide view explain themselves on hover */
.has-ntip{cursor:help}
.has-ntip:hover b,.has-ntip:hover .cx-chip{text-decoration:underline dotted}
/* the title stays centred; its note hangs off to the right of it */
.pinbox .tt-wrap{position:relative}
.pinbox .tt-aside{position:absolute;left:100%;top:1px;margin-left:6px;white-space:nowrap;
  font-size:9.5px;font-weight:400;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;gap:3px}
.pinbox .tt-aside input{margin:0;width:11px;height:11px;cursor:pointer}
.pinbox .pin-grip{cursor:move;user-select:none}
#dmgPin.pin-dragging,#dmgPin.pin-dragging *{cursor:move;user-select:none}
/* the compare riding the pointer: the same panels, minus the controls */
.pinbox .pin-close2{display:none}
.pinbox.pin-wide .pin-close2{display:block;position:static;align-self:center;margin-top:6px;font-size:18px}
/* the wide view's own switches, under its second close */
.pinbox .pin-opts{display:none}
.pinbox.pin-wide .pin-opts{display:flex;flex-direction:column;align-items:flex-start;align-self:center;gap:3px;
  margin-top:6px;font-size:11px;color:var(--text-dim)}
.pinbox .pin-opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.pinbox .pin-opts input{margin:0}
.pinbox .pin-opts .opt-sep{margin-top:4px}
.pinbox .pin-opts .opt-red{color:var(--atk)}
.pin-hover .pin-opts{display:none !important}
body.hide-1x .cmp-one{display:none}
body.hide-act .cx-act{display:none}
body.hide-skim .sz-skim,body.hide-skim .sz-skim + .sz-gap{display:none}
body.hide-raise .sz-raise,body.hide-raise .sz-raise + .sz-gap{display:none}
body.hide-par .sz-par,body.hide-par .sz-gap:has(+ .sz-par){display:none}
body.hide-skim .sz-gap:has(+ .sz-skim),body.hide-raise .sz-gap:has(+ .sz-raise){display:none}
.pin-hover .pin-close,.pin-hover .hold-tab,.pin-hover .tt-aside input{display:none}
.cmp-dmg-k{grid-column:1;justify-self:center;font-size:10px;color:var(--text-dim);letter-spacing:.04em}
.cmp-dmg{grid-column:2 / span 2;font-size:12px;display:flex;justify-content:space-between;
  font-family:var(--mono)}
.cmp-cur{border:1px solid rgba(var(--good-rgb),.45);border-radius:3px;padding:6px 2px;margin:0 -3px 6px}
.cmp-cur .cmp-name,.cmp-cur .cmp-stat,.cmp-cur .cmp-cost .bits,.cmp-cur .cmp-dmg{color:var(--good)}
.cmp-tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:2px}
.cmp-up{color:var(--good)}.cmp-amb{color:var(--gold)}.cmp-down{color:var(--atk)}.cmp-same{color:var(--text-dim)}
.tip-table{width:100%;border-top:1px solid var(--border-soft);padding-top:4px}
.tip-table th{font-size:10px;padding:3px 4px}
.tip-table td{font-size:12px;padding:1px 4px}
.tip-table tbody tr{border:none}
.kill{color:var(--atk);font-weight:600}
.hurt{color:var(--warn)}

.surv-card{
  width:150px;text-align:center;padding:10px;border-radius:4px;
  border:1px solid var(--border-soft);background:var(--sunken);
}
.card-gear{margin-top:7px;color:var(--text-dim);overflow-wrap:anywhere}
.card-gear > span{display:block}
.card-gear > .cg-sep{display:none}
body.card-slash .card-gear{word-break:break-all}
body.card-slash .card-gear > span{display:inline}
.surv-atk{background:var(--surv-atk);border-color:rgba(var(--atk-rgb),.22)}
.surv-def{background:var(--surv-def);border-color:rgba(var(--def-rgb),.18)}
.surv-dead{opacity:.45}
/* a reinforcement that has just dropped in: a short yellow line along the foot */
.surv-card.surv-fresh{position:relative}
.surv-card.surv-fresh::after{
  content:"";position:absolute;left:30%;right:30%;bottom:3px;height:2px;
  border-radius:1px;background:var(--gold);
}
.surv-card{position:relative}
.surv-lost{position:absolute;right:2px;bottom:2px;font:600 11px/1 var(--mono)}
.surv-atk .surv-lost{color:var(--atk-lost)}
.surv-def .surv-lost{color:var(--def-lost)}
.surv-col{display:flex;flex-direction:column}
.surv-col h3{margin-bottom:8px}
.surv-grid{display:flex;gap:12px;flex-wrap:wrap}
/* the two columns' standing values line up whatever the card counts are */
.surv-col .surv-grid{margin-bottom:16px}      /* never flush against the value block */
.surv-worth{margin-top:auto;padding:0;background:var(--worth-bg)}
.worth-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;font-size:12px;border-bottom:1px solid var(--border-soft);
}
.worth-head .cost-label{color:var(--text)}
/* Total standing, Casualties and a tick's Deaths fold away; the caret says which way */
summary.worth-head,.fold > summary{list-style:none;cursor:pointer}
summary.worth-head::-webkit-details-marker,.fold > summary::-webkit-details-marker{display:none}
summary.worth-head::before,.fold > summary::before{content:"\25B8";color:var(--text-dim);font-size:11px;width:9px}
details[open] > summary.worth-head::before,.fold[open] > summary::before{content:"\25BE"}
details.surv-worth:not([open]) > .worth-head{border-bottom:none}
.fold:not([open]) > summary{margin-bottom:0}
.fold:not([open]) [data-log-toggle],.fold:not([open]) > summary .badge{display:none}
.surv-worth-body{padding:8px 10px}
.worth-head .cost-n,.log-head .cost-n{font-size:11.5px;color:var(--text-dim)}
.cost-n b{color:var(--text);font-weight:600}
/* Use icons puts the gear on the Entire battle's standing lines too */
.gear-ic{display:none;vertical-align:-3px;margin-right:4px;gap:2px}
body.log-icons .gear-ic{display:inline-flex}
.gear-ic .gear-img{width:auto;max-width:28px;flex:none}
.surv-worth .cost-row{font-size:12px}
/* inside a replayed tick the value block takes that tick's own hue, a shade
   up from the tick behind it so it sits in the panel rather than on it */
.chain-tick .surv-worth{background:rgba(var(--hi),.022)}
.chain-tick.tone-a .surv-worth{background-image:linear-gradient(rgba(var(--gold-rgb),.05),rgba(var(--gold-rgb),.05))}
.chain-tick.tone-b .surv-worth{background-image:linear-gradient(rgba(var(--tone-b-rgb),.05),rgba(var(--tone-b-rgb),.05))}
.chain-tick.tone-c .surv-worth{background-image:linear-gradient(rgba(var(--tone-c-rgb),.055),rgba(var(--tone-c-rgb),.055))}
/* a tick's deaths wear its hue too, over the same dark well */
.chain-tick.tone-a .chain-deaths .well{background-image:linear-gradient(rgba(var(--gold-rgb),.06),rgba(var(--gold-rgb),.06))}
.chain-tick.tone-b .chain-deaths .well{background-image:linear-gradient(rgba(var(--tone-b-rgb),.06),rgba(var(--tone-b-rgb),.06))}
.chain-tick.tone-c .chain-deaths .well{background-image:linear-gradient(rgba(var(--tone-c-rgb),.07),rgba(var(--tone-c-rgb),.07))}
.worth-plain{margin-top:12px;background:var(--sunken)}
/* a unit card is a shortcut into the counter finder */
.surv-card{cursor:pointer}
.surv-card:hover{border-color:rgba(var(--hi),.45)}
.pick-tag{
  display:block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--good);
}

/* ---------- successive battles ---------- */
.chain-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);
}
/* every further tick is its own battle, so it gets its own breathing room:
   a heavy rule above it and a real gap, rather than blurring into the one
   before it */
.chain-tick{
  border:1px solid var(--border-soft);border-radius:5px;
  background:rgba(var(--lo),.22);padding:12px 13px;margin:0 0 22px;
}
/* each replayed tick takes the next colour in the cycle, so two ticks never
   share a background and the eye can tell where one ends */
.chain-tick.tone-a{background-image:linear-gradient(rgba(var(--gold-rgb),.030),rgba(var(--gold-rgb),.030));border-color:rgba(var(--gold-rgb),.13)}
.chain-tick.tone-b{background-image:linear-gradient(rgba(var(--tone-b-rgb),.030),rgba(var(--tone-b-rgb),.030));border-color:rgba(var(--tone-b-rgb),.13)}
.chain-tick.tone-c{background-image:linear-gradient(rgba(var(--tone-c-rgb),.034),rgba(var(--tone-c-rgb),.034));border-color:rgba(var(--tone-c-rgb),.15)}
/* a plain white rule with the tick's number sitting in the gap; it is also
   the tick's fold handle. The line box is pinned so the bigger words leave
   the spacing between ticks as it was */
.tick-divider{
  display:flex;align-items:center;gap:14px;
  margin:30px 0;color:rgba(var(--hi),.78);
  font-size:21px;line-height:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  list-style:none;cursor:pointer;
}
.tick-divider::-webkit-details-marker{display:none}
.tick-divider::before,.tick-divider::after{
  content:"";flex:1 1 auto;height:1px;background:rgba(var(--hi),.35);
}
.tick-divider:hover{color:var(--strong)}
.tick-divider .caret{font-size:11px;letter-spacing:0;color:var(--text-dim);width:9px;margin-right:-6px}
.tick-divider .caret::before{content:"\25B8"}
.chain-wrap[open] > .tick-divider .caret::before{content:"\25BE"}
.tick-divider .reinf{font-size:11px;letter-spacing:.06em;text-transform:none;font-weight:600;color:var(--gold)}
.chain-wrap:first-of-type > .tick-divider{margin-top:14px}
.chain-wrap:not([open]) > .tick-divider{margin-bottom:0}
/* a folded tick's rule and number go dark */
.chain-wrap:not([open]) > .tick-divider{color:rgba(var(--hi),.34)}
.chain-wrap:not([open]) > .tick-divider::before,
.chain-wrap:not([open]) > .tick-divider::after{background:rgba(var(--hi),.14)}
.chain-wrap:not([open]) > .tick-divider .caret{color:rgba(var(--hi),.34)}
.chain-wrap:not([open]) > .tick-divider:hover{color:rgba(var(--hi),.6)}
/* the closing rule after the last tick is a marker only, not a fold */
.tick-divider.tick-end{cursor:default;margin-bottom:22px}
.tick-divider.tick-end:hover{color:rgba(var(--hi),.78)}
.chain-wrap:not([open]) + .chain-wrap > .tick-divider{margin-top:22px}
.chain-body .log{max-height:220px}
.chain-body .log.log-full{max-height:none}
/* two columns like the survivors above, so Defenders starts under Defenders */
.chain-upkeep{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;align-items:center;
  margin-top:16px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:12px;
}
.chain-upkeep > span{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
@media (max-width:1100px){.chain-upkeep{grid-template-columns:1fr}}
.chain-note{margin:12px 0 0}

/* ---------- jump dock (bottom right) ---------- */
.hk-dock{
  position:fixed;right:2px;bottom:2px;z-index:900;
  display:flex;flex-direction:column;gap:5px;align-items:flex-end;
}
.hk-btn{
  width:32px;height:32px;padding:0;flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1px solid var(--border);border-radius:5px;
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
  color:var(--text);cursor:pointer;opacity:.5;
  box-shadow:0 2px 7px rgba(var(--lo),.55);
  transition:opacity .15s,filter .12s;
}
.hk-ticks{
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  max-height:56vh;overflow-y:auto;
}
.hk-ticks:empty{display:none}
.hk-num-lab{
  font-size:13px;font-weight:700;line-height:1;
  text-shadow:var(--btn-default-shadow);
}
.hk-dock:hover .hk-btn{opacity:1}
.hk-btn:hover{filter:brightness(1.18);color:var(--strong)}
.hk-btn:focus-visible{opacity:1;outline:2px solid var(--btn-info-b);outline-offset:1px}
.hk-btn:active{transform:translateY(1px)}
.hk-btn.hk-off{opacity:.28;cursor:default}
.hk-dock:hover .hk-btn.hk-off{opacity:.35}
.hk-btn.hk-off:hover{filter:none;color:var(--text)}
.hk-ic{
  width:16px;height:16px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.hk-ic .f{fill:currentColor;stroke:none}
.hk-key{
  font-size:8px;line-height:1;font-weight:700;letter-spacing:.06em;
  color:var(--btn-default-ink-dim);text-shadow:var(--btn-default-shadow);
}
.hk-dock.keys-off .hk-key{visibility:hidden}
.hk-btn.hk-miss{animation:hk-shake .3s}
@keyframes hk-shake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)}
}
.hk-toggle{
  display:inline-flex;align-items:center;gap:5px;margin:0;
  font-size:12px;color:var(--text-dim);cursor:pointer;white-space:nowrap;
}
.hk-toggle:hover{color:var(--text)}
.hk-toggle input{width:auto;margin:0}
@media (max-width:700px){.hk-dock{display:none}}

.note{
  border-left:3px solid var(--accent);background:rgba(var(--def-rgb),.07);
  padding:8px 11px;border-radius:0 3px 3px 0;font-size:12.5px;margin-bottom:14px;
}
.note.warn{border-left-color:var(--warn);background:rgba(var(--warn-rgb),.07)}

/* the crunch report — a link can carry the spreadsheet's own totals, and a
   mismatch has to be impossible to click past */
.modal-wrap{
  position:fixed;inset:0;z-index:950;background:rgba(var(--lo),.62);
  display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;overflow:auto;
}
.modal{
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  width:100%;max-width:580px;box-shadow:0 14px 44px rgba(var(--lo),.55);
}
.modal-head{display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border-soft)}
.modal-head h2{margin:0;font-size:14px;color:var(--strong)}
.modal-body{padding:12px 14px;font-size:12.5px;max-height:62vh;overflow:auto}
.modal-foot{padding:9px 14px;border-top:1px solid var(--border-soft);
  display:flex;gap:8px;align-items:center}
.crunch-side{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);margin:12px 0 2px}
.crunch-side:first-child{margin-top:0}
.crunch-table{width:100%;border-collapse:collapse;font-size:12px}
.crunch-table th,.crunch-table td{padding:3px 6px;text-align:right;
  border-bottom:1px solid var(--border-soft);white-space:nowrap}
.crunch-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);font-weight:500}
.crunch-table th:first-child,.crunch-table td:first-child{text-align:left;width:100%}
.crunch-table td.n{font-family:var(--mono)}
.crunch-cell{display:flex;align-items:center;gap:7px}
.crunch-cell .g-name{flex:1 1 auto;text-align:right}
.crunch-table tr.crunch-head td{font-weight:700}
.crunch-short{color:var(--atk)}
.crunch-over{color:var(--warn)}
details summary{cursor:pointer;color:var(--strong);font-size:13px;padding:2px 0}
.stat-table input{width:62px;text-align:right;font-family:var(--mono);font-size:12px}
.stat-table td,.stat-table th{padding:3px 5px;font-size:12px}
.stat-table tbody th{font-weight:500;color:var(--text);text-transform:none;letter-spacing:0;border:none}

/* ---------- tab strip ---------- */
.tabstrip{
  display:flex;align-items:stretch;gap:2px;
  margin:-20px -20px 14px;padding:0 16px;
  height:30px;background:var(--sunken);border-bottom:1px solid var(--border-soft);
  /* a narrow window slides the strip rather than widening the page under it;
     the bar is only 30px tall, so the scrollbar itself stays out of sight */
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip > *{flex:0 0 auto}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-dim);font:500 12px/1 inherit;letter-spacing:.06em;text-transform:uppercase;
  padding:0 14px;cursor:pointer;
}
.tab:hover{color:var(--strong)}
.tab.active{color:var(--strong);border-bottom-color:var(--accent)}
.tab-brand{
  display:flex;align-items:center;gap:2px;color:var(--text-dim);font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding-right:10px;margin-right:6px;
  border-right:1px solid var(--border-soft);
}

/* ---------- marked presets ---------- */
.mark-chips{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.mark-chip{
  display:inline-flex;align-items:center;gap:3px;max-width:130px;
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
  border:1px solid var(--border-soft);border-radius:9px;
  padding:1px 4px 1px 7px;font-size:11px;color:var(--btn-default-ink);cursor:pointer;
  text-shadow:var(--btn-default-shadow);
}
.mark-chip:hover{filter:brightness(1.14)}
.mark-chip.on{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b));
  color:var(--btn-ink);text-shadow:var(--btn-shadow)}
.mark-chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark-chip .x{
  border:none;background:none;color:var(--chip-x);font-size:12px;line-height:1;
  cursor:pointer;padding:0 1px;
}
.mark-chip .x:hover{color:var(--btn-default-ink)}

/* ---------- counter finder ---------- */
.ctr-grid{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:center}
.ctr-rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;color:var(--btn-default-ink);
  border:1px solid var(--border-soft);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.ctr-rank.top{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b));color:var(--btn-ink)}
.ctr-target{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctr-controls{
  display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:center;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);
}
/* the two answers, side by side: how to kill it, and how to eat its punch */
.ctr-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:1100px){.ctr-split{grid-template-columns:1fr}}
.ctr-split > .panel{margin-bottom:0}
.ctr-1x{margin-top:10px;padding-top:8px;border-top:1px solid rgba(var(--lo),.35);font-size:12px;
  line-height:22px}
.ctr-1x-lab{color:var(--text-dim);margin-right:10px}
.ctr-1x .gear-img{width:auto;max-width:32px;vertical-align:-3px;margin-right:3px;object-position:center}

/* ---------- top bar / presets ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.topbar h1{margin:0}
.caret-btn{
  background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1;
  cursor:pointer;padding:0 4px;transition:transform .12s;display:inline-block;
}
.caret-btn:hover{color:var(--strong)}
.caret-btn.open{transform:rotate(90deg)}
/* the settings gear in the tab strip: bigger than the caret it replaced, but
   still inside the strip's 30px */
.gear-btn{
  background:none;border:none;color:var(--text-dim);cursor:pointer;
  padding:0 2px 0 6px;display:inline-flex;align-items:center;line-height:0;
}
.gear-btn svg{width:22px;height:22px;transition:transform .2s}
.gear-btn:hover{color:var(--strong)}
.gear-btn.open{color:var(--strong)}
.gear-btn.open svg{transform:rotate(60deg)}
/* the settings in the gear drawer, laid out in columns */
.set-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:7px 18px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);
}
.set-grid .hk-toggle{white-space:normal}
.theme-pick select{width:auto;padding:1px 4px;font-size:12px}
/* the horsewife roams the whole window on a clear pane that clicks fall
   straight through, over the panels but under a modal and the tooltips */
#horsewife{position:fixed;inset:0;width:100vw;height:100vh;border:0;margin:0;padding:0;z-index:940;
  pointer-events:none;background:transparent;color-scheme:normal}
/* ticket moss, as the Grand Strategy slips wear it */
.btn-moss{background:var(--paper-moss);background-image:none;color:var(--ink-moss);border-color:rgba(var(--good-rgb),.28)}
.battle-presets{display:flex;align-items:center;gap:4px;opacity:.45;transition:opacity .15s}
.battle-presets:hover,.battle-presets:focus-within{opacity:1}
.bp-lab{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.bp-sel{width:auto;max-width:150px;font-size:11px;padding:1px 4px;background:var(--sunken);color:var(--text);border-color:var(--border-soft)}
.bp-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 3px;
}
.bp-btn:hover{color:var(--strong)}
.bp-btn:active{transform:translateY(1px)}
.bp-btn.ok{color:var(--good)}
.ic{
  width:14px;height:14px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
}
.ic .f{fill:currentColor;stroke:none}
.army-presets{display:flex;align-items:center;gap:4px;opacity:.45;transition:opacity .15s}
.army-presets:hover,.army-presets:focus-within{opacity:1}
.ap-sel{width:auto;max-width:112px;font-size:11px;padding:1px 4px;
  background:var(--sunken);color:var(--text);border-color:var(--border-soft)}
.v-div{color:var(--text-dim);opacity:.4;font-size:12px;margin:0 1px}

/* ---------- resources ---------- */
.res-icon{
  width:16px;height:16px;display:inline-block;vertical-align:-4px;   /* centres a 16px icon on a 16px line */
  image-rendering:pixelated;image-rendering:crisp-edges;
}
/* inline flow rather than flex: the spaces between the icon, the number and
   the next chip are real text, so selecting a row copies them too */
.res-chip{display:inline-block;margin:0 7px 0 0;font-size:12px;white-space:nowrap;vertical-align:middle;line-height:16px}
.res-chip .mono{font-size:12px}
.res-none{color:var(--text-dim);font-size:12px;font-style:italic}
.bits{font-family:var(--mono);color:var(--strong)}

/* ---------- cost footer ---------- */
.cost-foot{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);
}
.cost-drop > summary{
  font-size:12px;color:var(--text-dim);list-style:none;display:inline-flex;gap:5px;align-items:center;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;
}
.cost-drop > summary::-webkit-details-marker{display:none}
.cost-drop > summary:before{content:"▸";display:inline-block;transition:transform .12s}
.cost-drop[open] > summary:before{transform:rotate(90deg)}
.cost-drop > summary:hover{color:var(--strong)}
/* the pretty-plan copy rides beside the heading, only while the costs are open */
.cost-drop .plan-copy{display:none}
.cost-drop[open] > summary .plan-copy{display:inline-flex}
.cost-body{padding-top:8px}
/* with reinforcements on the list the costs split by when they are paid */
.cost-tabs{display:flex;gap:2px;margin:2px 0 6px;border-bottom:1px solid var(--border-soft)}
.cost-tab{
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
  color:var(--text-dim);font:500 11px/1 inherit;padding:5px 9px;cursor:pointer;
}
.cost-tab:hover{color:var(--strong)}
.cost-tab.active{color:var(--strong);border-bottom-color:var(--accent)}
.cost-row{
  display:flex;gap:10px;align-items:center;padding:3px 0;font-size:12px;
}
.cost-row .cost-label{flex:0 0 138px;color:var(--text-dim)}
.cost-row .cost-val{flex:1 1 auto;text-align:left}
.has-tip > .cost-label{border-bottom:1px dotted var(--text-dim);cursor:help;display:inline-block;flex:0 0 138px}

/* Resources and Units rows double as their own dropdowns */
.res-drop > summary,.units-drop > summary{list-style:none;cursor:pointer}
.res-drop > summary::-webkit-details-marker,
.units-drop > summary::-webkit-details-marker{display:none}
.res-drop > summary .caret,
.units-drop > summary .caret{display:inline-block;transition:transform .12s;color:var(--text-dim)}
.res-drop[open] > summary .caret,
.units-drop[open] > summary .caret{transform:rotate(90deg)}
.res-drop > summary:hover .cost-label,
.units-drop > summary:hover .cost-label{color:var(--strong)}
.res-drop .raw-body,.units-drop .raw-body{padding:2px 0 2px 12px}
.res-drop .raw-body .cost-label{flex:0 0 126px}
/* a right-aligned name column, then the count, so every portrait starts at
   the same x no matter how long the gear is called. The headcount lines run
   the other way round — count first, the way "248 Cavalry" is read — and
   spend the same width, so the two kinds of line still share a right edge. */
.gear-line{display:flex;align-items:center;padding:1px 0;font-size:12px;color:var(--text-dim)}
.gear-line .n{flex:0 0 var(--gear-n-w,52px);text-align:right;color:var(--text)}
.gear-line .g-name{flex:0 0 138px;text-align:right;padding:0 8px 0 6px}
.gear-line.gear-head .g-name{flex:0 0 138px;text-align:left}
/* the count runs right up to the portrait without this — the counters view
   spaces its own gear cells, so keep the gap to the Units list */
.gear-line .gear-img{margin-left:10px}
/* the sprites are 16 tall and 16-32 wide, so a fixed 32-wide box holds the
   widest of them at native size and starts every one at the same x */
.gear-img{
  flex:0 0 32px;width:32px;height:16px;display:inline-block;
  object-fit:contain;object-position:left center;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.gear-img-none{background:none}
.units-drop .u-copy{display:none;margin-left:7px;vertical-align:middle}
.units-drop[open] .u-copy{display:inline-flex}
/* a bp-btn that carries a word instead of a glyph still needs an edge to
   read as a button */
.bp-btn.txt-btn{
  border:1px solid var(--border-soft);border-radius:3px;padding:1px 6px;
  background:var(--sunken);white-space:nowrap;
}
.bp-btn.txt-btn:hover{border-color:var(--text-dim)}
/* the copy buttons wear the Grand Strategy ticket papers: wine, navy, moss */
.bp-btn.txt-btn.u-human  {background:var(--paper-atk);color:var(--ink-atk)}
.bp-btn.txt-btn.u-sheet  {background:var(--paper-def);color:var(--ink-def)}
.bp-btn.txt-btn.u-builder{background:var(--paper-moss);color:var(--ink-moss)}
/* the headcount that opens each type's block in the Units list */
.gear-line.gear-head{color:var(--text);font-weight:700;margin-top:5px}
.gear-line.gear-head:first-child{margin-top:0}
.gear-line.gear-head .g-name{color:var(--text)}

.tip-cost{border-top:1px solid var(--border-soft);margin-top:8px;padding-top:6px;font-size:12px}
.tip-upkeep{width:80px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
.tip-upkeep .res-chip{margin:0}
.tip-break td{font-size:12px;padding:6px 4px;vertical-align:top}
.tip-break tbody tr{border:none}
.tip-break tbody tr + tr td{border-top:1px solid var(--border-soft)}
.tip-break .u{color:var(--strong);white-space:nowrap}

/* ---------- solver ---------- */
.solve-grid{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)}
.solve-types{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.solve-type{display:flex;flex-direction:column;gap:5px;min-width:106px;
  background:var(--sunken);border:1px solid var(--border-soft);border-radius:4px;padding:7px 8px}
.solve-type label{display:inline-flex;align-items:center;gap:5px;margin:0;
  font-size:12px;color:var(--text);cursor:pointer}
.solve-type label input{width:auto;margin:0}
.solve-type input.lean{width:100%;margin:0;padding:2px 4px;font-size:12px;text-align:center;
  font-family:var(--mono)}
.solve-type.lean-plenty{border-color:rgba(var(--good-rgb),.6)}
.solve-type.lean-plenty input.lean{color:var(--good)}
.solve-type.lean-scarce{border-color:rgba(var(--atk-rgb),.55)}
.solve-type.lean-scarce input.lean{color:var(--atk)}
.solve-type.lean-off{opacity:.4}
.solve-budget{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.solve-budget label{display:inline-flex;align-items:center;gap:5px;margin:0;font-size:12px;color:var(--text);
  background:var(--sunken);border:1px solid var(--border-soft);border-radius:4px;padding:5px 8px}
.solve-budget input{width:96px;margin:0;padding:2px 4px;font-size:12px;text-align:right;
  font-family:var(--mono)}
.solve-off{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--text);cursor:pointer}
.solve-off input{width:auto;margin:0}
.solve-limit-sets.off{opacity:.4}
.solve-limits-note{text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-dim)}
.solve-nation{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.solve-nation .note-lean{flex:1 1 260px;min-width:200px}
.solve-bar-outer{height:6px;background:var(--sunken);border:1px solid var(--border-soft);
  border-radius:3px;overflow:hidden;margin-top:10px}
.solve-bar{height:100%;width:0;transition:width .12s linear;
  background-image:linear-gradient(to bottom,var(--btn-warning-a),var(--btn-warning-b))}
#solveOut .surv-grid{justify-content:flex-start}
.tick-table{width:auto;min-width:340px}
.tick-table th{font-size:10px;padding:2px 14px 4px 0}
.tick-table td{padding:2px 14px 2px 0;font-family:var(--mono);font-size:12px}
.tick-table th.n,.tick-table td.n{text-align:right}
.tick-table tbody tr{border-bottom:none}
.tick-wipe td{color:var(--good)}

/* ---------- reference overlays ---------- */
.ref-btns{display:flex;align-items:center;gap:2px;margin-left:auto}
.ref-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-dim);font:500 11px/1 inherit;letter-spacing:.06em;text-transform:uppercase;
  padding:0 9px;cursor:pointer;
}
.ref-btn:hover{color:var(--strong)}
.ref-btn.on{color:var(--strong);border-bottom-color:var(--warn)}
.ref-btn kbd{
  font:600 10px/1 var(--mono);
  background:var(--raised);border:1px solid var(--border-soft);border-radius:3px;
  padding:2px 4px;color:var(--text-dim);
}
.ref-btn.on kbd{color:var(--strong)}
@media (max-width:700px){.ref-btn .ref-lab{display:none}.ref-btn{padding:0 5px}}

.ovl{
  position:fixed;z-index:60;display:none;flex-direction:column;
  max-width:calc(100vw - 16px);
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  box-shadow:0 10px 34px rgba(var(--lo),.6);
}
.ovl.open{display:flex}
.ovl-head{
  display:flex;align-items:center;gap:8px;cursor:move;user-select:none;
  padding:7px 8px 7px 11px;background:var(--sunken);
  border-bottom:1px solid var(--border-soft);border-radius:3px 3px 0 0;
}
.ovl-head h3{
  margin:0;font-size:11px;font-weight:600;color:var(--strong);
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
}
.ovl-x{
  background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;
  cursor:pointer;padding:0 4px;
}
.ovl-x:hover{color:var(--strong)}
.ovl-body{overflow:auto;padding:12px;max-height:72vh;overscroll-behavior:contain}
.ref-table{width:100%}
.ref-table + .ref-table{margin-top:16px}
.ref-table th,.ref-table td{padding:2px 6px;font-size:11.5px;white-space:nowrap}
.ref-table thead th{font-size:10px;padding-bottom:4px}
/* the five type names are the thing you scan for, so they get a little room */
.ref-table th.ref-th-type{font-size:12px}
.ref-table tbody tr{border-bottom:1px solid rgba(var(--lo),.28)}
.ref-table tr.grp-start td{border-top:1px solid rgba(var(--hi),.3)}
.ref-table td.num,.ref-table th.num{text-align:right;font-family:var(--mono)}
.ref-table .res{padding-left:22px}
.ref-table td.res{white-space:normal;min-width:120px}
.ref-table .gear-cell{display:flex;align-items:center;gap:7px}
.ref-table .gear-cell .g-name{flex:1 1 auto;text-align:right}
.ref-best{color:var(--good);font-weight:600}

/* one colour a unit type, on the column heads and on the gear each type carries */
.t-cavalry {color:var(--t-cav)}
.t-tanks   {color:var(--t-tank)}
.t-pegasi  {color:var(--t-peg)}
.t-unicorns{color:var(--t-uni)}
.t-naval   {color:var(--t-nav)}

/* ---------- grand strategy ---------- */
.gs-top{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:flex-start}
.gs-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);
  font-weight:600;margin-bottom:6px}

<script>
/* the theme goes on before anything paints, so a reload never flashes Grey.
   Fonts a theme borrows are fetched only once that theme is picked */
const THEMES = {grey:"Grey", white:"White", black:"Black", optimal:"Optimal", applejack:"Applejack", rainbow:"Rainbow Dash"};
const THEME_FONTS = {
  applejack:"https://fonts.googleapis.com/css2?family=Rye&family=Caudex:ital,wght@0,400;0,700;1,400&display=swap",
  rainbow:"https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
};
function applyTheme(t){
  if (!THEMES[t]) t = "grey";
  if (t === "grey") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  const href = THEME_FONTS[t];
  if (href && !document.querySelector(`link[data-theme-font="${t}"]`)){
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href; l.dataset.themeFont = t;
    document.head.appendChild(l);
  }
  return t;
}
try{ applyTheme(JSON.parse(localStorage.getItem("warcalc.theme"))); }catch(e){}
</script>

<script>
"use strict";

/* ===================================================================
   1. DEFINITIONS  (mirrors $forcetypes / $weapontypes / $armortypes)
   =================================================================== */

const FORCE_TYPES = {Cavalry:1, Tanks:2, Pegasi:3, Unicorns:4, Naval:5, Alicorns:6};
const TYPES = {1:"cavalry", 2:"tanks", 3:"pegasi", 4:"unicorns", 5:"naval"};
const TYPE_NUMS = [1,2,3,4,5];

const WEAPON_IDS = {ScroungedWeapons:0,"PRC-E6":1,"PRC-E7":2,"PRC-E8":3,ACFU:4,ATFU:5,APFU:6,AUFU:7,
  K9P:8,"ELBO-GRS":9,"Chem-LightBattery":10,PropWash:11,SteamBucket:12,CanopyLights:13,
  LongStand:14,LongWeight:15,GridSquares:16,Shoreline:17,WaterHammer:18,WaterlineEraser:19};

const ARMOR_IDS = {ScroungedArmor:0,Barding:1,Bigdog:2,Nope:3,Trundle:4,Shepherd:5,Ohno:6,Titan:7,
  Cooler:8,Wonder:9,Griffin:10,Dragon:11,Hornshield:12,Librarian:13,Shining:14,D2A:15,
  "C-PON3":16,Esohes:17,Shubidu:18};

// Which weapons/armor each unit type may equip (from bindDropdownsInner)
const LOADOUTS = {
  Alicorns:{weapons:["ScroungedWeapons"], armor:["ScroungedArmor"]},
  Cavalry:{weapons:["ScroungedWeapons","PRC-E6","PRC-E7","PRC-E8","ACFU","ATFU","APFU","AUFU"],
           armor:["ScroungedArmor","Barding","Bigdog","Nope"]},
  Tanks:{weapons:["ScroungedWeapons","K9P","ELBO-GRS","Chem-LightBattery"],
         armor:["ScroungedArmor","Trundle","Shepherd","Ohno","Titan"]},
  Pegasi:{weapons:["ScroungedWeapons","PropWash","SteamBucket","CanopyLights"],
          armor:["ScroungedArmor","Cooler","Wonder","Griffin","Dragon"]},
  Unicorns:{weapons:["ScroungedWeapons","LongStand","LongWeight","GridSquares"],
            armor:["ScroungedArmor","Hornshield","Librarian","Shining","D2A"]},
  Naval:{weapons:["ScroungedWeapons","Shoreline","WaterHammer","WaterlineEraser"],
         armor:["ScroungedArmor","C-PON3","Esohes","Shubidu"]}
};

const LABELS = {"Chem-LightBattery":"Chem-Light Battery",PropWash:"Prop Wash",SteamBucket:"Steam Bucket",
  CanopyLights:"Canopy Lights",LongStand:"Long Stand",LongWeight:"Long Weight",GridSquares:"Grid Squares",
  WaterHammer:"Water Hammer",WaterlineEraser:"Waterline Eraser",ScroungedWeapons:"Scrounged Weapons",
  ScroungedArmor:"Scrounged Armor"};
const label = k => LABELS[k] || k;

/* every picture lives on the neocities site, filed under the name shown
   on screen — a handful are filed under a spelling of their own */
const PIC_BASE = "https://cloppenmanager.neocities.org/img/";
const imgUrl = name => PIC_BASE + encodeURIComponent(name) + ".png";
const IMG_FILE = {Nope:"NOPE"};
const gearUrl = key => imgUrl(IMG_FILE[key] || label(key));

/* portraits for every piece of gear, keyed the same way the defs are */
const WEAPON_IMG = Object.fromEntries(["PRC-E6","PRC-E7","PRC-E8","ACFU","ATFU","APFU","AUFU",
  "K9P","ELBO-GRS","Chem-LightBattery","PropWash","SteamBucket","CanopyLights",
  "LongStand","LongWeight","GridSquares","Shoreline","WaterHammer","WaterlineEraser"].map(k => [k, gearUrl(k)]));

const ARMOR_IMG = Object.fromEntries(["Barding","Bigdog","Nope","Trundle","Shepherd","Ohno","Titan",
  "Cooler","Wonder","Griffin","Dragon","Hornshield","Librarian","Shining","D2A",
  "C-PON3","Esohes","Shubidu"].map(k => [k, gearUrl(k)]));

/* Scrounged has a picture too, but it is whatever was lying around, not
   gear anyone chose: it shows only where a fight is being read — the
   exchange log and the compare cards — and never in a list, tally or copy */
const SCROUNGED_IMG = {ScroungedWeapons: gearUrl("ScroungedWeapons"), ScroungedArmor: gearUrl("ScroungedArmor")};

const gearImgSrc = (key, scr) => WEAPON_IMG[key] || ARMOR_IMG[key] || (scr && SCROUNGED_IMG[key]) || "";

/* an empty slot of the same size keeps rows of pictures on one baseline
   even when a piece of gear has no portrait */
function gearImg(key, scr){
  const src = gearImgSrc(key, scr);
  if (!src) return `<span class="gear-img gear-img-none"></span>`;
  return `<img class="gear-img" src="${esc(src)}" alt="" loading="lazy"
    title="${esc(label(key))}" onerror="this.classList.add('gear-img-none');this.removeAttribute('src')">`;
}
/* the same, Scrounged included — for the fight views only */
const fightImg = key => gearImg(key, true);

/* weapondefs / armordefs, verbatim from tables_with_data.sql.
   ids 0 (Scrounged) are absent by design: the PHP treats id 0 as falsy
   and applies its hardcoded 0.25 damage / 1.0 armor fallbacks. */
let WEAPON_DEFS = {
  "PRC-E6":            {cavalry:0.80, tanks:0.80, pegasi:0.80, unicorns:0.80, naval:0.80},
  "PRC-E7":            {cavalry:0.90, tanks:0.90, pegasi:0.90, unicorns:0.90, naval:0.90},
  "PRC-E8":            {cavalry:1.00, tanks:1.00, pegasi:1.00, unicorns:1.00, naval:1.10},
  "ACFU":              {cavalry:1.50, tanks:1.00, pegasi:1.00, unicorns:1.00, naval:1.00},
  "ATFU":              {cavalry:1.00, tanks:1.50, pegasi:1.00, unicorns:1.00, naval:1.00},

const BIT = "฿";

const money = n => Math.round(n).toLocaleString("en-US");

/* a big bits figure cut down to three figures, always rounded up:
   300k, 99.5mil, 1.17bil */
function shortBits(n){
  const a = Math.abs(n), sign = n < 0 ? "−" : "";
  for (const [u, suf] of [[1e9, "bil"], [1e6, "mil"], [1e3, "k"]]){
    if (a < u) continue;
    const x = a / u, dec = x >= 100 ? 0 : x >= 10 ? 1 : 2;
    const y = Math.ceil(x * 10 ** dec - 1e-9) / 10 ** dec;
    if (y >= 1000 && u < 1e9) return sign + shortBits(u * 1000);   // 999.6k rounds up to 1mil
    return sign + String(+y.toFixed(dec)) + suf;
  }
  return sign + money(a);
}

const gearCost = (kind, key) =>
  (kind === "weapon" ? WEAPON_COST : ARMOR_COST)[key] || {bits:0, res:{}};

const bits = n => money(n);

function addRes(into, from, mult){
  Object.entries(from || {}).forEach(([k,v])=>{ into[k] = (into[k]||0) + v*(mult ?? 1); });
  return into;
}

/* replace crafted parts with what they are actually made of */
function toRaw(res){
  const out = {};
  let craftBits = 0;
  Object.entries(res).forEach(([k,v])=>{
    const rec = CRAFT[k];
    if (rec){ addRes(out, rec.res, v); craftBits += rec.bits * v; }
    else out[k] = (out[k]||0) + v;
  });
  return {res: out, craftBits};
}

function resIcon(key){
  const r = RESOURCES[key];
  if (!r) return esc(key);
  return `<img class="res-icon" src="${r.icon}" alt="${esc(r.name)}" title="${esc(r.name)}">`;
}

function resChips(res){
  const keys = RES_ORDER.filter(k=>res[k]);
  const extra = Object.keys(res).filter(k=>!RESOURCES[k] && res[k]);
  if (!keys.length && !extra.length) return `<span class="res-none">none</span>`;
  return keys.concat(extra).map(k=>
    `<span class="res-chip">${resIcon(k)} <span class="mono">${res[k]}</span></span>`).join(" ");
}

/* ===================================================================
   2. SPRITES
   Same filename scheme overview.php uses:
   images/{lowertype}/w-{armor_id}-{weapon_id}.png
   Scrounged gear is id 0 on both axes, so unequipped units land on w-0-0.png.
   Anything that 404s is replaced with a question mark.
   =================================================================== */
const IMG_BASE = "https://4clop.org/images/";

const clampInt = (v, lo, hi) => Math.min(hi, Math.max(lo, parseInt(v, 10) || 0));

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function spritePath(type, weapon, armor){
  return `${IMG_BASE}${type.toLowerCase()}/w-${ARMOR_IDS[armor]}-${WEAPON_IDS[weapon]}.png`;
}

function buildSprite(type, weapon, armor, big, meta){
  const tip = typeof tipAttrs === "function"
    ? tipAttrs(type, weapon, armor, meta?.size, meta?.training) +
      (meta?.left != null ? ` data-tip-left="${esc(meta.left)}"` : "") : "";
  return `<img class="sprite${big ? " sprite-lg" : ""}" src="${esc(spritePath(type, weapon, armor))}"
    alt="${esc(type)} — ${esc(label(weapon))} / ${esc(label(armor))}" loading="lazy"
    ${tip} onerror="this.replaceWith(spriteMissing(this))">`;
}

/* attributes that turn a unit card into a one-click target for the counter
   finder; the click handler lives with the counter code */
function pickAttrs(type, weapon, armor, size, training){
  return `data-ctr-pick="1" data-pick-type="${esc(type)}" data-pick-weapon="${esc(weapon)}"
    data-pick-armor="${esc(armor)}" data-pick-size="${Math.max(1, Math.round(size) || 1)}"
    data-pick-train="${clampInt(training, 0, TRAIN_UNCAPPED)}"`;
}

function spriteMissing(img){
  const span = document.createElement("span");
  span.className = "sprite sprite-missing" + (img.classList.contains("sprite-lg") ? " sprite-lg" : "");
  span.textContent = "?";
  Object.entries(img.dataset).forEach(([k, v])=>{ span.dataset[k] = v; });
  return span;
}
