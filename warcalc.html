  return `<button class="btn btn-xs" data-log-toggle="${id}"
    title="${open ? "Scroll box" : "Show all"}"
    >${open ? "Collapse" : "Expand"}</button>`;
}

document.addEventListener("click", e=>{
  const btn = e.target.closest?.("[data-log-toggle]");
  if (!btn) return;
  e.preventDefault();
  const id = btn.dataset.logToggle;
  const box = document.getElementById(id);
  if (!box) return;
  const open = box.classList.toggle("log-full");
  LOG_FULL.set(id, open);
  btn.textContent = open ? "Collapse" : "Expand";
  btn.title = open ? "Scroll box" : "Show all";
});

/* ---- the pieces a battle result is built from -----------------------
   render() lays these out for the battle you just fought; the successive-tick
   replay below lays out the same four for every further tick. Each caller
   passes its own log ids (so the Expand toggles stay independent) and its own
   tooltip namespace (so it can drop its tips without touching anyone else's). */
function stallsNote(stalls){
  return stalls.length ? `<div class="note warn"><strong>${stalls.length} matchup(s) did nothing.</strong></div>` : "";
}

/* the hits each unit still had in hand when it ran out of things to shoot,
   read off the finished result (simulate() is left exactly as it is). Only
   the fight that ends the battle — one side wiped — gets the list, and only
   if anyone had hits left over. */
function unspentLine(units){
  const all = Object.values(units);
  const wiped = inv => all.filter(u => !!u.attack_mission === inv).every(u => u.dead);
  if (!wiped(true) && !wiped(false)) return "";
  const idle = all.filter(u => u.hits > 0);
  if (!idle.length) return "";
  const total = idle.reduce((s, u) => s + u.hits, 0);
  return `<div class="unspent">Unspent hits — <b>${total.toLocaleString("en-US")}</b>${idle.map(u =>
    `<span class="us-row">${unitRef(u)} — <b>${u.hits.toLocaleString("en-US")}</b></span>`).join("")}</div>`;
}

function exchangeLogBlock(units, log, bonus, id, ns, tail){
  /* the widest "before→after" hits figure, in digits, sizes the hits column */
  const left = {};
  const ammoCh = log.reduce((w, l)=>{
    const A = units[l.aid], was = Math.max(0, A.size - (left[l.aid] || 0));
    left[l.aid] = (left[l.aid] || 0) + l.hits;
    return Math.max(w, money(was).length + money(Math.max(0, was - l.hits)).length);
  }, 1);
  const leadW = log.reduce((w, l) => Math.max(w, String(units[l.aid].size).length), 1);
  return `<div>
    <div class="log-head">
      <h3>Exchange log</h3>
      <span class="small muted">${log.length} exchange${log.length === 1 ? "" : "s"}</span>
      <span class="spacer"></span>
      ${logToggle(id)}
    </div>
    <div class="well log xlog${logIsFull(id) ? " log-full" : ""}" id="${id}" style="--ammo-ch:${ammoCh}">${
      log.length ? log.map((l, i)=>{
        const A = units[l.aid], D = units[l.did];
        const bonusApplied = !!A.attack_mission && bonus === "Yes";
        const mk = regTip(dmgMathTip(A, D, l, bonusApplied), ns);
        /* a unit only moves off a target once it is dead, so whatever it
           swung after this, and whatever it never got to swing, would have
           come down on this stack too had it lasted */
        const after = log.slice(i + 1).reduce((t, x) => t + (x.aid === l.aid ? x.hits : 0), 0);
        const before = log.slice(0, i).reduce((t, x) => t + (x.did === l.did ? x.damage : 0), 0);
        const lp = {...l, potHits: l.hits + after + Math.max(0, A.hits || 0), prevTaken: before,
                    logIdx: i, logAll: log, unitsAll: units};
        PINS.set(mk, ()=>dmgPinHTML(A, D, lp, bonusApplied));
        const spent = log.slice(0, i).reduce((t, x) => t + (x.aid === l.aid ? x.hits : 0), 0);
        const standing = n => Math.max(0, D.size - Math.floor(round6(n)));
        const train = A.training !== D.training;
        return `<div class="xr ${A.attack_mission ? "xr-atk" : "xr-def"}"><span class="xatk"><span class="xu">${unitRef(A, A.weapon, true, {train, leadW, ammo: Math.max(0, A.size - spent), ammoAfter: Math.max(0, A.size - spent - l.hits)})}</span> <span class="xhit">hit</span></span>
          <span class="xrest"><span class="xdef"><span class="xdu">${unitRef(D, D.armor, false, {train, was: standing(before), now: standing(before + l.damage)})}</span></span>
          <span class="xdmg"><span class="xfor">for&nbsp;</span><b class="dmg-ref" data-tip-key="${mk}" data-pin-key="${mk}">${fmt(l.damage)}</b> damage
          <span class="muted">(${l.hits} hits)</span></span></span></div>`;
      }).join("") : '<div class="muted">No hits were exchanged.</div>'}${tail || ""}</div>
  </div>`;
}

function casualtiesBlock(units, casualties, id){
  return `<details class="fold" style="margin-top:14px"${PREFS.casOpen ? " open" : ""}>
    <summary class="log-head">
      <h3>Casualties</h3>
      <span class="small muted">${casualties.length} entr${casualties.length === 1 ? "y" : "ies"}</span>
      <span class="spacer"></span>
      ${logToggle(id)}
    </summary>
    <div class="well log${logIsFull(id) ? " log-full" : ""}" id="${id}">${
      casualties.length ? casualties.map(c=>{
        const u = units[c.uid];
        return c.kind === "kill"
          ? `<div>${unitRef(u)} <span class="kill">IS KILL</span></div>`
          : `<div>${unitRef(u)} <span class="hurt">lost <b>${c.lost}</b> size!</span></div>`;
      }).join("") : '<div class="muted">Everyone walked away.</div>'}</div>
  </details>`;
}

/* what is still standing on one side, priced up: the money it took to raise
   and equip those troops, and the maintenance they keep billing */
function survivorValue(units){
  const items = [];
  let hire = 0, gear = 0;
  const res = {}, upkeep = {};
  units.forEach(u=>{
    const n = Math.max(0, u.remaining || 0);
    if (!n) return;
    const uc = UNIT_COST[u.origType] || {hire:0, upkeep:{}};
    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    const r = addRes(addRes({}, w.res, n), a.res, n);
    hire += uc.hire * n; gear += (w.bits + a.bits) * n;
    addRes(res, r); addRes(upkeep, uc.upkeep, n);
    items.push({u:{type:u.origType, weapon:u.weapon, armor:u.armor}, n,
                hire: uc.hire * n, gear: (w.bits + a.bits) * n, res:r});
  });
  return {items, hire, gear, res, upkeep};
}

function survivorWorth(units){
  const v = survivorValue(units);
  const left = v.items.reduce((n, it) => n + it.n, 0);
  return `<details class="well surv-worth"${PREFS.standOpen ? " open" : ""}>
    <summary class="worth-head"><span class="cost-label">Total standing</span>
      ${leftCount(left)}
      <span class="spacer"></span>
      <span class="cost-val bits">${money(v.hire + v.gear)}</span></summary>
    <div class="surv-worth-body">
      <div class="cost-row"><span class="cost-label">Raise value</span>
        <span class="cost-val bits">${money(v.hire)}</span></div>
      <div class="cost-row"><span class="cost-label">Equipment ${BIT}</span>
        <span class="cost-val bits">${money(v.gear)}</span></div>
      <div class="cost-row"><span class="cost-label">Upkeep / 12 h</span>
        <span class="cost-val">${resChips(v.upkeep)}</span></div>
    </div>
  </details>`;
}

/* ===================================================================
   5b. ARMY CODES — the short form
   ===================================================================
   A unit is only ever three facts: which of the 109 legal
   type/weapon/armour loadouts it wears, how trained it is (0-20), and how
   many of it there are. Those three numbers are poured one after another
   into a single mixed-radix integer, and that integer is written out in
   base 62. Nothing in the string is a name, a label, a padding digit or a
   separator, so a unit costs about four characters and an army of ten
   fits in a word and a half.

   A battle code is the two sides' integers with a sigil in front of each:
   "+" opens the attackers, "-" the defenders with the defender bonus on,
   "=" the defenders with it off. The sigil carries the bonus, so the flag
   costs nothing.

   Reinforcements ride behind a "_" as a second army in the same form, so
   "front_reinforcements"; a code without one is all front line, exactly as
   codes read before reinforcements existed.

   Training past 20 takes the wide form: the unit's "there is a unit here"
   digit reads 0 instead of 1, and its training gets a field wide enough for
   any level instead of 0 … 20. No code written before this ever put a 0 there
   with anything left behind it, so every older code reads exactly as it did,
   and an army that never passes 20 still writes the same code it always has.

   Base 62 rather than 64 on purpose: letters and digits survive markdown,
   URLs, chat clients and a double-click, and the eight-thousandths of a
   bit per character it gives up is cheaper than one mangled paste. */

const CODE_ALPHA = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const CODE_DIGIT = new Map([...CODE_ALPHA].map((c, i) => [c, BigInt(i)]));

/* every legal loadout, in an order that must never be reshuffled — the
   index into this list IS the type, the weapon and the armour */
const KIT_TYPES = ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"];
const KITS = [];
KIT_TYPES.forEach(t => LOADOUTS[t].weapons.forEach(w =>
  LOADOUTS[t].armor.forEach(a => KITS.push([t, w, a]))));
const KIT_AT  = new Map(KITS.map((k, i) => [k.join("|"), i]));
const R_KIT   = BigInt(KITS.length);      // 109 loadouts
const R_TRAIN = 21n;                      // training 0 … 20
const R_TRAIN_WIDE = BigInt(TRAIN_UNCAPPED + 1);   // training 0 … 9999, the wide form
const R_CLASS = 4n;                       // which size bracket

/* four size brackets, cheapest first, because most units are small */
const SIZE_CLASS = [
  {base: 1,        radix: 256n},            //          1 … 256
  {base: 257,      radix: 65536n},          //        257 … 65,792
  {base: 65793,    radix: 16777216n},       //     65,793 … 16,843,008
  {base: 16843009, radix: 1099511627776n}   // 16,843,009 … about 1.1e12
];
const SIZE_MAX = SIZE_CLASS[3].base + Number(SIZE_CLASS[3].radix) - 1;

const b62 = v => {
  if (v <= 0n) return "0";
  let s = "";
  while (v > 0n){ s = CODE_ALPHA[Number(v % 62n)] + s; v /= 62n; }
  return s;
};

function unb62(s){
  let v = 0n;
  for (const ch of s){
    const d = CODE_DIGIT.get(ch);
    if (d === undefined) throw new Error("not a code");
    v = v * 62n + d;
  }
  return v;
}

/* gear that does not belong to the type falls back to that type's first
   loadout rather than poisoning the whole code */
function kitIndex(u){
  let i = KIT_AT.get([u.type, u.weapon, u.armor].join("|"));
  if (i !== undefined) return i;
  const set = LOADOUTS[u.type];
  if (set) i = KIT_AT.get([u.type, set.weapons[0], set.armor[0]].join("|"));
  return i === undefined ? 0 : i;
}

function sizeParts(n){
  const size = Math.max(1, Math.min(SIZE_MAX, Math.floor(Number(n)) || 1));
  for (let c = 0; c < SIZE_CLASS.length; c++){
    const off = size - SIZE_CLASS[c].base;
    if (off >= 0 && off < Number(SIZE_CLASS[c].radix)) return {cls: c, off};
  }
  return {cls: 0, off: 0};
}

/* built back to front: the last unit goes in first, so the first unit is
   the first one to come back out */
function encodeArmy(units, barracks){
  const front = (units || []).filter(u => !u.reserve);
  const reinf = (units || []).filter(u =>  u.reserve);
  return encodeStacks(front, barracks) + (reinf.length ? "_" + encodeStacks(reinf, barracks) : "")
       + encodeNames(front.concat(reinf))
       + (barracks == null ? "" : "~" + clampInt(barracks, 0, TRAIN_UNCAPPED));   // the side's Barracks level
}

/* unit names ride after a ".", only when a unit has one: the names in stack
   order (front line, then reinforcements), one a line, as UTF-8 bytes read
   as one base-62 number. A leading 1 byte keeps any zero bytes. */
function encodeNames(units){
  const names = units.map(u => String(u.name || "").replace(/\s+/g, " ").trim());
  if (!names.some(Boolean)) return "";
  let v = 1n;
  for (const b of new TextEncoder().encode(names.join("\n"))) v = v * 256n + BigInt(b);
  return "." + b62(v);
}

function decodeNames(code){
  let v = unb62(code);
  const bytes = [];
  while (v > 1n){ bytes.unshift(Number(v % 256n)); v /= 256n; }
  if (v !== 1n) throw new Error("not a code");
  return new TextDecoder().decode(new Uint8Array(bytes)).split("\n");
}

/* Codes from before the wide form cut every level past 20 down to 20, so a
   narrow 20 under a Barracks above 20 is read as one of those (see
   decodeArmy). A real 20 under such a Barracks is written wide, so the two
   can never be mistaken for each other. */
function encodeStacks(units, barracks){
  const brk = parseInt(barracks, 10) || 0;
  let v = 0n;
  for (let i = (units || []).length - 1; i >= 0; i--){
    const u = units[i];
    const {cls, off} = sizeParts(u.size);
    const tr = Math.max(0, Math.min(TRAIN_UNCAPPED, parseInt(u.training, 10) || 0));
    const wide = tr > 20 || (tr === 20 && brk > 20);
    v = v * SIZE_CLASS[cls].radix + BigInt(off);
    v = v * R_CLASS + BigInt(cls);
    v = v * (wide ? R_TRAIN_WIDE : R_TRAIN) + BigInt(tr);
    v = v * R_KIT   + BigInt(kitIndex(u));
    v = v * 2n + (wide ? 0n : 1n);   // "there is a unit here" — without it an army
  }                                  // of one all-zero unit would encode as nothing
  return b62(v);
}

function decodeArmy(code){
  const [body, brk, tail] = String(code).split("~");
  if (tail !== undefined || (brk !== undefined && !/^\d{1,4}$/.test(brk))) throw new Error("not a code");
  const [stacks, names, more] = body.split(".");
  if (more !== undefined) throw new Error("not a code");
  const [front, reinf, extra] = stacks.split("_");
  if (extra !== undefined) throw new Error("not a code");
  const units = decodeStacks(front || "0").concat(
    reinf ? decodeStacks(reinf).map(u => Object.assign(u, {reserve:true})) : []);
  if (names) decodeNames(names).forEach((n, i) => {
    if (units[i] && n.trim()) units[i].name = n.trim().slice(0, 50);
  });
  if (brk !== undefined) units.barracks = clampInt(brk, 0, TRAIN_UNCAPPED);   // rides on the list, not in it
  /* an older code under a Barracks past 20 had every level past 20 cut to
     20 on the way out; the Barracks level is the best guess at what they were */
  let lifted = 0;
  units.forEach(u => {
    if (u.capped && units.barracks > 20){ u.training = units.barracks; lifted++; }
    delete u.capped;
  });
  if (lifted) units.lifted = lifted;
  return units;
}

function decodeStacks(code){
  let v = unb62(code);
  const pop = r => { const d = Number(v % r); v /= r; return d; };
  const out = [];
  while (v > 0n){
    const wide = !pop(2n);
    const kit = KITS[pop(R_KIT)];
    if (!kit) break;                           // malformed tail, stop there
    const [type, weapon, armor] = kit;
    const training = pop(wide ? R_TRAIN_WIDE : R_TRAIN);
    if (wide && training < 20) break;          // not something the wide form writes
    const cls = pop(R_CLASS);
    out.push(Object.assign({type, weapon, armor, training,
              size: SIZE_CLASS[cls].base + pop(SIZE_CLASS[cls].radix)},
              !wide && training === 20 ? {capped: true} : {}));
    if (out.length > 4000) throw new Error("not a code");
  }
  return out;
}

const encodeBattle = (atk, def, bonus, brk) =>
  "+" + encodeArmy(atk, brk?.attacker) + (bonus === "No" ? "=" : "-") + encodeArmy(def, brk?.defender);
const barracksBoth = () => ({attacker: barracksOf("attacker"), defender: barracksOf("defender")});

const RE_ARMY_CODE   = /^(?=.)[0-9A-Za-z]*(_[0-9A-Za-z]+)?(\.[0-9A-Za-z]+)?(~\d{1,4})?$/;
const RE_BATTLE_CODE = /^\+([0-9A-Za-z]*(?:_[0-9A-Za-z]+)?(?:\.[0-9A-Za-z]+)?(?:~\d{1,4})?)([-=])([0-9A-Za-z]*(?:_[0-9A-Za-z]+)?(?:\.[0-9A-Za-z]+)?(?:~\d{1,4})?)$/;

/* null when the text is not a battle code at all */
function decodeBattle(code){
  const m = RE_BATTLE_CODE.exec(code);
  if (!m) return null;
  try{
    return {attacker: decodeArmy(m[1] || "0"),     // each list may carry .barracks
            defender: decodeArmy(m[3] || "0"),
            bonus: m[2] === "=" ? "No" : "Yes"};
  }catch(e){ return null; }
}


/* ---- the crunch: the roster spreadsheet's 43 counts, in one cell ----
   The sheet tracks stock, not pairings — how many cavalry, how many ACFU,
   how many Barding — so it cannot say which weapon sits next to which
   armour. What it can do is total up, and those totals are exactly what a
   stale army code gets wrong. A crunch is those 43 numbers; warcalc adds
   the same 43 totals up from the code it was handed and says where the two
   disagree.

   Slot i is written as its letter followed by the count in plain decimal —
   letters and digits never collide, so no separator is needed and no
   spreadsheet needs anything cleverer than MID() and "&". Three unicorns
   carrying long weights behind librarians is "b3d3g3". Zero slots are left
   out entirely, which is most of them. */

/* 43 roster rows, then "r" for training — which is a level, not a tally, so
   it rides one higher than it reads. Nothing is written for a zero, and
   training 0 is a real answer, so "r1" means nought and a missing "r" means
   the sheet did not say. */
const CRUNCH_ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqr";   // 43 + training
const CRUNCH_TRAIN = 43;

/* the sheet's row order, which is NOT warcalc's own — cavalry list APFU
   ahead of ATFU there — so this table is the one that must not drift */
const CRUNCH_SLOTS = [
  ["type","Cavalry","Cavalry Amount"],
  ["weapon","PRC-E6","PRC-E6"], ["weapon","PRC-E7","PRC-E7"], ["weapon","PRC-E8","PRC-E8"],
  ["weapon","ACFU","ACFU"], ["weapon","APFU","APFU"], ["weapon","ATFU","ATFU"],
  ["weapon","AUFU","AUFU"],
  ["armor","Barding","Barding"], ["armor","Bigdog","Bigdog"], ["armor","Nope","Nope"],
  ["type","Tanks","Tanks Amount"],
  ["weapon","K9P","K9P"], ["weapon","ELBO-GRS","ELBO-GRS"],
  ["weapon","Chem-LightBattery","Chem-Light Battery"],
  ["armor","Trundle","Trundle"], ["armor","Shepherd","Shepherd"],
  ["armor","Ohno","Ohno"], ["armor","Titan","Titan"],
  ["type","Pegasi","Pegasi Amount"],
  ["weapon","PropWash","Prop Wash"], ["weapon","SteamBucket","Steam Bucket"],
  ["weapon","CanopyLights","Canopy Lights"],
  ["armor","Cooler","Cooler"], ["armor","Wonder","Wonder"],
  ["armor","Griffin","Griffin"], ["armor","Dragon","Dragon"],
  ["type","Unicorns","Unicorns Amount"],
  ["weapon","LongStand","Long Stand"], ["weapon","LongWeight","Long Weight"],
  ["weapon","GridSquares","Grid Squares"],
  ["armor","Hornshield","Hornshield"], ["armor","Librarian","Librarian"],
  ["armor","Shining","Shining"], ["armor","D2A","D2A"],
  ["type","Naval","Naval Amount"],
  ["weapon","Shoreline","Shoreline"], ["weapon","WaterHammer","Water Hammer"],
  ["weapon","WaterlineEraser","Waterline Eraser"],
  ["armor","C-PON3","C-Pon3"], ["armor","Esohes","Esohes"], ["armor","Shubidu","Shubidu"],
  ["type","Alicorns","Alicorns Amount"]
].map(([kind, key, name], i, all) => ({
  kind, key, name, row: i + 1,
  /* the last type head at or above this row owns it */
  group: all.slice(0, i + 1).reverse().find(e => e[0] === "type")[1]
}));

/* scrounged gear has no row in the sheet, so it lands in the type total
   and nowhere else — which is what the sheet does too */
function crunchFromUnits(units){
  const n = CRUNCH_SLOTS.map(()=>0);
  (units || []).forEach(u=>{
    const size = Math.max(0, parseInt(u.size, 10) || 0);
    CRUNCH_SLOTS.forEach((s, i)=>{
      if (u[s.kind] === s.key) n[i] += size;
    });
  });
  return n;
}

function encodeCrunch(nums, training){
  let s = CRUNCH_SLOTS.reduce((acc, _, i)=>{
    const v = Math.max(0, Math.round(Number(nums[i]) || 0));
    return v > 0 ? acc + CRUNCH_ALPHA[i] + v : acc;
  }, "");
  if (training !== null && training !== undefined && training !== "")
    s += CRUNCH_ALPHA[CRUNCH_TRAIN] + (Math.max(0, Math.round(Number(training) || 0)) + 1);
  return s;
}

/* null for "no crunch here", which is not the same as a crunch of zeroes.
   .training is null when the sheet left it out. */
function decodeCrunch(code){
  if (!code || !/^(?:[A-Za-z]\d+)+$/.test(code)) return null;
  const counts = CRUNCH_SLOTS.map(()=>0);
  let training = null;
  for (const [, ch, num] of code.matchAll(/([A-Za-z])(\d+)/g)){
    const i = CRUNCH_ALPHA.indexOf(ch);
    if (i < 0) return null;
    if (i === CRUNCH_TRAIN) training = Math.max(0, Number(num) - 1);
    else counts[i] += Number(num);
  }
  return {counts, training};
}

/* what the side actually trained to: one number, or null when the stacks
   disagree and there is no single answer to compare against */
function trainingOf(units){
  const seen = [...new Set((units || []).map(u => Math.max(0, parseInt(u.training, 10) || 0)))];
  return {levels: seen.sort((a, b)=>a - b), one: seen.length === 1 ? seen[0] : null};
}

function crunchDiff(want, units){
  const got = crunchFromUnits(units);
  const rows = CRUNCH_SLOTS
    .map((s, i)=>({...s, want: want.counts[i], got: got[i]}))
    .filter(d => d.want !== d.got);
  if (want.training !== null){
    const t = trainingOf(units);
    if (t.one !== want.training)
      rows.push({name:"Training", row:null, want:want.training,
                 got: t.levels.length ? t.levels.join(" / ") : "\u2014",
                 mixed: t.one === null});
  }
  return rows;
}

/* ---- shareable links ----
   "#" + battle code, then the crunches after a "*" each: attacker first,
   defender second, either may be left empty. The fragment rather than a
   query string so the "+" that opens the attackers stays a "+". */

const battleFragment = () => encodeBattle(noNames(packSide("attacker")), noNames(packSide("defender")),
                                          document.getElementById("defBonus").value, barracksBoth());
const battleLink = () => location.href.split("#")[0] + "#" + battleFragment();

/* takes a whole url, a bare fragment, or a bare battle code */
function parseShareable(text){
  let frag = String(text || "").trim();
  const hash = frag.indexOf("#");
  if (hash >= 0) frag = frag.slice(hash + 1);
  try{ frag = decodeURIComponent(frag); }catch(e){}
  frag = frag.trim();
  if (!frag) return null;
  const parts = frag.split("*");
  const battle = decodeBattle(parts[0]);
  if (!battle) return null;
  return {battle, crunch: {attacker: decodeCrunch((parts[1] || "").trim()),
                           defender: decodeCrunch((parts[2] || "").trim())}};
}

/* ---- the mismatch report ---- */
function closeModal(){ document.getElementById("modalWrap")?.remove(); }

function showCrunchReport(sides){
  closeModal();
  const bad = ["attacker","defender"].map(side=>{
    const want = sides[side];
    return want ? {side, diff: crunchDiff(want, packSide(side))} : null;
  }).filter(r => r && r.diff.length);

  if (!bad.length) return false;

  const body = bad.map(({side, diff})=>`
    <div class="crunch-side">${side === "attacker" ? "Attackers" : "Defenders"}
      — ${diff.length} row${diff.length === 1 ? "" : "s"} off</div>
    <table class="crunch-table">
      <thead><tr><th>Row</th><th>Sheet</th><th>Code</th><th>Off by</th></tr></thead>
      <tbody>${diff.map(d=>{
        const num = typeof d.got === "number";
        const by = num ? d.got - d.want : null;
        const tone = d.group ? ` t-${d.group.toLowerCase()}` : "";
        return `<tr class="${d.kind === "type" ? "crunch-head" : ""}">
          <td><span class="crunch-cell${tone}"><span class="g-name">${esc(d.name)}</span>${
            d.kind === "type" || !d.key ? '<span class="gear-img gear-img-none"></span>' : gearImg(d.key)
          }</span></td>
          <td class="n">${d.want.toLocaleString("en-US")}</td>
          <td class="n">${num ? d.got.toLocaleString("en-US") : esc(String(d.got))}</td>
          <td class="n ${by === null || by < 0 ? "crunch-short" : "crunch-over"}">${
            by === null ? (d.mixed ? "mixed" : "off") : (by > 0 ? "+" : "") + by.toLocaleString("en-US")}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>`).join("");

  const wrap = document.createElement("div");
  wrap.className = "modal-wrap";
  wrap.id = "modalWrap";
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Roster mismatch">
    <div class="modal-head"><h2>⚠ The codes do not match the roster</h2></div>
    <div class="modal-body">
      <div class="note warn" style="margin-bottom:12px">Composition Code and Sheet Tally
        mismatch. Update!</div>
      ${body}
    </div>
    <div class="modal-foot">
      <span class="small muted">Battle loaded anyway --&gt;</span>
      <span class="spacer"></span>
      <button class="btn btn-xs" id="crunchClose">Got it</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e=>{ if (e.target === wrap) closeModal(); });
  document.getElementById("crunchClose").addEventListener("click", closeModal);
  return true;
}

/* ---- loading a link ---- */
function applyShareable(sh){
  setSide("attacker", noNames(sh.battle.attacker));
  setSide("defender", noNames(sh.battle.defender));
  document.getElementById("defBonus").value = sh.battle.bonus;
  scheduleSave();
  liftedNote({attacking: sh.battle.attacker, defending: sh.battle.defender});
  showCrunchReport(sh.crunch);
}

/* a link loads once and then gets out of the way, so a later reload keeps
   whatever the player has since changed rather than snapping back */
function loadFromHash(){
  const sh = parseShareable(location.hash);
  if (!sh) return false;
  showTab("battle");
  applyShareable(sh);
  try{ history.replaceState(null, "", location.href.split("#")[0]); }catch(e){}
  return true;
}

/* ===================================================================
   6. IMPORT (same parser as the original page)
   =================================================================== */

/* Codes copied before they could carry training past 20 cut every such level
   to 20; decodeArmy reads those back at the side's Barracks level, and this
   says so, since it is a guess the player should look over. */
function liftedNote(lists){
  const parts = Object.entries(lists)
    .filter(([, l]) => l && l.lifted)
    .map(([who, l]) => `${l.lifted} ${who} stack${l.lifted === 1 ? "" : "s"} at training ${l.barracks}`);
  if (!parts.length) return;
  alert("This code was copied before army codes could hold training past 20, so it cut those levels down to 20. "
      + `They were read back at the Barracks level instead — ${parts.join(", ")}. `
      + "Check the Training column, then copy a fresh code to replace the old one.");
}

/* drop a decoded list onto a side, minding who may field alicorns */
function addUnits(side, units){
  units = noNames(units);
  setBarracks(side, units?.barracks);
  let skipped = 0;
  (units || []).forEach(u=>{
    if (side === "attacker" && u.type === "Alicorns"){ skipped++; return; }
    makeRow(side, u);
  });
  refreshCounts();
  if (skipped) alert(`Alicorns can only be fielded as defenders — skipped ${skipped}.`);
  return (units || []).length - skipped;
}

/* pasted preset JSON — the same shape the export buttons write:
   {kind:"armyPresets", armyPresets:{name:[units]}}, battlePresets likewise,
   or just a bare [units] list. Returns null when the text isn't JSON at all. */
function parsePresetJSON(text){
  const t = String(text || "").trim();
  if (!/^[{[]/.test(t)) return null;
  let data;
  try{ data = JSON.parse(t); }catch(e){ return {error: "That looks like JSON but does not parse."}; }
  const unit = u => Object.assign({
    type: String(u.type || "Cavalry").trim(),
    weapon: String(u.weapon || "").trim(),
    armor: String(u.armor || "").trim(),
    size: Math.max(1, parseInt(u.size, 10) || 1),
    training: Math.min(TRAIN_UNCAPPED, Math.max(0, parseInt(u.training, 10) || 0))
  }, typeof u.name === "string" && u.name.trim() ? {name: u.name.trim().slice(0, 50)} : {},
     u.reserve === true ? {reserve:true} : {});
  const units = a => (Array.isArray(a) ? a : []).filter(u => u && typeof u === "object").map(unit);
  const obj = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
  if (Array.isArray(data)) return {armies: {"pasted": units(data)}, battles: {}};
  const armies  = data.armyPresets   || (data.kind === "armyPresets"   ? data.presets : null) || {};
  const battles = data.battlePresets || (data.kind === "battlePresets" ? data.presets : null) || {};
  const out = {armies: {}, battles: {}};
  const brk = obj(data.armyBarracks);
  const withBrk = (list, n) => { if (n != null) list.barracks = n; return list; };
  Object.entries(armies).forEach(([n, v]) => { out.armies[n] = withBrk(units(v), brk[n]); });
  Object.entries(battles).forEach(([n, b]) => {
    if (b && typeof b === "object")
      out.battles[n] = {attacker: withBrk(units(b.attacker), obj(b.barracks).attacker),
                        defender: withBrk(units(b.defender), obj(b.barracks).defender), bonus: b.bonus};
  });
  if (!Object.keys(out.armies).length && !Object.keys(out.battles).length)
    return {error: "No army or battle presets found in that JSON."};
  return out;
}

/* one name out of several: the only one, or ask */
function pickPresetName(names, what){
  if (names.length <= 1) return names[0] || null;
  const ans = prompt(`That JSON holds ${names.length} ${what}. Which one?\n\n`
    + names.map((n, i) => `${i + 1}. ${n}`).join("\n"), "1");
  if (ans == null) return null;
  const i = parseInt(ans, 10);
  if (i >= 1 && i <= names.length) return names[i - 1];
  return names.includes(ans.trim()) ? ans.trim() : null;
}

function importRows(side){
  const ta = document.getElementById("txtImport");
  const text = ta.value;
  const code = text.trim();

  /* preset JSON: an army goes whole onto this side, a battle gives its half */
  const json = parsePresetJSON(code);
  if (json){
    if (json.error){ alert(json.error); return; }
    const armyNames = Object.keys(json.armies);
    let units;
    if (armyNames.length){
      const name = pickPresetName(armyNames, "armies");
      if (!name) return;
      units = json.armies[name];
    } else {
      const name = pickPresetName(Object.keys(json.battles), "battles");
      if (!name) return;
      units = json.battles[name][side];
    }
    if (!units.length){ alert("That preset has no units for this side."); return; }
    if (addUnits(side, units)) ta.value = "";
    return;
  }

  /* a battle code hands each button its own half */
  const battle = decodeBattle(code);
  if (battle){
    if (!addUnits(side, battle[side])) alert("That code has nothing on that side.");
    else liftedNote({[side === "attacker" ? "attacking" : "defending"]: battle[side]});
    ta.value = "";
    return;
  }

  /* a bare army code */
  if (RE_ARMY_CODE.test(code)){
    let units;
    try{ units = decodeArmy(code); }
    catch(e){ alert("That is not an army code."); return; }
    if (!units.length){ alert("That code holds no units."); return; }
    addUnits(side, units);
    liftedNote({[side === "attacker" ? "attacking" : "defending"]: units});
    ta.value = "";
    return;
  }

  if (!text.trim()) return;
  try{
    /* a pasted nation page (or warcalc's battle long form) carries both
       sides under their own headings; this button takes its own half */
    const sides = splitLongSides(text);
    const part = sides ? sides[side] : text;
    const {units, barracks} = parseLongForm(part);
    if (!units.length){
      alert(sides ? `There are no ${side === "attacker" ? "attackers" : "defenders"} in that paste.`
                  : "Nothing matched the expected format. Each unit block must end with a Training: line.");
      return;
    }
    const kept = noNames(units).filter(u => !(side === "attacker" && u.type === "Alicorns"));
    if (kept.length < units.length)
      alert("Alicorns can only be fielded as defenders — skipping that entry.");
    kept.forEach(u => makeRow(side, u));
    setBarracks(side, barracks);
    refreshCounts();
    ta.value = "";
  } catch(e){
    console.error(e);
    alert("The import data was in an unexpected format.");
  }
}

/* the long form, one unit a block ending in its Training: line — warcalc's
   own, or the game's army / nation page copied straight off the screen */
function parseLongForm(text){
  const clean = s => String(s).trim().split(" ").join("");
  const lines = String(text).split(/\r?\n|\r/);
  const units = [];
  for (let i = 0; i < lines.length; i++){
    if (i >= 4 && lines[i].trim().indexOf("Training:") === 0){
      let unit;
      if (lines[i-2].trim() !== "Alicorns"){
        unit = {type: clean(lines[i-4]), weapon: clean(lines[i-3]), armor: clean(lines[i-2]),
                size: parseInt(lines[i-1].split(":")[1].trim(),10),
                training: parseInt(lines[i].split(":")[1].trim(),10)};
      } else {
        unit = {type:"Alicorns", weapon:"ScroungedWeapons", armor:"ScroungedArmor",
                size: parseInt(lines[i-1].split(":")[1].trim(),10),
                training: parseInt(lines[i].split(":")[1].trim(),10)};
      }
      unit.training = Math.min(TRAIN_UNCAPPED, Math.max(0, unit.training || 0));
      /* the line above the type is the unit's own name, as the game's
         army page copies out; group headings sit apart, each followed by
         an "Owned by" line, so they never land here. warcalc's own long
         form puts a Type_Weapon_Armor key there instead — not a name. */
      const nl = (lines[i - (unit.type === "Alicorns" ? 3 : 5)] || "").trim();
      if (nl && !/^(Owned by |===|(Size|Training|Name|Reinforcement|Barracks):)/i.test(nl)
          && !RE_SIDE_HEAD.test(nl)
          && nl !== `${unit.type}_${unit.weapon}_${unit.armor}`
          && nl.replace(/^\d+_/, "") !== `${unit.weapon}_${unit.armor}`)
        unit.name = nl.replace(/\s+/g, " ").slice(0, 50);
      /* the optional tail lines, in either order */
      for (let j = i + 1; j <= i + 2 && j < lines.length; j++){
        const nm = /^\s*Name:\s*(.*)$/i.exec(lines[j]);
        if (nm && nm[1].trim()) unit.name = nm[1].trim().slice(0, 50);
        if (/^\s*Reinforcement:\s*yes/i.test(lines[j])) unit.reserve = true;
      }
      units.push(unit);
    }
  }
  /* warcalc's long form opens with the side's Barracks level */
  let barracks = null;
  lines.forEach(l=>{
    const m = /^\s*Barracks:\s*(\d+)/i.exec(l);
    if (m && barracks === null) barracks = m[1];
  });
  return {units, barracks};
}

/* "Attackers" / "Defenders" alone on a line, as the nation page heads its
   two lists, or warcalc's "=== ATTACKERS ===" */
const RE_SIDE_HEAD = /^(?:===\s*)?(attackers|defenders)(?:\s*===)?$/i;

/* cuts a paste at its side headings; null when it has none */
function splitLongSides(text){
  const out = {attacker: "", defender: ""};
  let cur = null, found = false;
  String(text).split(/\r?\n|\r/).forEach(l=>{
    const h = RE_SIDE_HEAD.exec(l.trim());
    if (h){ cur = /^a/i.test(h[1]) ? "attacker" : "defender"; found = true; return; }
    if (cur) out[cur] += l + "\n";
  });
  return found ? out : null;
}

/* a battle code is the whole board, so it replaces both sides rather than
   adding to them — the same thing loading a battle preset does */
function importBattle(){
  const ta = document.getElementById("txtImport");
  const json = parsePresetJSON(ta.value);
  if (json){
    if (json.error){ alert(json.error); return; }
    const names = Object.keys(json.battles);
    if (!names.length){
      alert("That JSON holds army presets, not a battle — use Import to attackers / defenders.");
      return;
    }
    const name = pickPresetName(names, "battles");
    if (!name) return;
    const b = noNamesBattle(json.battles[name]);
    ta.value = "";
    setSide("attacker", b.attacker);
    setSide("defender", b.defender);
    if (b.bonus) document.getElementById("defBonus").value = b.bonus;
    scheduleSave();
    return;
  }
  /* a pasted nation page: its Attackers and Defenders lists fill each side */
  const sides = splitLongSides(ta.value);
  if (sides){
    const a = parseLongForm(sides.attacker), d = parseLongForm(sides.defender);
    if (!a.units.length && !d.units.length){
      alert("Found the Attackers / Defenders headings, but no units under them.");
      return;
    }
    a.units.barracks = a.barracks; d.units.barracks = d.barracks;
    ta.value = "";
    setSide("attacker", noNames(a.units));
    setSide("defender", noNames(d.units));
    scheduleSave();
    const ali = a.units.filter(u => u.type === "Alicorns").length;
    if (ali) alert(`Alicorns can only be fielded as defenders — skipped ${ali}.`);
    return;
  }
  const sh = parseShareable(ta.value);
  if (!sh){
    alert('That is not a battle code. A battle code opens with "+" and carries '
        + 'both sides, like +3F3F-9kQw2 — a whole warcalc link works too.');
    return;
  }
  ta.value = "";
  applyShareable(sh);
}

/* a button that says it worked, then goes back to being a button */
function flashOk(btn, word){
  if (!btn) return;
  const html = btn.innerHTML, title = btn.title;
  btn.innerHTML = btn.classList.contains("txt-btn")
    ? esc(word || "Done") : iconSvg("ok");
  btn.classList.add("ok");

  setTimeout(()=>{ btn.innerHTML = html; btn.classList.remove("ok"); btn.title = title; }, 1200);

/* ===================================================================
   6b. STORAGE — autosave, army presets, battle presets
   =================================================================== */

const LS_KEY  = "warcalc.autosave";
const LS_ARMY = "warcalc.armyPresets";
const LS_BATL = "warcalc.battlePresets";
const LS_MARK = "warcalc.markedArmies";
const LS_TAB  = "warcalc.tab";

let storageOK = true;
const store = {
  get(key, fallback){
    try{
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    }catch(e){ storageOK = false; return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ storageOK = false; return false; }
  },
  del(key){ try{ localStorage.removeItem(key); }catch(e){} }
};

/* a unit stripped down to what is worth saving */
const packSide = side => readSide(side).map(u=>Object.assign({
  type:u.type, weapon:u.weapon, armor:u.armor, size:u.size, training:u.training},
  u.nick ? {name:u.nick} : {}, u.reserve ? {reserve:true} : {}));

function setSide(side, units){
  (units || []).forEach(u=>uncapFor(side, u.training));
  setBarracks(side, units?.barracks);
  document.getElementById(side === "attacker" ? "tbodyAttacker" : "tbodyDefender").innerHTML = "";
  (units || []).forEach(u=>{
    if (side === "attacker" && u.type === "Alicorns") return;   // attackers can't field them
    makeRow(side, u);
  });
  refreshCounts();
}

/* ---- autosave ---- */
let autosaveArmed = false;
let saveTimer = null;
function scheduleSave(){
  if (!autosaveArmed) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    store.set(LS_KEY, {
      attacker: packSide("attacker"),
      defender: packSide("defender"),
      bonus: document.getElementById("defBonus").value,
      barracks: {attacker: barracksOf("attacker"), defender: barracksOf("defender")},
      uncap: {attacker: !!uncapBox("attacker")?.checked, defender: !!uncapBox("defender")?.checked},
      at: Date.now()
    });
  }, 400);
}

function restoreAutosave(){
  const s = store.get(LS_KEY, null);
  if (!s) return false;
  if (s.uncap) ["attacker", "defender"].forEach(side=>setUncap(side, s.uncap[side]));
  if (s.barracks) ["attacker", "defender"].forEach(side=>{
    const el = document.querySelector(`[data-barracks="${side}"]`);
    if (el) el.value = clampInt(s.barracks[side], 0, trainCap(side));
  });
  setSide("attacker", s.attacker);
  setSide("defender", s.defender);
  if (s.bonus) document.getElementById("defBonus").value = s.bonus;
  return true;
}

/* ---- army presets (shared pool, loadable into either side) ---- */
const getArmies  = () => store.get(LS_ARMY, {});
/* each army preset's Barracks level, kept beside the presets so the presets
   themselves stay plain unit lists */
const LS_ABRK = "warcalc.armyBarracks";
const getArmyBarracks = () => { const m = store.get(LS_ABRK, {}); return m && typeof m === "object" ? m : {}; };
function setArmyBarracks(name, n, rename){
  const m = getArmyBarracks();
  if (rename !== undefined){ if (name in m) m[rename] = m[name]; delete m[name]; }
  else if (n == null) delete m[name];
  else m[name] = clampInt(n, 0, TRAIN_UNCAPPED);
  store.set(LS_ABRK, m);
}
/* the levels for a set of army presets, for an export */
const barracksFor = names => Object.fromEntries(Object.entries(getArmyBarracks())
  .filter(([n]) => names.includes(n)));
const getBattles = () => store.get(LS_BATL, {});
const getMarks   = () => { const m = store.get(LS_MARK, []); return Array.isArray(m) ? m : []; };
const setMarks   = m => store.set(LS_MARK, m);

function refreshPresetSelects(){
  const armies = Object.keys(getArmies()).sort();
  document.querySelectorAll("[data-ap-sel]").forEach(sel=>{
    const keep = sel.value;
    sel.innerHTML = `<option value="">preset…</option>` +
      armies.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
    if (armies.includes(keep)) sel.value = keep;
  });
  const battles = Object.keys(getBattles()).sort();
  const bp = document.getElementById("bpSel");
  const keepB = bp.value;
  bp.innerHTML = `<option value="">—</option>` +
    battles.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (battles.includes(keepB)) bp.value = keepB;
  const tc = document.getElementById("toolsCount");
  if (tc) tc.textContent = `${armies.length} army · ${battles.length} battle` +
    (storageOK ? "" : " · storage unavailable");
  renderMarks();
  document.dispatchEvent(new Event("warcalc:presets"));   // the Grand Strategy list follows
}

/* ---- marked armies: the presets you swap between, one click away ---- */
function renderMarks(){
  const armies = getArmies();
  const marks = getMarks().filter(n => armies[n]);
  document.querySelectorAll("[data-ap-marks]").forEach(box=>{
    const side = box.dataset.apMarks;
    const sel = document.querySelector(`[data-ap-sel="${side}"]`);
    const sideWord = side === "attacker" ? "attackers" : "defenders";
    box.innerHTML = marks.map(n=>`<span class="mark-chip${sel && sel.value === n ? " on" : ""}"
        data-mark-load="${esc(n)}" data-mark-side="${esc(side)}"
        title="Load ${esc(n)} into the ${sideWord}"><span class="n">${esc(n)}</span
        ><button class="x" data-mark-off="${esc(n)}" title="Unpin ${esc(n)}">×</button></span>`).join("");
  });
  paintMarkButtons(marks);
}

function paintMarkButtons(marks){
  document.querySelectorAll("[data-ap-mark]").forEach(btn=>{
    const sel = document.querySelector(`[data-ap-sel="${btn.dataset.apMark}"]`);
    const on = !!(sel && sel.value && marks.includes(sel.value));
    btn.innerHTML = iconSvg(on ? "markOn" : "mark");
    btn.title = on ? "Unpin this preset" : "Pin this preset as a quick-swap button";
    btn.setAttribute("aria-label", btn.title);
  });
}

function toggleArmyMark(side){
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = sel.value;
  if (!name){ alert("Pick a preset first — marking pins it as a one-click button."); return; }
  const marks = getMarks();
  const i = marks.indexOf(name);
  if (i >= 0) marks.splice(i, 1); else marks.push(name);
  setMarks(marks);
  renderMarks();
}

function unmarkArmyPreset(name){
  setMarks(getMarks().filter(n => n !== name));
  renderMarks();
}

function saveArmyPreset(side){
  const units = packSide(side);
  if (!units.length){ alert("Nothing to save — that side is empty."); return; }
  const name = (prompt("Name this army preset:", "") || "").trim();
  if (!name) return;
  const all = getArmies();
  if (all[name] && !confirm(`Overwrite "${name}"?`)) return;
  all[name] = units;
  if (!store.set(LS_ARMY, all)) alert("Could not save — this browser is blocking local storage.");
  setArmyBarracks(name, barracksOf(side));
  refreshPresetSelects();
  document.querySelectorAll("[data-ap-sel]").forEach(sel=>{ sel.value = name; });
  renderMarks();
}

function loadArmyPreset(side){
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  const units = getArmies()[name];
  if (!units) return;
  setBarracks(side, getArmyBarracks()[name]);
  setSide(side, units);
}

/* update: keep the name, replace what is behind it with what is on screen */
function updateArmyPreset(side, btn){
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  const all = getArmies();
  if (!all[name]) return;
  const units = packSide(side);
  if (!units.length){ alert("Nothing to save \u2014 that side is empty."); return; }
  const sideWord = side === "attacker" ? "attackers" : "defenders";
  if (!confirm(`Update army preset "${name}" with the current ${sideWord}? The saved version is replaced.`)) return;
  all[name] = units;
  if (!store.set(LS_ARMY, all)){ alert("Could not save \u2014 this browser is blocking local storage."); return; }
  setArmyBarracks(name, barracksOf(side));
  flashOk(btn, "Updated");
}

function deleteArmyPreset(side){
  const sel = document.querySelector(`[data-ap-sel="${side || "attacker"}"]`)
           || document.querySelector("[data-ap-sel]");
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  if (!confirm(`Delete army preset "${name}"?`)) return;
  const all = getArmies();
  delete all[name];
  store.set(LS_ARMY, all);
  setArmyBarracks(name, null);
  setMarks(getMarks().filter(n => n !== name));
  refreshPresetSelects();
}

function renameArmyPreset(side){
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  const all = getArmies();
  if (!all[name]) return;
  const next = (prompt(`Rename army preset "${name}" to:`, name) || "").trim();
  if (!next || next === name) return;
  if (all[next] && !confirm(`Overwrite "${next}"?`)) return;
  all[next] = all[name];
  delete all[name];
  if (!store.set(LS_ARMY, all)){ alert("Could not save — this browser is blocking local storage."); return; }
  setArmyBarracks(name, null, next);
  const marks = getMarks();
  const i = marks.indexOf(name);
  if (i >= 0){ marks[i] = next; setMarks(marks); }
  refreshPresetSelects();
  document.querySelectorAll("[data-ap-sel]").forEach(o=>{ o.value = next; });
  renderMarks();
}

/* "Strip names from export/import": every way a roster leaves or enters the
   page drops the unit names on the way through. A list keeps its .barracks */
function noNames(units){
  if (!PREFS.stripNames || !Array.isArray(units)) return units;
  const out = units.map(u => { if (!u || typeof u !== "object") return u;
    const {name, ...rest} = u; return rest; });
  if (units.barracks != null) out.barracks = units.barracks;
  if (units.lifted) out.lifted = units.lifted;
  return out;
}
const noNamesBattle = b => b && typeof b === "object"
  ? Object.assign({}, b, {attacker: noNames(b.attacker), defender: noNames(b.defender)}) : b;
const noNamesEach = (map, f) => map && typeof map === "object"
  ? Object.fromEntries(Object.entries(map).map(([k, v]) => [k, f(v)])) : map;

/* ---- clipboard ----
   the block importRows() parses: a name line, then type / weapon / armor,
   then the two labelled numbers */
const compText = units => units.map(u=>[
    `${u.type}_${u.weapon}_${u.armor}`,
    u.type, label(u.weapon), label(u.armor),
    `Size: ${u.size}`, `Training: ${u.training}`
  ].concat(u.name ? [`Name: ${u.name}`] : [], u.reserve ? ["Reinforcement: yes"] : [])
   .join("\n")).join("\n\n");

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{                                     // file:// and older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* a plain click gives the short code, shift gives the long readable block
   the original page used */
async function copyComposition(side, btn, longForm){
  const units = noNames(packSide(side));
  if (!units.length){ alert("Nothing to copy — that side is empty."); return; }
  const text = longForm ? `Barracks: ${barracksOf(side)}\n\n${compText(units)}`
                        : encodeArmy(units, barracksOf(side));
  if (await copyText(text)) flashOk(btn, "Copied");
  else alert("This browser would not let the page reach the clipboard.");
}

async function copyBattleCode(btn, longForm){
  const atk = noNames(packSide("attacker")), def = noNames(packSide("defender"));
  if (!atk.length && !def.length){ alert("Nothing to copy — both sides are empty."); return; }
  const bonus = document.getElementById("defBonus").value;
  const text = longForm
    ? `=== ATTACKERS ===\n\nBarracks: ${barracksOf("attacker")}\n\n${compText(atk)}\n\n`
      + `=== DEFENDERS ===\n\nBarracks: ${barracksOf("defender")}\n\n${compText(def)}`
    : encodeBattle(atk, def, bonus, barracksBoth());
  if (await copyText(text)) flashOk(btn, "Copied");
  else alert("This browser would not let the page reach the clipboard.");
}

/* ---- json in / out ---- */
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* Local date and time, YYYY-MM-DD-HHMM. Local rather than UTC so the stamp
   matches the clock the exporter was looking at, and no colons so the name
   survives a Windows filesystem. */
const stamp = () => {
  const d = new Date(), p2 = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`
       + `-${p2(d.getHours())}${p2(d.getMinutes())}`;
};

/* a name that survives a trip through a filesystem */
const safeFile = n => (String(n || "").replace(/[^A-Za-z0-9._-]+/g, "-")
                        .replace(/^-+|-+$/g, "").slice(0, 60)) || "untitled";

/* ---- exporting one thing rather than the whole drawer ---- */
function exportArmyComposition(side){
  const units = noNames(packSide(side));
  if (!units.length){ alert("Nothing to export — that side is empty."); return; }
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = (prompt("Name this army composition:",
    sel && sel.value ? sel.value : (side === "attacker" ? "attackers" : "defenders")) || "").trim();
  if (!name) return;
  downloadJSON({kind:"armyPresets", armyPresets:{[name]: units},
                armyBarracks:{[name]: barracksOf(side)}},
               `curiocalc-army-${safeFile(name)}-${stamp()}.json`);
}

function exportBattle(){
  const battle = {attacker: noNames(packSide("attacker")), defender: noNames(packSide("defender")),
                  bonus: document.getElementById("defBonus").value, barracks: barracksBoth()};
  if (!battle.attacker.length && !battle.defender.length){
    alert("Nothing to export — both sides are empty."); return;
  }
  const sel = document.getElementById("bpSel");
  const name = (prompt("Name this battle:", sel.value || "battle") || "").trim();
  if (!name) return;
  downloadJSON({kind:"battlePresets", battlePresets:{[name]: battle}},
               `curiocalc-battle-${safeFile(name)}-${stamp()}.json`);
}

/* ---- bulk deletes ---- */
function deleteAllArmyPresets(){
  const n = Object.keys(getArmies()).length;
  if (!n){ alert("There are no army presets to delete."); return; }
  if (!confirm(`Delete all ${n} army preset${n === 1 ? "" : "s"}? This cannot be undone.`)) return;
  store.set(LS_ARMY, {});
  store.set(LS_ABRK, {});
  setMarks([]);
  refreshPresetSelects();
}

function deleteAllBattlePresets(){
  const n = Object.keys(getBattles()).length;
  if (!n){ alert("There are no battle presets to delete."); return; }
  if (!confirm(`Delete all ${n} battle preset${n === 1 ? "" : "s"}? This cannot be undone.`)) return;
  store.set(LS_BATL, {});
  refreshPresetSelects();
}

function importJSON(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ alert("That file isn't valid JSON."); return; }

  const armies  = noNamesEach(data.armyPresets   || (data.kind === "armyPresets"   ? data.presets : null), noNames);
  const battles = noNamesEach(data.battlePresets || (data.kind === "battlePresets" ? data.presets : null), noNamesBattle);
  if (!armies && !battles){ alert("No presets found in that file."); return; }

  let added = 0;
  if (armies){
    const all = getArmies();
    Object.entries(armies).forEach(([n,v])=>{
      let name = n;
      while (all[name] && JSON.stringify(all[name]) !== JSON.stringify(v)) name += " (imported)";
      all[name] = v; added++;
      const brk = data.armyBarracks && data.armyBarracks[n];
      if (brk != null) setArmyBarracks(name, brk);
    });
    store.set(LS_ARMY, all);
  }
  if (battles){
    const all = getBattles();
    Object.entries(battles).forEach(([n,v])=>{
      let name = n;
      while (all[name] && JSON.stringify(all[name]) !== JSON.stringify(v)) name += " (imported)";
      all[name] = v; added++;
    });
    store.set(LS_BATL, all);
  }
  refreshPresetSelects();
  alert(`Imported ${added} preset(s).`);
}

/* drag it anywhere: press on any bare part of it and move. A press that
   barely moves is still a click, so the buttons and figures keep working. */
(function dragPin(){
  let start = null, dx = 0, dy = 0, moved = false;
  pinEl.addEventListener("pointerdown", e=>{
    if (e.button !== 0 || e.target.closest(".pin-close,.m1-more,.hold-tab,label,input")) return;
    const r = pinEl.getBoundingClientRect();
    start = {x:e.clientX, y:e.clientY, id:e.pointerId};
    dx = e.clientX - r.left; dy = e.clientY - r.top; moved = false;
  });
  pinEl.addEventListener("pointermove", e=>{
    if (!start) return;
    if (!moved){
      if (Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 4) return;
      moved = true;
      pinEl.setPointerCapture(start.id);
      pinEl.classList.add("pin-dragging");
      tipEl.style.display = "none";
    }
    const r = pinEl.getBoundingClientRect();
    pinEl.style.left = Math.max(4 - r.width + 60, Math.min(e.clientX - dx, innerWidth  - 60)) + "px";
    pinEl.style.top  = Math.max(4, Math.min(e.clientY - dy, innerHeight - 40)) + "px";
  });
  const drop = e=>{
    if (!start) return;
    if (moved){
      try{ pinEl.releasePointerCapture(start.id); }catch(err){}
      pinEl.classList.remove("pin-dragging");
      /* the click that ends a drag is not a click on whatever is under it */
      const eat = ev=>{ ev.stopPropagation(); ev.preventDefault(); };
      addEventListener("click", eat, true);
      setTimeout(()=>removeEventListener("click", eat, true), 0);
    }
    start = null;
  };
  pinEl.addEventListener("pointerup", drop);
  pinEl.addEventListener("pointercancel", drop);
})();

/* ===================================================================
   8. SOLVER — cheapest force for whichever side you point it at
   =================================================================== */

const SOLVE_STACK_CAP = 5000000;
/* how many distinct stacks the solver may field, and how many subsets it is
   willing to enumerate one by one before it switches to the beam search */
const MAX_SOLVE_STACKS = 20;
const EXHAUSTIVE_COMBO_CAP = 250000;
/* beam order: cheapest first; subsets that found no answer (rank Infinity)
   go last, the most promising floor first among them */
const byRank = (a, b) => a.rank !== b.rank ? (a.rank < b.rank ? -1 : 1)
                                           : (a.lb ?? a.rank) - (b.lb ?? b.rank) || 0;

/* ---- nation leanings ----------------------------------------------
   Straight bits are the default and nothing below changes them. A nation
   that digs its own gems and smelts its own copper is not paying the same
   price for a unicorn as one that has to buy every horn in, so each type
   carries a multiplier the *search* optimises against. Under 1 the solver
   reaches for that type sooner; over 1 it has to earn its place. The bits
   quoted on the answer are always the real ones. */
const SOLVE_TYPES = ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"];
const LEAN_MIN = 0.1, LEAN_MAX = 10;
const PLENTY = 0.7, SCARCE = 1.4;   /* what the stock nations lean by */

const NATIONS = {
  even: {name:"No lean — straight ฿", note:""},
  zebrica: {
    name:"Zebrica",
    note:"Gems and copper out of its own ground, so unicorns and tanks are cheap to reach for. Wings, hooves and hulls all have to be bought in.",
    lean:{Tanks:PLENTY, Unicorns:PLENTY, Cavalry:SCARCE, Pegasi:SCARCE, Naval:SCARCE}
  },
  saddlearabia: {
    name:"Saddle Arabia",
    note:"Armour and hulls in quantity — tanks and ships come easy, everything else is a stretch.",
    lean:{Tanks:PLENTY, Naval:PLENTY, Cavalry:SCARCE, Pegasi:SCARCE, Unicorns:SCARCE}
  },
  burrozil: {
    name:"Burrozil",
    note:"Riders and fliers in quantity — cavalry and pegasi come easy, everything else is a stretch.",
    lean:{Cavalry:PLENTY, Pegasi:PLENTY, Tanks:SCARCE, Unicorns:SCARCE, Naval:SCARCE}
  },
  custom: {name:"Custom", note:"Your own numbers."}
};

/* the lean a nation puts on every type, gaps filled in with 1 */
function nationLean(key){
  const spec = (NATIONS[key] || {}).lean || {};
  const out = {};
  SOLVE_TYPES.forEach(t => { out[t] = spec[t] || 1; });
  return out;
}

/* missing, zero or nonsense reads as "no opinion" */
const leanOf = (lean, type) => {
  const v = lean && +lean[type];
  return v > 0 ? Math.min(LEAN_MAX, Math.max(LEAN_MIN, v)) : 1;
};
const leanActive = lean => SOLVE_TYPES.some(t => leanOf(lean, t) !== 1);

/* the stock nation these numbers match, if any */
function matchNation(lean){
  for (const key of Object.keys(NATIONS)){
    if (key === "custom") continue;
    const want = nationLean(key);
    if (SOLVE_TYPES.every(t => Math.abs(leanOf(lean, t) - want[t]) < 1e-9)) return key;
  }
  return "custom";
}

/* ---- cost of one troop of a given loadout ---- */
function loadoutBits(type, weapon, armor, resValue){
  const uc = UNIT_COST[type] || {hire:0, upkeep:{}};
  const hire = uc.hire;
  const w = gearCost("weapon", weapon), a = gearCost("armor", armor);
  const res = addRes(addRes({}, w.res, 1), a.res, 1);
  const raw = toRaw(res);
  let rawTotal = 0;
  for (const k in raw.res) rawTotal += raw.res[k];
  return {
    hire, gear: w.bits + a.bits, craft: raw.craftBits,
    cash: hire + w.bits + a.bits + raw.craftBits,
    bits: hire + w.bits + a.bits + raw.craftBits + (resValue || 0) * rawTotal,
    res, rawRes: raw.res, rawTotal, upkeep: uc.upkeep
  };
}

/* ---- a fighting profile, independent of stack size ---- */
function solProfile(row){
  const isAli = row.type === "Alicorns";
  const tn = isAli ? 5 : FORCE_TYPES[row.type];
  const es = effectiveStats(row.type, row.weapon, row.armor);
  /* a reinforcement sits out the first tick and joins on the second, the
     way the battle view brings it in */
  return {typeNum: tn, typeName: TYPES[tn], origType: row.type,
          weapon: row.weapon, armor: row.armor,
          training: row.training, size: row.size,
          arrive: row.reserve ? 2 : 1,
          dmg: es.dmg, arm: es.arm};
}

/* per-hit damage src -> dst, exactly as simulate() computes it */
function hitDamage(src, dst, bonus){
  const d = round3(src.dmg[dst.typeName] * dst.arm[src.typeName]
                   * Math.pow(1.5, (src.training - dst.training) / 20));
  return bonus ? d * 0.75 : d;
}

/* Stable insertion sort of `base` into `out`, biggest stack first. Both the
   bucket lists and the tied stretches of a target pool are a handful of entries
   at most, so this beats handing Array#sort a fresh closure a few million
   times, and it allocates nothing. Strict < keeps equal sizes in base order,
   which is the order the comparator it replaces settled them in. */
function orderBySize(base, sizes, out){
  for (let i = 0, n = base.length; i < n; i++){
    const v = base[i], sz = sizes[v];
    let j = i;
    while (j > 0 && sizes[out[j - 1]] < sz){ out[j] = out[j - 1]; j--; }
    out[j] = v;
  }
  return out;
}

/* buckets: sorted by raw weapon value desc, exactly like damageBuckets().
   Each list gets a scratch array beside it for the per-call size ordering.
   The (bucket, target type) pairs that actually hold sources are flattened into
   one list of jobs in the order the run walks them, so the inner loop never
   asks a bucket for a type it hasn't got — that lookup and its miss used to be
   a tenth of the whole search. */
function bucketPlan(srcs){
  const map = new Map();
  srcs.forEach((u, i) => {
    for (let n = 1; n <= 5; n++){
      const key = u.dmg[TYPES[n]];
      let b = map.get(key);
      if (!b){ b = {}; map.set(key, b); }
      (b[n] ??= []).push(i);
    }
  });
  const jobs = [];
  for (const key of [...map.keys()].sort((a, b) => b - a)){
    const byType = map.get(key);
    for (let n = 1; n <= 5; n++){
      const list = byType[n];
      if (!list) continue;
      jobs.push({tn: n, list: Int32Array.from(list),
                 scratch: list.length > 1 ? new Int32Array(list.length) : null});
    }
  }
  return jobs;
}

const NO_POOL = new Int32Array(0);

/* Target pools: which enemy stack a firing type works down first — armour
   ascending, then biggest stack first — as a flat [dstType * 6 + srcType]
   table of stack indices.
   Armour is a property of the loadout and never moves; only the sizes do. So
   the ordering is built once here and, on each call, only the stretches that
   tie on armour are re-sorted. Where every armour value is distinct that is no
   work at all, and the search used to rebuild this whole structure — object
   allocation, grouping and five sorts — for every single size it tried. */
function poolCache(dsts){
  const byType = {};
  dsts.forEach((u, i) => { (byType[u.typeNum] ??= []).push(i); });
  /* every slot holds a list, empty where that pairing has no targets: the
     lookup in the firing loop is then one shape of array and needs no null
     check, and it is the single hottest line in the search */
  const pools = new Array(36).fill(NO_POOL), plan = [];
  for (const dt in byType){
    for (let n = 1; n <= 5; n++){
      const t = TYPES[n];
      const order = byType[dt].slice().sort((x, y) => dsts[x].arm[t] - dsts[y].arm[t]);
      const runs = [];
      for (let a = 0; a < order.length; ){
        let b = a + 1;
        while (b < order.length && dsts[order[b]].arm[t] === dsts[order[a]].arm[t]) b++;
        if (b - a > 1) runs.push(a, b);
        a = b;
      }
      const base = Int32Array.from(order), out = Int32Array.from(order);
      pools[+dt * 6 + n] = out;
      if (runs.length) plan.push({base, out, runs: Int32Array.from(runs)});
    }
  }
  return {pools, plan};
}

/* the cached pools with their tied stretches settled for these sizes. The
   arrays are reused, so the answer only stands until the next call. */
function poolsFor(cache, sizes){
  const plan = cache.plan;
  for (let p = 0; p < plan.length; p++){
    const {base, out, runs} = plan[p];
    for (let r = 0; r < runs.length; r += 2){
      const a = runs[r], b = runs[r + 1];
      /* back to the armour order first: sorting last call's answer again
         would settle equal sizes by where they drifted to, not by index */
      for (let i = a; i < b; i++) out[i] = base[i];
      for (let i = a + 1; i < b; i++){
        const v = out[i], sz = sizes[v];
        let j = i;
        while (j > a && sizes[out[j - 1]] < sz){ out[j] = out[j - 1]; j--; }
        out[j] = v;
      }
    }
  }
  return cache.pools;
}

/* Which stacks the other side actually fields never changes during a fight, so
   a firing job aimed at a type nobody brought is dead weight — and with two or
   three enemy types against five it was most of them. Those pairings are struck
   off here, once, instead of being looked up and stepped over on every pass.
   Dropping them changes nothing: a source with no pool to work down never
   fought and never stopped the ones behind it. */
function prunePlan(jobs, srcTypes, pools){
  const out = [];
  for (const job of jobs){
    const keep = [];
    for (let k = 0; k < job.list.length; k++){
      const si = job.list[k];
      if (pools[job.tn * 6 + srcTypes[si]].length) keep.push(si);
    }
    if (!keep.length) continue;
    out.push({tn: job.tn, list: Int32Array.from(keep),
              scratch: keep.length > 1 ? new Int32Array(keep.length) : null});
  }
  return out;
}

/* one side's attack run, hit blocks resolved arithmetically.
   MAT is the flat src-by-dst damage table, one row of `stride` per source. */
function runAlloc(srcTypes, srcSizes, srcHits, dstSize, dstDam, MAT, stride, jobs, pools){
  for (let bi = 0; bi < jobs.length; bi++){
    const job = jobs[bi], tn = job.tn, list = job.list;
    const ordered = job.scratch ? orderBySize(list, srcSizes, job.scratch) : list;
    for (let oi = 0, on = ordered.length; oi < on; oi++){
      const si = ordered[oi];
      /* the pool a source works down never changes mid-source, so it is
         looked up once rather than on every pass */
      const pool = pools[tn * 6 + srcTypes[si]];
      const pn = pool.length;
      if (!pn) continue;
      const row = si * stride;
      let hits = srcHits[si], breakType = false;
      while (hits > 0){
        let fought = false;
        for (let pi = 0; pi < pn; pi++){
          const di = pool[pi];
          const dmg = MAT[row + di];
          if (!(dmg > 0)) continue;
          const left = dstSize[di] - dstDam[di];
          if (left > 0){
            const need = Math.max(1, Math.ceil(left / dmg - 1e-9));
            const n = need < hits ? need : hits;
            if (n > 0){
              fought = true;
              dstDam[di] += n * dmg;
              hits -= n;
              if (hits === 0) break;
            }
          }
        }
        if (hits === 0) break;
        if (!fought){ breakType = true; break; }
      }
      srcHits[si] = hits;
      if (breakType) break;
    }
  }
}

/* ---- context ----
   "own" is the side being solved for (its sizes vary), "foe" is fixed.
   bonusOwn / bonusFoe say which side's damage the defender bonus scales down.
   ticks is how many exchanges the engagement may run for: after each one the
   survivors on both sides carry into the next, so a force too small to wipe the
   enemy in one tick can still grind them down over several. Tracking losses is
   optional at one tick but mandatory beyond it — the next tick fires from
   whatever is left. */
function makeContext(ownProfiles, foeProfiles, bonusOwn, bonusFoe, wantLosses, ticks){
  const own = ownProfiles, foe = foeProfiles;
  const T = Math.max(1, ticks || 1);
  const losses = wantLosses || T > 1;
  const K = own.length, M = foe.length;

  /* the damage tables flat, one row per source, so the inner loop indexes
     a single typed array instead of walking an array of arrays */
  const MO = new Float64Array(K * M);
  for (let i = 0; i < K; i++)
    for (let j = 0; j < M; j++) MO[i * M + j] = hitDamage(own[i], foe[j], bonusOwn);
  let MF = null;
  if (losses){
    MF = new Float64Array(M * K);
    for (let j = 0; j < M; j++)
      for (let i = 0; i < K; i++) MF[j * K + i] = hitDamage(foe[j], own[i], bonusFoe);
  }

  const ownTypes = Int32Array.from(own, u => u.typeNum);
  const foeTypes = Int32Array.from(foe, u => u.typeNum);
  const foePools = poolCache(foe), ownPools = losses ? poolCache(own) : null;

  /* The enemy's reinforcements are in every table from the start, but stand
     at 0 until the tick they arrive. A stack of 0 fires nothing and soaks
     nothing, and the pools are settled afresh every tick anyway, so until then
     the fight runs exactly as if they were not there. runSolver hands them
     over at the back of the list, where the battle view puts them when they
     join, so a tie in who gets shot first settles the same way. */
  const late = [];
  foe.forEach((f, j) => { if (f.arrive > 1) late.push({j, at: f.arrive, size: f.size}); });

  return {
    own, foe, K, M, wantLosses: losses, ticks: T,
    MO, MF, ownTypes, foeTypes,
    foeSize: Float64Array.from(foe, f => f.arrive > 1 ? 0 : f.size),
    foeLate: late.length ? late : null,
    foeDue: late.reduce((s, r) => s + r.size, 0),
    ownBuckets: prunePlan(bucketPlan(own), ownTypes, foePools.pools),
    ownPoolCache: ownPools,
    foePoolCache: foePools,
    foeBuckets: losses ? prunePlan(bucketPlan(foe), foeTypes, ownPools.pools) : null,
    /* scratch the search reuses: trySizes runs millions of times and every
       one of these used to be a fresh allocation */
    sOwnSize: new Float64Array(K), sFoeSize: new Float64Array(M),
    sOwnHits: new Float64Array(K), sFoeHits: new Float64Array(M),
    sFoeDam:  new Float64Array(M), sOwnDam:  new Float64Array(K),
    sOwnLost: new Float64Array(K), sTroopTicks: new Float64Array(K),
    sRes: {wipe:false, foeLeft:0, ownLost:null, ownLeft:null, ticksUsed:0, perTick:null, troopTicks:null}
  };
}

/* The verdict the search asks for is often settled by half the exchange. Over a
   single tick both sides fire from full strength, so whether the enemy is wiped
   turns on our volley alone, and whether enough of ours are left standing turns
   on theirs. This hands back a view of the context with the half that cannot
   change the answer left unfought — the scratch buffers and tables are shared,
   so it costs nothing to make. Past one tick each side's losses feed the next,
   and nothing can be skipped. */
function feasContext(ctx, goal){
  if (ctx.ticks > 1) return ctx;
  if (goal === "wipe"){
    if (!ctx.wantLosses) return ctx;
    const lean = Object.assign({}, ctx);
    lean.wantLosses = false; lean.MF = null; lean.foeBuckets = null;
    return lean;
  }
  if (goal === "survive"){
    const lean = Object.assign({}, ctx);
    lean.skipOwnRun = true;
    return lean;
  }
  return ctx;
}

/* Fight the engagement out: both sides fire from their pre-tick strength, then
   the dead are removed, exactly the order simulate() uses. Every tick after the
   first is that same arithmetic on the survivors, so the target pools have to be
   rebuilt each time — stack sizes decide targeting order.
   Enemy reinforcements drop in at the start of the tick they arrive on, and
   while any are still to come the enemy is not wiped and a quiet tick is not
   a deadlock: they are counted among the enemy left.
   wantLog fills in the per-tick trace for the result card; the search itself
   runs this millions of times and skips it. */
function trySizes(sizes, ctx, wantLog){
  const K = ctx.K, M = ctx.M;
  /* the scratch buffers are the search's; a call that hands its answer back to
     be kept — the ones that end up on screen — gets arrays of its own */
  const ownSize = ctx.sOwnSize, foeSize = ctx.sFoeSize;
  const ownHits = ctx.sOwnHits, foeHits = ctx.sFoeHits;
  const foeDam = ctx.sFoeDam, ownDamBuf = ctx.sOwnDam;
  for (let i = 0; i < K; i++) ownSize[i] = sizes[i];
  foeSize.set(ctx.foeSize);
  const ownLost = ctx.wantLosses ? (wantLog ? new Array(K).fill(0) : ctx.sOwnLost.fill(0)) : null;
  const perTick = wantLog ? [] : null;
  /* troops of each stack standing at the start of every tick, summed: what
     the upkeep over the whole fight is billed on */
  const troopTicks = wantLog ? new Array(K).fill(0) : ctx.sTroopTicks.fill(0);
  let wipe = false, ticksUsed = 0, foeLeft = 0, ownLeft = 0;
  let due = ctx.foeDue;                 // enemy troops still to arrive

  const skipOwnRun = !!ctx.skipOwnRun;

  for (let t = 1; t <= ctx.ticks; t++){
    if (due){
      const late = ctx.foeLate;
      for (let r = 0; r < late.length; r++)
        if (late[r].at === t){ foeSize[late[r].j] = late[r].size; due -= late[r].size; }
    }
    for (let i = 0; i < K; i++) troopTicks[i] += ownSize[i];
    if (!skipOwnRun){
      foeDam.fill(0);
      for (let i = 0; i < K; i++) ownHits[i] = ownSize[i];
      runAlloc(ctx.ownTypes, ownSize, ownHits, foeSize, foeDam,
               ctx.MO, M, ctx.ownBuckets, poolsFor(ctx.foePoolCache, foeSize));
    }

    let ownDam = null;
    if (ctx.wantLosses){
      ownDam = ownDamBuf; ownDam.fill(0);
      for (let j = 0; j < M; j++) foeHits[j] = foeSize[j];
      runAlloc(ctx.foeTypes, foeSize, foeHits, ownSize, ownDam,
               ctx.MF, K, ctx.foeBuckets, poolsFor(ctx.ownPoolCache, ownSize));
    }

    /* round6 inlined and the loss branch lifted out of the loop: this runs
       twice per stack per tick, millions of times over a search */
    let foeKilled = 0, ownKilled = 0;
    foeLeft = 0; ownLeft = 0;
    if (skipOwnRun) for (let j = 0; j < M; j++) foeLeft += foeSize[j];
    else for (let j = 0; j < M; j++){
      const d = foeDam[j];
      let dead = d > 0 ? Math.floor(Math.round((d + Number.EPSILON) * 1e6) / 1e6) : 0;
      if (dead > foeSize[j]) dead = foeSize[j];
      foeSize[j] -= dead; foeKilled += dead; foeLeft += foeSize[j];
    }
    if (ownDam){
      for (let i = 0; i < K; i++){
        const d = ownDam[i];
        let dead = d > 0 ? Math.floor(Math.round((d + Number.EPSILON) * 1e6) / 1e6) : 0;
        if (dead > ownSize[i]) dead = ownSize[i];
        ownSize[i] -= dead; ownKilled += dead; ownLost[i] += dead;
        ownLeft += ownSize[i];
      }
    } else for (let i = 0; i < K; i++) ownLeft += ownSize[i];
    if (due) foeLeft += due;

    ticksUsed = t;
    if (perTick) perTick.push({tick:t, foeKilled, ownKilled, foeLeft, ownLeft});
    if (!foeLeft){ wipe = true; break; }
    if (!ownLeft) break;
    if (!foeKilled && !ownKilled && !due) break;   // deadlock: every later tick repeats it
  }

  if (wantLog)
    return {wipe, foeLeft, ownLost, ownLeft: ctx.wantLosses ? ownLeft : null,
            ticksUsed, perTick, troopTicks};
  /* the search only ever reads the verdict straight back out, so it is handed
     the same object every time rather than a fresh one a few million over */
  const r = ctx.sRes;
  r.wipe = wipe; r.foeLeft = foeLeft; r.ownLost = ownLost;
  r.ownLeft = ctx.wantLosses ? ownLeft : null;
  r.ticksUsed = ticksUsed; r.perTick = null; r.troopTicks = troopTicks;
  return r;
}

/* ================= candidates ================= */
function buildCandidates(opts, foeProfiles, bonusOwn, bonusFoe){
  const out = [];
  opts.types.forEach(type => {
    const set = LOADOUTS[type];
    if (!set) return;
    /* bits is what the troop really costs; wbits is what it costs *this*
       nation to reach for, and that is the number the search minimises */
    const lean = leanOf(opts.lean, type);
    set.weapons.forEach(w => set.armor.forEach(a => {
      if (!opts.useArmor && a !== "ScroungedArmor") return;
      /* a loadout whose very first troop breaks a limit can never be fielded */
      if (overCaps(capsFor([{type, weapon:w, armor:a}], opts), [1])) return;
      const cost = loadoutBits(type, w, a, opts.resValue);
      const p = solProfile({type, weapon:w, armor:a, size:1, training:opts.training});
      const perHit = foeProfiles.map(f => hitDamage(p, f, bonusOwn));
      const incoming = foeProfiles.map(f => hitDamage(f, p, bonusFoe));
      if (opts.goal !== "survive" && !perHit.some(v => v > 0)) return;
      out.push({type, weapon:w, armor:a, bits:cost.bits, wbits:cost.bits * lean, lean,
                cost, perHit, incoming, p});
    }));
  });
  return out;
}

/* drop loadouts another beats on every axis at no extra cost */
function pruneCands(cands, useIncoming, usePerHit, maxKeep){
  const keep = [];
  for (const c of cands.slice().sort((a, b) => a.wbits - b.wbits)){
    let dominated = false;
    for (const k of keep){
      if (k.wbits > c.wbits) continue;
      let ok = true;
      if (usePerHit)
        for (let j = 0; j < c.perHit.length && ok; j++) if (k.perHit[j] < c.perHit[j]) ok = false;
      if (ok && useIncoming)
        for (let j = 0; j < c.incoming.length && ok; j++) if (k.incoming[j] > c.incoming[j]) ok = false;
      if (ok){ dominated = true; break; }
    }
    if (!dominated) keep.push(c);
  }
  if (keep.length <= maxKeep) return keep;
  const score = new Map(keep.map(c => [c, Infinity]));
  const rank = fn => keep.slice().sort((a, b) => fn(a) - fn(b))
    .forEach((c, r) => score.set(c, Math.min(score.get(c), r)));
  for (let j = 0; j < keep[0].perHit.length; j++){
    if (usePerHit) rank(c => c.wbits / (c.perHit[j] || 1e-9));
    if (useIncoming) rank(c => c.wbits * (c.incoming[j] || 1e-9));
  }
  return keep.sort((a, b) => score.get(a) - score.get(b) || a.wbits - b.wbits).slice(0, maxKeep);
}

/* ================= size search =================
   A third of the size vectors a local search probes are ones it has already
   fought out: the tightening passes revisit, and the trade loop keeps coming
   back to the same trial. trySizes depends on nothing but the sizes and the
   context, so the verdicts are worth keeping.
   This is a cache, not a ledger — one direct-mapped table, fixed size, and a
   clash simply evicts the older entry. Every hit compares the whole vector
   before it is believed, so a hash collision can never hand back the wrong
   answer. One table serves every solver: each is handed a stamp of its own and
   believes only the slots carrying it, so solvers alive at the same time evict
   one another's entries but can never read them. */
const MEMO = {stride:0, cap:0, mask:0, keys:null, val:null, gen:null, epoch:0};

/* Claiming the table is on the hot path — the scan hands it to a new solver for
   every subset it sizes — so it neither clears the table nor rebuilds it: a
   fresh stamp retires every entry that came before, all at once. The rows are
   cut for the widest subset seen so far, so subsets of different sizes share
   the same allocation instead of throwing megabytes at the collector each time
   the stack count changes. */
function claimMemo(K){
  if (K > MEMO.stride){
    const stride = K, cap = stride <= 8 ? 1 << 16 : 1 << 14;
    MEMO.stride = stride; MEMO.cap = cap; MEMO.mask = cap - 1;
    MEMO.keys = new Float64Array(cap * stride);
    MEMO.val = new Uint8Array(cap);          // 1 passes, 2 fails, stale if the stamp is old
    MEMO.gen = new Uint32Array(cap);
    MEMO.epoch = 0;
  }
  if (MEMO.epoch >= 0xfffffffe){ MEMO.gen.fill(0); MEMO.epoch = 0; }
  MEMO.epoch++;
  return MEMO;
}

function makeSolver(subset, foeProfiles, o){
  const ctx = makeContext(subset.map(c => c.p), foeProfiles, o.bonusOwn, o.bonusFoe,
                          o.wantLosses, o.ticks);
  const fctx = feasContext(ctx, o.goal);
  const bitsArr = subset.map(c => c.wbits);
  const K = subset.length;
  let sims = 0;

  const meets = res =>
    o.goal === "wipe"    ? res.wipe :
    o.goal === "survive" ? res.ownLeft >= o.minSurvivors :
                           res.wipe && res.ownLeft >= o.minSurvivors;

  const memo = claimMemo(K);
  const epoch = memo.epoch, mask = memo.mask, stride = memo.stride;
  const keys = memo.keys, val = memo.val, gen = memo.gen;

  /* Two floors that need no battle to check. Every troop lands at most one hit
     a tick, and no hit takes more off an enemy stack than the best loadout in
     this subset does — so a force with fewer hits in it than the enemy has
     bodies to soak cannot wipe them however it is arranged. And only the troops
     brought can be the ones left standing. Both are a sum over the sizes, and
