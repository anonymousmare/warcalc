     they throw out most of what the bisections probe on the low side without
     fighting anything out. Enemy reinforcements count among the bodies to
     soak, and since nothing can hit them before they arrive, the hits that
     kill them have to fit in the ticks after the first as well. */
  const T = ctx.ticks;
  const needBodies = o.goal === "wipe" ? 0 : o.minSurvivors;
  let needHits = 0, needLate = 0;
  if (o.goal !== "survive"){
    for (let j = 0; j < foeProfiles.length; j++){
      let best = 0;
      for (let i = 0; i < K; i++){ const v = subset[i].perHit[j]; if (v > best) best = v; }
      if (!(best > 0)){ needHits = Infinity; break; }
      const n = Math.ceil((foeProfiles[j].size - 1e-6) / best);
      needHits += n;
      if (foeProfiles[j].arrive > 1) needLate += n;
    }
  }

  /* the upkeep budget covers the whole fight, and the first tick alone bills
     the full starting force — so the starting upkeep is a floor that needs no
     battle; the rest is checked once the fight is fought out. The equipment
     stock is spent once, up front, so it is settled by the sizes alone. */
  const caps = capsFor(subset, o), upCaps = caps.filter(c => c.upkeep);
  const overK = sz => overCaps(caps, sz);
  /* growth cut back, stack by stack, to whatever each limit still has room for */
  const fitBudget = (sz, prev) => {
    for (const cap of caps){
      let base = 0, grow = 0;
      for (let i = 0; i < K; i++){
        const u = cap.use[i];
        base += prev[i] * u; grow += Math.max(0, sz[i] - prev[i]) * u;
      }
      if (base + grow <= cap.lim + 1e-9) continue;
      const f = grow > 0 ? Math.max(0, (cap.lim - base) / grow) : 0;
      for (let i = 0; i < K; i++)
        if (cap.use[i] && sz[i] > prev[i]) sz[i] = prev[i] + Math.floor((sz[i] - prev[i]) * f);
    }
    return sz;
  };

  const feasible = sz => {
    let tot = 0;
    for (let i = 0; i < K; i++) tot += sz[i];
    if (tot < needBodies || tot * T < needHits) return false;
    if (needLate && tot * (T - 1) < needLate) return false;
    if (caps.length && overK(sz)) return false;
    let h = 2166136261;
    for (let i = 0; i < K; i++) h = Math.imul(h ^ (sz[i] | 0), 16777619);
    const slot = (h >>> 0) & mask, base = slot * stride;
    if (gen[slot] === epoch){
      let same = true;
      for (let i = 0; i < K; i++) if (keys[base + i] !== sz[i]){ same = false; break; }
      if (same) return val[slot] === 1;
    }
    sims++;
    const res = trySizes(sz, fctx);
    const ok = meets(res) && !(upCaps.length && T > 1 && overCaps(upCaps, res.troopTicks));
    for (let i = 0; i < K; i++) keys[base + i] = sz[i];
    val[slot] = ok ? 1 : 2;
    gen[slot] = epoch;
    return ok;
  };
  const cost = sz => { let c = 0; for (let i = 0; i < K; i++) c += sz[i] * bitsArr[i]; return c; };

  /* Shave one stack down to the least that still does the job. The answer is
     usually just below where the stack already stands — the later passes mostly
     confirm that it cannot shrink at all — so this walks down in doubling steps
     and bisects only the gap that finds, rather than bisecting the whole range
     from zero and paying twenty battles to be told nothing moved. */
  function tighten(sizes, i){
    const start = sizes[i];
    if (!start) return sizes;
    let lo = 0, hi = start;
    for (let step = 1; ; step *= 2){
      const probe = start - step;
      if (probe <= 0){
        sizes[i] = 0;
        if (feasible(sizes)) hi = 0; else lo = 1;
        break;
      }
      sizes[i] = probe;
      if (feasible(sizes)) hi = probe;
      else { lo = probe + 1; break; }
    }
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      sizes[i] = mid;
      if (feasible(sizes)) hi = mid; else lo = mid + 1;
    }
    sizes[i] = lo;
    return sizes;
  }

  function localMin(start, pinned){
    let sizes = start.slice();
    if (!feasible(sizes)) return null;
    const free = [];
    for (let i = 0; i < K; i++) if (i !== pinned) free.push(i);

    for (let pass = 0; pass < 5; pass++){
      let moved = false;
      const order = free.slice().sort((a, b) => sizes[b] * bitsArr[b] - sizes[a] * bitsArr[a]);
      for (const i of order){
        const before = sizes[i];
        tighten(sizes, i);
        if (sizes[i] < before) moved = true;
      }
      if (free.length > 1){
        /* the trade is O(K^2) sims per pass, so with many stacks it trades
           only against the priciest few, over a coarser ladder of steps */
        const factors = K <= 6  ? [0, .02, .05, .1, .2, .35, .5, .75, 1, 1.5, 2, 3]
                      : K <= 12 ? [0, .05, .2, .5, 1, 2]
                                : [0, .1, .5, 1.5];
        const partners = K <= 8 ? free : order.slice(0, 8);
        const trial = sizes.slice();
        for (const i of free) for (const j of partners){
          if (i === j || !sizes[j]) continue;
          const bi = bitsArr[i], bj = bitsArr[j];
          for (const f of factors){
            const step = f === 0 ? 1 : Math.max(1, Math.round((sizes[i] || sizes[j]) * f));
            /* what stack j has to give back before the trade is worth making.
               Anything above that is a cheaper answer than the one we hold, so
               the bisection starts there instead of at j's present size — and
               where even emptying j would not pay for the step, there is
               nothing to fight out at all. */
            const room = (sizes[j] * bj - step * bi - 1e-9) / bj;
            if (!(room > 0)) continue;
            let hi = Math.min(sizes[j], Math.ceil(room) - 1);
            if (hi < 0) continue;
            for (let k = 0; k < K; k++) trial[k] = sizes[k];
            trial[i] += step;
            trial[j] = hi;
            if (!feasible(trial)) continue;
            let lo = 0;
            while (lo < hi){
              const mid = (lo + hi) >> 1;
              trial[j] = mid;
              if (feasible(trial)) hi = mid; else lo = mid + 1;
            }
            trial[j] = lo;
            sizes = trial.slice();
            moved = true;
          }
        }
      }
      if (!moved) break;
    }
    for (const i of free) tighten(sizes, i);
    return feasible(sizes) ? sizes : null;
  }

  function reach(seed){
    let sizes = seed.map(s => Math.max(0, Math.round(s)));
    if (sizes.every(s => s === 0)) sizes = sizes.map(() => 1);
    let guard = 0;
    while (!feasible(sizes)){
      if (++guard > 60) return null;
      if (caps.length && overK(sizes)) return null;      // already past a limit
      const prev = sizes;
      let tot = 0;
      sizes = sizes.map(s => Math.max(2, Math.ceil(s * 1.4) + 2));
      if (caps.length){
        fitBudget(sizes, prev);
        if (sizes.every((v, i) => v === prev[i])) return null;  // nothing left to grow into
      }
      sizes.forEach(v => tot += v);
      if (tot > SOLVE_STACK_CAP) return null;
    }
    return sizes;
  }

  return {ctx, bitsArr, K, feasible, cost, tighten, localMin, reach,
          simCount: () => sims, result: sz => trySizes(sz, ctx, true)};
}

/* ---- seeds ---- */
function seedSizes(subset, foeProfiles, o){
  const sizes = new Array(subset.length).fill(0);
  /* a seed that already breaks a limit can never be grown into an answer,
     so each pick goes to the cheapest stack that still fits */
  const caps = capsFor(subset, o);
  const fits = (i, add) => {
    if (!caps.length) return true;
    const trial = sizes.slice();
    trial[i] += add;
    return !overCaps(caps, trial);
  };
  /* the most of `want` extra troops stack i can take before the budget bites */
  const room = (i, want) => {
    let lo = 0, hi = want;
    while (lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      if (fits(i, mid)) lo = mid; else hi = mid - 1;
    }
    return lo;
  };
  /* when no one stack fits the whole job, pour it into the cheapest stacks
     in turn, each up to what the budget leaves it — need(i) is how many
     troops stack i would take to do the job alone */
  const spread = need => {
    const order = [];
    for (let i = 0; i < subset.length; i++) if (need(i) > 0) order.push(i);
    order.sort((a, b) => need(a) * subset[a].wbits - need(b) * subset[b].wbits);
    let left = 1;
    for (const i of order){
      const add = room(i, Math.ceil(left * need(i) - 1e-9));
      sizes[i] += add;
      left -= add / need(i);
      if (left <= 1e-9) return true;
    }
    return false;
  };

  const T = Math.max(1, o.ticks || 1);           // a troop that lives gets one hit per tick
  /* the ticks a stack is there to be hit in, or to hit back in: an enemy
     reinforcement misses every tick before it arrives */
  const there = f => f.arrive > 1 ? T - f.arrive + 1 : T;
  if (o.goal !== "survive"){                     // enough hits to kill each enemy stack
    for (let j = 0; j < foeProfiles.length; j++){
      const Tj = there(foeProfiles[j]);
      if (Tj < 1) return null;
      let best = -1, bestCost = Infinity, bestHits = 0;
      for (let i = 0; i < subset.length; i++){
        const ph = subset[i].perHit[j];
        if (!(ph > 0)) continue;
        const h = Math.max(1, Math.ceil(foeProfiles[j].size / ph / Tj));
        if (h * subset[i].wbits < bestCost && fits(i, h)){ bestCost = h * subset[i].wbits; best = i; bestHits = h; }
      }
      if (best >= 0) sizes[best] += bestHits;
      else if (!spread(i => subset[i].perHit[j] > 0 ? foeProfiles[j].size / subset[i].perHit[j] / Tj : 0)) return null;
    }
  }

  if (o.goal !== "wipe"){                        // enough bodies to outlast the incoming damage
    let best = -1, bestCost = Infinity, bestNeed = 0;
    for (let i = 0; i < subset.length; i++){
      let dmg = 0;
      for (let j = 0; j < foeProfiles.length; j++)
        if (there(foeProfiles[j]) > 0) dmg += foeProfiles[j].size * subset[i].incoming[j];
      const need = Math.floor(dmg) + o.minSurvivors;
      if (need * subset[i].wbits < bestCost && fits(i, Math.max(0, need - sizes[i]))){ bestCost = need * subset[i].wbits; best = i; bestNeed = need; }
    }
    if (best >= 0) sizes[best] = Math.max(sizes[best], bestNeed);
    else {
      /* troops already placed to kill count towards the bodies */
      const need = i => {
        let dmg = 0;
        for (let j = 0; j < foeProfiles.length; j++)
          if (there(foeProfiles[j]) > 0) dmg += foeProfiles[j].size * subset[i].incoming[j];
        return Math.floor(dmg) + o.minSurvivors;
      };
      const had = sizes.reduce((t, v, i) => t + v / need(i), 0);
      if (had < 1){
        const scale = 1 - had;
        if (!spread(i => need(i) * scale)) return null;
      }
    }
  }
  return sizes;
}

function quickOptimize(subset, foeProfiles, o){
  const sv = makeSolver(subset, foeProfiles, o);
  const seed = seedSizes(subset, foeProfiles, o);
  if (!seed) return null;
  const reached = sv.reach(seed);
  if (!reached) return null;
  const sizes = sv.localMin(reached, -1);
  if (!sizes) return null;
  return {sizes, cost: sv.cost(sizes), sv};
}

function soloSize(cand, foeProfiles, o){
  const sv = makeSolver([cand], foeProfiles, o);
  const seed = seedSizes([cand], foeProfiles, o);
  if (!seed) return null;
  const reached = sv.reach(seed);
  if (!reached) return null;
  return sv.tighten(reached, 0)[0];
}

function* hardOptimize(subset, foeProfiles, o, solos, gridN, startSizes){
  const sv = makeSolver(subset, foeProfiles, o);
  const K = subset.length, caps = capsFor(subset, o);
  /* the scan already sized this subset, so start from what it found rather
     than paying for the whole local search a second time */
  const q = (startSizes && sv.feasible(startSizes)) ? {sizes: startSizes.slice()}
                                                    : quickOptimize(subset, foeProfiles, o);
  if (!q) return null;
  let bestSizes = q.sizes, bestCost = sv.cost(bestSizes);

  for (let round = 0; round < 2; round++){
    let improved = false;
    for (let i = 0; i < K; i++){
      const cap = Math.min(solos && solos[i] ? solos[i] : bestSizes[i] * 3 + 8,
                           Math.ceil(bestCost / sv.bitsArr[i]));
      if (!(cap > 0)) continue;
      const step = Math.max(1, Math.floor(cap / (gridN || 40)));
      for (let v = 0; v <= cap; v += step){
        const start = bestSizes.slice();
        start[i] = v;
        let trial = start, guard = 0;
        while (!sv.feasible(trial)){
          if (++guard > 40){ trial = null; break; }
          trial = trial.map((s, k) => k === i ? s : Math.max(2, Math.ceil(s * 1.4) + 2));
          if (overCaps(caps, trial)){ trial = null; break; }
          if (trial.reduce((a, b) => a + b, 0) > SOLVE_STACK_CAP){ trial = null; break; }
        }
        if (!trial) continue;
        yield null;
        const got = sv.localMin(trial, i);
        if (got && sv.cost(got) < bestCost - 1e-9){ bestCost = sv.cost(got); bestSizes = got; improved = true; }
      }
    }
    if (!improved) break;
  }
  const finished = sv.localMin(bestSizes, -1);
  if (finished && sv.cost(finished) < bestCost){ bestSizes = finished; bestCost = sv.cost(finished); }
  return {sizes: bestSizes, cost: bestCost, sv, res: sv.result(bestSizes)};
}

/* ================= driver ================= */
/* what to say when the scan sized nothing — how hard it looked, and the
   likeliest thing standing in the way */
function noSolution(tried, o){
  const n = tried.toLocaleString("en-US");
  return limitsOn(o)
    ? `No solution found — ${n} mixes tried, and none of them could do it inside your limits. Loosen a limit, or allow more unit types or stacks.`
    : `No solution found — ${n} mixes tried, and none of them could do it under the size cap. Allow more unit types or stacks.`;
}
const limitsOn = o => Object.keys(o.budget || {}).length + Object.keys(o.stock || {}).length > 0;
const noLoadouts = o => limitsOn(o)
  ? "None of the allowed unit types can be fielded inside your limits — not even one troop."
  : "None of the allowed unit types can be fielded here.";

function* solveGen(opts, foeRows, bonusOwn, bonusFoe){
  const foeProfiles = foeRows.map(solProfile);
  const ticks = Math.max(1, opts.ticks || 1);
  const o = {
    goal: opts.goal, minSurvivors: Math.max(1, opts.minSurvivors || 1),
    bonusOwn, bonusFoe, ticks, budget: opts.budget || {}, stock: opts.stock || {},
    /* past one tick the losses drive the next tick, so they are never optional */
    wantLosses: ticks > 1 || opts.goal !== "wipe" || opts.objective !== "upfront"
  };
  const needKill = o.goal !== "survive";

  let cands = buildCandidates(Object.assign({}, opts, {goal:o.goal}), foeProfiles, bonusOwn, bonusFoe);
  if (!cands.length){ yield {done:true, error:noLoadouts(o)}; return; }
  /* under a limit a pricier loadout is not beaten by a cheaper one, since it
     eats a different resource, so each type keeps its best loadout or two —
     few enough that the scan can still try every mix */
  cands = pruneCandsDeep(cands, o.wantLosses, needKill, opts.maxCandidates || 28, limitsOn(o), 2);

  if (needKill){
    const dead = [];
    foeProfiles.forEach((f, j) => { if (!cands.some(c => c.perHit[j] > 0)) dead.push(j); });
    if (dead.length){
      yield {done:true, error:"Some enemy stacks take zero damage from every allowed loadout, so they cannot be killed."};
      return;
    }
  }

  const solos = cands.map(c => soloSize(c, foeProfiles, o));

  const K = Math.min(opts.maxStacks, cands.length);

  /* Few enough subsets and every one of them gets sized. Past the cap the
     count explodes — C(32,10) alone is 64 million — so the search switches
     to a beam: keep the best subsets of each size, grow each by one more
     stack, keep the best of those, and stop when another stack stops
     paying for itself. */
  const subsetCount = (n, k) => {
    let tot = 0, c = 1;
    for (let i = 1; i <= k; i++){
      c = c * (n - i + 1) / i;
      tot += c;
      if (tot > EXHAUSTIVE_COMBO_CAP) return Infinity;
    }
    return tot;
  };
  const exhaustive = subsetCount(cands.length, K) <= EXHAUSTIVE_COMBO_CAP;

  /* lower bounds — both are floors on any achievable cost for that subset.
     Over T ticks a troop lands at most T hits, so the kill floor divides by T,
     and the enemy's reinforcements, who can only be hit from tick 2, have to
     be killed in T - 1. The damage the enemy deals in tick 1 lands whatever
     happens after, and so does what their reinforcements fire the tick they
     arrive, since the fight cannot end before then. */
  const killRate = cands.map(c => foeProfiles.map((f, j) => c.perHit[j] > 0 ? c.wbits / c.perHit[j] : Infinity));
  const lowerBound = idxs => {
    let lb = 0;
    if (needKill){
      let late = 0;
      for (let j = 0; j < foeProfiles.length; j++){
        let best = Infinity;
        for (const i of idxs) if (killRate[i][j] < best) best = killRate[i][j];
        if (best === Infinity) return Infinity;
        lb += foeProfiles[j].size * best / ticks;
        if (foeProfiles[j].arrive > 1) late += foeProfiles[j].size * best;
      }
      if (late) lb = ticks > 1 ? Math.max(lb, late / (ticks - 1)) : Infinity;
    }
    if (o.goal !== "wipe"){
      let dmg = 0, dmgLate = 0;
      for (let j = 0; j < foeProfiles.length; j++){
        let least = Infinity;
        for (const i of idxs) if (cands[i].incoming[j] < least) least = cands[i].incoming[j];
        if (!(foeProfiles[j].arrive > 1)) dmg += foeProfiles[j].size * least;
        else if (foeProfiles[j].arrive <= ticks) dmgLate += foeProfiles[j].size * least;
      }
      let cheapest = Infinity;
      for (const i of idxs) if (cands[i].wbits < cheapest) cheapest = cands[i].wbits;
      /* every stack can shrug off a fraction of a troop each tick it is hit */
      const need = dmgLate ? Math.max(1, Math.floor(dmg) + Math.floor(dmgLate) - 2 * idxs.length + o.minSurvivors)
                           : Math.max(1, Math.floor(dmg) - idxs.length + o.minSurvivors);
      lb = Math.max(lb, need * cheapest);
    }
    return lb;
  };

  const pick = (a, b) => opts.objective === "upfront" ? a
                       : opts.objective === "losses" ? b : a + b;
  const metricOf = (sizes, subset, res) => {
    let up = 0, burn = 0, wup = 0, wburn = 0;
    for (let i = 0; i < sizes.length; i++){
      up  += sizes[i] * subset[i].bits;
      wup += sizes[i] * subset[i].wbits;
      if (res && res.ownLost){
        burn  += res.ownLost[i] * subset[i].bits;
        wburn += res.ownLost[i] * subset[i].wbits;
      }
    }
    /* m is what the force is quoted at, score is what it is ranked on */
    return {up, burn, wup, m: pick(up, burn), score: pick(wup, wburn)};
  };

  const scored = [];
  const seenSub = new Set();
  let bestMetric = Infinity, skipped = 0, considered = 0;

  /* Size one subset. A subset whose floor already beats the best answer is
     never sized, but the beam still keeps it as a node to grow from — its
     supersets have lower floors still. */
  const scoreOne = idxs => {
    const key = idxs.join(",");
    if (seenSub.has(key)) return null;
    seenSub.add(key);
    considered++;
    const lb = lowerBound(idxs);
    /* the floor is on what the force costs to field. Ranking on that alone, or
       on it plus what burns, can never come out under the floor — so a subset
       whose floor is already past the best answer is not worth sizing. Ranking
       on losses alone is the exception: nothing here bounds those. */
    if (opts.objective !== "losses" && lb >= bestMetric * (opts.slack || 1)){
      skipped++;
      return {idxs, rank: lb};
    }
    const subset = idxs.map(i => cands[i]);
    const q = quickOptimize(subset, foeProfiles, o);
    /* no answer here, but one more stack may be all it lacks — keep it to
       grow from, behind every subset that did size */
    if (!q) return {idxs, rank: Infinity, lb};
    const met = metricOf(q.sizes, subset, q.sv.result(q.sizes));
    if (met.score < bestMetric) bestMetric = met.score;
    const entry = {idxs, subset, sizes: q.sizes, met, rank: met.score};
    scored.push(entry);
    return entry;
  };

  const scanUntil = Date.now() + (opts.scanMs || opts.budgetMs || 30000);

  if (exhaustive){
    const combos = [];
    const rec = (start, chosen) => {
      if (chosen.length) combos.push(chosen.slice());
      if (chosen.length === K) return;
      for (let i = start; i < cands.length; i++){ chosen.push(i); rec(i + 1, chosen); chosen.pop(); }
    };
    rec(0, []);
    for (let n = 0; n < combos.length; n++){
      scoreOne(combos[n]);
      if ((n & 7) === 0){
        yield {phase:1, done:false, at:n, of:combos.length};
        if (Date.now() > scanUntil) break;   /* out of time — refine what we have */
      }
    }
  } else {
    const width = Math.max(6, opts.beam || 20);
    let frontier = [], flat = 0;
    for (let i = 0; i < cands.length; i++){
      const e = scoreOne([i]);
      if (e) frontier.push(e);
      if ((i & 3) === 0) yield {phase:1, done:false, at:i / Math.max(1, cands.length), of:K, level:1, K, tried:considered};
    }
    frontier.sort(byRank);
    frontier = frontier.slice(0, width);

    for (let level = 2; level <= K && frontier.length; level++){
      const before = bestMetric;
      const next = [];
      const of = Math.max(1, frontier.length * cands.length);
      let step = 0, ranOut = false;
      for (const node of frontier){
        const last = node.idxs[node.idxs.length - 1];
        for (let i = last + 1; i < cands.length; i++){
          const e = scoreOne(node.idxs.concat(i));
          if (e) next.push(e);
          if ((++step & 3) === 0){
            yield {phase:1, done:false, at: level - 1 + step / of, of:K, level, K, tried:considered};
            if (Date.now() > scanUntil){ ranOut = true; break; }
          }
        }
        if (ranOut) break;
      }
      if (!next.length || ranOut) break;
      next.sort(byRank);
      frontier = next.slice(0, width);
      /* another stack has to earn its place; two flat rounds and we stop */
      flat = bestMetric === Infinity || bestMetric < before * 0.995 ? 0 : flat + 1;
      if (flat >= 2) break;
    }
  }
  if (!scored.length){ yield {done:true, error:noSolution(considered, o)}; return; }

  scored.sort((a, b) => a.met.score - b.met.score);
  const shortlist = scored.slice(0, opts.refine || 60);

  const finals = [];
  /* hardOptimize walks a grid per stack, so the grid thins as stacks pile up */
  const gridN = Math.max(10, Math.round((opts.gridN || 40) * 4 / Math.max(4, K)));
  const deadline = opts.budgetMs ? Date.now() + opts.budgetMs : Infinity;
  let refined = 0;
  for (let n = 0; n < shortlist.length; n++){
    const s = shortlist[n];
    const h = Date.now() < deadline
      ? (refined++, yield* hardOptimize(s.subset, foeProfiles, o, s.idxs.map(i => solos[i]), gridN, s.sizes))
      : null;
    const use = h && h.cost <= s.met.wup ? h : null;
    const sizes = use ? use.sizes : s.sizes;
    const sv = use ? use.sv : makeSolver(s.subset, foeProfiles, o);
    const res = sv.result(sizes);
    finals.push({subset: s.subset, sizes, met: metricOf(sizes, s.subset, res), res});
    yield {phase:2, done:false, at:n, of:shortlist.length};
  }

  const liveCount = f => f.sizes.filter(s => s > 0).length;
  finals.sort((a, b) => a.met.score - b.met.score || liveCount(a) - liveCount(b) || a.met.wup - b.met.wup);

  const seen = new Set(), out = [];
  for (const f of finals){
    const live = [];
    f.sizes.forEach((s, i) => { if (s > 0) live.push({c: f.subset[i], size: s,
      lost: f.res.ownLost ? f.res.ownLost[i] : null}); });
    if (!live.length) continue;
    const key = live.map(l => `${l.c.type}|${l.c.weapon}|${l.c.armor}|${l.size}`).sort().join(";");
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({live, upfront: f.met.up, burned: f.met.burn, metric: f.met.m, score: f.met.score,
              wipes: f.res.wipe, left: f.res.ownLeft,
              ticks: f.res.ticksUsed || 1, tickLog: f.res.perTick || null,
              troops: live.reduce((s, l) => s + l.size, 0)});
  }
  yield {done:true, results: out.slice(0, 10), candCount: cands.length,
         comboCount: considered, beam: !exhaustive, maxStacks: K,
         skipped, refined, shortlisted: shortlist.length};
}


/* ================= deep search =================
   The classic search seeds each subset with one stack per job and grows the
   whole force by a fixed factor until it works. Under an upkeep budget that
   breaks down: the seed piles everything onto the cheapest stack, that stack
   hits its resource's ceiling first, and the growth can never shift the load
   onto stacks that eat something else — so a force that fits comfortably
   gets reported as impossible.
   This one comes at it from every direction instead. A direction is a mix of
   the subset's stacks; along it the force is scaled up until it does the job
   (or the budget stops it), then bisected back down to the least that still
   works. Many mixes — every stack on its own, the budget filled to the brim,
   even spreads, random ones — so the shape of the answer is searched, not
   assumed. The best few are polished by the same local search the classic
   one uses, then kicked about and re-polished to get out of local minima. */

/* small seeded generator, so the same battle searches the same way twice */
function mulberry32(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Loadouts of different types eat different upkeep, so with a budget on one
   type cannot always stand in for another however much better it looks on
   paper. The classic shortlist is kept whole, and each type's own best few
   ride along beside it — compared only against loadouts of their own type —
   so a resource the budget leaves room for always has something to spend it on. */
function pruneCandsDeep(cands, useIncoming, usePerHit, maxKeep, budgetOn, perType = 5){
  const keep = pruneCands(cands, useIncoming, usePerHit, maxKeep);
  if (!budgetOn) return keep;
  const have = new Set(keep), byType = {};
  cands.forEach(c => (byType[c.type] ??= []).push(c));
  for (const g of Object.values(byType))
    for (const c of pruneCands(g, useIncoming, usePerHit, perType)) if (!have.has(c)){ have.add(c); keep.push(c); }
  return keep.sort((a, b) => a.wbits - b.wbits);
}

/* the scaling machinery for one subset, on top of a classic solver */
function deepSizer(subset, foeProfiles, o){
  const sv = makeSolver(subset, foeProfiles, o);
  const K = subset.length, T = Math.max(1, o.ticks || 1);
  const caps = capsFor(subset, o);

  /* where along a direction to start looking: the fewest troops that could
     possibly land enough hits, or be left standing. Enemy reinforcements can
     only be hit from the second tick on, so their share of the hits has to
     fit in one tick fewer. */
  let lam0 = o.goal === "wipe" ? 1 : o.minSurvivors;
  if (o.goal !== "survive"){
    let hits = 0, late = 0;
    for (let j = 0; j < foeProfiles.length; j++){
      let best = 0;
      for (let i = 0; i < K; i++) best = Math.max(best, subset[i].perHit[j] || 0);
      if (best > 0){
        hits += foeProfiles[j].size / best;
        if (foeProfiles[j].arrive > 1) late += foeProfiles[j].size / best;
      }
    }
    lam0 = Math.max(lam0, hits / T);
    if (late && T > 1) lam0 = Math.max(lam0, late / (T - 1));
  }

  /* the furthest a direction (summing to 1) can be scaled before the first
     tick's upkeep, or the equipment stock, breaks a limit */
  const lamMax = dir => {
    let m = SOLVE_STACK_CAP;
    for (const cap of caps){
      let use = 0;
      for (let i = 0; i < K; i++) use += dir[i] * cap.use[i];
      if (use > 0) m = Math.min(m, cap.lim / use);
    }
    return m;
  };
  const at = (dir, lam) => dir.map(d => Math.floor(d * lam + 1e-9));

  /* scale up along dir until it works, bisect back to the least that does,
     then shave each stack on its own */
  function probe(raw){
    let s = 0;
    for (const v of raw) s += Math.max(0, v);
    if (!(s > 0)) return null;
    const dir = raw.map(v => Math.max(0, v) / s);
    const top = lamMax(dir);
    if (!(top >= 1)) return null;
    let lo = 0, lam = Math.min(top, Math.max(1, lam0));
    while (!sv.feasible(at(dir, lam))){
      if (lam >= top) return null;
      lo = lam;
      lam = Math.min(top, lam * 2);
    }
    let hi = lam;
    while (hi - lo > Math.max(1, hi * 1e-4)){
      const mid = (lo + hi) / 2;
      if (sv.feasible(at(dir, mid))) hi = mid; else lo = mid;
    }
    const sizes = at(dir, hi);
    const order = sizes.map((v, i) => i).sort((a, b) => sizes[b] * sv.bitsArr[b] - sizes[a] * sv.bitsArr[a]);
    for (const i of order) if (sizes[i]) sv.tighten(sizes, i);
    return sv.feasible(sizes) ? sizes : null;
  }

  /* the directions every subset is tried along: each stack alone, the
     budget filled to the brim, an even spread of troops and of bits */
  function baseDirs(){
    const dirs = [];
    for (let i = 0; i < K; i++) dirs.push(subset.map((c, k) => k === i ? 1 : 0));
    if (K > 1){
      dirs.push(subset.map(() => 1));
      dirs.push(subset.map(c => 1 / c.wbits));
      if (caps.length){
        /* every limited resource split evenly between the stacks that eat
           it; a stack that eats none of them gets the average */
        const fill = new Array(K).fill(0);
        for (const cap of caps){
          const users = [];
          for (let i = 0; i < K; i++) if (cap.use[i]) users.push(i);
          for (const i of users) fill[i] += cap.lim / users.length / cap.use[i];
        }
        const used = fill.filter(v => v > 0);
        const avg = used.length ? used.reduce((a, b) => a + b, 0) / used.length : 1;
        dirs.push(fill.map(v => v > 0 ? v : avg));
      }
    }
    return dirs;
  }

  /* a random mix, often with a stack or two left out entirely */
  function randomDir(rng){
    const d = subset.map(() => -Math.log(1 - rng()) / subset[0].wbits);
    for (let i = 0; i < K; i++) d[i] *= subset[0].wbits / subset[i].wbits * (0.25 + 1.5 * rng());
    if (K > 1 && rng() < 0.4) d[Math.floor(rng() * K)] = 0;
    return d;
  }

  return {sv, K, probe, baseDirs, randomDir, lamMax};
}

function* deepSolveGen(opts, foeRows, bonusOwn, bonusFoe){
  const foeProfiles = foeRows.map(solProfile);
  const ticks = Math.max(1, opts.ticks || 1);
  const o = {
    goal: opts.goal, minSurvivors: Math.max(1, opts.minSurvivors || 1),
    bonusOwn, bonusFoe, ticks, budget: opts.budget || {}, stock: opts.stock || {},
    wantLosses: ticks > 1 || opts.goal !== "wipe" || opts.objective !== "upfront"
  };
  const needKill = o.goal !== "survive";
  const rng = mulberry32(0x5eed);

  let cands = buildCandidates(Object.assign({}, opts, {goal:o.goal}), foeProfiles, bonusOwn, bonusFoe);
  if (!cands.length){ yield {done:true, error:noLoadouts(o)}; return; }
  /* over several ticks killing them is how you live through it, so even a
     pure survival run keeps the loadouts that hit hard */
  cands = pruneCandsDeep(cands, o.wantLosses, needKill || ticks > 1, opts.maxCandidates || 32, limitsOn(o));

  if (needKill && foeProfiles.some((f, j) => !cands.some(c => c.perHit[j] > 0))){
    yield {done:true, error:"Some enemy stacks take zero damage from every allowed loadout, so they cannot be killed."};
    return;
  }

  const K = Math.min(opts.maxStacks, cands.length);

  const killRate = cands.map(c => foeProfiles.map((f, j) => c.perHit[j] > 0 ? c.wbits / c.perHit[j] : Infinity));
  const lowerBound = idxs => {
    let lb = 0;
    if (needKill){
      let late = 0;
      for (let j = 0; j < foeProfiles.length; j++){
        let best = Infinity;
        for (const i of idxs) if (killRate[i][j] < best) best = killRate[i][j];
        if (best === Infinity) return Infinity;
        lb += foeProfiles[j].size * best / ticks;
        if (foeProfiles[j].arrive > 1) late += foeProfiles[j].size * best;
      }
      if (late) lb = ticks > 1 ? Math.max(lb, late / (ticks - 1)) : Infinity;
    }
    if (o.goal !== "wipe"){
      let dmg = 0, dmgLate = 0;
      for (let j = 0; j < foeProfiles.length; j++){
        let least = Infinity;
        for (const i of idxs) if (cands[i].incoming[j] < least) least = cands[i].incoming[j];
        if (!(foeProfiles[j].arrive > 1)) dmg += foeProfiles[j].size * least;
        else if (foeProfiles[j].arrive <= ticks) dmgLate += foeProfiles[j].size * least;
      }
      let cheapest = Infinity;
      for (const i of idxs) if (cands[i].wbits < cheapest) cheapest = cands[i].wbits;
      const need = dmgLate ? Math.max(1, Math.floor(dmg) + Math.floor(dmgLate) - 2 * idxs.length + o.minSurvivors)
                           : Math.max(1, Math.floor(dmg) - idxs.length + o.minSurvivors);
      lb = Math.max(lb, need * cheapest);
    }
    return lb;
  };

  const pick = (a, b) => opts.objective === "upfront" ? a : opts.objective === "losses" ? b : a + b;
  const metricOf = (sizes, subset, res) => {
    let up = 0, burn = 0, wup = 0, wburn = 0;
    for (let i = 0; i < sizes.length; i++){
      up  += sizes[i] * subset[i].bits;
      wup += sizes[i] * subset[i].wbits;
      if (res && res.ownLost){
        burn  += res.ownLost[i] * subset[i].bits;
        wburn += res.ownLost[i] * subset[i].wbits;
      }
    }
    return {up, burn, wup, m: pick(up, burn), score: pick(wup, wburn)};
  };
  /* ranking up front needs no battle; anything counting losses does */
  const scoreOf = (sv, subset, sizes) =>
    opts.objective === "upfront" ? sv.cost(sizes) : metricOf(sizes, subset, sv.result(sizes)).score;

  /* ---- phase 1: every subset along its base directions ---- */
  const scored = [], seenSub = new Set();
  let bestMetric = Infinity, skipped = 0, considered = 0;

  const scoreOne = idxs => {
    const key = idxs.join(",");
    if (seenSub.has(key)) return null;
    seenSub.add(key);
    considered++;
    const lb = lowerBound(idxs);
    if (opts.objective !== "losses" && lb >= bestMetric * (opts.slack || 1)){
      skipped++;
      return {idxs, rank: lb};
    }
    const subset = idxs.map(i => cands[i]);
    const dz = deepSizer(subset, foeProfiles, o);
    let best = null, bestScore = Infinity;
    for (const d of dz.baseDirs()){
      const s = dz.probe(d);
      if (!s) continue;
      const sc = scoreOf(dz.sv, subset, s);
      if (sc < bestScore){ bestScore = sc; best = s; }
    }
    /* and the classic sizing beside them: where there is no budget to trip
       over it is often the better shape, and it keeps the ranking honest */
    const q = quickOptimize(subset, foeProfiles, o);
    if (q){
      const sc = scoreOf(q.sv, subset, q.sizes);
      if (sc < bestScore){ bestScore = sc; best = q.sizes; }
    }
    if (!best) return {idxs, rank: Infinity, lb};
    if (bestScore < bestMetric) bestMetric = bestScore;
    const entry = {idxs, subset, sizes: best, rank: bestScore};
    scored.push(entry);
    return entry;
  };

  const subsetCount = (n, k) => {
    let tot = 0, c = 1;
    for (let i = 1; i <= k; i++){
      c = c * (n - i + 1) / i;
      tot += c;
      if (tot > EXHAUSTIVE_COMBO_CAP) return Infinity;
    }
    return tot;
  };
  const exhaustive = subsetCount(cands.length, K) <= EXHAUSTIVE_COMBO_CAP;
  const scanUntil = Date.now() + (opts.scanMs || 30000);
  const label1 = "Sweeping every mix along its base directions";

  if (exhaustive){
    const combos = [];
    const rec = (start, chosen) => {
      if (chosen.length) combos.push(chosen.slice());
      if (chosen.length === K) return;
      for (let i = start; i < cands.length; i++){ chosen.push(i); rec(i + 1, chosen); chosen.pop(); }
    };
    rec(0, []);
    /* most promising first, so running out of time cuts the long tail */
    const lbs = new Map(combos.map(c => [c, lowerBound(c)]));
    combos.sort((a, b) => lbs.get(a) - lbs.get(b) || a.length - b.length);
    for (let n = 0; n < combos.length; n++){
      scoreOne(combos[n]);
      if ((n & 3) === 0){
        yield {phase:1, done:false, at:n, of:combos.length,
               msg:`${label1} — ${n.toLocaleString("en-US")} of ${combos.length.toLocaleString("en-US")}`};
        if (Date.now() > scanUntil) break;
      }
    }
  } else {
    const width = Math.max(6, opts.beam || 20);
    let frontier = [], flat = 0;
    for (let i = 0; i < cands.length; i++){
      const e = scoreOne([i]);
      if (e) frontier.push(e);
      yield {phase:1, done:false, at:i / Math.max(1, cands.length), of:K,
             msg:`${label1} — 1 of ${K} stacks · ${considered.toLocaleString("en-US")} tried`};
    }
    frontier.sort(byRank);
    frontier = frontier.slice(0, width);
    for (let level = 2; level <= K && frontier.length; level++){
      const before = bestMetric, next = [];
      const of = Math.max(1, frontier.length * cands.length);
      let step = 0, ranOut = false;
      for (const node of frontier){
        for (let i = 0; i < cands.length; i++){
          if (node.idxs.includes(i)) continue;
          const e = scoreOne(node.idxs.concat(i).sort((a, b) => a - b));
          if (e) next.push(e);
          if ((++step & 3) === 0){
            yield {phase:1, done:false, at: level - 1 + step / of, of:K,
                   msg:`${label1} — up to ${level} of ${K} stacks · ${considered.toLocaleString("en-US")} tried`};
            if (Date.now() > scanUntil){ ranOut = true; break; }
          }
        }
        if (ranOut) break;
      }
      if (!next.length || ranOut) break;
      next.sort(byRank);
      frontier = next.slice(0, width);
      flat = bestMetric === Infinity || bestMetric < before * 0.995 ? 0 : flat + 1;
      if (flat >= 2) break;
    }
  }

  const found = scored.filter(s => s.sizes);
  if (!found.length){ yield {done:true, error:noSolution(considered, o)}; return; }
  found.sort((a, b) => a.rank - b.rank);
  const shortlist = found.slice(0, opts.refine || 30);

  /* ---- phase 2: the shortlist from every direction, polished ---- */
  const deadline = Date.now() + (opts.budgetMs || 30000);
  const finals = [];
  let refined = 0;
  for (let n = 0; n < shortlist.length; n++){
    const s = shortlist[n];
    const msg = `Searching the shortlist from every angle — ${n + 1} of ${shortlist.length}`;
    let best = s.sizes, bestScore = s.rank, dz = null;
    if (Date.now() < deadline){
      refined++;
      dz = deepSizer(s.subset, foeProfiles, o);
      const sv = dz.sv;
      const consider = sizes => {
        if (!sizes || !sv.feasible(sizes)) return false;
        const sc = scoreOf(sv, s.subset, sizes);
        if (sc < bestScore - 1e-9){ bestScore = sc; best = sizes.slice(); return true; }
        return false;
      };
      /* many more directions than the scan could afford */
      const pts = [];
      const nd = (opts.dirs || 48) + 8 * s.subset.length;
      for (let d = 0; d < nd && Date.now() < deadline; d++){
        const p = dz.probe(dz.randomDir(rng));
        if (p){ pts.push({p, c: sv.cost(p)}); consider(p); }
        if ((d & 3) === 0) yield {phase:2, done:false, at:n, of:shortlist.length, msg};
      }
      /* the classic sizing as one more starting point, so this never does worse on a subset */
      const q = quickOptimize(s.subset, foeProfiles, o);
      if (q) consider(q.sizes);
      yield {phase:2, done:false, at:n, of:shortlist.length, msg};

      /* polish the best few starting points */
      pts.push({p: best.slice(), c: sv.cost(best)});
      pts.sort((a, b) => a.c - b.c);
      for (const {p} of pts.slice(0, 3)){
        if (Date.now() > deadline) break;
        consider(sv.localMin(p, -1));
        yield {phase:2, done:false, at:n, of:shortlist.length, msg};
      }

      /* then kick it about: shift troops from one stack onto another, or
         shake the whole mix and scale it back to working, and re-polish */
      const K2 = s.subset.length;
      for (let r = 0; r < (opts.kicks || 30) && Date.now() < deadline; r++){
        let trial;
        if (K2 > 1 && rng() < 0.6){
          const live = best.map((v, i) => i).filter(i => best[i] > 0);
          const i = live[Math.floor(rng() * live.length)];
          let j = Math.floor(rng() * (K2 - 1)); if (j >= i) j++;
          const f = [0.1, 0.25, 0.5, 1][Math.floor(rng() * 4)];
          trial = best.slice();
          const moved = Math.ceil(trial[i] * f);
          trial[i] -= moved;
          trial[j] += Math.max(1, Math.round(moved * s.subset[i].wbits / s.subset[j].wbits));
          trial = dz.probe(trial);
        } else {
          trial = dz.probe(best.map(v => (v + 1) * (0.5 + rng())));
        }
        if (trial){
          const polished = sv.localMin(trial, -1);
          consider(polished || trial);
        }
        yield {phase:2, done:false, at:n, of:shortlist.length, msg};
      }

      /* last, the classic search's own grid walk from the best found, so a
         subset never comes out worse here than it would there */
      if (Date.now() < deadline){
        const h = yield* hardOptimize(s.subset, foeProfiles, o, null, opts.gridN || 40, best);
        if (h) consider(h.sizes);
      }
    }
    const sv = dz ? dz.sv : makeSolver(s.subset, foeProfiles, o);
    const res = sv.result(best);
    finals.push({subset: s.subset, sizes: best, met: metricOf(best, s.subset, res), res});
  }

  const liveCount = f => f.sizes.filter(s => s > 0).length;
  finals.sort((a, b) => a.met.score - b.met.score || liveCount(a) - liveCount(b) || a.met.wup - b.met.wup);

  const seen = new Set(), out = [];
  for (const f of finals){
    const live = [];
    f.sizes.forEach((s, i) => { if (s > 0) live.push({c: f.subset[i], size: s,
      lost: f.res.ownLost ? f.res.ownLost[i] : null}); });
    if (!live.length) continue;
    const key = live.map(l => `${l.c.type}|${l.c.weapon}|${l.c.armor}|${l.size}`).sort().join(";");
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({live, upfront: f.met.up, burned: f.met.burn, metric: f.met.m, score: f.met.score,
              wipes: f.res.wipe, left: f.res.ownLeft,
              ticks: f.res.ticksUsed || 1, tickLog: f.res.perTick || null,
              troops: live.reduce((s, l) => s + l.size, 0)});
  }
  yield {done:true, results: out.slice(0, 10), candCount: cands.length,
         comboCount: considered, beam: !exhaustive, maxStacks: K,
         skipped, refined, shortlisted: shortlist.length, deep: true};
}

/* ================= cross-entropy search =================
   Deep sweeps every subset in the order of a bound that only counts hits, and
   to get through them at all it first cuts the loadouts down to a few dozen.
   Against a mixed enemy that cut throws away the loadouts that win — a cheap
   weapon whose only job is to make one stack shoot one enemy type first — and
   on a goal that counts losses the bound sends the sweep the wrong way.
   This search never cuts and never sweeps. It keeps a weight on every loadout
   worth having, draws whole mixes in proportion to the weights, sizes each one
   along the base directions, and moves the weights towards the loadouts the
   best few draws actually fielded. After a few rounds the draws keep landing
   in the same corner; once the best stops improving the weights are wiped and
   it goes looking somewhere else, keeping everything it has sized so far.
   Then the mixes it liked are polished in rounds, each round on a third as
   many as the last with more care each, so the time goes where the money is
   instead of the same amount to the 40th mix as to the 1st. */

/* the dominance pruneCands uses, plus one more test under a limit: a loadout
   only stands in for another if it eats no more of anything that is limited */
function ceLoadouts(cands, o, usePerHit){
  const caps = capsFor(cands, o);
  const at = new Map(cands.map((c, i) => [c, i]));
  const keep = [];
  for (const c of cands.slice().sort((a, b) => a.wbits - b.wbits)){
    const ci = at.get(c);
    let dominated = false;
    for (const k of keep){
      if (k.wbits > c.wbits) continue;
      let ok = true;
      if (usePerHit)
        for (let j = 0; j < c.perHit.length && ok; j++) if (k.perHit[j] < c.perHit[j]) ok = false;
      if (ok && o.wantLosses)
        for (let j = 0; j < c.incoming.length && ok; j++) if (k.incoming[j] > c.incoming[j]) ok = false;
      if (ok){
        const ki = at.get(k);
        for (const cap of caps) if (cap.use[ki] > cap.use[ci]){ ok = false; break; }
      }
      if (ok){ dominated = true; break; }
    }
    if (!dominated) keep.push(c);
  }
  return keep;
}

/* The exact cheapest sizes for one small mix. Adding troops never turns a win
   into a loss, so every army below one that fails fails too, and every army
   above one that works works. That lets the search keep a set of corners
   below which nothing has been ruled out: it takes the cheapest corner, walks
   a ray from it until the fight is won, shaves the winning end into a new
   best, and cuts away the box under the losing end, which splits every corner
   in that box into one new corner per stack. When the cheapest corner left
   costs as much as the best army in hand, nothing cheaper exists. It is only
   fast for three stacks or fewer, and only right when the cost is the sizes
   times the prices, which means upfront. Under a limit the rays run on the
   fight alone (sv), every corner already past a limit is dropped, since all
   above it is past it too, and only armies the full check (judge) passes can
   become the best in hand. */
function* cePolyblock(sv, judge, caps, start, until, eps){
  const K = sv.K, c = sv.bitsArr;
  const cost = x => { let s = 0; for (let i = 0; i < K; i++) s += x[i] * c[i]; return s; };
  let inc = cost(start), incX = start.slice();
  const U = c.map(ci => Math.ceil(inc / ci));
  let V = [new Array(K).fill(0)], proved = false;
  while (V.length && Date.now() < until && V.length < 20000){
    let bi = 0, bc = Infinity;
    for (let k = 0; k < V.length; k++){ const v = cost(V[k]); if (v < bc){ bc = v; bi = k; } }
    if (bc >= inc * (1 - eps)){ proved = true; break; }
    const v = V[bi];
    if (sv.feasible(v)){
      if (judge.feasible(v)){ if (bc < inc){ inc = bc; incX = v.slice(); } proved = true; break; }
      V.splice(bi, 1);
      continue;
    }
    const d = U.map((u, i) => u - v[i]);
    const at = t => v.map((vi, i) => Math.min(U[i], vi + Math.floor(d[i] * t + 1e-9)));
    let lo = 0, hi = 1, zlo;
    if (!sv.feasible(at(hi))) zlo = at(hi);
    else {
      for (;;){
        const mid = (lo + hi) / 2;
        if (sv.feasible(at(mid))) hi = mid; else lo = mid;
        const a = at(lo), b = at(hi);
        let close = true;
        for (let i = 0; i < K; i++) if (b[i] - a[i] > 1){ close = false; break; }
        if (close || hi - lo < 1e-9) break;
      }
      zlo = at(lo);
      const x = at(hi);
      for (let i = 0; i < K; i++) if (x[i]) sv.tighten(x, i);
      if (cost(x) < inc && judge.feasible(x)){ inc = cost(x); incX = x.slice(); }
      if (sv.feasible(zlo)) zlo = v.slice();
    }
    /* every corner under the losing end is replaced by its children */
    const keep = [], kids = [];
    for (const s of V){
      let below = true;
      for (let i = 0; i < K; i++) if (s[i] > zlo[i]){ below = false; break; }
      if (!below){ keep.push(s); continue; }
      for (let i = 0; i < K; i++){
        const ch = s.slice();
        ch[i] = zlo[i] + 1;
        if (ch[i] <= U[i] && cost(ch) < inc * (1 - eps) && !(caps.length && overCaps(caps, ch))) kids.push(ch);
      }
    }
    const nKeep = keep.length;
    for (const x of kids){
      let covered = false;
      for (let b = 0; b < keep.length && !covered; b++){
        const y = keep[b];
        let ge = true;
        for (let i = 0; i < K; i++) if (x[i] < y[i]){ ge = false; break; }
        covered = ge;
      }
      if (covered) continue;
      for (let b = keep.length - 1; b >= nKeep; b--){
        const y = keep[b];
        let ge = true;
        for (let i = 0; i < K; i++) if (y[i] < x[i]){ ge = false; break; }
        if (ge) keep.splice(b, 1);
      }
      keep.push(x);
    }
    V = keep.filter(x => cost(x) < inc * (1 - eps));
    if (!V.length) proved = true;
    yield null;
  }
  return {sizes: incX, cost: inc, proved};
}

function* ceSolveGen(opts, foeRows, bonusOwn, bonusFoe){
  const foeProfiles = foeRows.map(solProfile);
  const ticks = Math.max(1, opts.ticks || 1);
  const o = {
    goal: opts.goal, minSurvivors: Math.max(1, opts.minSurvivors || 1),
    bonusOwn, bonusFoe, ticks, budget: opts.budget || {}, stock: opts.stock || {},
    wantLosses: ticks > 1 || opts.goal !== "wipe" || opts.objective !== "upfront"
  };
  const needKill = o.goal !== "survive";
  const capsOn = limitsOn(o);
  const upfront = opts.objective === "upfront";
  const rng = mulberry32(0xce5eed);

  /* the clock: the first allowance learns which mixes are worth having, the
     second polishes them, and the answer is handed back with a little to spare */
  const t0 = Date.now();
  const scanMs = Math.max(200, opts.scanMs || 30000), budgetMs = Math.max(200, opts.budgetMs || 30000);
  const scanEnd = t0 + scanMs;
  const stopAt = t0 + scanMs + budgetMs - Math.min(500, 0.02 * (scanMs + budgetMs));
  let lastNote = Date.now();
  const due = () => Date.now() - lastNote >= 25;
  const note = (phase, at, of, msg) => { lastNote = Date.now(); return {phase, done:false, at, of, msg}; };

  let all = buildCandidates(Object.assign({}, opts, {goal:o.goal}), foeProfiles, bonusOwn, bonusFoe);
  if (opts.side === "attacker") all = all.filter(c => c.type !== "Alicorns");
  if (!all.length){ yield {done:true, error:noLoadouts(o)}; return; }
  /* over several ticks killing them is how you live through it, so even a
     pure survival run keeps the loadouts that hit hard */
  const pool = ceLoadouts(all, o, needKill || ticks > 1);
  if (needKill && foeProfiles.some((f, j) => !pool.some(c => c.perHit[j] > 0))){
    yield {done:true, error:"Some enemy stacks take zero damage from every allowed loadout, so they cannot be killed."};
    return;
  }
  const n = pool.length, K = Math.min(opts.maxStacks, n);

  const pick = (a, b) => upfront ? a : opts.objective === "losses" ? b : a + b;
  const metricOf = (sizes, subset, res) => {
    let up = 0, burn = 0, wup = 0, wburn = 0;
    for (let i = 0; i < sizes.length; i++){
      up  += sizes[i] * subset[i].bits;
      wup += sizes[i] * subset[i].wbits;
      if (res && res.ownLost){
        burn  += res.ownLost[i] * subset[i].bits;
        wburn += res.ownLost[i] * subset[i].wbits;
      }
    }
    return {up, burn, wup, m: pick(up, burn), score: pick(wup, wburn)};
  };
  /* ranking up front needs no battle; anything counting losses does */
  const scoreOf = (sv, subset, sizes) =>
    upfront ? sv.cost(sizes) : metricOf(sizes, subset, sv.result(sizes)).score;

  /* the hits a mix needs at the very least, priced at its cheapest killer of
     each enemy stack — the floor Deep sorts by, used here only to skip mixes
     that cannot beat what is already in hand */
  const killRate = pool.map(c => foeProfiles.map((f, j) => c.perHit[j] > 0 ? c.wbits / c.perHit[j] : Infinity));
  const lowerBound = idxs => {
    if (!needKill) return 0;
    let lb = 0;
    for (let j = 0; j < foeProfiles.length; j++){
      let best = Infinity;
      for (const i of idxs) if (killRate[i][j] < best) best = killRate[i][j];
      if (best === Infinity) return Infinity;
      lb += foeProfiles[j].size * best / ticks;
    }
    return lb;
  };

  /* ---- phase 1: learn which loadouts belong together ---- */
  /* every mix that could be sized, and the eight best of them */
  const archive = [], seen = new Set(), archiveAt = new Map(), leaders = [];
  let considered = 0, bestRank = Infinity;
  const evalSubset = idxs => {
    const key = idxs.join(",");
    if (seen.has(key)) return archiveAt.has(key) ? archive[archiveAt.get(key)] : null;
    seen.add(key);
    considered++;
    if (upfront && lowerBound(idxs) >= bestRank) return null;
    const subset = idxs.map(i => pool[i]);
    const dz = deepSizer(subset, foeProfiles, o);
    let best = null, bestScore = Infinity;
    for (const d of dz.baseDirs()){
      const s = dz.probe(d);
      if (!s) continue;
      const sc = scoreOf(dz.sv, subset, s);
      if (sc < bestScore){ bestScore = sc; best = s; }
    }
    /* under a limit the cheapest mix hugs the edge of it, where no base
       direction points, so the classic sizing has to rank it */
    if (capsOn){
      const q = quickOptimize(subset, foeProfiles, o);
      if (q){
        const sc = scoreOf(q.sv, subset, q.sizes);
        if (sc < bestScore){ bestScore = sc; best = q.sizes; }
      }
    }
    if (!best) return null;
    /* when losses count, where a base direction lands says little about what
       the mix can really do, so every mix is walked down to its local best
       before it is ranked; up front the ranking holds well enough without,
       and sizing five times as many mixes is worth more */
    if (!upfront){
      const lm = dz.sv.localMin(best, -1);
      if (lm){
        const sc = scoreOf(dz.sv, subset, lm);
        if (sc < bestScore){ bestScore = sc; best = lm; }
      }
    }
    if (bestScore < bestRank) bestRank = bestScore;
    const e = {idxs, subset, sizes: best, rank: bestScore, settled: !upfront};
    archiveAt.set(key, archive.length);
    archive.push(e);
    if (leaders.length < 8 || bestScore < leaders[leaders.length - 1].rank){
      let k = Math.min(leaders.length, 7);
      if (leaders.length < 8) leaders.push(e);
      while (k > 0 && leaders[k - 1].rank > bestScore){ leaders[k] = leaders[k - 1]; k--; }
      leaders[k] = e;
    }
    return e;
  };
  const liveOf = (idxs, sizes) => idxs.filter((v, k) => sizes[k] > 0);

  /* how many mixes there are in all, and whether that is few enough to just
     size every one of them */
  const totalMixes = (() => {
    let tot = 0, c = 1;
    for (let i = 1; i <= K; i++){ c = c * (n - i + 1) / i; tot += c; }
    return tot;
  })();
  const SWEEP_CAP = 150000;

  /* a round draws three mixes per loadout; the best tenth of them teach the
     weights, which move most of the way there each round but never quite
     to nothing */
  const N = Math.max(40, Math.min(400, 3 * n));
  const rho = 0.1, alpha = 0.7, floor = 0.05 / n;
  let p = new Float64Array(n).fill(1 / n);
  /* With up to four stacks allowed every draw fills them all. With more, a
     draw of twenty loadouts is mostly passengers that blur the ranking, so
     fresh draws stay at four and wider mixes are grown one stack at a time
     from the best ones (see neighbour below). */
  const kDraw = Math.min(K, 4);
  let round = 0, stall = 0, bestEver = Infinity, sweep = false;
  const draw = () => {
    const w = Array.from(p), out = [];
    for (let k = 0; k < kDraw; k++){
      let tot = 0;
      for (let i = 0; i < n; i++) tot += w[i];
      let r = rng() * tot, i = 0;
      for (; i < n - 1; i++){ r -= w[i]; if (r <= 0 && w[i] > 0) break; }
      while (!(w[i] > 0) && i > 0) i--;
      out.push(i);
      w[i] = 0;
    }
    return out.sort((a, b) => a - b);
  };
  /* A draw the weights alone would rarely make: one of the best mixes so far
     with one stack swapped for another, picked half by the weights and half
     at random. The weights learn which loadouts are good, not which go
     together, and a winning trio can sit one swap away from a runner-up long
     before the weights find all three. With more than four stacks allowed,
     half of these add the new stack to what the mix really fields instead,
     which is how the wider mixes get built. When losses count, and the
     stacks are four or fewer, the ranking is too rough for any of this to
     pay — it only crowds the draws round a few mixes — so there every draw
     comes from the weights. */
  const WIDE = K > 4;
  const NEAR = upfront || WIDE ? 0.3 : 0;
  const neighbour = () => {
    const lead = leaders[Math.floor(rng() * leaders.length)];
    const out = WIDE ? liveOf(lead.idxs, lead.sizes) : lead.idxs.slice(), w = Array.from(p, v => v + 1 / n);
    for (const i of out) w[i] = 0;
    let tot = 0;
    for (let i = 0; i < n; i++) tot += w[i];
    if (!(tot > 0)) return draw();
    let r = rng() * tot, i = 0;
    for (; i < n - 1; i++){ r -= w[i]; if (r <= 0 && w[i] > 0) break; }
    while (!(w[i] > 0) && i > 0) i--;
    if (out.length < kDraw || (WIDE && out.length < K && rng() < 0.5)) out.push(i);
    else out[Math.floor(rng() * out.length)] = i;
    return out.sort((a, b) => a - b);
  };
  const restart = () => { p = new Float64Array(n).fill(1 / n); stall = 0; };
  const label1 = () => `Learning which loadouts pull together — round ${round} · ${considered.toLocaleString("en-US")} mixes sized`;

  while (Date.now() < scanEnd){
    round++;
    const batch = [];
    for (let s = 0; s < N; s++){
      const e = evalSubset(NEAR && leaders.length && rng() < NEAR ? neighbour() : draw());
      if (e) batch.push(e);
      if (due()){
        yield note(1, Math.min(1, (Date.now() - t0) / scanMs), 1, label1());
        if (Date.now() >= scanEnd) break;
      }
    }
    /* few enough left that sizing them all beats guessing */
    const rate = considered / Math.max(1, Date.now() - t0);
    if (totalMixes <= SWEEP_CAP && totalMixes - seen.size <= rate * (scanEnd - Date.now()) * 0.6){ sweep = true; break; }
    if (!batch.length){ if (++stall >= 4) restart(); continue; }
    batch.sort((a, b) => a.rank - b.rank);
    const elite = batch.slice(0, Math.max(2, Math.ceil(rho * batch.length)));
    const freq = new Float64Array(n);
    for (const e of elite) e.idxs.forEach((v, k) => { if (e.sizes[k] > 0) freq[v] += 1; });
    let tot = 0;
    for (let i = 0; i < n; i++){ p[i] = Math.max(floor, (1 - alpha) * p[i] + alpha * freq[i] / (elite.length * kDraw)); tot += p[i]; }
    for (let i = 0; i < n; i++) p[i] /= tot;
    if (batch[0].rank < bestEver * (1 - 1e-6)){ bestEver = batch[0].rank; stall = 0; } else stall++;
    if (stall >= 4) restart();
  }

  if (sweep){
    /* every mix not yet sized, the likeliest first by what the weights learned */
    const combos = [];
    const rec = (start, chosen) => {
      if (chosen.length && !seen.has(chosen.join(","))) combos.push(chosen.slice());
      if (chosen.length === K) return;
      for (let i = start; i < n; i++){ chosen.push(i); rec(i + 1, chosen); chosen.pop(); }
    };
    rec(0, []);
    const lp = Array.from(p, v => Math.log(v));
    for (const c of combos) c.like = c.reduce((s, i) => s + lp[i], 0) / c.length;
    combos.sort((a, b) => b.like - a.like);
    for (let k = 0; k < combos.length; k++){
      evalSubset(combos[k]);
      if (due()){
        yield note(1, Math.min(1, (Date.now() - t0) / scanMs), 1,
          `Sizing every mix that is left — ${k.toLocaleString("en-US")} of ${combos.length.toLocaleString("en-US")}`);
        if (Date.now() >= scanEnd) break;
      }
    }
  }

  if (!archive.length){ yield {done:true, error:noSolution(considered, o)}; return; }

  /* ---- phase 2: polish in rounds, a third as many mixes each time ---- */
  archive.sort((a, b) => a.rank - b.rank);
  const p2Start = Date.now();
  const span = Math.max(1, stopAt - p2Start);
  /* mixes that field the same stacks are the same mix, whatever else was
     drawn beside them */
  const states = [], liveSeen = new Set();
  for (const e of archive){
    const lk = liveOf(e.idxs, e.sizes).join(",");
    if (liveSeen.has(lk)) continue;
    liveSeen.add(lk);
    states.push({subset: e.subset, best: e.sizes.slice(), bestScore: e.rank, dz: null, pts: [],
                 polished: new Set(e.settled ? [e.sizes.join(",")] : []), quick: capsOn, rung: 0});
    if ((states.length & 255) === 0 && due()) yield note(2, 0, span, "Lining up the best mixes");
  }

  const ensure = st => {
    if (!st.dz) st.dz = deepSizer(st.subset, foeProfiles, o);
    return st.dz;
  };
  const consider = (st, sizes) => {
    if (!sizes || !st.dz.sv.feasible(sizes)) return false;
    const sc = scoreOf(st.dz.sv, st.subset, sizes);
    if (sc < st.bestScore - 1e-9){ st.bestScore = sc; st.best = sizes.slice(); return true; }
    return false;
  };

  /* many more directions than the scan could afford, each one a fresh shape */
  function* look(st, count, until, msg){
    const dz = ensure(st);
    for (let d = 0; d < count && Date.now() < until; d++){
      const pz = dz.probe(dz.randomDir(rng));
      if (pz){ st.pts.push({p: pz, c: dz.sv.cost(pz)}); consider(st, pz); }
      if (due()) yield msg();
    }
  }
  /* the best few starting points walked down to where no single trade helps */
  function* settle(st, count, until, msg){
    const dz = ensure(st);
    const pts = st.pts.slice();
    pts.push({p: st.best.slice(), c: dz.sv.cost(st.best)});
    pts.sort((a, b) => a.c - b.c);
    let done = 0;
    for (const {p: pp} of pts){
      if (done >= count || Date.now() >= until) break;
      const key = pp.join(",");
      if (st.polished.has(key)) continue;
      st.polished.add(key);
      consider(st, dz.sv.localMin(pp, -1));
      done++;
      if (due()) yield msg();
    }
    st.pts = pts.slice(0, 12);
  }
  /* shift troops from one stack onto another, or shake the whole mix and
     scale it back to working, then re-polish */
  function* kick(st, count, until, msg){
    const dz = ensure(st), K2 = st.subset.length;
    for (let r = 0; r < count && Date.now() < until; r++){
      const best = st.best;
      let trial;
      if (K2 > 1 && rng() < 0.6){
        const live = best.map((v, i) => i).filter(i => best[i] > 0);
        const i = live[Math.floor(rng() * live.length)];
        let j = Math.floor(rng() * (K2 - 1)); if (j >= i) j++;
        const f = [0.1, 0.25, 0.5, 1][Math.floor(rng() * 4)];
        trial = best.slice();
        const moved = Math.ceil(trial[i] * f);
        trial[i] -= moved;
        trial[j] += Math.max(1, Math.round(moved * st.subset[i].wbits / st.subset[j].wbits));
        trial = dz.probe(trial);
      } else trial = dz.probe(best.map(v => (v + 1) * (0.5 + rng())));
      if (trial){
        const pol = dz.sv.localMin(trial, -1);
        consider(st, pol || trial);
      }
      if (due()) yield msg();
    }
  }
  /* When the price counts what the fight burns, the cheapest army up front is
     not the answer — a bigger stack can win sooner and lose less. localMin only
     knows the price up front, so this walks the edge of winning by the real
     price: grow one stack a little, shave every stack back to the least that
     still wins (the grown one last), and keep it if the total came down. */
  function* descend(st, rounds, until, msg){
    if (upfront) return;
    const dz = ensure(st), sv = dz.sv, K2 = st.subset.length;
    const factors = [0.003, 0.01, 0.03, 0.1, 0.3];
    for (let r = 0; r < rounds && Date.now() < until; r++){
      let moved = false;
      for (let i = 0; i < K2 && !moved; i++){
        for (const f of factors){
          const base = st.best;
          let tot = 0;
          for (const v of base) tot += v;
          const step = Math.max(1, Math.round((base[i] || tot / K2) * f));
          const trial = base.slice();
          trial[i] += step;
          if (!sv.feasible(trial)) continue;
          const order = trial.map((v, k) => k).filter(k => k !== i && trial[k] > 0)
            .sort((a, b) => trial[b] * sv.bitsArr[b] - trial[a] * sv.bitsArr[a]);
          for (const k of order) sv.tighten(trial, k);
          sv.tighten(trial, i);
          if (consider(st, trial)){ moved = true; break; }
          if (due()) yield msg();
        }
      }
      if (!moved) break;
    }
  }
  /* the classic search's own grid walk from the best found, for as long as
     the round's time lasts */
  function* grid(st, gridN, until, msg){
    ensure(st);
    const walk = hardOptimize(st.subset, foeProfiles, o, null, gridN, st.best);
    let r;
    while (!(r = walk.next()).done){
      if (Date.now() >= until) return;
      if (due()) yield msg();
    }
    if (r.value) consider(st, r.value.sizes);
  }
  /* the exact sizes for a mix of three stacks or fewer, where they can be had */
  function* exact(st, until, msg){
    if (!upfront) return;
    const keepIdx = st.best.map((v, i) => i).filter(i => st.best[i] > 0);
    if (keepIdx.length > 3 || !keepIdx.length) return;
    const sub = keepIdx.map(i => st.subset[i]);
    const judge = makeSolver(sub, foeProfiles, o);
    const start = keepIdx.map(i => st.best[i]);
    if (!judge.feasible(start)) return;
    const sv = capsOn ? makeSolver(sub, foeProfiles, Object.assign({}, o, {budget:{}, stock:{}})) : judge;
    const run = cePolyblock(sv, judge, capsOn ? capsFor(sub, o) : [], start,
                            Math.min(until, Date.now() + Math.max(250, span * 0.06)), 1e-5);
    let r;
    while (!(r = run.next()).done) if (due()) yield msg();
    const got = r.value;
    if (got && judge.feasible(got.sizes) && judge.cost(got.sizes) < judge.cost(start) - 1e-9){
      const full = st.best.map(() => 0);
      keepIdx.forEach((i, k) => { full[i] = got.sizes[k]; });
      ensure(st);
      consider(st, full);
    }
    if (got && got.proved) st.exact = st.best.join(",");
  }

  /* The leader against the whole catalogue, not just the loadouts kept for the
     draw, one stack at a time: each stack dropped, then with a slot to spare
     one more beside them, then every other loadout in each slot. The extra
     stack is often a cheap unarmoured one of a type already fielded: the
     enemy shoots the toughest of a type first, so it is only reached once its
     armoured fellows are dead, and it fires a full volley every tick until
     then. */
  const loKey = sub => sub.map(c => `${c.type}|${c.weapon}|${c.armor}`).sort().join(";");
  function* reshape(st0, until, msg){
    const liveIdx = st0.best.map((v, i) => i).filter(i => st0.best[i] > 0);
    let cur = {subset: liveIdx.map(i => st0.subset[i]), sizes: liveIdx.map(i => st0.best[i]), score: st0.bestScore};
    const tried = new Set([loKey(cur.subset)]);
    let found = null;
    while (Date.now() < until){
      const L = cur.subset.length, moves = [];
      const types = new Set(cur.subset.map(c => c.type));
      if (L > 1) for (let i = 0; i < L; i++) moves.push({drop: i, pri: 0});
      if (L < K) for (const c of all) if (!cur.subset.includes(c)) moves.push({add: c, pri: types.has(c.type) ? 1 : 3});
      for (let i = 0; i < L; i++) for (const c of all)
        if (!cur.subset.includes(c)) moves.push({at: i, c, pri: c.type === cur.subset[i].type ? 2 : 4});
      moves.sort((a, b) => a.pri - b.pri);
      let tot = 0;
      for (const v of cur.sizes) tot += v;
      let better = null;
      for (const mv of moves){
        if (Date.now() >= until) break;
        let sub, warm;
        if (mv.add){ sub = cur.subset.concat(mv.add); warm = cur.sizes.concat(Math.max(1, Math.round(tot * 0.03))); }
        else if (mv.c){
          sub = cur.subset.slice(); sub[mv.at] = mv.c;
          warm = cur.sizes.slice();
          warm[mv.at] = Math.max(1, Math.round(warm[mv.at] * cur.subset[mv.at].wbits / mv.c.wbits));
        } else { sub = cur.subset.filter((c, i) => i !== mv.drop); warm = cur.sizes.filter((v, i) => i !== mv.drop); }
        const key = loKey(sub);
        if (tried.has(key)) continue;
        tried.add(key);
        const dz = deepSizer(sub, foeProfiles, o);
        const pz = dz.probe(warm);
        if (pz){
          const lm = dz.sv.localMin(pz, -1) || pz;
          const st = {subset: sub, best: lm, bestScore: scoreOf(dz.sv, sub, lm), dz, pts: [], polished: new Set()};
          /* a near miss often only needs shaking to come out ahead — dropping a
             one-troop passenger lands a hair above the mix that carried it,
             and a few kicks find the better shape the extra slot was hiding */
          if (st.bestScore >= cur.score - 1e-9 && st.bestScore < cur.score * 1.0005) yield* kick(st, 20, until, msg);
          if (st.bestScore < cur.score - 1e-9){ better = {subset: sub, sizes: st.best, score: st.bestScore, dz}; break; }
        }
        if (due()) yield msg();
      }
      if (!better) break;
      cur = found = better;
    }
    if (!found) return null;
    const st = {subset: found.subset, best: found.sizes, bestScore: found.score, dz: found.dz, pts: [],
                polished: new Set([found.sizes.join(",")]), quick: false, rung: 4};
    states.push(st);
    return st;
  }

  /* each round's share of the time, on a third as many mixes as the round
     before; whatever a round leaves unspent rolls on to the next */
  const rungs = [
    {share: 0.25, word: "a first look at", run: function*(st, until, msg){
      yield* look(st, 6 + 3 * st.subset.length, until, msg);
      yield* settle(st, 1, until, msg);
      yield* descend(st, 3, until, msg);
    }},
    {share: 0.30, word: "a closer look at", run: function*(st, until, msg){
      yield* look(st, 24 + 6 * st.subset.length, until, msg);
      if (!st.quick && Date.now() < until){
        st.quick = true;
        const q = quickOptimize(st.subset, foeProfiles, o);
        if (q){ ensure(st); consider(st, q.sizes); }
      }
      yield* settle(st, 3, until, msg);
      yield* descend(st, 10, until, msg);
      yield* kick(st, 10, until, msg);
    }},
    {share: 0.25, word: "shaking up", run: function*(st, until, msg){
      yield* kick(st, 30, until, msg);
      yield* descend(st, 20, until, msg);
      yield* grid(st, 40, until, msg);
    }},
    {share: 0.20, word: "finishing", run: function*(st, until, msg){
      yield* exact(st, until, msg);
      yield* kick(st, 40, until, msg);
      yield* look(st, 48, until, msg);
      yield* settle(st, 4, until, msg);
      yield* descend(st, 50, until, msg);
    }}
  ];
  const reshapeShare = 0.1, rungSpan = span * (1 - reshapeShare);
  let field = states, refined = 0, share = 0;
  for (let r = 0; r < rungs.length && field.length; r++){
    share += rungs[r].share;
    const until = p2Start + rungSpan * share;
    const done = [];
    for (let k = 0; k < field.length && Date.now() < until; k++){
      const st = field[k];
      const msg = () => note(2, Date.now() - p2Start, span,
        `Polishing the best mixes — ${rungs[r].word} ${k + 1} of ${field.length}`);
      yield* rungs[r].run(st, until, msg);
      st.rung = r + 1;
      done.push(st);
      if (r === 0) refined++;
      if (due()) yield msg();
    }
    done.sort((a, b) => a.bestScore - b.bestScore);
    field = done.slice(0, Math.max(Math.min(3, done.length), Math.ceil(done.length / 3)));
  }

  /* the leader against every loadout there is */
  const lead = states.filter(st => st.rung).sort((a, b) => a.bestScore - b.bestScore)[0];
  const reshapeUntil = Math.min(stopAt, Math.max(Date.now(), p2Start + rungSpan) + span * reshapeShare);
  if (lead && Date.now() < reshapeUntil){
    const msg = () => note(2, Date.now() - p2Start, span, "Trying every other loadout in each slot of the best mix");
    const st = yield* reshape(lead, reshapeUntil, msg);
    if (st){
      yield* settle(st, 2, stopAt, msg);
      yield* kick(st, 20, stopAt, msg);
      yield* exact(st, stopAt, msg);
      yield* descend(st, 20, stopAt, msg);
    }
  }

  /* time to spare: keep shaking the leaders, until a few passes in a row
     find nothing */
  field = states.filter(st => st.rung).sort((a, b) => a.bestScore - b.bestScore).slice(0, 3);
  for (let pass = 0, idle = 0; field.length && Date.now() < stopAt && idle < 4 * field.length; pass++){
    const st = field[pass % field.length], was = st.bestScore;
    const msg = () => note(2, Date.now() - p2Start, span, "Polishing the best mixes — one more pass over the leaders");
    yield* kick(st, 20, stopAt, msg);
    yield* look(st, 12, stopAt, msg);
    yield* settle(st, 2, stopAt, msg);
    yield* descend(st, 10, stopAt, msg);
    idle = st.bestScore < was ? 0 : idle + 1;
    if (due()) yield msg();
  }

  /* ---- the answers ---- */
  states.sort((a, b) => a.bestScore - b.bestScore);
  const finals = states.slice(0, 40).map(st => {
    const sv = st.dz ? st.dz.sv : makeSolver(st.subset, foeProfiles, o);
    const res = sv.result(st.best);
    return {subset: st.subset, sizes: st.best, met: metricOf(st.best, st.subset, res), res,
            exact: st.exact === st.best.join(",")};
  });
  const liveCount = f => f.sizes.filter(v => v > 0).length;
  finals.sort((a, b) => a.met.score - b.met.score || liveCount(a) - liveCount(b) || a.met.wup - b.met.wup);
  const seenOut = new Set(), out = [];
  for (const f of finals){
    const live = [];
    f.sizes.forEach((sz, i) => { if (sz > 0) live.push({c: f.subset[i], size: sz,
      lost: f.res.ownLost ? f.res.ownLost[i] : null}); });
    if (!live.length) continue;
    const key = live.map(l => `${l.c.type}|${l.c.weapon}|${l.c.armor}|${l.size}`).sort().join(";");
    if (seenOut.has(key)) continue;
    seenOut.add(key);
    out.push({live, upfront: f.met.up, burned: f.met.burn, metric: f.met.m, score: f.met.score,
              wipes: f.res.wipe, left: f.res.ownLeft,
              ticks: f.res.ticksUsed || 1, tickLog: f.res.perTick || null,
              troops: live.reduce((s, l) => s + l.size, 0), exact: f.exact});
  }
  yield {done:true, results: out.slice(0, 10), candCount: n, comboCount: considered,
         beam: false, maxStacks: K, skipped: 0, refined, shortlisted: states.length, deep: false, ce: true};
}

/* how hard the deep search looks at each effort level */
const DEEP_EFFORT = {
  quick:    {maxCandidates:20, refine:12, dirs:24, kicks:15, gridN:20, slack:1,    budgetMs:10000,  beam:10, scanMs:10000},
  normal:   {maxCandidates:32, refine:40, dirs:48, kicks:30, gridN:40, slack:1.02, budgetMs:40000,  beam:20, scanMs:40000},
  thorough: {maxCandidates:48, refine:100, dirs:96, kicks:60, gridN:72, slack:1.25, budgetMs:150000, beam:32, scanMs:150000}
};

/* ---- effort presets ---------------------------------------------- */
const SOLVE_EFFORT = {
  quick:    {maxCandidates:20, refine:20,  gridN:20, slack:1,    budgetMs:8000,   beam:10, scanMs:10000},
  normal:   {maxCandidates:32, refine:50,  gridN:40, slack:1.02, budgetMs:30000,  beam:20, scanMs:40000},
  thorough: {maxCandidates:48, refine:120, gridN:72, slack:1.25, budgetMs:120000, beam:32, scanMs:150000}
};

const troopBits = u => {
  const uc = UNIT_COST[u.type] || {hire:0};
  return uc.hire + gearCost("weapon", u.weapon).bits + gearCost("armor", u.armor).bits;
};

/* money and materiel for an arbitrary list of unit rows */
function solveCosts(rows){
  let hire = 0, gearBits = 0;
  const upkeep = {}, gearRes = {};
  rows.forEach(u => {
    const n = Math.max(0, u.size);
    const uc = UNIT_COST[u.type] || {hire:0, upkeep:{}};
    hire += uc.hire * n;
    addRes(upkeep, uc.upkeep, n);
    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    gearBits += (w.bits + a.bits) * n;
    addRes(gearRes, w.res, n); addRes(gearRes, a.res, n);
  });
  const raw = toRaw(gearRes);
  return {hire, gearBits, gearRes, upkeep, rawRes: raw.res, craftBits: raw.craftBits,
          total: hire + gearBits + raw.craftBits};
}

/* ---- verification against the real battle engine ------------------
   The fast search sums a block of hits at once; simulate() adds them one at a
   time, and float drift makes those differ by a single hit now and then. So the
   forces the solver hands back get replayed through simulate() and nudged until
   they really do the job.
   With more than one tick allowed the replay keeps going: the survivors of each
   tick are the forces of the next, wiped stacks drop out, and the losses are
   totalled per starting stack.
   The enemy's reinforcements sit out tick 1 and join whoever is left of the
   rest on tick 2, behind them in the list, the way the battle view brings
   them in. Until they have, the enemy is not wiped, a quiet tick is not a
   deadlock, and they count among the enemy left. */
function realCheck(ownRows, foeRows, side, bonus, goal, minSurv, ticks, budget, stock){
  const T = Math.max(1, ticks || 1);
  const named = (rows, p) => rows.map((u, i) => ({type:u.type, weapon:u.weapon, armor:u.armor,
    size:u.size, training:u.training, name:p + i}));
  let own = ownRows.map((u, i) => Object.assign({}, u, {at:i}));
  let foe = foeRows.filter(u => !u.reserve).map(u => Object.assign({}, u));
  const reinf = foeRows.filter(u => u.reserve).map(u => Object.assign({}, u));
  let due = reinf.reduce((s, u) => s + u.size, 0);
  const lost = ownRows.map(() => 0);
  const log = [];
  const up = {};                       // everyone standing at the start of a tick is billed for it
  let wipe = false, left = own.reduce((s, u) => s + u.size, 0), used = 0;

  for (let t = 1; t <= T; t++){
    if (t === 2 && reinf.length){ foe = foe.concat(reinf); due = 0; }
    if (!own.length || !(foe.length || due)) break;
    addRes(up, upkeepOf(own));
    let r;
    try {
      r = simulate(side === "defender" ? named(foe, "A") : named(own, "A"),
                   side === "defender" ? named(own, "D") : named(foe, "D"), bonus);
    } catch(e){ return null; }
    const ownUnits = side === "defender" ? r.repellers : r.invaders;
    const foeUnits = side === "defender" ? r.invaders  : r.repellers;

    let ownKilled = 0, foeKilled = 0, foeLeft = 0;
    left = 0;
    ownUnits.forEach((u, i) => { lost[own[i].at] += u.lost || 0; ownKilled += u.lost || 0;
                                 left += u.remaining; });
    foeUnits.forEach(u => { foeKilled += u.lost || 0; foeLeft += u.remaining; });

    own = own.map((u, i) => Object.assign({}, u, {size: ownUnits[i].remaining})).filter(u => u.size > 0);
    foe = foe.map((u, i) => Object.assign({}, u, {size: foeUnits[i].remaining})).filter(u => u.size > 0);
    foeLeft += due;

    used = t;
    log.push({tick:t, foeKilled, ownKilled, foeLeft, ownLeft:left});
    if (!foeLeft){ wipe = true; break; }
    if (!left) break;
    if (!foeKilled && !ownKilled && !due) break;   // deadlock: every later tick repeats it
  }

  const gear = solveCosts(ownRows).gearRes;
  const fits = !Object.keys(budget || {}).some(k => (up[k] || 0) > budget[k] + 1e-9)
            && !Object.keys(stock || {}).some(k => (gear[k] || 0) > stock[k] + 1e-9);
  return {wipe, left, lost, ticks: used || 1, log, up,
          ok: fits && (goal === "wipe" ? wipe : goal === "survive" ? left >= minSurv
                                                                   : wipe && left >= minSurv)};
}

function verifyAndRepair(rows, foeRows, side, bonus, goal, minSurv, deadline, ticks, lean, budget, stock){
  const check = () => realCheck(rows, foeRows, side, bonus, goal, minSurv, ticks, budget, stock);
  /* which stack to top up, and which to shave first, is a question about
     what this nation can spare — so it is asked in leaned bits */
  const leaned = u => troopBits(u) * leanOf(lean, u.type);
  let v = check();
  if (!v) return null;
  let calls = 1, repaired = false;

  if (!v.ok){                                   // short by a hair — buy the cheapest fix
    /* cheapest stack first; one already up against a limit cannot take the
       extra troops, so the next cheapest gets its turn */
    const order = rows.map((u, i) => i).sort((a, b) => leaned(rows[a]) - leaned(rows[b]));
    let cheap = -1, base = 0, add = 1, hi = -1;
    repaired = true;
    for (const at of order){
      cheap = at; base = rows[at].size; add = 1;
      const stop = calls + 26;
      while (calls < stop && Date.now() < deadline){   // double until it passes
        rows[cheap].size = base + add;
        v = check();
        calls++;
        if (v && v.ok){ hi = base + add; break; }
        add *= 2;
        if (base + add > SOLVE_STACK_CAP) break;
      }
      if (hi >= 0) break;
      rows[cheap].size = base;
      if (calls > 80 || Date.now() > deadline) break;
    }
    if (hi < 0){ v = check(); return {rows, v, calls, ok:false, repaired}; }
    let lo = base + (add >> 1);                        // last size known to fail
    while (lo + 1 < hi && calls < 70 && Date.now() < deadline){
