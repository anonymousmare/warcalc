   3. ROW MANAGEMENT
   =================================================================== */

let rowSeq = 0;

/* training tops out at 20, unless the box beside that side's Barracks is ticked */
const TRAIN_UNCAPPED = 9999;
const uncapBox = side => document.querySelector(`[data-uncap="${side}"]`);
const trainCap = side => uncapBox(side)?.checked ? TRAIN_UNCAPPED : 20;
function setUncap(side, on){
  const box = uncapBox(side);
  if (!box) return;
  box.checked = !!on;
  const cap = trainCap(side);
  document.querySelectorAll(`[data-barracks="${side}"], #tbody${side === "attacker" ? "Attacker" : "Defender"} .training`)
    .forEach(el=>{ el.max = cap; if (el.value !== "" && +el.value > cap) el.value = cap; });
}
/* a level past 20 coming in (a preset, an import) ticks the box rather than
   being cut down */
const uncapFor = (side, n) => { if (parseInt(n, 10) > 20 && !uncapBox(side)?.checked) setUncap(side, true); };
document.querySelectorAll("[data-uncap]").forEach(box=>box.addEventListener("change", ()=>{
  const side = box.dataset.uncap;
  setUncap(side, box.checked);
  document.querySelectorAll(`#tbody${side === "attacker" ? "Attacker" : "Defender"} tr`).forEach(paintRow);
  scheduleSave();
}));

/* the Barracks box beside each side's count: the training a new row starts at */
const barracksOf = side =>
  clampInt(document.querySelector(`[data-barracks="${side}"]`)?.value, 0, trainCap(side));
/* a Barracks level that came in with an import or a preset; anything that is
   not a level leaves the box as it is */
function setBarracks(side, n){
  const el = document.querySelector(`[data-barracks="${side}"]`);
  if (!el || n == null || n === "" || isNaN(parseInt(n, 10))) return;
  uncapFor(side, n);
  el.value = clampInt(n, 0, trainCap(side));
  scheduleSave();
}
document.querySelectorAll("[data-barracks]").forEach(el=>{
  const side = el.dataset.barracks;
  el.addEventListener("input", ()=>{ const cap = trainCap(side); if (el.value !== "" && +el.value > cap) el.value = cap; scheduleSave(); });
  el.addEventListener("change", ()=>{ el.value = clampInt(el.value, 0, trainCap(side)); scheduleSave(); });
});

function makeRow(side, data){
  const tr = document.createElement("tr");
  tr.dataset.side = side;
  tr.dataset.id = ++rowSeq;
  uncapFor(side, data?.training);   // a level past 20 coming in ticks the box, not cut to 20

  const typeOpts = (side === "defender"
    ? ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"]
    : ["Cavalry","Tanks","Pegasi","Unicorns","Naval"]);

  tr.innerHTML = `
    <td class="col-sprite"><span class="spriteSlot"></span></td>
    <td class="col-name"><input type="text" class="uname" maxlength="50" spellcheck="false"
      placeholder="—" value="${esc(data?.name ?? "")}"></td>
    <td class="col-type"><span class="reinf-sw">
      <button type="button" data-reinf="0" title="Front line">−</button>
      <button type="button" data-reinf="1" title="Reinforcement">+</button>
    </span><select class="type">
      ${typeOpts.map(t=>`<option value="${t}">${t}</option>`).join("")}
    </select></td>
    <td class="col-weapon"><select class="weapon"><option value="">—</option></select></td>
    <td class="col-armor"><select class="armor"><option value="">—</option></select></td>
    <td class="col-size"><input type="number" class="size" min="1" value="${data?.size ?? 1}"></td>
    <td class="col-train"><input type="number" class="training" min="0" max="${trainCap(side)}"
      value="${clampInt(data?.training ?? barracksOf(side), 0, trainCap(side))}"></td>
    <td class="col-del"><button class="btn btn-danger btn-xs del" title="Remove unit">×</button></td>`;

  const typeSel = tr.querySelector(".type");
  const wSel = tr.querySelector(".weapon");
  const aSel = tr.querySelector(".armor");

  typeSel.addEventListener("change", ()=>{ fillLoadout(typeSel.value, wSel, aSel); paintRow(tr); });
  wSel.addEventListener("change", ()=>paintRow(tr));
  aSel.addEventListener("change", ()=>paintRow(tr));
  const trIn = tr.querySelector(".training");
  trIn.addEventListener("input", ()=>{
    const cap = trainCap(side);                                      // training tops out at 20
    if (trIn.value !== "" && +trIn.value > cap) trIn.value = cap;    // unless uncapped
    paintRow(tr);
  });
  trIn.addEventListener("change", ()=>{ trIn.value = clampInt(trIn.value, 0, trainCap(side)); paintRow(tr); });
  tr.querySelector(".uname").addEventListener("input", refreshCosts);
  tr.querySelector(".size").addEventListener("input", ()=>paintRow(tr));
  tr.querySelector(".del").addEventListener("click", ()=>{ tr.remove(); refreshCounts(); });
  tr.querySelectorAll("[data-reinf]").forEach(b=>b.addEventListener("click", ()=>{
    const was = tr.classList.contains("reserve");
    setReserve(tr, b.dataset.reinf === "1");
    if (was !== tr.classList.contains("reserve")) flagReinfStale();
    refreshCosts();
  }));
  setReserve(tr, !!data?.reserve);

  document.getElementById(side === "attacker" ? "tbodyAttacker" : "tbodyDefender").appendChild(tr);

  typeSel.value = (data && data.type) || "Cavalry";
  fillLoadout(typeSel.value, wSel, aSel);
  wSel.value = (data && data.weapon) || "ScroungedWeapons";
  aSel.value = (data && data.armor)  || "ScroungedArmor";
  if (!wSel.value) wSel.selectedIndex = 0;
  if (!aSel.value) aSel.selectedIndex = 0;
  paintRow(tr);
  refreshCounts();
  return tr;
}

/* a reinforcement stays out of the battle on screen and arrives with the
   survivors at the start of the next tick */
function setReserve(tr, on){
  tr.classList.toggle("reserve", on);
  tr.querySelector('[data-reinf="1"]').classList.toggle("on", on);
  tr.querySelector('[data-reinf="0"]').classList.toggle("on", !on);
}

/* the battle on screen was fought with the old front line, so its ticks and
   upkeep no longer match the lists — say so rather than quietly mislead */
function flagReinfStale(){
  const el = document.getElementById("reinfStale");
  if (el) el.innerHTML = `<div class="note warn"><strong>Reinforcements changed — run again.</strong></div>`;
}

function fillLoadout(type, wSel, aSel){
  wSel.innerHTML = ""; aSel.innerHTML = "";
  const set = LOADOUTS[type];
  if (!set){
    wSel.innerHTML = '<option value="">—</option>';
    aSel.innerHTML = '<option value="">—</option>';
    return;
  }
  set.weapons.forEach(w=>wSel.add(new Option(label(w), w)));
  set.armor.forEach(a=>aSel.add(new Option(label(a), a)));
}

function paintRow(tr){
  const type = tr.querySelector(".type").value;
  const weapon = tr.querySelector(".weapon").value || "ScroungedWeapons";
  const armor = tr.querySelector(".armor").value || "ScroungedArmor";
  const training = tr.querySelector(".training").value;
  const size = tr.querySelector(".size").value;
  const slot = tr.querySelector(".spriteSlot");

  // keep the same <img> when only size/training moved — avoids a sprite reload
  const cur = slot.querySelector("[data-tip-t]");
  if (type && cur && cur.dataset.tipT === type && cur.dataset.tipW === weapon && cur.dataset.tipA === armor){
    cur.dataset.tipSize = size;
    cur.dataset.tipTrain = training;
  } else {
    slot.innerHTML = type
      ? buildSprite(type, weapon, armor, false, {size, training})
      : `<span class="muted small">—</span>`;
  }
  refreshCosts();
}

function refreshCounts(){
  document.getElementById("atkCount").textContent =
    document.querySelectorAll("#tbodyAttacker tr").length + " units";
  document.getElementById("defCount").textContent =
    document.querySelectorAll("#tbodyDefender tr").length + " units";
  refreshCosts();
}

   3b. COST SUMMARY per side
   =================================================================== */

/* tooltips whose body is arbitrary html live in this registry, keyed by
   data-tip-key, so we never have to shove markup through an attribute */
const TIPS = new Map();
let tipSeq = 0;
function regTip(html, ns){
  const k = (ns || "k") + (++tipSeq);
  TIPS.set(k, html);
  return k;
}
function clearTips(ns){
  [...TIPS.keys()].forEach(k=>{ if (k.startsWith(ns)) TIPS.delete(k); });
  [...PINS.keys()].forEach(k=>{ if (k.startsWith(ns)) PINS.delete(k); });
}
/* what a damage figure opens into when clicked, built only when asked for */
const PINS = new Map();

function costsOf(rows){
  let hire = 0, gearBits = 0;
  const upkeep = {}, gearRes = {};
  const items = [];

  rows.forEach(u=>{
    const n = Math.max(0, u.size);            // every cost is per troop
    const uc = UNIT_COST[u.type] || {hire:0, upkeep:{}};
    hire += uc.hire * n;
    addRes(upkeep, uc.upkeep, n);

    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    const gb = (w.bits + a.bits) * n;
    gearBits += gb;
    addRes(gearRes, w.res, n); addRes(gearRes, a.res, n);

    items.push({u, n, w, a,
      res: addRes(addRes({}, w.res, n), a.res, n),
      gbits: gb,
      hire: uc.hire * n,
      upkeep: addRes({}, uc.upkeep, n)});
  });

  const raw = toRaw(gearRes);
  return {rows, items, hire, upkeep, gearBits, gearRes,
          rawRes: raw.res, craftBits: raw.craftBits};
}

function breakdownTip(title, items, cell, countFmt){
  if (!items.length) return `<div class="tip-title">${esc(title)}</div>
    <div class="small muted" style="margin-top:4px">No units yet.</div>`;
  const count = countFmt || (it=>"×" + it.n);
  const rows = items.map(it=>`<tr>
      <td class="u">${esc(it.u.type)} <span class="muted mono">${count(it)}</span>
        <div class="small muted">${esc(label(it.u.weapon))} / ${esc(label(it.u.armor))}</div></td>
      <td style="text-align:right">${cell(it)}</td></tr>`).join("");
  return `<div class="tip-title">${esc(title)}</div>
    <table class="tip-break" style="margin-top:6px">${rows}</table>`;
}

/* with reinforcements on the list the costs can be read for the whole force,
   the front line alone, or the reinforcements alone */
const COST_TABS = [
  {id:"total", name:"Total",          pick:(f, r)=>f.concat(r)},
  {id:"t1",    name:"Tick 1",         pick:(f, r)=>f},
  {id:"reinf", name:"Reinforcements", pick:(f, r)=>r}
];
const costTab = {attacker:"total", defender:"total"};

function renderCosts(side){
  const el = document.getElementById(side === "attacker" ? "costAttacker" : "costDefender");
  if (!el) return;
  const all = readSide(side);
  const front = all.filter(u=>!u.reserve), reinf = all.filter(u=>u.reserve);
  const tabs = reinf.length > 0;

/* 1 satisfaction a turn for every 2 troops past 20 */
const troopTotal = rows => rows.reduce((s,u)=>s + Math.max(0, u.size), 0);
const satCost = troops => Math.max(0, Math.ceil((troops - 20) / 2));

const SCROUNGED = {ScroungedWeapons:1, ScroungedArmor:1};

/* The running order the Units list and the spreadsheet column both follow:
   a type's headcount, then that type's weapons, then its armor. Every entry
   is one line of the spreadsheet copy, zeroes included, so the column is
   always the same length and each pile lands in the same row. */
const UNIT_ORDER = [
  {type:"Cavalry",  gear:["PRC-E6","PRC-E7","PRC-E8","ACFU","APFU","ATFU","AUFU",
                          "Barding","Bigdog","Nope"]},
  {type:"Tanks",    gear:["K9P","ELBO-GRS","Chem-LightBattery",
                          "Trundle","Shepherd","Ohno","Titan"]},
  {type:"Pegasi",   gear:["PropWash","SteamBucket","CanopyLights",
                          "Cooler","Wonder","Griffin","Dragon"]},
  {type:"Unicorns", gear:["LongStand","LongWeight","GridSquares",
                          "Hornshield","Librarian","Shining","D2A"]},
  {type:"Naval",    gear:["Shoreline","WaterHammer","WaterlineEraser",
                          "C-PON3","Esohes","Shubidu"]},
  {type:"Alicorns", gear:[]}
];

/* heads a type, and every piece of gear the whole force needs */
function unitTally(rows){
  const head = {}, gear = {};
  rows.forEach(u=>{
    const n = Math.max(0, u.size);
    head[u.type] = (head[u.type] || 0) + n;
    [u.weapon, u.armor].forEach(k=>{
      if (!k || SCROUNGED[k]) return;
      gear[k] = (gear[k] || 0) + n;
    });
  });
  return {head, gear};
}

/* the same running order, one count a line and nothing else, so the whole
   column can be pasted straight down a sheet */
function sheetText(rows){
  const {head, gear} = unitTally(rows);
  const out = [];
  UNIT_ORDER.forEach(g=>{
    out.push(head[g.type] || 0);
    g.gear.forEach(k => out.push(gear[k] || 0));
  });
  return out.join("\n");
}

/* one line a stack, stacks of a type kept together, ready to paste */
function rosterText(rows){
  const order = [], byType = new Map();
  rows.forEach(u=>{
    const n = Math.max(0, u.size);
    if (!n) return;
    if (!byType.has(u.type)){ byType.set(u.type, []); order.push(u.type); }
    byType.get(u.type).push(
      `${n.toLocaleString("en-US")} ${u.type} \`${label(u.weapon)}\` + \`${label(u.armor)}\``);
  });
  return order.map(t => byType.get(t).join("\n")).join("\n\n");
}

/* create, equip and group lines for the army-builder plugin; the gear is
   taken as already delivered, so nothing is built */
const bq = t => /\s/.test(t) ? `"${t}"` : t;
const bSuffix = i => { let s = ""; i++; while (i > 0){ i--; s = String.fromCharCode(97 + i % 26) + s; i = Math.floor(i / 26); } return s; };
function builderText(rows){
  const lines = [], names = [], seen = {}, taken = new Set();
  rows.forEach(u=>{
    const n = Math.max(0, u.size);
    if (!n) return;
    /* a unit's own name when it has one, else type_a, type_b … — the builder
       takes 1-50 letters, digits, spaces and underscores, quoted if spaced */
    const own = String(u.nick || "").replace(/[^A-Za-z0-9_ ]+/g, "").replace(/\s+/g, " ").trim().slice(0, 47);
    const base = u.type.toLowerCase();
    let name = own;
    /* the builder reads names case-blind, so "Alpha" and "alpha" would clash */
    if (!name || taken.has(name.toLowerCase())){
      const stem = own || base;
      do name = `${stem}_${bSuffix(seen[stem] = (seen[stem] ?? -1) + 1)}`; while (taken.has(name.toLowerCase()));
    }
    taken.add(name.toLowerCase());
    name = bq(name);
    names.push(name);
    lines.push(`create ${u.type} national ${n} ${name}`);
    const gear = [u.weapon, u.armor].filter(k => k && !SCROUNGED[k]).map(k => bq(label(k)));
    if (gear.length) lines.push(`equip ${name} ${gear.join(" ")}`);
  });
  if (!document.getElementById("bcNoGroup")?.checked)
    names.slice(1).forEach(n => lines.push(`group ${n} ${names[0]}`));
  return lines.join("\n");
}

/* the one builder line that makes the gear itself — build "Item":count …,
   each piece sized to every troop that carries it, in the Units list's order */
function builderGearText(rows){
  const {gear} = unitTally(rows);
  const items = [];
  UNIT_ORDER.forEach(g => g.gear.forEach(k=>{
    if (gear[k] > 0) items.push(`${bq(label(k))}:${gear[k]}`);
  }));
  return items.length ? `build ${items.join(" ")}` : "";
}

/* the Units row doubles as the gear-tally dropdown */

      title="Copy every unit type's total, one a line (Cavalry to Alicorns, zeros included)">${iconSvg("copy")}</button>`;

         data-units-copy="${sheetText(rows).replace(/\n/g, "&#10;")}">Spreadsheet Copy</button>` +
      `<button class="bp-btn txt-btn u-copy u-builder" title="Copy as army-builder commands"

      (gearText ? `<button class="bp-btn txt-btn u-copy u-builder" title="Copy the army-builder commands that build the gear"
         data-units-copy="${esc(gearText).replace(/\n/g, "&#10;")}">Builder Gear Copy</button>` : "")

  return `<details class="units-drop"${open ? " open" : ""}>

/* ---- the pretty plan: one side's whole order, dressed up for a chat ----
   the army code, the roster, sat and bits, the builder gear line, and the
   gear and upkeep as ANSI colour blocks. A plain click also fights the side
   against whatever the other list holds, tick after tick, and adds the
   upkeep for the whole fight (and a warning if the side is wiped out). */
const ANSI = "\u001b";
const PLAN_RGB = {
  copper:"255;106;0", tungsten:"128;128;128", plastics:"0;255;33", machinery:"0;148;255",
  vehicle:"255;89;89", precision:"195;66;255", composites:"255;255;255",
  gems:"0;255;33", energy:"255;216;0", oil:"160;120;80",
  apples:"255;89;89", coffee:"255;106;0", gasoline:"0;148;255"
};
const planHead = t =>
  `${ANSI}[2;4;2m${ANSI}[7;40m${t}${ANSI}[0m${ANSI}[2;2m${ANSI}[4;2m${ANSI}[0m${ANSI}[7;2m`;
const planKeys = res => RES_ORDER.filter(k => Math.round(res[k] || 0) > 0);
/* names padded to the widest so every swatch and figure lines up */
function planResLines(res, width){
  return planKeys(res).map(k=>{
    const name = RESOURCES[k].name, c = PLAN_RGB[k] || "255;255;255";
    return `${ANSI}[38;2;${c}m${name}${ANSI}[0m${ANSI}[7;2m${" ".repeat(width - name.length + 1)}` +
           `${ANSI}[48;2;${c}m ${ANSI}[0m${ANSI}[7;2m ${Math.round(res[k])}`;
  }).join(" \n");
}
const planWidth = (...maps) =>
  Math.max(0, ...maps.flatMap(m => planKeys(m).map(k => RESOURCES[k].name.length)));

/* the side fought out against the other list the way Resolve battle and the
   successive replay do it: the upkeep everyone starting a tick is billed,
   summed over every tick, and whether the side is still standing at the end */
function planFight(side){
  const isAtk = side === "attacker";
  const atkAll = readSide("attacker"), defAll = readSide("defender");
  const foe = isAtk ? defAll : atkAll;
  if (!foe.length || [...atkAll, ...defAll].some(u => u.size < 1)) return null;
  const bonus = document.getElementById("defBonus").value;
  const atk = atkAll.filter(u=>!u.reserve), def = defAll.filter(u=>!u.reserve);
  const reinf = rows => rows.filter(u=>u.reserve).map(u => Object.assign({}, u, {fresh:true}));
  let r1;
  try { r1 = simulate(atk, def, bonus); } catch(e){ return null; }

  const up = upkeepOf(isAtk ? atk : def);
  const a0 = chainRows(r1.units, true).concat(reinf(atkAll));
  const d0 = chainRows(r1.units, false).concat(reinf(defAll));
  let ticks = 1, left = troopsOf(isAtk ? a0 : d0);
  if (a0.length && d0.length){
    const run = chainBattles(a0, d0, bonus);
    run.ticks.forEach(k => addRes(up, isAtk ? k.upA : k.upD));
    ticks += run.ticks.length;
    if (run.ticks.length){
      const last = run.ticks[run.ticks.length - 1];
      left = isAtk ? last.atkLeft : last.defLeft;
    }
  }
  return {up, ticks, lost: left <= 0};
}

function prettyPlan(side, noFight){
  const rows = readSide(side);
  if (!rows.some(u => u.size > 0)) return "";
  const c = costsOf(rows);
  const fence = (lang, body) => "```" + lang + "\n" + body + "\n```";
  const out = ["`" + encodeArmy(noNames(packSide(side)), barracksOf(side)) + "`"];

  /* the roster, a type's stacks together */
  const order = [], byType = new Map();
  rows.forEach(u=>{
    const n = Math.max(0, u.size);
    if (!n) return;
    if (!byType.has(u.type)){ byType.set(u.type, []); order.push(u.type); }
    byType.get(u.type).push(`${n.toLocaleString("en-US")} ${u.type} ${label(u.weapon)} + ${label(u.armor)}`);
  });
  out.push(fence("cs", order.map(t => byType.get(t).join("\n")).join("\n\n")));

  const sat = satCost(troopTotal(rows));
  out.push(fence("glsl", `☹ ${sat ? "-" + sat.toLocaleString("en-US") : 0} Sat\n\n` +
    `₿ ${money(c.hire + c.gearBits + c.craftBits)}\n` +
    ` ├── ${money(c.hire)} Raise\n` +
    ` └── ${money(c.gearBits)} Equipment`));

  out.push("`Nerd Stuff`");
  const build = builderGearText(rows);
  if (build) out.push(fence("prolog", build));

  const fight = noFight ? null : planFight(side);
  const total = fight && fight.ticks > 1 ? fight.up : null;
  if (planKeys(c.gearRes).length)
    out.push(fence("ansi", planResLines(c.gearRes, planWidth(c.gearRes))));
  const w = planWidth(c.upkeep, total || {});        // both upkeep lists share one column
  out.push(fence("ansi", planHead("Upkeep 12/h") + "\n" + planResLines(c.upkeep, w) +
    (total ? "\n" + planHead("Upkeep Total") + "\n" + planResLines(total, w) : "")));
  if (fight && fight.lost)
    out.push(fence("ansi", `${ANSI}[7;41m${ANSI}[48;2;255;0;0mBATTLE LOSS?${ANSI}[0m${ANSI}[7;41m${ANSI}[0m`));
  return out.join("\n");
}

function readSide(side){

/* ===================================================================
   4. SIMULATION — direct port of huge-ovipositor-backend.php
   =================================================================== */

function buildUnit(raw, forceId, isInvader){
  const u = {
    force_id: forceId,
    name: (isInvader ? "A_" : "D_") + raw.name,
    size: raw.size,
    training: raw.training,
    nick: raw.nick || "",
    fresh: !!raw.fresh,          // a reinforcement that joined on this tick
    type: FORCE_TYPES[raw.type],
    origType: raw.type,          // kept because alicorns get retyped to Naval below
    weapon: raw.weapon,
    armor: raw.armor,
    weapon_id: WEAPON_IDS[raw.weapon],
    armor_id: ARMOR_IDS[raw.armor],
    attack_mission: isInvader ? 1 : 0,
    nation_id: isInvader ? 1 : 2,
    damage: 0,
    hits: raw.size,
    dmg: {}, arm: {}
  };

  const wd = WEAPON_DEFS[raw.weapon];
  const ad = ARMOR_DEFS[raw.armor];

  if (u.type === 6){                       // alicorns
    u.type = 5;                            // "treat them like naval for now"
    TYPE_NUMS.forEach(n=>{ u.dmg[TYPES[n]] = 10; u.arm[TYPES[n]] = 0.1; });
  } else {
    TYPE_NUMS.forEach(n=>{
      const t = TYPES[n];
      // PHP: !$rs['weapon_id'] — id 0 (Scrounged) is falsy, so it takes the fallback
      u.dmg[t] = (!u.weapon_id || !wd) ? 0.25 : Number(wd[t]);
      u.arm[t] = (!u.armor_id  || !ad) ? 1    : Number(ad[t]);
    });
  }
  return u;
}

// array_multisort helper: stable sort of parallel arrays by key list
function multisort(items, keys){
  return items.map((v,i)=>({v,i}))
    .sort((a,b)=>{
      for (const k of keys){
        const d = k.cmp(k.get(a.v), k.get(b.v));
        if (d) return d;
      }
      return a.i - b.i;
    })
    .map(x=>x.v);
}
const ASC  = (x,y)=> x<y ? -1 : x>y ? 1 : 0;
const DESC = (x,y)=> x<y ?  1 : x>y ? -1 : 0;

function simulate(attackers, defenders, defenderBonus){
  const units = {};
  const invaders = [], repellers = [];
  let fid = 0;

  attackers.forEach(r=>{ const u = buildUnit(r, ++fid, true);  units[u.force_id]=u; invaders.push(u); });
  defenders.forEach(r=>{ const u = buildUnit(r, ++fid, false); units[u.force_id]=u; repellers.push(u); });

  // --- damage buckets: [damageValue][targetTypeName] = [units]
  function damageBuckets(side){
    const b = {};
    side.forEach(u=>{
      TYPE_NUMS.forEach(n=>{
        const t = TYPES[n];
        const key = String(u.dmg[t]);
        (b[key] ??= {});
        (b[key][t] ??= []).push(u);
      });
    });
    // krsort numerically (highest damage first)
    const sortedKeys = Object.keys(b).sort((a,c)=>parseFloat(c)-parseFloat(a));
    const out = [];
    sortedKeys.forEach(k=>{
      const byType = {};
      TYPE_NUMS.forEach(n=>{
        const t = TYPES[n];
        if (b[k][t]) byType[t] = multisort(b[k][t], [
          {get:u=>u.size,       cmp:DESC},
          {get:u=>u.nation_id,  cmp:ASC}
        ]);
      });
      out.push({damage: parseFloat(k), byType});
    });
    return out;
  }

  // --- defender pools: [defenderOwnType][attackerType] = [units], sorted by armor asc
  function defenderPools(side){
    const p = {};
    side.forEach(u=>{
      TYPE_NUMS.forEach(n=>{
        (p[u.type] ??= {});
        (p[u.type][n] ??= []).push(u);
      });
    });
    Object.keys(p).forEach(dt=>{
      TYPE_NUMS.forEach(n=>{
        if (p[dt][n]) p[dt][n] = multisort(p[dt][n], [
          {get:u=>u.arm[TYPES[n]], cmp:ASC},
          {get:u=>u.size,          cmp:DESC},
          {get:u=>u.nation_id,     cmp:ASC}
        ]);
      });
    });
    return p;
  }

  const invaderDamages   = damageBuckets(invaders);
  const repellerDamages  = damageBuckets(repellers);
  const invaderDefenders = defenderPools(invaders);
  const repellerDefenders= defenderPools(repellers);

  const hitinfo = {}, damageinfo = {};
  // PHP arrays keep insertion order; JS objects with numeric keys re-sort
  // ascending, which would scramble the exchange log. Track order separately.
  const hitOrder = [];
  const stalls = [];
  let budget = 4_000_000;   // guard: PHP would hang here on a 0-damage matchup

  function runSide(buckets, enemyPools, applyBonus){
    for (const bucket of buckets){
      for (const tn of TYPE_NUMS){
        const t = TYPES[tn];
        const attackerList = bucket.byType[t];
        if (!attackerList) continue;

        let breakTypeLoop = false;
        for (const attacker of attackerList){
          const A = units[attacker.force_id];
          while (A.hits > 0){
            let fought = false;
            const pool = enemyPools[tn]?.[A.type];
            if (!pool || !pool.length) break;

            let outOfHits = false;
            for (const defender of pool){
              const D = units[defender.force_id];
              let dmg = round3(bucket.damage * D.arm[TYPES[A.type]]
                        * Math.pow(1.5, (A.training - D.training)/20));
              if (applyBonus) dmg = dmg * 0.75;

              if (dmg <= 0){
                // PHP would spin forever here; record and skip.
                stalls.push(`${A.name} does 0 damage to ${D.name} — skipped`);
                continue;
              }

              while (D.size > D.damage){
                fought = true;
                D.damage += dmg;
                hitinfo[A.force_id] ??= {}; damageinfo[A.force_id] ??= {};
                if (!(D.force_id in hitinfo[A.force_id])) hitOrder.push([A.force_id, D.force_id]);
                hitinfo[A.force_id][D.force_id] = (hitinfo[A.force_id][D.force_id]||0) + 1;
                damageinfo[A.force_id][D.force_id] = (damageinfo[A.force_id][D.force_id]||0) + dmg;
                A.hits--;
                if (--budget <= 0) throw new Error("Iteration limit reached — check for zero or near-zero damage values.");
                if (A.hits === 0){ outOfHits = true; break; }
              }
              if (outOfHits) break;
            }
            if (outOfHits) break;          // PHP: break 2 -> exits while(hits)
            if (!fought){ breakTypeLoop = true; break; }  // PHP: break 2 -> next type
          }
          if (breakTypeLoop) break;
        }
      }
    }
  }

  if (repellers.length){
    runSide(invaderDamages,  repellerDefenders, defenderBonus === "Yes");
    runSide(repellerDamages, invaderDefenders,  false);
  }

  // --- apply casualties
  const log = [];
  for (const [aid, did] of hitOrder){
    log.push({aid, did, damage: round6(damageinfo[aid][did]), hits: hitinfo[aid][did]});
  }

  const casualties = [];
  Object.values(units).forEach(u=>{
    const dealt = Math.floor(round6(u.damage));
    u.lost = 0; u.dead = false;
    if (dealt > 0){
      if (dealt < u.size){ u.lost = dealt; u.remaining = u.size - dealt;
        casualties.push({kind:"hurt", uid:u.force_id, lost:dealt}); }
      else { u.lost = u.size; u.remaining = 0; u.dead = true;
        casualties.push({kind:"kill", uid:u.force_id}); }
    } else { u.remaining = u.size; }
  });

  return {units, invaders, repellers, log, casualties, stalls};
}

const round3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
const round6 = n => Math.round((n + Number.EPSILON) * 1e6) / 1e6;

/* ===================================================================
   5. RESULTS RENDERING
   =================================================================== */

const fmt = n => Number.isInteger(n) ? String(n) : String(round3(n));

// What the unit actually fights with, after the alicorn override and the
// id-0 scrounged fallbacks. Mirrors buildUnit().
function effectiveStats(type, weapon, armor){
  const dmg = {}, arm = {};
  if (type === "Alicorns"){
    TYPE_NUMS.forEach(n=>{ dmg[TYPES[n]] = 10; arm[TYPES[n]] = 0.1; });
  } else {
    const wd = WEAPON_DEFS[weapon], ad = ARMOR_DEFS[armor];
    TYPE_NUMS.forEach(n=>{
      const t = TYPES[n];
      dmg[t] = (!WEAPON_IDS[weapon] || !wd) ? 0.25 : Number(wd[t]);
      arm[t] = (!ARMOR_IDS[armor]  || !ad) ? 1    : Number(ad[t]);
    });
  }
  return {dmg, arm};
}

function tipHTML(type, weapon, armor, size, training){
  const {dmg, arm} = effectiveStats(type, weapon, armor);
  const rows = TYPE_NUMS.map(n=>{
    const t = TYPES[n];
    return `<tr><td>${t.charAt(0).toUpperCase()+t.slice(1)}</td>
      <td class="mono" style="text-align:right;color:var(--atk)">${fmt(dmg[t])}</td>
      <td class="mono" style="text-align:right;color:var(--def)">${fmt(arm[t])}</td></tr>`;
  }).join("");
  const w = gearCost("weapon", weapon), a = gearCost("armor", armor);
  const n = (size != null && size !== "") ? Math.max(0, parseInt(size, 10) || 0) : 1;
  const gres = addRes(addRes({}, w.res, n), a.res, n);
  const uc = UNIT_COST[type] || {hire:0, upkeep:{}};

  const upkeep = addRes({}, uc.upkeep, n);
  const hasUpkeep = Object.keys(upkeep).some(k=>upkeep[k]);

  return `<div class="tip-head">
      <div>
        ${buildSprite(type, weapon, armor, false)}
        ${hasUpkeep ? `<div class="tip-upkeep" title="Upkeep per 12 hours">${resChips(upkeep)}</div>` : ""}
      </div>
      <div>
        <div class="tip-title">${esc(type)}</div>
        ${size != null
          ? `<div class="small mono muted">size ${esc(size)} \u00b7 training ${esc(training)}</div>`
          : ""}
        <div class="small mono">${money(uc.hire * n)}</div>
      </div>
    </div>
    <table class="tip-table">
      <thead><tr>
        <th>vs</th>
        <th style="text-align:right;color:var(--atk)">${esc(label(weapon))}</th>
        <th style="text-align:right;color:var(--def)">${esc(label(armor))}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="tip-cost">
      <div>Equipment <span class="bits">${money((w.bits + a.bits) * n)}</span></div>
      <div>Total <span class="bits">${money(uc.hire * n + (w.bits + a.bits) * n)}</span></div>
      <div style="margin-top:4px">${resChips(gres)}</div>
    </div>`;
}

function tipAttrs(type, weapon, armor, size, training){
  return `data-tip-t="${esc(type)}" data-tip-w="${esc(weapon)}" data-tip-a="${esc(armor)}"` +
         (size != null ? ` data-tip-size="${esc(size)}" data-tip-train="${esc(training)}"` : "");
}

/* both the long name and the unit's own name go out; the Use names box picks
   which shows. `gear`, when given, is the piece whose icon Use icons puts in
   front — the swinger's weapon, the one struck's armour; Show weapon and
   armor swaps that for both pieces, armour first on the one swinging. */
const TRAIN_IMG = imgUrl("Training"), AMMO_IMG = imgUrl("Ammo");
/* `x`, from an exchange, adds what the clean log can show beside the unit:
   train — its training, when the two sides' differ; ammo/ammoAfter — the
   hits it had going in and coming out; was/now — its size before and after
   being struck */
function unitRef(u, gear, swing, x){
  const img = k => k && gearImgSrc(k, true) ? fightImg(k) : "";
  const pair = img(u.weapon) + img(u.armor);
  const nm = u.nick ? " ref-named" : "";
  const ic = (img(gear) ? `<span class="ref-ic ref-one${swing ? " ref-swing" : ""}${nm}">${img(gear)}</span>` : "") +
             (pair ? `<span class="ref-ic ref-both${swing ? " ref-swing" : ""}${nm}">${pair}</span>` : "");
  x = x || {};
  const ammo = x.ammo != null
    ? `<span class="ref-ammo"><img src="${AMMO_IMG}" alt="" title="Hits left"><span class="n-was">${money(x.ammo)}</span><span class="n-arr">→</span>${money(x.ammoAfter)}</span>` : "";
  const chg = x.was != null
    ? `<span class="n-chg">(<span class="n-was">${money(x.was)}</span><span class="n-arr">→</span>${money(x.now)})</span>` : "";
  return `${ammo}${ic}<span class="unit-ref ${u.attack_mission ? "ref-atk" : "ref-def"}${swing ? " ref-swinger" : ""}"
    ${tipAttrs(u.origType, u.weapon, u.armor, u.size, u.training)}><span class="ref-sys">${esc(u.name).replace(/size_\d+/, "<span class=\"ref-size\">$&</span>")}</span>${
    swing ? `<span class="ref-num ref-lead">${x.leadW > String(u.size).length
      ? `<span class="lead-pad">${"\u2007".repeat(x.leadW - String(u.size).length)}</span>` : ""}${esc(u.size)}</span>` : ""}<span class="ref-kit">${
    esc(label(u.weapon))} + ${esc(label(u.armor))}</span>${
    u.nick ? `<span class="ref-nick">${esc(u.nick)}</span>` : ""}${
    ""}<span class="ref-num"><span class="n-plain">${esc(u.size)}</span>${chg}</span>${
    x.train ? `<span class="ref-train"><img src="${TRAIN_IMG}" alt="" title="Training">${esc(u.training)}</span>` : ""}</span>`;
}

/* whether the armour side counts the weapon each suit is worn with: it is
   bought beside the suit and goes down with the troop that carries it */
let PIN_WITH_WPN = true;
/* the hover-card namespace a compare is being built under: "pin" for the
   locked window, "hov" for the one riding the pointer, so drawing one never
   drops the other's cards */
let PIN_NS = "pin";
/* and whether the weapon side counts the armour each weapon is carried in */
let PIN_WITH_ARM = false;
/* build a damage figure's compare for hovering rather than locking */
function hoverPinHTML(key){
  const build = PINS.get(key);
  if (!build) return "";
  PIN_NS = "hov";
  try { return build(); } finally { PIN_NS = "pin"; }
}
/* whether the armour side's raise / skim column is pulled out */
let PIN_HOLD = false;
/* and the weapon side's matching column */
let PIN_WHOLD = false;

/* a mouse, left button lit */
const M1_ICON = `<svg class="m1-ic" viewBox="0 0 16 22" width="9" height="12" aria-label="left click">
  <rect x="1" y="1" width="14" height="20" rx="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M8 1.7A6.3 6.3 0 0 0 1.7 8V9H8z" fill="currentColor" opacity=".6"/>
  <path d="M8 1v8M1.2 9h13.6" stroke="currentColor" stroke-width="1.2"/></svg>`;

/* invaders in red, defenders in blue, whichever of them is swinging */
const sideCol = u => u.attack_mission ? "var(--atk)" : "var(--def)";

/* ---- hover math for a single exchange-log damage figure ---- */
function dmgMathTip(A, D, l, bonusApplied, extra){
  const vsDef = TYPES[D.type];        // what the attacker's weapon rates against
  const vsAtk = TYPES[A.type];        // what the defender's armor rates against
  const base = A.dmg[vsDef];
  const armv = D.arm[vsAtk];
  const tExp = (A.training - D.training) / 20;
  const tMul = Math.pow(1.5, tExp);
  const rounded = round3(base * armv * tMul);
  const perHit = bonusApplied ? rounded * 0.75 : rounded;
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

  return `<div class="tip-title tip-title-m1">Damage breakdown ${M1_ICON}</div>${extra || ""}
    <table class="tip-math" style="margin-top:6px">
      <tr><td><span style="color:${sideCol(A)}">${esc(label(A.weapon))}</span>
              <span class="muted">vs ${cap(vsDef)}</span></td>
          <td class="n" style="color:${sideCol(A)}">${fmt(base)}</td></tr>
      <tr><td><span style="color:${sideCol(D)}">${esc(label(D.armor))}</span>
              <span class="muted">vs ${cap(vsAtk)}</span></td>
          <td class="n" style="color:${sideCol(D)}">×${fmt(armv)}</td></tr>
      <tr><td>training <span class="muted">${A.training} vs ${D.training}</span></td>
          <td class="n">×${fmt(round3(tMul))}</td></tr>
      ${bonusApplied ? `<tr><td>defender bonus</td><td class="n">×0.75</td></tr>` : ""}
      <tr class="tot"><td>per hit</td><td class="n">${fmt(perHit)}</td></tr>
      <tr><td class="muted">× ${l.hits} hit${l.hits === 1 ? "" : "s"}</td>
          <td class="n">${fmt(l.damage)}</td></tr>
    </table>
`;
}

/* ---- the same exchange with other gear -----------------------------
   Every figure is one piece swapped and everything else held still: the
   same hits land, training and the defender bonus apply as before, and the
   per-hit figure is rounded the way simulate() rounds it. */
function exchangePerHit(base, armv, A, D, bonusApplied){
  const d = round3(base * armv * Math.pow(1.5, (A.training - D.training) / 20));
  return bonusApplied ? d * 0.75 : d;
}

function gearCompare(kind, A, D, l, bonusApplied){
  const isW = kind === "weapon";
  const U = isW ? A : D;                              // whose gear is being swapped
  const tipBg = U.attack_mission ? "var(--paper-atk)" : "var(--paper-def)";   // its side's paper, as the panel wears
  const cur = isW ? A.weapon : D.armor;
  const vs = isW ? TYPES[D.type] : TYPES[A.type];
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const pool = (LOADOUTS[U.origType] || {})[isW ? "weapons" : "armor"] || [cur];
  const n = U.size;

  /* the hits actually swung in this exchange, or the swinger's full size when asked */
  const H = PREFS.fullHits ? A.size : l.hits;
  /* what the struck stack had standing when this exchange began, unless full sizes are asked for */
  const Sd = PREFS.fullHits ? D.size : Math.max(0, D.size - Math.floor(round6(l.prevTaken || 0)));
  const Dw = gearCost("weapon", D.weapon), Da = gearCost("armor", D.armor);
  /* the weapon the armour side carries with each suit, or nothing when
     the attached-weapon box is off */
  const Aw = isW || PIN_WITH_WPN ? Dw : {bits:0, res:{}};
  /* the armour the weapon side carries with each weapon, only when its box is on */
  const Wa = isW && PIN_WITH_ARM ? gearCost("armor", A.armor) : {bits:0, res:{}};

  const calc = key=>{
    const st = effectiveStats(U.origType, isW ? key : U.weapon, isW ? U.armor : key);
    const stat = isW ? st.dmg[vs] : st.arm[vs];
    const base = isW ? stat : A.dmg[TYPES[D.type]];
    const armv = isW ? D.arm[TYPES[A.type]] : stat;
    const ph = exchangePerHit(base, armv, A, D, bonusApplied);
    const dmg = Math.floor(round6(ph * H));
    const c = gearCost(kind, key), w = isW ? Wa : Aw;
    return {key, stat, ph, dmg, bits: (c.bits + w.bits) * n, res: addRes(addRes({}, c.res, n), w.res, n)};
  };
  const now = calc(cur);
  if (H === l.hits) now.dmg = Math.floor(l.damage);  // the figure that was clicked

  /* the wide view: what the swap does to the bill. Troops lost are this
     exchange's damage, floored and capped at the stack, as casualties are.
     Armour: the new kit, then the troops (and the kit on them) that die
     more or less, then the two together. Weapon: the new kit, then the
     enemy troops and value that go down more or less. */
  const hire = u => (UNIT_COST[u.origType] || {hire:0}).hire;
  const dead = r => Math.min(Sd, Math.floor(r.dmg));
  const lossOf = r=>{
    const k = dead(r);
    if (isW) return {k, bits: k * (hire(D) + Dw.bits + Da.bits),
                     res: addRes(addRes({}, Dw.res, k), Da.res, k)};
    const a = gearCost("armor", r.key);
    return {k, bits: k * (hire(D) + Aw.bits + a.bits),
            res: addRes(addRes({}, Aw.res, k), a.res, k)};
  };
  const nowLoss = lossOf(now);
  const resSub = (x, y) => { const o = addRes({}, x); addRes(o, y, -1); return o; };
  const sgn = v => !v ? "±0" : (v > 0 ? "+" : "−") + money(Math.abs(v));
  const less = v => v < 0, more = v => v > 0;

  /* ---- the working behind each figure, for its hover card ----
     `res` picks one resource; without it the figure is in bits.
     kitUnit is one piece of this side's gear; perLoss is one dead troop
     rebought: raise (bits only), plus the weapon and armour it carried */
  const kitUnit = (key, res) => res ? (gearCost(kind, key).res[res] || 0) : gearCost(kind, key).bits;
  const perLoss = (key, res)=>{              // one dead troop, rebought with its kit
    const a = isW ? Da : gearCost("armor", key);
    return res ? (Aw.res[res] || 0) + (a.res[res] || 0) : hire(D) + Aw.bits + a.bits;
  };
  const tr = (a, b, cls) => `<tr${cls ? ` class="${cls}"` : ""}><td>${a}</td><td class="n">${b}</td></tr>`;
  const gearTag = key => `<span class="gtag">${fightImg(key)}${esc(label(key))}</span>`;
  /* the net card: the dead each piece leaves behind. Only the dead are
     spent: a survivor keeps its kit, and a dead one's kit was already bought
     in the fielding, so the net is what the fight burns and nothing more. */
  const tipNet = (r, res)=>{
    const ico = res ? resIcon(res) : BIT;
    const deadRow = x=>{
      const k = dead(x), p1 = perLoss(x.key, res);
      return tr(`${gearTag(x.key)}: ${money(k)} dead
        <span class="muted">× ${money(p1)}</span> ${ico}`, money(k * p1));
    };
    const lossD = dead(r) * perLoss(r.key, res) - dead(now) * perLoss(now.key, res);
    return `<div data-tip-bg="${tipBg}"><div class="tip-title">${gearTag(r.key)} <span class="muted">vs</span> ${gearTag(now.key)} – ${ico}</div>
      <div class="small" style="margin:8px 0 2px">Killed${res ? "" : ` <span class="muted">(raise ${money(hire(D))} each, with their kit)</span>`}</div>
      <table class="tip-math">${deadRow(r)}${deadRow(now)}${tr("net", sgn(lossD), "tot")}</table></div>`;
  };

  /* weapon cards: the swing and what it brings down, laid out like the net card */
  /* equipped vs hypothetical, then what one of each takes of this resource */
  const wTitle = (r, res)=>{
    const ico = res === false ? "" : res ? resIcon(res) : BIT;
    const pair = r === now ? [now] : [now, r];
    return `<div class="tip-title">${pair.map(x => gearTag(x.key)).join(` <span class="muted">vs</span> `)}</div>${
      res === false ? "" : `<div style="margin-top:5px">${pair.map(x =>
        `<div class="tl">${esc(label(x.key))}<span class="muted">›</span> ${ico} ${w_(money(kitUnit(x.key, res)))}</div>`).join("")}</div>
      <div class="tl-hr"></div>`}`;
  };
  const wRow = (x, right, mid) => tr(`${gearTag(x.key)}: ${mid}`, right);
  const tipWKills = r => wTitle(r, false) + `<table class="tip-math" style="margin-top:6px">${
    [r, now].filter((x, i) => !i || r !== now).map(x =>
      wRow(x, `${money(dead(x))} killed`, `<b class="w">${money(x.dmg)}</b> dmg dealt`)).join("")}${
    r === now ? "" : tr("difference", sgn(dead(r) - dead(now)), "tot")}</table>`;
  /* what each weapon takes out of the enemy, worked in the enemy's own worth */
  const tipWorth = (r, res)=>{
    const ico = res ? resIcon(res) : BIT, per = perLoss(r.key, res);
    const pair = r === now ? [now] : [now, r];
    return wTitle(r, false) +
      `<div class="tl" style="margin-top:5px"><span class="muted">each of theirs:</span> <span class="gtag">${fightImg(D.weapon)}</span>+ <span class="gtag">${
        fightImg(D.armor)}</span>${res ? "" : ` <span class="muted">+ raise</span>`} = ${ico} ${w_(money(per))}</div><div class="tl-hr"></div>
      ${pair.map(x => tl(`${esc(label(x.key))}<span class="muted">›</span> ${w_(money(dead(x)))} killed = ${ico} ${w_(money(dead(x) * per))}`)).join("")}${
        r === now ? "" : tl(`difference = ${ico} ${w_(sgn((dead(r) - dead(now)) * per))}`, "tot")}`;
  };
  const tipped = (html, tip) => `<span class="has-ntip" data-tip-key="${regTip(
    tip.startsWith("<div data-tip-bg") ? tip : `<div data-tip-bg="${tipBg}">${tip}</div>`, PIN_NS)}">${html}</span>`;

  /* `good` may name a class outright instead of saying good or bad */
  const tone = (good, v) => { const g = good(v); return typeof g === "string" ? g : g ? "cmp-up" : "cmp-down"; };
  const signed = (v, good, tip) => tipped(!v ? `<b class="cmp-same">±0</b>`
    : `<b class="${tone(good, v)}">${sgn(v)}</b>`, tip);
  /* one resource to a line; with no `good` they are plain amounts, not changes.
     `act`, when given, is the amount itself, shown small and grey after the change */
  const chips = (res, good, tip, act) => RES_ORDER.filter(k => Math.round(res[k] || 0)).map(k=> tipped(good
    ? `<span class="cx-chip ${tone(good, res[k])}">${resIcon(k)}${sgn(res[k])}${
        act ? `<span class="cx-act">(${money(act[k] || 0)})</span>` : ""}</span>`
    : `<span class="cx-chip">${resIcon(k)}${money(res[k])}</span>`, tip(k))).join("");
  /* the bits figure's own amount, short, in the grey brackets */
  const actBits = v => `<span class="cx-act">(${shortBits(v)})</span>`;
  const line = (k, html, cls, res) => `<div class="${cls || ""}"><div class="cx-line"><span class="cx-k">${k}</span>${html}</div>${
    res ? `<div class="cx-res">${res}</div>` : ""}</div>`;

  /* weapons: the kit, then the kills and what they were worth.
     armour: just the net of the kit and the troops that die more or less. */
  const troops = `<span class="muted">troops</span>`;
  /* the equipped piece's own burn, which every net is measured from */
  const tipBase = res=>{
    const ico = res ? resIcon(res) : BIT, per = perLoss(now.key, res), k = dead(now);
    return `<div class="tip-title">${esc(label(now.key))}, as fought ${ico}</div>
      <div class="small" style="margin:6px 0 2px">Killed${res ? "" : ` <span class="muted">(raise ${money(hire(D))} each, with their kit)</span>`}</div>
      <table class="tip-math">${tr(`${gearTag(now.key)}: ${money(k)} dead
        <span class="muted">× ${money(per)}</span> ${ico}`, money(k * per), "tot")}</table>`;
  };
  const extra = (r, isCur)=>{
    const L = lossOf(r);
    if (isCur) return isW
      ? line("kills", tipped(`<b>${money(L.k)}</b>`, tipWKills(r)) + troops + `<span class="cx-hits">(${money(l.hits)} hits)</span>`) +
        line("", tipped(`<b>${money(L.bits)}</b>`, tipWorth(r, null)), "", chips(L.res, null, k => tipWorth(r, k)))
      : line("loss<br>base", tipped(`<b>${money(L.bits)}</b>`, tipBase(null)), "", chips(L.res, null, k => tipBase(k)));
    const kitB = r.bits - now.bits, kitR = resSub(r.res, now.res);
    const lossB = L.bits - nowLoss.bits, lossR = resSub(L.res, nowLoss.res);
    if (isW) return line("kills", signed(L.k - nowLoss.k, more, tipWKills(r)) + troops) +
      line("", signed(lossB, more, tipWorth(r, null)) + actBits(L.bits), "", chips(lossR, more, k => tipWorth(r, k), L.res));
    /* a saving on a stack that is wiped out anyway is no clear win: yellow, not green */
    const netTone = r.dmg >= Sd ? (v => v < 0 ? "cmp-amb" : false) : less;
    return line("net", signed(lossB, netTone, tipNet(r, null)) + actBits(L.bits), "", chips(lossR, netTone, k => tipNet(r, k), L.res));
  };

  /* ---- armour: the stack sized to the hits. One that falls could be
     raised until one is left standing; one with room to spare could be
     skimmed down to that same one. If the equipped piece leaves more
     standing, parity is what it takes for this piece to match it. Each is
     the troops raised (or not) in full kit, with their upkeep; the hits all
     still kill, so a bigger stack only burns more. */
  const S = Sd;
  const upk = (UNIT_COST[D.origType] || {upkeep:{}}).upkeep;
  const survivors = r => Math.max(0, S - dead(r));
  /* re-equipping the troops already there with this piece; nothing on the equipped row */
  const swapOf = (r, res) => r === now ? 0 : S * (kitUnit(r.key, res) - kitUnit(now.key, res));
  const plan = (r, E, res) => E * perLoss(r.key, res) + swapOf(r, res);
  /* the fewest hits at `ph` a piece that lands `T` damage needs */
  const hitsTo = (ph, T)=>{
    if (!(T > 0)) return 0;
    if (!(ph > 0)) return Infinity;
    let h = Math.max(1, Math.ceil(T / ph - 1e-9));
    while (Math.floor(round6(ph * h)) < T) h++;
    while (h > 1 && Math.floor(round6(ph * (h - 1))) >= T) h--;
    return h;
  };
  const dmgAt = (r, h) => Math.floor(round6(r.ph * h));
  /* parity soaks what the equipped piece soaked: every hit if it stood, or
     the hits it took to fall if it fell, and leaves as many standing */
  const soaked = survivors(now) > 0 ? H : Math.min(H, hitsTo(now.ph, S));
  const parityOf = r => dmgAt(r, soaked) + survivors(now) - S;
  /* ---- the plan cards: the working, one line at a time ---- */
  const tMul = Math.pow(1.5, (A.training - D.training) / 20);
  const tl = (html, cls) => `<div class="tl${cls ? " " + cls : ""}">${html}</div>`;
  const tlHr = `<div class="tl-hr"></div>`;
  const nS = v => v > 0 ? "+" + money(v) : v < 0 ? "−" + money(-v) : "0";
  const w_ = v => `<b class="w">${v}</b>`;
  /* weapon (stat) vs armour (×stat), with training and the bonus if they apply */
  const phLine = (wKey, wStat, aKey, aStat, ph) => tl(`${gearTag(wKey)} (${w_(fmt(wStat))})
    <span class="muted">vs</span> ${gearTag(aKey)} (×${w_(fmt(aStat))})${
    Math.abs(tMul - 1) > 1e-9 ? ` × ${fmt(round3(tMul))} <span class="muted">training</span>` : ""}${
    bonusApplied ? ` × 0.75 <span class="muted">bonus</span>` : ""} = ${w_(fmt(round3(ph)))} dmg`);
  const approx = (T, ph, need) => Math.abs(T / ph - need) < 1e-9 ? "" : "~";
  const costLines = (E, per, ico, swapN, u1, u0, total) =>
    (E ? tl(`${nS(E)} × ${ico} ${money(per)} = ${ico} ${w_(sgn(E * per))}`) : "") +
    (swapN != null && u1 !== u0 ? tl(`swap ${money(swapN)} × (${ico} ${money(u1)} − ${ico} ${money(u0)}) = ${ico} ${w_(sgn(swapN * (u1 - u0)))}`) : "") +
    tl(`total = ${ico} ${w_(sgn(total))}`, "tot");
  const tipPlan = (r, E, kind, res)=>{
    const ico = res ? resIcon(res) : BIT, p1 = perLoss(r.key, res), up = E > 0, X = S + E;
    const arm = r2 => phLine(A.weapon, A.dmg[TYPES[D.type]], r2.key, r2.stat, r2.ph);
    const title = kind === "parity"
      ? `<div class="tip-title">${gearTag(now.key)} <span class="muted">vs</span> ${gearTag(r.key)} – ${ico}</div>`
      : `<div class="tip-title">${esc(label(r.key))}, ${up ? "raised" : "skimmed"} ${ico}</div>`;
    const work = kind === "parity"
      ? arm(now) + tl(`${fmt(round3(now.ph))} × ${money(soaked)} hits = ${w_(money(dmgAt(now, soaked)))} damage${
          survivors(now) ? `, ${w_(money(survivors(now)))} left` : ""}`) + tlHr +
        arm(r) + tl(`${fmt(round3(r.ph))} × ${money(soaked)} hits = ${w_(money(dmgAt(r, soaked)))} damage`) +
        tl(`${money(dmgAt(r, soaked))} + ${money(survivors(now))} standing = ${w_(money(X))}`) +
        tl(`${money(X)} − ${money(S)} = ${w_(nS(E))}`)
      : arm(r) + tl(`${fmt(round3(r.ph))} × ${money(H)} hits = ${w_(money(r.dmg))} damage`) +
        tl(`${money(r.dmg)} + 1 standing = ${w_(money(X))}`) +
        tl(`${money(X)} − ${money(S)} = ${w_(nS(E))}`);
    return `<div data-tip-bg="${tipBg}">${title}<div style="margin-top:6px">${work}${tlHr}${
      costLines(E, p1, ico, r === now ? null : S, kitUnit(r.key, res), kitUnit(now.key, res), plan(r, E, res))}</div></div>`;
  };
  /* upkeep per 12 hours for the troops a plan adds or drops */
  /* the grey bracket after each is the whole resized stack's upkeep */
  const upkChips = (E, good, X, u) => !E ? "" : Object.keys(u || upk).filter(k => (u || upk)[k]).map(k=>
    `<span class="cx-chip cx-upk ${good(E) ? "cmp-up" : "cmp-down"}">${resIcon(k)}${sgn(E * (u || upk)[k])}<span class="muted">/12h</span>${
      X != null ? `<span class="cx-act">(${money(X * (u || upk)[k])})</span>` : ""}</span>`).join("");
  /* a resized stack in full kit, resource by resource: the bracketed actuals */
  const stackRes = (X, per) => RES_ORDER.reduce((o, k)=>{ o[k] = X * per(k); return o; }, {});
  const planBlock = (r, E, kind)=>{
    const cls = kind === "parity" ? "cmp-par" : E > 0 ? "cmp-down" : "cmp-up";
    const word = kind === "parity" ? "parity" : E > 0 ? "raise" : "skim";
    const xr = RES_ORDER.reduce((o, k)=>{ const v = plan(r, E, k); if (v) o[k] = v; return o; }, {});
    return `<div class="sz${word === "skim" ? " sz-skim" : word === "raise" ? " sz-raise" : " sz-par"}"><div class="sz-k"><span class="${cls}">${word}</span>
        <b class="sz-n ${cls}">${E ? (E > 0 ? "+" : "−") + money(Math.abs(E)) : "±0"}</b><span class="cx-act sz-act">(${money(S + E)})</span></div>
      <div class="sz-v"><div class="cx-line">${signed(plan(r, E, null), less, tipPlan(r, E, kind, null))}${actBits((S + E) * perLoss(r.key, null))}</div>
        <div class="cx-res">${chips(xr, less, k => tipPlan(r, E, kind, k), stackRes(S + E, k => perLoss(r.key, k)))}${
          upkChips(E, less, S + E)}</div></div></div>`;
  };
  /* ---- weapon: the swinging stack sized to deal as much as the equipped
     weapon does, overkill and all. Every troop is one hit, so a weaker
     weapon needs more of them (parity) and a stronger one fewer (skim).
     Each is the troops raised or dropped in full kit, with their upkeep. */
  const Aa = Wa;                                         // attached armour, or none
  const upkA = (UNIT_COST[A.origType] || {upkeep:{}}).upkeep;
  const K = now.dmg;                                     // the damage to match
  const hitsFor = r => K ? hitsTo(r.ph, K) : H;
  const perA = (key, res)=>{
    const w = gearCost("weapon", key);
    return res ? (w.res[res] || 0) + (Aa.res[res] || 0) : hire(A) + w.bits + Aa.bits;
  };
  const swapW = (r, res) => r === now ? 0 : A.size * (kitUnit(r.key, res) - kitUnit(now.key, res));
  const planW = (r, E, res) => E * perA(r.key, res) + swapW(r, res);
  /* kind "parity": match the equipped weapon's damage; kind "raise": wipe the
     struck stack outright, for a weapon that falls short of it */
  const needFor = (r, kind) => kind === "raise" || kind === "skim" ? hitsTo(r.ph, Sd) : hitsFor(r);
  const tipWPlan = (r, E, res, kind)=>{
    const ico = res ? resIcon(res) : BIT, p1 = perA(r.key, res), up = E > 0, need = needFor(r, kind);
    const wpn = r2 => phLine(r2.key, r2.stat, D.armor, D.arm[TYPES[A.type]], r2.ph);
    const title = kind === "parity"
      ? `<div class="tip-title">${gearTag(now.key)} <span class="muted">vs</span> ${gearTag(r.key)} – ${ico}</div>`
      : `<div class="tip-title">${esc(label(r.key))}, ${kind === "raise" ? "raised to wipe them" : "skimmed, still wiping them"} ${ico}</div>`;
    const work = kind === "parity"
      ? wpn(now) + tl(`${fmt(round3(now.ph))} × ${money(H)} hits = ${w_(money(K))} damage`) + tlHr +
        wpn(r) + tl(`${money(K)} / ${fmt(round3(r.ph))} = ${w_(money(need))}${approx(K, r.ph, need)} hits`)
      : wpn(r) + tl(`${money(Sd)} standing / ${fmt(round3(r.ph))} = ${w_(money(need))}${approx(Sd, r.ph, need)} hits`);
    return `<div data-tip-bg="${tipBg}">${title}<div style="margin-top:6px">${work}${
      tl(`${money(need)} − ${money(H)} = ${w_(nS(E))}`)}${tlHr}${
      costLines(E, p1, ico, r === now ? null : A.size, kitUnit(r.key, res), kitUnit(now.key, res), planW(r, E, res))}</div></div>`;
  };
  const wBlock = (r, E, kind)=>{
    const up = E >= 0, cls = kind === "raise" ? "cmp-down" : kind === "skim" ? "cmp-up" : "cmp-par";
    const xr = RES_ORDER.reduce((o, k)=>{ const v = planW(r, E, k); if (v) o[k] = v; return o; }, {});
    const X = A.size + E;                      // the swinging stack, resized
    return `<div class="sz${kind === "raise" ? " sz-raise" : kind === "skim" ? " sz-skim" : " sz-par"}"><div class="sz-k"><span class="${cls}">${kind}</span>
        <b class="sz-n ${cls}">${E ? (up ? "+" : "−") + money(Math.abs(E)) : "±0"}</b><span class="cx-act sz-act">(${money(X)})</span></div>
      <div class="sz-v"><div class="cx-line">${signed(planW(r, E, null), less, tipWPlan(r, E, null, kind))}${actBits(X * perA(r.key, null))}</div>
        <div class="cx-res">${chips(xr, less, k => tipWPlan(r, E, k, kind), stackRes(X, k => perA(r.key, k)))}${
          upkChips(E, less, X, upkA)}</div></div></div>`;
  };
  /* the equipped weapon's own army: what it cost to raise and kit, and its upkeep */
  const tipWBase = res=>{
    const ico = res ? resIcon(res) : BIT, per = perA(now.key, res);
    return `<div data-tip-bg="${tipBg}"><div class="tip-title">${esc(label(now.key))}, as fielded ${ico}</div>
      <table class="tip-math" style="margin-top:6px">${tr(`${money(A.size)} <span class="muted">× ${money(per)}</span> ${ico}
        <div class="small muted">each: ${res ? "" : `raise ${money(hire(A))} + `}${esc(label(now.key))} ${money(res ? (gearCost("weapon", now.key).res[res] || 0) : gearCost("weapon", now.key).bits)}
          ${PIN_WITH_ARM ? `+ ${esc(label(A.armor))} ${money(res ? (Aa.res[res] || 0) : Aa.bits)}` : ""}</div>`, money(A.size * per), "tot")}</table></div>`;
  };
  const wBase = ()=>{
    const xr = RES_ORDER.reduce((o, k)=>{ const v = A.size * perA(now.key, k); if (v) o[k] = v; return o; }, {});
    const upk = Object.keys(upkA).filter(k => upkA[k]).map(k=>
      `<span class="cx-chip cx-upk">${resIcon(k)}${money(A.size * upkA[k])}<span class="muted">/12h</span></span>`).join("");
    return `<div class="sz"><div class="sz-k"><span class="muted">base</span>
        <b class="sz-n">${money(A.size)}</b></div>
      <div class="sz-v"><div class="cx-line">${tipped(`<b>${money(A.size * perA(now.key, null))}</b>`, tipWBase(null))}</div>
        <div class="cx-res">${chips(xr, null, k => tipWBase(k))}${upk}</div></div></div>`;
  };
  const wparCol = r=>{
    if (!isW) return "";
    let out = r === now ? wBase() : "";
    const gap = () => out ? `<div class="sz-gap"></div>` : "";
    /* raise: a weapon that leaves some of the struck stack standing;
       skim: one that wipes them with hits to spare */
    const need = needFor(r, "raise");
    if (!isFinite(need)) out += gap() + `<span class="muted small">can't wipe them</span>`;
    else if (need > H) out += gap() + wBlock(r, need - H, "raise");
    else if (need < H) out += gap() + wBlock(r, need - H, "skim");
    /* parity, either sign: a better weapon needing fewer troops is the whole
       point of the column, so it is never tucked away as a skim. Even at ±0
       the swap itself still costs. */
    if (K && r !== now){
      const need = hitsFor(r);   // parity
      if (!isFinite(need)) out += gap() + `<span class="muted small">can't match</span>`;
      else out += gap() + wBlock(r, need - H, "parity");
    }
    return out;
  };

  /* the equipped armour's own army: what it cost to raise and kit, and its upkeep */
  const tipABase = res=>{
    const ico = res ? resIcon(res) : BIT, per = perLoss(now.key, res);
    return `<div data-tip-bg="${tipBg}"><div class="tip-title">${esc(label(now.key))}, as fielded ${ico}</div>
      <table class="tip-math" style="margin-top:6px">${tr(`${money(S)} <span class="muted">× ${money(per)}</span> ${ico}
        <div class="small muted">each: ${res ? "" : `raise ${money(hire(D))} + `}${esc(label(now.key))} ${money(kitUnit(now.key, res))}
          ${PIN_WITH_WPN ? `+ ${esc(label(D.weapon))} ${money(res ? (Dw.res[res] || 0) : Dw.bits)}` : ""}</div>`, money(S * per), "tot")}</table></div>`;
  };
  const aBase = ()=>{
    const xr = RES_ORDER.reduce((o, k)=>{ const v = S * perLoss(now.key, k); if (v) o[k] = v; return o; }, {});
    const up = Object.keys(upk).filter(k => upk[k]).map(k=>
      `<span class="cx-chip cx-upk">${resIcon(k)}${money(S * upk[k])}<span class="muted">/12h</span></span>`).join("");
    return `<div class="sz"><div class="sz-k"><span class="muted">base</span>
        <b class="sz-n">${money(S)}</b></div>
      <div class="sz-v"><div class="cx-line">${tipped(`<b>${money(S * perLoss(now.key, null))}</b>`, tipABase(null))}</div>
        <div class="cx-res">${chips(xr, null, k => tipABase(k))}${up}</div></div></div>`;
  };
  const sizeCol = r=>{
    if (isW) return "";
    if (r === now){
      const E = r.dmg + 1 - S;
      return aBase() + (E ? `<div class="sz-gap"></div>` + planBlock(r, E, "size") : "");
    }
    const E = r.dmg + 1 - S;                   // one left standing: + raise, − skim
    const P = parityOf(r);                     // soaking and standing level with the equipped piece
    const par = r !== now && (P !== 0 || !E);
    return (E ? planBlock(r, E, "size") : "") + (par ? `<div class="sz-gap"></div>` + planBlock(r, P, "parity") : "");
  };

  /* what one piece costs, greyed, under what the stack's worth costs */
  const oneOf = key=>{
    const g = gearCost(kind, key), w = isW ? Wa : Aw;
    const c = {bits: g.bits + w.bits, res: addRes(addRes({}, g.res), w.res)};
    return `<span class="cmp-one"><span>[1x] ${money(c.bits)}</span>${
      Object.keys(c.res).length ? `<span class="cmp-res">${resChips(c.res)}</span>` : ""}</span>`;
  };
  /* each row carries the other piece it is counted with, greyed: the
     struck unit's weapon under armour, the swinger's armour under weapons */
  const icons = key => isW ? (PIN_WITH_ARM ? `${fightImg(key)}<span class="cmp-wpn">${fightImg(A.armor)}</span>` : fightImg(key))
    : PIN_WITH_WPN ? `${fightImg(key)}<span class="cmp-wpn">${fightImg(U.weapon)}</span>` : fightImg(key);

  /* ---- the equipped row's warnings: hits already spent elsewhere, or a
     stack already hit before; each opens the exchanges behind it */
  const miniLog = (title, pick, show)=>{
    const us = l.unitsAll || {}, lg = l.logAll || [];
    /* after each line: the swinger's hits still in hand, the struck stack still standing */
    const spent = {}, taken = {};
    return `<div class="tip-title">${title}</div><div class="ml-box">${lg.map((x, j)=>{
      const a = us[x.aid], d = us[x.did];
      spent[x.aid] = (spent[x.aid] || 0) + x.hits;
      taken[x.did] = (taken[x.did] || 0) + x.damage;
      if (!pick(x)) return "";
      const swings = Math.max(0, a.size - spent[x.aid]);
      const standing = Math.max(0, d.size - Math.floor(round6(taken[x.did])));
      return `<div class="ml${j === l.logIdx ? " ml-cur" : ""}">${unitRef(a, a.weapon, true, {train: a.training !== d.training})} hit ${unitRef(d, d.armor, false, {train: a.training !== d.training})} for <b class="w">${fmt(x.damage)}</b>
        <span class="muted">(${money(x.hits)} hits)</span> → ${show === "swings"
          ? `<b class="w">${money(swings)}</b> <span class="muted">swings left</span>`
          : `<b class="w">${money(standing)}</b> <span class="muted">standing</span>`}</div>`;
    }).join("")}</div>`;
  };
  const warnOf = ()=>{
    const lg = l.logAll || [];
    /* with full sizes on, the warning says so instead, in red */
    if (PREFS.fullHits) return `<span class="cmp-warn cmp-warn-full" data-tip-key="${regTip(`<div data-tip-bg="${tipBg}">${
      isW ? miniLog(`${esc(A.nick || A.name)}'s swings`, x => x.aid === l.aid, "swings")
          : miniLog(`Hits on ${esc(D.nick || D.name)}`, x => x.did === l.did, "standing")}</div>`, PIN_NS)}">Using full size instead of actual</span>`;
    if (isW){
      if (l.hits >= A.size) return "";
      return `<span class="cmp-warn" data-tip-key="${regTip(`<div data-tip-bg="${tipBg}">${
        miniLog(`${esc(A.nick || A.name)}'s swings`, x => x.aid === l.aid, "swings")}</div>`, PIN_NS)}">Using ${money(l.hits)} hits of ${money(A.size)} total!</span>`;
    }
    if (!lg.some((x, j) => j < l.logIdx && x.did === l.did)) return "";
    return `<span class="cmp-warn" data-tip-key="${regTip(`<div data-tip-bg="${tipBg}">${
      miniLog(`Hits on ${esc(D.nick || D.name)}`, x => x.did === l.did, "standing")}</div>`, PIN_NS)}">This unit was attacked earlier!</span>`;
  };

  const row = (r, isCur)=>{
    let delta = "";
    if (!isCur){
      const d = r.dmg - now.dmg;
      const good = isW ? d > 0 : d < 0;
      delta = `<span class="${!d ? "cmp-same" : good ? "cmp-up" : "cmp-down"}">${
        !d ? "±0" : (d > 0 ? "+" : "−") + money(Math.abs(d))}</span>`;
    }
    return `<div class="cmp-row${isCur ? " cmp-cur" : ""}">
      <span class="cmp-ic">${icons(r.key)}</span>
      <span class="cmp-name">${esc(label(r.key))}</span>
      <span class="cmp-stat">${isW ? "" : "×"}${fmt(r.stat)}</span>
      <span class="cmp-cost"><span class="bits">${money(r.bits)}</span><span class="cmp-res">${resChips(r.res)}</span>${oneOf(r.key)}</span>
      <span class="cmp-dmg-k">DMG:</span>
      <span class="cmp-dmg"><span>${r.dmg >= Sd
        ? `[${money(Sd)}] ${isW ? "dealt" : "taken"} <span class="muted">(${money(r.dmg)} total)</span>`
        : `${money(r.dmg)} ${isW ? "dealt" : "taken"}`}</span>${delta}</span>
      <div class="cmp-x">${extra(r, isCur)}</div>
      ${isW ? `<div class="cmp-wpar">${wparCol(r)}</div>` : `<div class="cmp-hold">${sizeCol(r)}</div>`}
      ${isCur ? warnOf() : ""}
    </div>`;
  };

  /* Scrounged is the fallback, not a choice, so it always goes last */
  const others = pool.filter(k => k !== cur)
    .sort((a, b) => !!SCROUNGED[a] - !!SCROUNGED[b]).map(calc);


  return `<div class="tip-title pin-grip"><span class="tt-wrap">${isW ? `Weapon Compare<label class="tt-aside" title="Count the armour each weapon is carried in"><input type="checkbox"
          class="pin-arm"${PIN_WITH_ARM ? " checked" : ""}> (+ attached armour)</label>`
      : `Armour Compare<label class="tt-aside" title="Count the weapon each suit is worn with"><input type="checkbox"
          class="pin-wpn"${PIN_WITH_WPN ? " checked" : ""}> (+ attached weapon)</label>`}</span></div>
    <div class="cmp-tag">Equipped</div>
    ${isW ? `<button class="hold-tab" title="${PIN_WHOLD ? "Hide" : "Show"} parity / skim">${PIN_WHOLD ? "›" : "‹"}</button>`
          : `<button class="hold-tab" title="${PIN_HOLD ? "Hide" : "Show"} raise / skim">${PIN_HOLD ? "‹" : "›"}</button>`}
    ${row(now, true)}
    ${others.length ? others.map(r => row(r, false)).join("")
      : `<div class="small muted">Nothing else this unit can ${isW ? "carry" : "wear"}.</div>`}

/* ---- what a side lost, in money and materiel ---- */
function deathCosts(units, isAtk){
  const items = [];
  let troops = 0, hire = 0, gear = 0;
  const res = {};
  Object.values(units).forEach(u=>{
    if ((!!u.attack_mission) !== isAtk) return;
    const n = u.lost || 0;
    if (!n) return;
    const uc = UNIT_COST[u.origType] || {hire:0, upkeep:{}};
    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    const r = addRes(addRes({}, w.res, n), a.res, n);
    troops += n; hire += uc.hire * n; gear += (w.bits + a.bits) * n;
    addRes(res, r);
    items.push({u:{type:u.origType, weapon:u.weapon, armor:u.armor}, n,
                hire: uc.hire * n, gear: (w.bits + a.bits) * n, res:r,
                dead: u.dead, of: u.size});
  });
  const raw = toRaw(res);
  return {items, troops, hire, gear, res, rawRes:raw.res, craftBits:raw.craftBits};
}

/* ---- carry survivors back into the force tables ---- */
let lastResult   = null;   // the most recent simulate() output
let survSnapshot = null;   // pre-apply force lists, so the button can undo

const survivorRows = (units, isAtk) =>
  Object.values(units)
    .filter(u => (!!u.attack_mission) === isAtk && u.remaining > 0)
    .map(u => Object.assign({type:u.origType, weapon:u.weapon, armor:u.armor,
                size:u.remaining, training:u.training}, u.nick ? {name:u.nick} : {}));

function applySurvivors(){
  const btn = document.getElementById("btnApplySurv");
  if (!btn) return;

  if (survSnapshot){                       // second click = undo
    setSide("attacker", survSnapshot.attacker);
    setSide("defender", survSnapshot.defender);
    survSnapshot = null;
    btn.textContent = "Use survivors";
    btn.className = "btn btn-xs btn-warning";
    btn.title = "Replace both force lists";
    return;
  }
  if (!lastResult) return;

  survSnapshot = {attacker: packSide("attacker"), defender: packSide("defender")};
  const fwd = rows => rows.map(u=>Object.assign({type:u.type, weapon:u.weapon, armor:u.armor,
                                     size:u.size, training:u.training}, u.nick ? {name:u.nick} : {}));
  setSide("attacker", survivorRows(lastResult.units, true).concat(fwd(lastReserves.attacker)));
  setSide("defender", survivorRows(lastResult.units, false).concat(fwd(lastReserves.defender)));
  scheduleSave();
  btn.textContent = "Undo";
  btn.className = "btn btn-xs";
  btn.title = "Put the old ones back";
}

/* ---- keep fighting: the survivors of one tick are the forces of the next ----
   The battle on screen is tick 1. This replays up to CHAIN_MAX further
   exchanges from whatever is left standing, the way the solver's multi-tick
   replay does it: both sides fire from their pre-tick strength, the dead are
   removed, and the remainder starts the next tick. Every tick gets the same
   write-up the battle above does — exchange log, casualties, survivors, deaths
   — plus the upkeep it costs, since maintenance is billed per 12 h on everyone
   who starts a tick whether or not they live through it. */
const CHAIN_MAX = 10;
let lastBonus = "No";        // the defender bonus the shown battle was fought under
/* the units held back from the shown battle; they join the survivors on tick 2 */
let lastReserves = {attacker:[], defender:[]};
const reserveCount = () => lastReserves.attacker.length + lastReserves.defender.length;

const troopsOf = rows => rows.reduce((n, u) => n + Math.max(0, u.size), 0);

function upkeepOf(rows){
  const res = {};
  rows.forEach(u => addRes(res, (UNIT_COST[u.type] || {upkeep:{}}).upkeep, Math.max(0, u.size)));
  return res;
}

/* survivors as force rows simulate() will take */
const chainRows = (units, isAtk) =>
  survivorRows(units, isAtk).map(u => Object.assign({}, u, {nick: u.name || "",
    name:`${u.type}_${u.weapon}_${u.armor}_size_${u.size}_train_${u.training}`}));

function chainBattles(atkRows, defRows, bonus){
  let atk = atkRows.map(u => Object.assign({}, u));
  let def = defRows.map(u => Object.assign({}, u));
  const ticks = [];
  let stop = "cap", error = "";

  for (let t = 1; t <= CHAIN_MAX; t++){
    const upA = upkeepOf(atk), upD = upkeepOf(def);
    const atkStart = troopsOf(atk), defStart = troopsOf(def);

    let r;
    try { r = simulate(atk, def, bonus); }
    catch(e){ stop = "error"; error = e.message; break; }

    const atkDead = deathCosts(r.units, true), defDead = deathCosts(r.units, false);
    const atkLeft = r.invaders.reduce((n, u) => n + u.remaining, 0);
    const defLeft = r.repellers.reduce((n, u) => n + u.remaining, 0);

    ticks.push({tick:t, res:r, atkStart, defStart, atkLeft, defLeft, atkDead, defDead, upA, upD});

    atk = atk.map((u, i) => Object.assign({}, u, {size:r.invaders[i].remaining, fresh:false})).filter(u => u.size > 0);
    def = def.map((u, i) => Object.assign({}, u, {size:r.repellers[i].remaining, fresh:false})).filter(u => u.size > 0);

    if (!atkLeft || !defLeft){ stop = "wipe"; break; }
    if (!atkDead.troops && !defDead.troops){ stop = "stall"; break; }   // every later tick repeats it
  }
  return {ticks, stop, error};
}

/* how many troops both sides lost, for the Deaths heading */

  `<span class="cost-n"><b>${(a.troops + d.troops).toLocaleString("en-US")}</b> troop${a.troops + d.troops === 1 ? "" : "s"} died</span>`;

const leftCount = n =>

const TICK_TONES = ["tone-a", "tone-b", "tone-c"];

/* one further tick, written up exactly like the battle above it.

        <span><span class="badge badge-info">Defenders</span> ${resChips(cum.def)}</span>

    </div>

}

/* the tally for one side over the whole battle — tick 1 included — plus a

        <span class="spacer"></span>

/* only the two endings that need explaining say anything; a wipe or a replay
   that simply ran to the cap speaks for itself in the tick headers */
function chainOutcome(run){
  const last = run.ticks[run.ticks.length - 1];
  const at = last.tick + 1;                       // the shown battle is tick 1
  if (run.stop === "error")                       // the failing tick never made the list
    return `<div class="note warn chain-note"><strong>Replay stopped on tick ${at + 1}.</strong> ${esc(run.error)}</div>`;
  if (run.stop === "stall")
    return `<div class="note warn chain-note"><strong>Deadlock on tick ${at}.</strong></div>`;
  return "";
}

function renderChain(){
  if (!lastResult) return "";
  /* reinforcements are marked fresh for the one tick they drop in on */
  const dropIn = rows => rows.map(u => Object.assign({}, u, {fresh:true}));
  const atk0 = chainRows(lastResult.units, true).concat(dropIn(lastReserves.attacker));
  const def0 = chainRows(lastResult.units, false).concat(dropIn(lastReserves.defender));

  if (!atk0.length || !def0.length)
    return `<div class="note chain-note">Nothing left to fight.</div>`;

  const run = chainBattles(atk0, def0, lastBonus);
  if (!run.ticks.length)
    return `<div class="note warn chain-note"><strong>Nothing to replay.</strong>
      ${esc(run.error || "The next tick could not be resolved.")}</div>`;

  const last  = run.ticks[run.ticks.length - 1];
  const ticks = run.ticks.length + 1;              // the battle on screen is tick 1

  /* tick 1 is part of the battle too: its dead and the upkeep everyone who
     started it was billed both belong in the totals */
  const t1A = deathCosts(lastResult.units, true), t1D = deathCosts(lastResult.units, false);
  const up1A = {}, up1D = {};
  Object.values(lastResult.units).forEach(u=>{
    const uc = UNIT_COST[u.origType] || {upkeep:{}};
    addRes(u.attack_mission ? up1A : up1D, uc.upkeep, Math.max(0, u.size));
  });

  const seed = (d, up) => ({troops:d.troops, hire:d.hire, gear:d.gear,
                            res: addRes({}, d.res), up: addRes({}, up)});
  const atkTot = seed(t1A, up1A);
  const defTot = seed(t1D, up1D);

  /* the upkeep line inside each tick is the running bill, not that tick alone */
  const cumA = addRes({}, up1A), cumD = addRes({}, up1D);

  const blocks = run.ticks.map(k=>{
    atkTot.troops += k.atkDead.troops; atkTot.hire += k.atkDead.hire;
    atkTot.gear += k.atkDead.gear; addRes(atkTot.res, k.atkDead.res); addRes(atkTot.up, k.upA);
    defTot.troops += k.defDead.troops; defTot.hire += k.defDead.hire;
    defTot.gear += k.defDead.gear; addRes(defTot.res, k.defDead.res); addRes(defTot.up, k.upD);
    addRes(cumA, k.upA); addRes(cumD, k.upD);
    return chainTickBlock(k, {atk: addRes({}, cumA), def: addRes({}, cumD)});
  }).join("");

  const lastUnits = Object.values(last.res.units);
  atkTot.leftover = survivorValue(lastUnits.filter(u=>  u.attack_mission));
  defTot.leftover = survivorValue(lastUnits.filter(u=>! u.attack_mission));

  return `<div class="log-head" style="margin-top:16px">
      <h3>Successive ticks</h3>
      <span class="spacer"></span>
      <button class="btn btn-xs" data-chain-fold="1" title="Fold every tick away">Collapse all</button>
    </div>
    ${blocks}
    <div class="tick-divider tick-end">End battle</div>
    <div class="panel" id="panelEntireBattle">
      <div class="panel-head"><h2>Entire battle</h2>
        <span class="spacer"></span>
        <span class="badge">Ticks 1–${ticks}</span>
      </div>
      <div class="grid2">
        ${chainTotalsColumn("Attackers", "badge-danger", atkTot, ticks)}
        ${chainTotalsColumn("Defenders", "badge-info", defTot, ticks)}
      </div>
      ${chainOutcome(run)}
    </div>`;
}

function toggleChain(){
  const btn = document.getElementById("btnChain");
  const out = document.getElementById("chainOut");
  if (!btn || !out) return;
  clearTips("chain");
  if (out.innerHTML){                       // second click puts it away
    out.innerHTML = "";
    setChainJumpButtons(0);
    btn.textContent = "Check successive battles";
    return;
  }
  out.innerHTML = renderChain();
  setChainJumpButtons(out.querySelectorAll("details.chain-wrap").length
    ? out.querySelectorAll("details.chain-wrap").length + 1 : 0);
  btn.textContent = "Hide successive battles";
}

/* fold every replayed tick at once */
document.addEventListener("click", e=>{
  const btn = e.target.closest?.("[data-chain-fold]");
  if (!btn) return;
  const ticks = [...document.querySelectorAll("details.chain-wrap")];
  if (!ticks.length) return;
  const open = btn.dataset.chainFold === "1";     // 1 = they are open, so close them
  ticks.forEach(d => { d.open = !open; });
  btn.dataset.chainFold = open ? "0" : "1";
  btn.textContent = open ? "Expand all" : "Collapse all";
  btn.title = open ? "Open every tick again" : "Fold every tick away";
});

  : PREFS.logFull && id.startsWith("logExchange");

function logToggle(id){
