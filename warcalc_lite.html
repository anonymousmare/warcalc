/* ===================================================================
   4. SIMULATION — direct port of huge-ovipositor-backend.php
   =================================================================== */

function buildUnit(raw, forceId, isInvader){
  const u = {
    force_id: forceId,
    name: (isInvader ? "A_" : "D_") + raw.name,
    size: raw.size,
    training: raw.training,
    type: FORCE_TYPES[raw.type],
    origType: raw.type,          // kept because alicorns get retyped to Naval below
    weapon: raw.weapon,
    armor: raw.armor,
    weapon_id: WEAPON_IDS[raw.weapon],
    armor_id: ARMOR_IDS[raw.armor],
    attack_mission: isInvader ? 1 : 0,
    nation_id: isInvader ? 1 : 2,
    damage: 0,
    hits: raw.size,
    dmg: {}, arm: {}
  };

  const wd = WEAPON_DEFS[raw.weapon];
  const ad = ARMOR_DEFS[raw.armor];

  if (u.type === 6){                       // alicorns
    u.type = 5;                            // "treat them like naval for now"
    TYPE_NUMS.forEach(n=>{ u.dmg[TYPES[n]] = 10; u.arm[TYPES[n]] = 0.1; });
  } else {
    TYPE_NUMS.forEach(n=>{
      const t = TYPES[n];
      // PHP: !$rs['weapon_id'] — id 0 (Scrounged) is falsy, so it takes the fallback
      u.dmg[t] = (!u.weapon_id || !wd) ? 0.25 : Number(wd[t]);
      u.arm[t] = (!u.armor_id  || !ad) ? 1    : Number(ad[t]);
    });
  }
  return u;
}

// array_multisort helper: stable sort of parallel arrays by key list
function multisort(items, keys){
  return items.map((v,i)=>({v,i}))
    .sort((a,b)=>{
      for (const k of keys){
        const d = k.cmp(k.get(a.v), k.get(b.v));
        if (d) return d;
      }
      return a.i - b.i;
    })
    .map(x=>x.v);
}
const ASC  = (x,y)=> x<y ? -1 : x>y ? 1 : 0;
const DESC = (x,y)=> x<y ?  1 : x>y ? -1 : 0;

function simulate(attackers, defenders, defenderBonus){
  const units = {};
  const invaders = [], repellers = [];
  let fid = 0;

  attackers.forEach(r=>{ const u = buildUnit(r, ++fid, true);  units[u.force_id]=u; invaders.push(u); });
  defenders.forEach(r=>{ const u = buildUnit(r, ++fid, false); units[u.force_id]=u; repellers.push(u); });

  // --- damage buckets: [damageValue][targetTypeName] = [units]
  function damageBuckets(side){
    const b = {};
    side.forEach(u=>{
      TYPE_NUMS.forEach(n=>{
        const t = TYPES[n];
        const key = String(u.dmg[t]);
        (b[key] ??= {});
        (b[key][t] ??= []).push(u);
      });
    });
    // krsort numerically (highest damage first)
    const sortedKeys = Object.keys(b).sort((a,c)=>parseFloat(c)-parseFloat(a));
    const out = [];
    sortedKeys.forEach(k=>{
      const byType = {};
      TYPE_NUMS.forEach(n=>{
        const t = TYPES[n];
        if (b[k][t]) byType[t] = multisort(b[k][t], [
          {get:u=>u.size,       cmp:DESC},
          {get:u=>u.nation_id,  cmp:ASC}
        ]);
      });
      out.push({damage: parseFloat(k), byType});
    });
    return out;
  }

  // --- defender pools: [defenderOwnType][attackerType] = [units], sorted by armor asc
  function defenderPools(side){
    const p = {};
    side.forEach(u=>{
      TYPE_NUMS.forEach(n=>{
        (p[u.type] ??= {});
        (p[u.type][n] ??= []).push(u);
      });
    });
    Object.keys(p).forEach(dt=>{
      TYPE_NUMS.forEach(n=>{
        if (p[dt][n]) p[dt][n] = multisort(p[dt][n], [
          {get:u=>u.arm[TYPES[n]], cmp:ASC},
          {get:u=>u.size,          cmp:DESC},
          {get:u=>u.nation_id,     cmp:ASC}
        ]);
      });
    });
    return p;
  }

  const invaderDamages   = damageBuckets(invaders);
  const repellerDamages  = damageBuckets(repellers);
  const invaderDefenders = defenderPools(invaders);
  const repellerDefenders= defenderPools(repellers);

  const hitinfo = {}, damageinfo = {};
  // PHP arrays keep insertion order; JS objects with numeric keys re-sort
  // ascending, which would scramble the exchange log. Track order separately.
  const hitOrder = [];
  const stalls = [];
  let budget = 4_000_000;   // guard: PHP would hang here on a 0-damage matchup

  function runSide(buckets, enemyPools, applyBonus){
    for (const bucket of buckets){
      for (const tn of TYPE_NUMS){
        const t = TYPES[tn];
        const attackerList = bucket.byType[t];
        if (!attackerList) continue;

        let breakTypeLoop = false;
        for (const attacker of attackerList){
          const A = units[attacker.force_id];
          while (A.hits > 0){
            let fought = false;
            const pool = enemyPools[tn]?.[A.type];
            if (!pool || !pool.length) break;

            let outOfHits = false;
            for (const defender of pool){
              const D = units[defender.force_id];
              let dmg = round3(bucket.damage * D.arm[TYPES[A.type]]
                        * Math.pow(1.5, (A.training - D.training)/20));
              if (applyBonus) dmg = dmg * 0.75;

              if (dmg <= 0){
                // PHP would spin forever here; record and skip.
                stalls.push(`${A.name} does 0 damage to ${D.name} — skipped`);
                continue;
              }

              while (D.size > D.damage){
                fought = true;
                D.damage += dmg;
                hitinfo[A.force_id] ??= {}; damageinfo[A.force_id] ??= {};
                if (!(D.force_id in hitinfo[A.force_id])) hitOrder.push([A.force_id, D.force_id]);
                hitinfo[A.force_id][D.force_id] = (hitinfo[A.force_id][D.force_id]||0) + 1;
                damageinfo[A.force_id][D.force_id] = (damageinfo[A.force_id][D.force_id]||0) + dmg;
                A.hits--;
                if (--budget <= 0) throw new Error("Iteration limit reached — check for zero or near-zero damage values.");
                if (A.hits === 0){ outOfHits = true; break; }
              }
              if (outOfHits) break;
            }
            if (outOfHits) break;          // PHP: break 2 -> exits while(hits)
            if (!fought){ breakTypeLoop = true; break; }  // PHP: break 2 -> next type
          }
          if (breakTypeLoop) break;
        }
      }
    }
  }

  if (repellers.length){
    runSide(invaderDamages,  repellerDefenders, defenderBonus === "Yes");
    runSide(repellerDamages, invaderDefenders,  false);
  }

  // --- apply casualties
  const log = [];
  for (const [aid, did] of hitOrder){
    log.push({aid, did, damage: round6(damageinfo[aid][did]), hits: hitinfo[aid][did]});
  }

  const casualties = [];
  Object.values(units).forEach(u=>{
    const dealt = Math.floor(round6(u.damage));
    u.lost = 0; u.dead = false;
    if (dealt > 0){
      if (dealt < u.size){ u.lost = dealt; u.remaining = u.size - dealt;
        casualties.push({kind:"hurt", uid:u.force_id, lost:dealt}); }
      else { u.lost = u.size; u.remaining = 0; u.dead = true;
        casualties.push({kind:"kill", uid:u.force_id}); }
    } else { u.remaining = u.size; }
  });

  return {units, invaders, repellers, log, casualties, stalls};
}

const round3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
const round6 = n => Math.round((n + Number.EPSILON) * 1e6) / 1e6;

/* ===================================================================
   5. RESULTS RENDERING
   =================================================================== */

const fmt = n => Number.isInteger(n) ? String(n) : String(round3(n));

// What the unit actually fights with, after the alicorn override and the
// id-0 scrounged fallbacks. Mirrors buildUnit().
function effectiveStats(type, weapon, armor){
  const dmg = {}, arm = {};
  if (type === "Alicorns"){
    TYPE_NUMS.forEach(n=>{ dmg[TYPES[n]] = 10; arm[TYPES[n]] = 0.1; });
  } else {
    const wd = WEAPON_DEFS[weapon], ad = ARMOR_DEFS[armor];
    TYPE_NUMS.forEach(n=>{
      const t = TYPES[n];
      dmg[t] = (!WEAPON_IDS[weapon] || !wd) ? 0.25 : Number(wd[t]);
      arm[t] = (!ARMOR_IDS[armor]  || !ad) ? 1    : Number(ad[t]);
    });
  }
  return {dmg, arm};
}

function tipHTML(type, weapon, armor, size, training){
  const {dmg, arm} = effectiveStats(type, weapon, armor);
  const rows = TYPE_NUMS.map(n=>{
    const t = TYPES[n];
    return `<tr><td>${t.charAt(0).toUpperCase()+t.slice(1)}</td>
      <td class="mono" style="text-align:right;color:#f17a77">${fmt(dmg[t])}</td>
      <td class="mono" style="text-align:right;color:#74cae3">${fmt(arm[t])}</td></tr>`;
  }).join("");
  const w = gearCost("weapon", weapon), a = gearCost("armor", armor);
  const n = (size != null && size !== "") ? Math.max(0, parseInt(size, 10) || 0) : 1;
  const gres = addRes(addRes({}, w.res, n), a.res, n);
  const uc = UNIT_COST[type] || {hire:0, upkeep:{}};

  const upkeep = addRes({}, uc.upkeep, n);
  const hasUpkeep = Object.keys(upkeep).some(k=>upkeep[k]);

  return `<div class="tip-head">
      <div>
        ${buildSprite(type, weapon, armor, false)}
        ${hasUpkeep ? `<div class="tip-upkeep" title="Upkeep per 12 hours">${resChips(upkeep)}</div>` : ""}
      </div>
      <div>
        <div class="tip-title">${esc(type)}</div>
        ${size != null
          ? `<div class="small mono muted">size ${esc(size)} \u00b7 training ${esc(training)}</div>`
          : ""}
        ${type === "Alicorns"
          ? `<div class="small muted">no price data</div>`
          : `<div class="small mono">${money(uc.hire * n)}</div>`}
      </div>
    </div>
    <table class="tip-table">
      <thead><tr>
        <th>vs</th>
        <th style="text-align:right;color:#f17a77">${esc(label(weapon))}</th>
        <th style="text-align:right;color:#74cae3">${esc(label(armor))}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="tip-cost">
      <div>Equipment <span class="bits">${money((w.bits + a.bits) * n)}</span></div>
      <div style="margin-top:4px">${resChips(gres)}</div>
    </div>`;
}

function tipAttrs(type, weapon, armor, size, training){
  return `data-tip-t="${esc(type)}" data-tip-w="${esc(weapon)}" data-tip-a="${esc(armor)}"` +
         (size != null ? ` data-tip-size="${esc(size)}" data-tip-train="${esc(training)}"` : "");
}

function unitRef(u){
  return `<span class="unit-ref ${u.attack_mission ? "ref-atk" : "ref-def"}"
    ${tipAttrs(u.origType, u.weapon, u.armor, u.size, u.training)}>${esc(u.name)}</span>`;
}

/* ---- hover math for a single exchange-log damage figure ---- */
function dmgMathTip(A, D, l, bonusApplied){
  const vsDef = TYPES[D.type];        // what the attacker's weapon rates against
  const vsAtk = TYPES[A.type];        // what the defender's armor rates against
  const base = A.dmg[vsDef];
  const armv = D.arm[vsAtk];
  const tExp = (A.training - D.training) / 20;
  const tMul = Math.pow(1.5, tExp);
  const rounded = round3(base * armv * tMul);
  const perHit = bonusApplied ? rounded * 0.75 : rounded;
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

  return `<div class="tip-title">Damage breakdown</div>
    <table class="tip-math" style="margin-top:6px">
      <tr><td><span style="color:#f17a77">${esc(label(A.weapon))}</span>
              <span class="muted">vs ${cap(vsDef)}</span></td>
          <td class="n" style="color:#f17a77">${fmt(base)}</td></tr>
      <tr><td><span style="color:#74cae3">${esc(label(D.armor))}</span>
              <span class="muted">vs ${cap(vsAtk)}</span></td>
          <td class="n" style="color:#74cae3">×${fmt(armv)}</td></tr>
      <tr><td>training <span class="muted">${A.training} vs ${D.training}</span></td>
          <td class="n">×${fmt(round3(tMul))}</td></tr>
      ${bonusApplied ? `<tr><td>defender bonus</td><td class="n">×0.75</td></tr>` : ""}
      <tr class="tot"><td>per hit</td><td class="n">${fmt(perHit)}</td></tr>
      <tr><td class="muted">× ${l.hits} hit${l.hits === 1 ? "" : "s"}</td>
          <td class="n">${fmt(l.damage)}</td></tr>
    </table>
`;
}

/* ---- what a side lost, in money and materiel ---- */
function deathCosts(units, isAtk){
  const items = [];
  let troops = 0, hire = 0, gear = 0;
  const res = {};
  Object.values(units).forEach(u=>{
    if ((!!u.attack_mission) !== isAtk) return;
    const n = u.lost || 0;
    if (!n) return;
    const uc = UNIT_COST[u.origType] || {hire:0, upkeep:{}};
    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    const r = addRes(addRes({}, w.res, n), a.res, n);
    troops += n; hire += uc.hire * n; gear += (w.bits + a.bits) * n;
    addRes(res, r);
    items.push({u:{type:u.origType, weapon:u.weapon, armor:u.armor}, n,
                hire: uc.hire * n, gear: (w.bits + a.bits) * n, res:r,
                dead: u.dead, of: u.size});
  });
  const raw = toRaw(res);
  return {items, troops, hire, gear, res, rawRes:raw.res, craftBits:raw.craftBits};
}

const lostCount = it => `${it.n} lost${it.dead ? " (wiped)" : " / " + it.of}`;

function deathsColumn(title, cls, d){
  if (!d.troops) return `<div>
      <div class="small" style="margin-bottom:6px"><span class="badge ${cls}">${title}</span></div>
      <div class="well"><span class="muted small">Nothing lost.</span></div>
    </div>`;

  const moneyKey = regTip(breakdownTip(title + " — money lost", d.items, it=>
    `<span class="bits">${money(it.hire + it.gear)}</span>
     <div class="small muted mono">raise ${money(it.hire)} · equipment ${money(it.gear)}</div>`,
    lostCount) + `<div class="tip-cost">Total <span class="bits">${money(d.hire + d.gear)}</span></div>`, "death");

  const resKey = regTip(breakdownTip(title + " — resources lost", d.items,
    it=>resChips(it.res), lostCount), "death");

  const rawKey = regTip(breakdownTip(title + " — raw resources lost", d.items, it=>{
    const r = toRaw(it.res);
    return resChips(r.res) + (r.craftBits
      ? `<div class="small muted mono">+ ${money(r.craftBits)} crafting</div>` : "");
  }, lostCount) + `<div class="tip-cost">Crafting fees <span class="bits">${money(d.craftBits)}</span></div>`, "death");

  return `<div>
    <div class="small" style="margin-bottom:6px">
      <span class="badge ${cls}">${title}</span>
      <span class="muted" style="margin-left:6px">${d.troops} troop${d.troops === 1 ? "" : "s"} lost</span>
    </div>
    <div class="well">
      <div class="cost-row has-tip" data-tip-key="${moneyKey}">
        <span class="cost-label">Raise value</span>
        <span class="cost-val bits">${money(d.hire)}</span></div>
      <div class="cost-row has-tip" data-tip-key="${moneyKey}">
        <span class="cost-label">Equipment ${BIT}</span>
        <span class="cost-val bits">${money(d.gear)}</span></div>
      ${resourceBlock({res:d.res, rawRes:d.rawRes, craftBits:d.craftBits,
                       resKey:resKey, rawKey:rawKey, open:false})}
      <div class="cost-row" style="margin-top:6px;padding-top:7px;border-top:1px solid rgba(0,0,0,.35)">
        <span class="cost-label" style="color:var(--text)">Total burned</span>
        <span class="cost-val bits" style="font-size:13px">${money(d.hire + d.gear + d.craftBits)}</span></div>
    </div>
  </div>`;
}

function render(result, atkRaw, defRaw, bonus){
  const {units, log, casualties, stalls} = result;
  const all = Object.values(units);
  const sum = (f, inv) => all.filter(u=>!!u.attack_mission === inv).reduce((a,u)=>a+f(u), 0);
  const atkTotal = sum(u=>u.size, true),  atkLeft = sum(u=>u.remaining, true);
  const defTotal = sum(u=>u.size, false), defLeft = sum(u=>u.remaining, false);

  clearTips("death");
  const atkDead = deathCosts(units, true), defDead = deathCosts(units, false);

  const el = document.getElementById("results");
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>Battle result</h2>
        <span class="badge">Defender bonus: ${bonus}</span>
        <span class="spacer"></span>
        <span class="badge badge-danger">Attackers <b>${atkLeft}</b> / ${atkTotal}</span>
        <span class="badge badge-info">Defenders <b>${defLeft}</b> / ${defTotal}</span>
      </div>

      ${stalls.length ? `<div class="note warn"><strong>${stalls.length} matchup(s) did nothing</strong> —
        a damage value resolved to zero. The PHP would loop forever here; this build skips them.</div>` : ""}

      <div>
        <div>
          <h3>Exchange log</h3>
          <div class="well log">${
            log.length ? log.map(l=>{
              const A = units[l.aid], D = units[l.did];
              const bonusApplied = !!A.attack_mission && bonus === "Yes";
              const mk = regTip(dmgMathTip(A, D, l, bonusApplied), "death");
              return `<div>${unitRef(A)} <span class="muted">(size <b>${A.size}</b>)</span> hit
                ${unitRef(D)} <span class="muted">(size <b>${D.size}</b>)</span>
                for <b class="dmg-ref" data-tip-key="${mk}">${fmt(l.damage)}</b> damage
                <span class="muted">(<b>${l.hits}</b> hits)</span></div>`;
            }).join("") : '<div class="muted">No hits were exchanged.</div>'}</div>
        </div>
        <div style="margin-top:14px">
          <h3>Casualties</h3>
          <div class="well log">${
            casualties.length ? casualties.map(c=>{
              const u = units[c.uid];
              return c.kind === "kill"
                ? `<div>${unitRef(u)} <span class="kill">IS KILL</span></div>`
                : `<div>${unitRef(u)} <span class="hurt">lost <b>${c.lost}</b> size!</span></div>`;
            }).join("") : '<div class="muted">Everyone walked away.</div>'}</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Survivors</h2></div>
      <div class="grid2">
        ${[["Attackers", true, "surv-atk"], ["Defenders", false, "surv-def"]].map(([hd, inv, cls])=>{
          const side = all.filter(u=>!!u.attack_mission === inv);
          return `<div class="surv-col">
            <h3>${hd}</h3>
            <div class="surv-grid">${
              side.length ? side.map(u=>`<div class="surv-card ${cls}${u.dead ? " surv-dead" : ""}">
                  ${buildSprite(u.origType, u.weapon, u.armor, true, {size:u.size, training:u.training})}
                  <div class="small mono" style="margin-top:7px;word-break:break-all;color:var(--text-dim)">${esc(label(u.weapon))} / ${esc(label(u.armor))}</div>
                  <div class="mono" style="margin-top:4px;font-size:15px;${u.dead?'color:#f17a77':''}">
                    ${u.dead ? "DESTROYED" : `<b>${u.remaining}</b> <span class="muted small">/ ${u.size}</span>`}
                  </div>
                </div>`).join("") : '<div class="muted small">None fielded.</div>'}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Deaths</h2>
        <span class="spacer"></span>
        <span class="badge badge-danger">Attackers −${money(atkDead.hire + atkDead.gear + atkDead.craftBits)}</span>
        <span class="badge badge-info">Defenders −${money(defDead.hire + defDead.gear + defDead.craftBits)}</span>
      </div>
      <div class="grid2">
        ${deathsColumn("Attackers", "badge-danger", atkDead)}
        ${deathsColumn("Defenders", "badge-info", defDead)}
      </div>
    </div>`;
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ===================================================================
   5b. ARMY CODES — the short form, the same one the full calculator
   reads and writes, so a code copied in either opens in the other.
   ===================================================================
   A unit is only ever three facts: which of the 109 legal
   type/weapon/armour loadouts it wears, how trained it is (0-20), and how
   many of it there are. Those three numbers are poured one after another
   into a single mixed-radix integer, and that integer is written out in
   base 62.

   A battle code is the two sides' integers with a sigil in front of each:
   "+" opens the attackers, "-" the defenders with the defender bonus on,
   "=" the defenders with it off.

   The full calculator may tack on reinforcements ("_"), unit names (".")
   and a Barracks level ("~"). Lite reads past all three: names and
   Barracks are dropped, and reinforcements are left out, since they sit
   out the one tick Lite resolves. */

const TRAIN_MAX = 20;
const clampInt = (v, lo, hi) => Math.min(hi, Math.max(lo, parseInt(v, 10) || 0));

const CODE_ALPHA = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const CODE_DIGIT = new Map([...CODE_ALPHA].map((c, i) => [c, BigInt(i)]));

/* every legal loadout, in an order that must never be reshuffled — the
   index into this list IS the type, the weapon and the armour */
const KIT_TYPES = ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"];
const KITS = [];
KIT_TYPES.forEach(t => LOADOUTS[t].weapons.forEach(w =>
  LOADOUTS[t].armor.forEach(a => KITS.push([t, w, a]))));
const KIT_AT  = new Map(KITS.map((k, i) => [k.join("|"), i]));
const R_KIT   = BigInt(KITS.length);      // 109 loadouts
const R_TRAIN = 21n;                      // training 0 … 20
const R_CLASS = 4n;                       // which size bracket

/* four size brackets, cheapest first, because most units are small */
const SIZE_CLASS = [
  {base: 1,        radix: 256n},
  {base: 257,      radix: 65536n},
  {base: 65793,    radix: 16777216n},
  {base: 16843009, radix: 1099511627776n}
];
const SIZE_MAX = SIZE_CLASS[3].base + Number(SIZE_CLASS[3].radix) - 1;

const b62 = v => {
  if (v <= 0n) return "0";
  let s = "";
  while (v > 0n){ s = CODE_ALPHA[Number(v % 62n)] + s; v /= 62n; }
  return s;
};

function unb62(s){
  let v = 0n;
  for (const ch of s){
    const d = CODE_DIGIT.get(ch);
    if (d === undefined) throw new Error("not a code");
    v = v * 62n + d;
  }
  return v;
}

/* gear that does not belong to the type falls back to that type's first
   loadout rather than poisoning the whole code */
function kitIndex(u){
  let i = KIT_AT.get([u.type, u.weapon, u.armor].join("|"));
  if (i !== undefined) return i;
  const set = LOADOUTS[u.type];
  if (set) i = KIT_AT.get([u.type, set.weapons[0], set.armor[0]].join("|"));
  return i === undefined ? 0 : i;
}

function sizeParts(n){
  const size = Math.max(1, Math.min(SIZE_MAX, Math.floor(Number(n)) || 1));
  for (let c = 0; c < SIZE_CLASS.length; c++){
    const off = size - SIZE_CLASS[c].base;
    if (off >= 0 && off < Number(SIZE_CLASS[c].radix)) return {cls: c, off};
  }
  return {cls: 0, off: 0};
}

/* built back to front: the last unit goes in first, so the first unit is
   the first one to come back out */
function encodeArmy(units){
  let v = 0n;
  for (let i = (units || []).length - 1; i >= 0; i--){
    const u = units[i];
    const {cls, off} = sizeParts(u.size);
    const tr = clampInt(u.training, 0, TRAIN_MAX);
    v = v * SIZE_CLASS[cls].radix + BigInt(off);
    v = v * R_CLASS + BigInt(cls);
    v = v * R_TRAIN + BigInt(tr);
    v = v * R_KIT   + BigInt(kitIndex(u));
    v = v * 2n + 1n;          // "there is a unit here" — without it an army
  }                           // of one all-zero unit would encode as nothing
  return b62(v);
}

/* the front line only; .reserves counts the reinforcements left behind */
function decodeArmy(code){
  const [body, brk, tail] = String(code).split("~");
  if (tail !== undefined || (brk !== undefined && !/^\d{1,2}$/.test(brk))) throw new Error("not a code");
  const [stacks, names, more] = body.split(".");
  if (more !== undefined) throw new Error("not a code");
  if (names !== undefined) unb62(names);           // must still be a valid code
  const [front, reinf, extra] = stacks.split("_");
  if (extra !== undefined) throw new Error("not a code");
  const units = decodeStacks(front || "0");
  units.reserves = reinf ? decodeStacks(reinf).length : 0;
  return units;
}

function decodeStacks(code){
  let v = unb62(code);
  const pop = r => { const d = Number(v % r); v /= r; return d; };
  const out = [];
  while (v > 0n){
    if (!pop(2n)) break;                       // malformed tail, stop there
    const [type, weapon, armor] = KITS[pop(R_KIT)];
    const training = pop(R_TRAIN);
    const cls = pop(R_CLASS);
    out.push({type, weapon, armor, training,
              size: SIZE_CLASS[cls].base + pop(SIZE_CLASS[cls].radix)});
    if (out.length > 4000) throw new Error("not a code");
  }
  return out;
}

const encodeBattle = (atk, def, bonus) =>
  "+" + encodeArmy(atk) + (bonus === "No" ? "=" : "-") + encodeArmy(def);

const RE_ARMY_CODE   = /^(?=.)[0-9A-Za-z]*(_[0-9A-Za-z]+)?(\.[0-9A-Za-z]+)?(~\d{1,2})?$/;
const RE_BATTLE_CODE = /^\+([0-9A-Za-z]*(?:_[0-9A-Za-z]+)?(?:\.[0-9A-Za-z]+)?(?:~\d{1,2})?)([-=])([0-9A-Za-z]*(?:_[0-9A-Za-z]+)?(?:\.[0-9A-Za-z]+)?(?:~\d{1,2})?)$/;

/* null when the text is not a battle code at all */
function decodeBattle(code){
  const m = RE_BATTLE_CODE.exec(code);
  if (!m) return null;
  try{
    return {attacker: decodeArmy(m[1] || "0"),
            defender: decodeArmy(m[3] || "0"),
            bonus: m[2] === "=" ? "No" : "Yes"};
  }catch(e){ return null; }
}

/* reinforcements a code carried that Lite leaves out — said once */
function noteReserves(...lists){
  const n = lists.reduce((t, l) => t + ((l && l.reserves) || 0), 0);
  if (n) alert(`That code carries ${n} reinforcement stack${n === 1 ? "" : "s"}. `
             + "Warcalc Lite resolves the front line only, so they were left out.");
}


/* ---- the crunch: the roster spreadsheet's 43 counts, in one cell ----
   Slot i is written as its letter followed by the count in plain decimal;
   "r" is training, one higher than it reads. Warcalc adds the same 43
   totals up from the code it was handed and says where the two disagree. */
const CRUNCH_ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqr";   // 43 + training
const CRUNCH_TRAIN = 43;

/* the sheet's row order, which is NOT warcalc's own — cavalry list APFU
   ahead of ATFU there — so this table is the one that must not drift */
const CRUNCH_SLOTS = [
  ["type","Cavalry","Cavalry Amount"],
  ["weapon","PRC-E6","PRC-E6"], ["weapon","PRC-E7","PRC-E7"], ["weapon","PRC-E8","PRC-E8"],
  ["weapon","ACFU","ACFU"], ["weapon","APFU","APFU"], ["weapon","ATFU","ATFU"],
  ["weapon","AUFU","AUFU"],
  ["armor","Barding","Barding"], ["armor","Bigdog","Bigdog"], ["armor","Nope","Nope"],
  ["type","Tanks","Tanks Amount"],
  ["weapon","K9P","K9P"], ["weapon","ELBO-GRS","ELBO-GRS"],
  ["weapon","Chem-LightBattery","Chem-Light Battery"],
  ["armor","Trundle","Trundle"], ["armor","Shepherd","Shepherd"],
  ["armor","Ohno","Ohno"], ["armor","Titan","Titan"],
  ["type","Pegasi","Pegasi Amount"],
  ["weapon","PropWash","Prop Wash"], ["weapon","SteamBucket","Steam Bucket"],
  ["weapon","CanopyLights","Canopy Lights"],
  ["armor","Cooler","Cooler"], ["armor","Wonder","Wonder"],
  ["armor","Griffin","Griffin"], ["armor","Dragon","Dragon"],
  ["type","Unicorns","Unicorns Amount"],
  ["weapon","LongStand","Long Stand"], ["weapon","LongWeight","Long Weight"],
  ["weapon","GridSquares","Grid Squares"],
  ["armor","Hornshield","Hornshield"], ["armor","Librarian","Librarian"],
  ["armor","Shining","Shining"], ["armor","D2A","D2A"],
  ["type","Naval","Naval Amount"],
  ["weapon","Shoreline","Shoreline"], ["weapon","WaterHammer","Water Hammer"],
  ["weapon","WaterlineEraser","Waterline Eraser"],
  ["armor","C-PON3","C-Pon3"], ["armor","Esohes","Esohes"], ["armor","Shubidu","Shubidu"],
  ["type","Alicorns","Alicorns Amount"]
].map(([kind, key, name], i, all) => ({
  kind, key, name, row: i + 1,
  group: all.slice(0, i + 1).reverse().find(e => e[0] === "type")[1]
}));

function crunchFromUnits(units){
  const n = CRUNCH_SLOTS.map(()=>0);
  (units || []).forEach(u=>{
    const size = Math.max(0, parseInt(u.size, 10) || 0);
    CRUNCH_SLOTS.forEach((s, i)=>{
      if (u[s.kind] === s.key) n[i] += size;
    });
  });
  return n;
}

/* null for "no crunch here", which is not the same as a crunch of zeroes */
function decodeCrunch(code){
  if (!code || !/^(?:[A-Za-z]\d+)+$/.test(code)) return null;
  const counts = CRUNCH_SLOTS.map(()=>0);
  let training = null;
  for (const [, ch, num] of code.matchAll(/([A-Za-z])(\d+)/g)){
    const i = CRUNCH_ALPHA.indexOf(ch);
    if (i < 0) return null;
    if (i === CRUNCH_TRAIN) training = Math.max(0, Number(num) - 1);
    else counts[i] += Number(num);
  }
  return {counts, training};
}

function trainingOf(units){
  const seen = [...new Set((units || []).map(u => Math.max(0, parseInt(u.training, 10) || 0)))];
  return {levels: seen.sort((a, b)=>a - b), one: seen.length === 1 ? seen[0] : null};
}

function crunchDiff(want, units){
  const got = crunchFromUnits(units);
  const rows = CRUNCH_SLOTS
    .map((s, i)=>({...s, want: want.counts[i], got: got[i]}))
    .filter(d => d.want !== d.got);
  if (want.training !== null){
    const t = trainingOf(units);
    if (t.one !== want.training)
      rows.push({name:"Training", row:null, want:want.training,
                 got: t.levels.length ? t.levels.join(" / ") : "—",
                 mixed: t.one === null});
  }
  return rows;
}

/* ---- shareable links ----
   "#" + battle code, then the crunches after a "*" each: attacker first,
   defender second, either may be left empty. */
const battleFragment = () => encodeBattle(packSide("attacker"), packSide("defender"),
                                          document.getElementById("defBonus").value);
const battleLink = () => location.href.split("#")[0] + "#" + battleFragment();

/* takes a whole url, a bare fragment, or a bare battle code */
function parseShareable(text){
  let frag = String(text || "").trim();
  const hash = frag.indexOf("#");
  if (hash >= 0) frag = frag.slice(hash + 1);
  try{ frag = decodeURIComponent(frag); }catch(e){}
  frag = frag.trim();
  if (!frag) return null;
  const parts = frag.split("*");
  const battle = decodeBattle(parts[0]);
  if (!battle) return null;
  return {battle, crunch: {attacker: decodeCrunch((parts[1] || "").trim()),
                           defender: decodeCrunch((parts[2] || "").trim())}};
}

/* ---- the mismatch report ---- */
function closeModal(){ document.getElementById("modalWrap")?.remove(); }

function showCrunchReport(sides){
  closeModal();
  const bad = ["attacker","defender"].map(side=>{
    const want = sides[side];
    return want ? {side, diff: crunchDiff(want, packSide(side))} : null;
  }).filter(r => r && r.diff.length);

  if (!bad.length) return false;

  const body = bad.map(({side, diff})=>`
    <div class="crunch-side">${side === "attacker" ? "Attackers" : "Defenders"}
      — ${diff.length} row${diff.length === 1 ? "" : "s"} off</div>
    <table class="crunch-table">
      <thead><tr><th>Row</th><th>Sheet</th><th>Code</th><th>Off by</th></tr></thead>
      <tbody>${diff.map(d=>{
        const num = typeof d.got === "number";
        const by = num ? d.got - d.want : null;
        const tone = d.group ? ` class="t-${d.group.toLowerCase()}"` : "";
        return `<tr class="${d.kind === "type" ? "crunch-head" : ""}">
          <td><span${tone}>${esc(d.name)}</span></td>
          <td class="n">${d.want.toLocaleString("en-US")}</td>
          <td class="n">${num ? d.got.toLocaleString("en-US") : esc(String(d.got))}</td>
          <td class="n ${by === null || by < 0 ? "crunch-short" : "crunch-over"}">${
            by === null ? (d.mixed ? "mixed" : "off") : (by > 0 ? "+" : "") + by.toLocaleString("en-US")}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>`).join("");

  const wrap = document.createElement("div");
  wrap.className = "modal-wrap";
  wrap.id = "modalWrap";
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Roster mismatch">
    <div class="modal-head"><h2>⚠ The codes do not match the roster</h2></div>
    <div class="modal-body">
      <div class="note warn" style="margin-bottom:12px">Composition Code and Sheet Tally
        mismatch. Update!</div>
      ${body}
    </div>
    <div class="modal-foot">
      <span class="small muted">Battle loaded anyway --&gt;</span>
      <span class="spacer"></span>
      <button class="btn btn-xs" id="crunchClose">Got it</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e=>{ if (e.target === wrap) closeModal(); });
  document.getElementById("crunchClose").addEventListener("click", closeModal);
  return true;
}

/* ---- loading a link ---- */
function applyShareable(sh){
  setSide("attacker", sh.battle.attacker);
  setSide("defender", sh.battle.defender);
  document.getElementById("defBonus").value = sh.battle.bonus;
  scheduleSave();
  noteReserves(sh.battle.attacker, sh.battle.defender);
  showCrunchReport(sh.crunch);
}

/* a link loads once and then gets out of the way, so a later reload keeps
   whatever the player has since changed rather than snapping back */
function loadFromHash(){
  const sh = parseShareable(location.hash);
  if (!sh) return false;
  applyShareable(sh);
  try{ history.replaceState(null, "", location.href.split("#")[0]); }catch(e){}
  return true;
}

/* ===================================================================
   6. IMPORT — army codes, battle codes, links, preset JSON, the long
   form, and a nation page copied straight off the screen
   =================================================================== */

/* drop a decoded list onto a side, minding who may field alicorns */
function addUnits(side, units){
  let skipped = 0;
  (units || []).forEach(u=>{
    if (side === "attacker" && u.type === "Alicorns"){ skipped++; return; }
    makeRow(side, u);
  });
  refreshCounts();
  if (skipped) alert(`Alicorns can only be fielded as defenders — skipped ${skipped}.`);
  return (units || []).length - skipped;
}

/* pasted preset JSON — the same shape the export buttons write:
   {kind:"armyPresets", armyPresets:{name:[units]}}, battlePresets likewise,
   or just a bare [units] list. Returns null when the text isn't JSON at all.
   Names and reinforcement flags from the full calculator are dropped. */
function parsePresetJSON(text){
  const t = String(text || "").trim();
  if (!/^[{[]/.test(t)) return null;
  let data;
  try{ data = JSON.parse(t); }catch(e){ return {error: "That looks like JSON but does not parse."}; }
  const unit = u => ({
    type: String(u.type || "Cavalry").trim(),
    weapon: String(u.weapon || "").trim(),
    armor: String(u.armor || "").trim(),
    size: Math.max(1, parseInt(u.size, 10) || 1),
    training: clampInt(u.training, 0, TRAIN_MAX)
  });
  const units = a => (Array.isArray(a) ? a : [])
    .filter(u => u && typeof u === "object" && u.reserve !== true).map(unit);
  if (Array.isArray(data)) return {armies: {"pasted": units(data)}, battles: {}};
  const armies  = data.armyPresets   || (data.kind === "armyPresets"   ? data.presets : null) || {};
  const battles = data.battlePresets || (data.kind === "battlePresets" ? data.presets : null) || {};
  const out = {armies: {}, battles: {}};
  Object.entries(armies).forEach(([n, v]) => { out.armies[n] = units(v); });
  Object.entries(battles).forEach(([n, b]) => {
    if (b && typeof b === "object")
      out.battles[n] = {attacker: units(b.attacker), defender: units(b.defender), bonus: b.bonus};
  });
  if (!Object.keys(out.armies).length && !Object.keys(out.battles).length)
    return {error: "No army or battle presets found in that JSON."};
  return out;
}

/* one name out of several: the only one, or ask */
function pickPresetName(names, what){
  if (names.length <= 1) return names[0] || null;
  const ans = prompt(`That JSON holds ${names.length} ${what}. Which one?\n\n`
    + names.map((n, i) => `${i + 1}. ${n}`).join("\n"), "1");
  if (ans == null) return null;
  const i = parseInt(ans, 10);
  if (i >= 1 && i <= names.length) return names[i - 1];
  return names.includes(ans.trim()) ? ans.trim() : null;
}

function importRows(side){
  const ta = document.getElementById("txtImport");
  const text = ta.value;
  const code = text.trim();
  if (!code) return;

  /* preset JSON: an army goes whole onto this side, a battle gives its half */
  const json = parsePresetJSON(code);
  if (json){
    if (json.error){ alert(json.error); return; }
    const armyNames = Object.keys(json.armies);
    let units;
    if (armyNames.length){
      const name = pickPresetName(armyNames, "armies");
      if (!name) return;
      units = json.armies[name];
    } else {
      const name = pickPresetName(Object.keys(json.battles), "battles");
      if (!name) return;
      units = json.battles[name][side];
    }
    if (!units.length){ alert("That preset has no units for this side."); return; }
    if (addUnits(side, units)) ta.value = "";
    return;
  }

  /* a battle code (or a whole link) hands each button its own half */
  const sh = parseShareable(code);
  if (sh){
    if (!addUnits(side, sh.battle[side])) alert("That code has nothing on that side.");
    else noteReserves(sh.battle[side]);
    ta.value = "";
    return;
  }

  /* a bare army code */
  if (RE_ARMY_CODE.test(code)){
    let units;
    try{ units = decodeArmy(code); }
    catch(e){ alert("That is not an army code."); return; }
    if (!units.length && !units.reserves){ alert("That code holds no units."); return; }
    addUnits(side, units);
    noteReserves(units);
    ta.value = "";
    return;
  }

  try{
    /* a pasted nation page (or the battle long form) carries both sides
       under their own headings; this button takes its own half */
    const sides = splitLongSides(text);
    const units = parseLongForm(sides ? sides[side] : text);
    if (!units.length){
      alert(sides ? `There are no ${side === "attacker" ? "attackers" : "defenders"} in that paste.`
                  : "Nothing matched the expected format. Each unit block must end with a Training: line.");
      return;
    }
    addUnits(side, units);
    ta.value = "";
  } catch(e){
    console.error(e);
    alert("The import data was in an unexpected format.");
  }
}

/* the long form, one unit a block ending in its Training: line — warcalc's
   own, or the game's army / nation page copied straight off the screen.
   Names and reinforcements are read past. */
function parseLongForm(text){
  const clean = s => String(s).trim().split(" ").join("");
  const lines = String(text).split(/\r?\n|\r/);
  const units = [];
  for (let i = 0; i < lines.length; i++){
    if (i >= 4 && lines[i].trim().indexOf("Training:") === 0){
      let unit;
      if (lines[i-2].trim() !== "Alicorns"){
        unit = {type: clean(lines[i-4]), weapon: clean(lines[i-3]), armor: clean(lines[i-2]),
                size: parseInt(lines[i-1].split(":")[1].trim(),10),
                training: parseInt(lines[i].split(":")[1].trim(),10)};
      } else {
        unit = {type:"Alicorns", weapon:"ScroungedWeapons", armor:"ScroungedArmor",
                size: parseInt(lines[i-1].split(":")[1].trim(),10),
                training: parseInt(lines[i].split(":")[1].trim(),10)};
      }
      unit.training = clampInt(unit.training, 0, TRAIN_MAX);
      let reserve = false;
      for (let j = i + 1; j <= i + 2 && j < lines.length; j++)
        if (/^\s*Reinforcement:\s*yes/i.test(lines[j])) reserve = true;
      if (!reserve) units.push(unit);
    }
  }
  return units;
}

/* "Attackers" / "Defenders" alone on a line, as the nation page heads its
   two lists, or warcalc's "=== ATTACKERS ===" */
const RE_SIDE_HEAD = /^(?:===\s*)?(attackers|defenders)(?:\s*===)?$/i;

/* cuts a paste at its side headings; null when it has none */
function splitLongSides(text){
  const out = {attacker: "", defender: ""};
  let cur = null, found = false;
  String(text).split(/\r?\n|\r/).forEach(l=>{
    const h = RE_SIDE_HEAD.exec(l.trim());
    if (h){ cur = /^a/i.test(h[1]) ? "attacker" : "defender"; found = true; return; }
    if (cur) out[cur] += l + "\n";
  });
  return found ? out : null;
}

/* a battle replaces both sides rather than adding to them — the same
   thing loading a battle preset does */
function importBattle(){
  const ta = document.getElementById("txtImport");
  const json = parsePresetJSON(ta.value);
  if (json){
    if (json.error){ alert(json.error); return; }
    const names = Object.keys(json.battles);
    if (!names.length){
      alert("That JSON holds army presets, not a battle — use Import to attackers / defenders.");
      return;
    }
    const name = pickPresetName(names, "battles");
    if (!name) return;
    const b = json.battles[name];
    ta.value = "";
    setSide("attacker", b.attacker);
    setSide("defender", b.defender);
    if (b.bonus) document.getElementById("defBonus").value = b.bonus;
    scheduleSave();
    return;
  }
  /* a pasted nation page: its Attackers and Defenders lists fill each side */
  const sides = splitLongSides(ta.value);
  if (sides){
    const a = parseLongForm(sides.attacker), d = parseLongForm(sides.defender);
    if (!a.length && !d.length){
      alert("Found the Attackers / Defenders headings, but no units under them.");
      return;
    }
    ta.value = "";
    setSide("attacker", a);
    setSide("defender", d);
    scheduleSave();
    const ali = a.filter(u => u.type === "Alicorns").length;
    if (ali) alert(`Alicorns can only be fielded as defenders — skipped ${ali}.`);
    return;
  }
  const sh = parseShareable(ta.value);
  if (!sh){
    alert('That is not a battle code. A battle code opens with "+" and carries '
        + 'both sides, like +3F3F-9kQw2 — a whole warcalc link works too.');
    return;
  }
  ta.value = "";
  applyShareable(sh);
}

/* ---- clipboard ----
   the block importRows() parses: a key line, then type / weapon / armor,
   then the two labelled numbers */
const compText = units => units.map(u=>[
    `${u.type}_${u.weapon}_${u.armor}`,
    u.type, label(u.weapon), label(u.armor),
    `Size: ${u.size}`, `Training: ${u.training}`
  ].join("\n")).join("\n\n");

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{                                     // file:// and older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* a button that says it worked, then goes back to being a button */
function flashOk(btn, word){
  if (!btn) return;
  const text = btn.textContent;
  btn.textContent = (word || "done").toLowerCase();
  btn.classList.add("ok");
  setTimeout(()=>{ btn.textContent = text; btn.classList.remove("ok"); }, 1200);
}

/* a plain click gives the short code, shift gives the long readable block */
async function copyComposition(side, btn, longForm){
  const units = packSide(side);
  if (!units.length){ alert("Nothing to copy — that side is empty."); return; }
  const text = longForm ? compText(units) : encodeArmy(units);
  if (await copyText(text)) flashOk(btn, "copied");
  else alert("This browser would not let the page reach the clipboard.");
}

async function copyBattleCode(btn, longForm){
  const atk = packSide("attacker"), def = packSide("defender");
  if (!atk.length && !def.length){ alert("Nothing to copy — both sides are empty."); return; }
  const bonus = document.getElementById("defBonus").value;
  const text = longForm
    ? `=== ATTACKERS ===\n\n${compText(atk)}\n\n=== DEFENDERS ===\n\n${compText(def)}`
    : encodeBattle(atk, def, bonus);
  if (await copyText(text)) flashOk(btn, "copied");
  else alert("This browser would not let the page reach the clipboard.");
}

/* ===================================================================
   6b. STORAGE — autosave, army presets, battle presets
   =================================================================== */

const LS_KEY  = "warcalc.autosave";
const LS_ARMY = "warcalc.armyPresets";
const LS_BATL = "warcalc.battlePresets";

let storageOK = true;
const store = {
  get(key, fallback){
    try{
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    }catch(e){ storageOK = false; return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ storageOK = false; return false; }
  },
  del(key){ try{ localStorage.removeItem(key); }catch(e){} }
};

/* a unit stripped down to what is worth saving */
const packSide = side => readSide(side).map(u=>({
  type:u.type, weapon:u.weapon, armor:u.armor, size:u.size, training:u.training}));

function setSide(side, units){
  document.getElementById(side === "attacker" ? "tbodyAttacker" : "tbodyDefender").innerHTML = "";
  (units || []).forEach(u=>{
    if (side === "attacker" && u.type === "Alicorns") return;   // attackers can't field them
    if (u.reserve) return;   // full-calc reinforcements sit out the one tick Lite resolves
    makeRow(side, u);
  });
  refreshCounts();
}

/* ---- autosave ---- */
let autosaveArmed = false;
let saveTimer = null;
function scheduleSave(){
  if (!autosaveArmed) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    store.set(LS_KEY, {
      attacker: packSide("attacker"),
      defender: packSide("defender"),
      bonus: document.getElementById("defBonus").value,
      at: Date.now()
    });
  }, 400);
}

function restoreAutosave(){
  const s = store.get(LS_KEY, null);
  if (!s) return false;
  setSide("attacker", s.attacker);
  setSide("defender", s.defender);
  if (s.bonus) document.getElementById("defBonus").value = s.bonus;
  return true;
}

/* ---- army presets (shared pool, loadable into either side) ---- */
const getArmies  = () => store.get(LS_ARMY, {});
const getBattles = () => store.get(LS_BATL, {});

function refreshPresetSelects(){
  const armies = Object.keys(getArmies()).sort();
  document.querySelectorAll("[data-ap-sel]").forEach(sel=>{
    const keep = sel.value;
    sel.innerHTML = `<option value="">preset…</option>` +
      armies.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
    if (armies.includes(keep)) sel.value = keep;
  });
  const battles = Object.keys(getBattles()).sort();
  const bp = document.getElementById("bpSel");
  const keepB = bp.value;
  bp.innerHTML = `<option value="">—</option>` +
    battles.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (battles.includes(keepB)) bp.value = keepB;
  const tc = document.getElementById("toolsCount");
  if (tc) tc.textContent = `${armies.length} army · ${battles.length} battle` +
    (storageOK ? "" : " · storage unavailable");
}

function saveArmyPreset(side){
  const units = packSide(side);
  if (!units.length){ alert("Nothing to save — that side is empty."); return; }
  const name = (prompt("Name this army preset:", "") || "").trim();
  if (!name) return;
  const all = getArmies();
  if (all[name] && !confirm(`Overwrite "${name}"?`)) return;
  all[name] = units;
  if (!store.set(LS_ARMY, all)) alert("Could not save — this browser is blocking local storage.");
  refreshPresetSelects();
  document.querySelectorAll("[data-ap-sel]").forEach(sel=>{ sel.value = name; });
}

function loadArmyPreset(side){
  const sel = document.querySelector(`[data-ap-sel="${side}"]`);
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  const units = getArmies()[name];
  if (!units) return;
  setSide(side, units);
}

function deleteArmyPreset(){
  const sel = document.querySelector("[data-ap-sel]");
  const name = sel.value;
  if (!name){ alert("Pick a preset first."); return; }
  if (!confirm(`Delete army preset "${name}"?`)) return;
  const all = getArmies();
  delete all[name];
  store.set(LS_ARMY, all);
  refreshPresetSelects();
}

/* ---- battle presets (both sides + bonus) ---- */
function saveBattlePreset(){
  const name = (prompt("Name this battle:", "") || "").trim();
  if (!name) return;
  const all = getBattles();
  if (all[name] && !confirm(`Overwrite "${name}"?`)) return;
  all[name] = {attacker: packSide("attacker"), defender: packSide("defender"),
               bonus: document.getElementById("defBonus").value};
  if (!store.set(LS_BATL, all)) alert("Could not save — this browser is blocking local storage.");
  refreshPresetSelects();
  document.getElementById("bpSel").value = name;
}

function loadBattlePreset(){
  const name = document.getElementById("bpSel").value;
  if (!name){ alert("Pick a battle first."); return; }
  const b = getBattles()[name];
  if (!b) return;
  setSide("attacker", b.attacker);
  setSide("defender", b.defender);
  if (b.bonus) document.getElementById("defBonus").value = b.bonus;
  scheduleSave();
}

function deleteBattlePreset(){
  const name = document.getElementById("bpSel").value;
  if (!name){ alert("Pick a battle first."); return; }
  if (!confirm(`Delete battle preset "${name}"?`)) return;
  const all = getBattles();
  delete all[name];
  store.set(LS_BATL, all);
  refreshPresetSelects();
}

/* ---- json in / out ---- */
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

const stamp = () => new Date().toISOString().slice(0,10);

function importJSON(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ alert("That file isn't valid JSON."); return; }

  const armies  = data.armyPresets   || (data.kind === "armyPresets"   ? data.presets : null);
  const battles = data.battlePresets || (data.kind === "battlePresets" ? data.presets : null);
  if (!armies && !battles){ alert("No presets found in that file."); return; }

  let added = 0;
  if (armies){
    const all = getArmies();
    Object.entries(armies).forEach(([n,v])=>{
      let name = n;
      while (all[name] && JSON.stringify(all[name]) !== JSON.stringify(v)) name += " (imported)";
      all[name] = v; added++;
    });
    store.set(LS_ARMY, all);
  }
  if (battles){
    const all = getBattles();
    Object.entries(battles).forEach(([n,v])=>{
      let name = n;
      while (all[name] && JSON.stringify(all[name]) !== JSON.stringify(v)) name += " (imported)";
      all[name] = v; added++;
    });
    store.set(LS_BATL, all);
  }
  refreshPresetSelects();
  alert(`Imported ${added} preset(s).`);
}

/* ===================================================================
   7. WIRING
   =================================================================== */

document.querySelectorAll("[data-add]").forEach(b=>
  b.addEventListener("click", ()=>makeRow(b.dataset.add)));

document.querySelectorAll("[data-clear]").forEach(b=>
  b.addEventListener("click", ()=>{
    document.getElementById(b.dataset.clear === "attacker" ? "tbodyAttacker" : "tbodyDefender").innerHTML = "";
    refreshCounts();
  }));

document.getElementById("btnImportAtk").addEventListener("click", ()=>importRows("attacker"));
document.getElementById("btnImportDef").addEventListener("click", ()=>importRows("defender"));
document.getElementById("btnImportBattle").addEventListener("click", importBattle);

/* the - and + by a side's Tr heading move every row's training one step */
document.querySelectorAll("[data-tr-step]").forEach(b=>
  b.addEventListener("click", ()=>{
    const side = b.dataset.trStep, step = +b.dataset.step;
    document.querySelectorAll(`#tbody${side === "attacker" ? "Attacker" : "Defender"} .training`)
      .forEach(el=>{
        el.value = clampInt(+el.value + step, 0, TRAIN_MAX);
        el.dispatchEvent(new Event("input"));
      });
  }));

/* --- army presets --- */
document.querySelectorAll("[data-ap-save]").forEach(b=>
  b.addEventListener("click", ()=>saveArmyPreset(b.dataset.apSave)));
document.querySelectorAll("[data-ap-load]").forEach(b=>
  b.addEventListener("click", ()=>loadArmyPreset(b.dataset.apLoad)));
document.querySelectorAll("[data-ap-copy]").forEach(b=>
  b.addEventListener("click", e=>copyComposition(b.dataset.apCopy, b, e.shiftKey)));
document.querySelectorAll("[data-ap-del]").forEach(b=>
  b.addEventListener("click", ()=>deleteArmyPreset()));
/* the two selects share one pool, so keep them in step */
document.querySelectorAll("[data-ap-sel]").forEach(sel=>
  sel.addEventListener("change", ()=>{
    document.querySelectorAll("[data-ap-sel]").forEach(o=>{ o.value = sel.value; });
  }));

/* --- battle presets --- */
document.getElementById("bpSave").addEventListener("click", saveBattlePreset);
document.getElementById("bpLoad").addEventListener("click", loadBattlePreset);
document.getElementById("bpDel").addEventListener("click", deleteBattlePreset);
document.getElementById("btlCopy").addEventListener("click",
  e=>copyBattleCode(e.currentTarget, e.shiftKey));
document.getElementById("btlLink").addEventListener("click", async e=>{
  const btn = e.currentTarget;
  if (!packSide("attacker").length && !packSide("defender").length){
    alert("Nothing to link to — both sides are empty."); return;
  }
  if (await copyText(battleLink())) flashOk(btn, "copied");
  else alert("This browser would not let the page reach the clipboard.");
});

/* --- tools drawer --- */
const toolsBtn = document.getElementById("btnTools");
const toolsPanel = document.getElementById("toolsPanel");
toolsBtn.addEventListener("click", ()=>{
  const open = toolsPanel.style.display === "none";
  toolsPanel.style.display = open ? "" : "none";
  toolsBtn.classList.toggle("open", open);
  toolsBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) refreshPresetSelects();
});

document.getElementById("expArmies").addEventListener("click", ()=>
  downloadJSON({kind:"armyPresets", armyPresets:getArmies()}, `warcalc-armies-${stamp()}.json`));
document.getElementById("expBattles").addEventListener("click", ()=>
  downloadJSON({kind:"battlePresets", battlePresets:getBattles()}, `warcalc-battles-${stamp()}.json`));
document.getElementById("expAll").addEventListener("click", ()=>
  downloadJSON({kind:"warcalcPresets", armyPresets:getArmies(), battlePresets:getBattles()},
               `warcalc-presets-${stamp()}.json`));

document.getElementById("impBtn").addEventListener("click", ()=>
  document.getElementById("impFile").click());
document.getElementById("impFile").addEventListener("change", e=>{
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importJSON(String(r.result));
  r.readAsText(f);
  e.target.value = "";
});

document.getElementById("wipeSaves").addEventListener("click", ()=>{
  if (!confirm("Delete the autosave and every saved preset in this browser?")) return;
  [LS_KEY, LS_ARMY, LS_BATL].forEach(store.del);
  refreshPresetSelects();
  alert("Cleared.");
});

document.getElementById("btnClearResults").addEventListener("click", ()=>{
  document.getElementById("results").innerHTML = "";
  clearTips("death");
});

document.getElementById("defBonus").addEventListener("change", scheduleSave);

document.getElementById("btnRun").addEventListener("click", ()=>{
  const atk = readSide("attacker");
  const def = readSide("defender");
  if (!atk.length && !def.length){ alert("Add at least one unit to either side."); return; }
  const bad = [...atk, ...def].find(u=>u.size < 1);
  if (bad){ alert("Every unit needs a size of at least 1."); return; }
  try{
    render(simulate(atk, def, document.getElementById("defBonus").value), atk, def,
           document.getElementById("defBonus").value);
  } catch(e){
    document.getElementById("results").innerHTML =
      `<div class="panel"><div class="note warn"><strong>Resolution stopped.</strong> ${esc(e.message)}</div></div>`;
  }
});

/* hover cards for unit names and sprites */
const tipEl = document.getElementById("tip");

document.addEventListener("mouseover", e=>{
  const t = e.target.closest?.("[data-tip-t],[data-tip-key]");
  if (!t) return;
  const d = t.dataset;
  if (d.tipKey){
    const html = TIPS.get(d.tipKey);
    if (!html) return;
    tipEl.innerHTML = html;
  } else {
    tipEl.innerHTML = tipHTML(d.tipT, d.tipW, d.tipA,
      d.tipSize !== undefined ? d.tipSize : null, d.tipTrain);
  }
  tipEl.style.display = "block";
  moveTip(e);
});

document.addEventListener("mouseout", e=>{
  if (e.target.closest?.("[data-tip-t],[data-tip-key]")) tipEl.style.display = "none";
});

document.addEventListener("mousemove", e=>{
  if (tipEl.style.display === "block") moveTip(e);
});

function moveTip(e){
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + r.width  > innerWidth  - 8) x = e.clientX - r.width  - 16;
  if (y + r.height > innerHeight - 8) y = Math.max(8, e.clientY - r.height - 16);
  tipEl.style.left = x + "px";
  tipEl.style.top  = y + "px";
}

/* boot */
(function checkStorage(){
  store.set("warcalc.probe", 1); store.del("warcalc.probe");
  if (storageOK) return;
  const d = document.createElement("div");
  d.className = "note warn";
  d.innerHTML = "<strong>Autosave is off.</strong> This browser is blocking local storage for this page, " +
                "so presets and your current battle won't survive a reload.";
  document.querySelector(".topbar").insertAdjacentElement("afterend", d);
})();

restoreAutosave();
refreshPresetSelects();
refreshCounts();
autosaveArmed = true;
loadFromHash();
addEventListener("hashchange", loadFromHash);
