<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warcalc Lite 1.0 — CLOP</title>
<style>
:root{
  --bg:#272b30;
  --text:#c8c8c8;
  --text-dim:#8b9198;
  --sunken:#1c1e22;
  --raised:#2e3338;
  --border:#1c1e22;
  --border-soft:rgba(0,0,0,.6);
  --link:#ffffff;

  --btn-default-a:#484e55; --btn-default-b:#313539;
  --btn-primary-a:#8a9196; --btn-primary-b:#70787d;
  --btn-success-a:#78cc78; --btn-success-b:#53be53;
  --btn-info-a:#74cae3;    --btn-info-b:#4ab9db;
  --btn-warning-a:#faa123; --btn-warning-b:#e48806;
  --btn-danger-a:#f17a77;  --btn-danger-b:#ec4d49;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:14px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;
  padding:20px;
}
h1,h2,h3{margin:0 0 10px;font-weight:500;color:#fff;letter-spacing:.01em}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:15px;color:var(--text)}
a{color:var(--link)}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
.muted{color:var(--text-dim)}
.small{font-size:12px}

/* ---------- surfaces ---------- */
.panel{
  background:var(--raised);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px;
  margin-bottom:16px;
}
.well{
  background:var(--sunken);
  border:1px solid var(--border-soft);
  border-radius:4px;
  padding:12px;
}
.panel-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--border-soft);
}
.panel-head h2{margin:0;flex:0 0 auto}
.spacer{flex:1 1 auto}

/* ---------- controls ---------- */
.btn{
  display:inline-block;border:1px solid var(--border-soft);border-radius:4px;
  padding:5px 12px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;
  text-shadow:0 -1px 0 rgba(0,0,0,.4);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.btn:hover{filter:brightness(1.14)}
.btn:active{filter:brightness(.9)}
.btn:focus-visible{outline:2px solid #74cae3;outline-offset:1px}
.btn-primary{background-image:linear-gradient(to bottom,var(--btn-primary-a),var(--btn-primary-b))}
.btn-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.btn-info{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}
.btn-warning{background-image:linear-gradient(to bottom,var(--btn-warning-a),var(--btn-warning-b))}
.btn-danger{background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b))}
.btn-xs{padding:2px 8px;font-size:12px}

.badge{
  display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600;color:#fff;
  text-shadow:0 -1px 0 rgba(0,0,0,.4);border:1px solid var(--border-soft);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.badge-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.badge-danger{background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b))}
.badge-info{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}
.badge-warning{background-image:linear-gradient(to bottom,var(--btn-warning-a),var(--btn-warning-b))}

input,select,textarea{
  background:#fff;color:#22262a;border:1px solid var(--border-soft);border-radius:3px;
  padding:4px 6px;font:13px/1.3 inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid #4ab9db;outline-offset:-1px}
input[type=number]{width:100%}
select{width:100%}
textarea{width:100%;min-height:170px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px}
label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:3px}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;text-align:left;vertical-align:middle}
thead th{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);
  font-weight:600;border-bottom:1px solid var(--border-soft);
}
tbody tr{border-bottom:1px solid rgba(0,0,0,.35)}
tbody tr:last-child{border-bottom:none}

.force-table td{padding:6px 5px}
.col-sprite{width:86px}
.col-type{width:120px}
.col-weapon{width:150px}
.col-armor{width:130px}
.col-size{width:82px}
.col-train{width:78px}
.col-del{width:34px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- sprite ---------- */
.sprite{
  width:80px;height:50px;display:block;object-fit:contain;
  background:var(--sunken);border:1px solid var(--border-soft);border-radius:3px;
}
.sprite-lg{width:80px;height:50px;margin:0 auto}
.sprite-missing.sprite-lg{margin:0 auto}
.sprite-missing{
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:20px;font-weight:600;
}
.sprite-missing.sprite-lg{font-size:20px}

/* ---------- log ---------- */
.log{
  max-height:320px;overflow:auto;font-family:"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:12px;line-height:1.6;
}
.log div{padding:2px 0;border-bottom:1px solid rgba(0,0,0,.25)}
.log b{color:#fff;font-weight:600}
.unit-ref{font-weight:600;cursor:help;border-bottom:1px dotted currentColor}
.ref-atk{color:#f17a77}
.ref-def{color:#74cae3}

#tip{
  position:fixed;z-index:999;display:none;pointer-events:none;
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  padding:10px;min-width:230px;max-width:400px;box-shadow:0 8px 22px rgba(0,0,0,.6);
}
.tip-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.tip-head > div{line-height:1.15}
.tip-head > div > div{margin-top:1px}
.tip-title{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.tip-math td{font-size:12px;padding:1px 4px}
.tip-math tbody tr{border:none}
.tip-math .n{text-align:right;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
.tip-math .tot td{border-top:1px solid var(--border-soft);padding-top:4px;color:#fff}
.dmg-ref{cursor:help;border-bottom:1px dotted currentColor}
.tip-table{width:100%;border-top:1px solid var(--border-soft);padding-top:4px}
.tip-table th{font-size:10px;padding:3px 4px}
.tip-table td{font-size:12px;padding:1px 4px}
.tip-table tbody tr{border:none}
.kill{color:#f17a77;font-weight:600}
.hurt{color:#faa123}

.surv-card{
  width:150px;text-align:center;padding:10px;border-radius:4px;
  border:1px solid var(--border-soft);background:var(--sunken);
}
.surv-atk{background:#241a1a;border-color:rgba(241,122,119,.22)}
.surv-def{background:#1a2026;border-color:rgba(116,202,227,.18)}
.surv-dead{opacity:.45}
.surv-col h3{margin-bottom:8px}
.surv-grid{display:flex;gap:12px;flex-wrap:wrap}

.note{
  border-left:3px solid #4ab9db;background:rgba(74,202,227,.07);
  padding:8px 11px;border-radius:0 3px 3px 0;font-size:12.5px;margin-bottom:14px;
}
.note.warn{border-left-color:#faa123;background:rgba(250,161,35,.07)}
details summary{cursor:pointer;color:#fff;font-size:13px;padding:2px 0}
.stat-table input{width:62px;text-align:right;font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px}
.stat-table td,.stat-table th{padding:3px 5px;font-size:12px}
.stat-table tbody th{font-weight:500;color:var(--text);text-transform:none;letter-spacing:0;border:none}

/* ---------- top bar / presets ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.topbar h1{margin:0}
.caret-btn{
  background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1;
  cursor:pointer;padding:0 4px;transition:transform .12s;display:inline-block;
}
.caret-btn:hover{color:#fff}
.caret-btn.open{transform:rotate(90deg)}
.battle-presets{display:flex;align-items:center;gap:4px;opacity:.45;transition:opacity .15s}
.battle-presets:hover,.battle-presets:focus-within{opacity:1}
.bp-lab{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.bp-sel{width:auto;max-width:150px;font-size:11px;padding:1px 4px;background:var(--sunken);color:var(--text);border-color:var(--border-soft)}
.bp-btn{
  background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:1px 3px;
}
.bp-btn:hover{color:#fff;text-decoration:underline}
.bp-btn.ok{color:#78cc78}

/* the bare - and + beside the Tr heading step every row's training */
.force-table th.col-train{position:relative}
.tr-sw{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:none;gap:3px;line-height:1}
.force-table th.col-train:hover .tr-sw{display:flex}
.tr-sw button{
  all:unset;cursor:pointer;position:relative;width:12px;height:12px;opacity:.45;
  border-radius:50%;background:rgba(120,126,134,.14);font-size:0;color:#d4d8dd;
}
.tr-sw button::before,.tr-sw button[data-step="1"]::after{
  content:"";position:absolute;left:50%;top:50%;background:currentColor;
  width:6px;height:1.5px;transform:translate(-50%,-50%);
}
.tr-sw button[data-step="1"]::after{width:1.5px;height:6px}
.tr-sw button:hover{opacity:1}

/* the crunch report — a link can carry the spreadsheet's own totals, and a
   mismatch has to be impossible to click past */
.modal-wrap{
  position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.62);
  display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;overflow:auto;
}
.modal{
  background:var(--raised);border:1px solid var(--border);border-radius:4px;
  width:100%;max-width:580px;box-shadow:0 14px 44px rgba(0,0,0,.55);
}
.modal-head{display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border-soft)}
.modal-head h2{margin:0;font-size:14px;color:#fff}
.modal-body{padding:12px 14px;font-size:12.5px;max-height:62vh;overflow:auto}
.modal-foot{padding:9px 14px;border-top:1px solid var(--border-soft);
  display:flex;gap:8px;align-items:center}
.crunch-side{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);margin:12px 0 2px}
.crunch-side:first-child{margin-top:0}
.crunch-table{width:100%;border-collapse:collapse;font-size:12px}
.crunch-table th,.crunch-table td{padding:3px 6px;text-align:right;
  border-bottom:1px solid var(--border-soft);white-space:nowrap}
.crunch-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);font-weight:500}
.crunch-table th:first-child,.crunch-table td:first-child{text-align:left;width:100%}
.crunch-table td.n{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
.crunch-table tr.crunch-head td{font-weight:700}
.crunch-short{color:#f17a77}
.crunch-over{color:#faa123}
.t-cavalry {color:#FF0000}
.t-tanks   {color:#0076FF}
.t-pegasi  {color:#FF6EC7}
.t-unicorns{color:#00FF21}
.t-naval   {color:#00FFFF}
.army-presets{display:flex;align-items:center;gap:4px;opacity:.45;transition:opacity .15s}
.army-presets:hover,.army-presets:focus-within{opacity:1}
.ap-sel{width:auto;max-width:112px;font-size:11px;padding:1px 4px;
  background:var(--sunken);color:var(--text);border-color:var(--border-soft)}
.v-div{color:var(--text-dim);opacity:.4;font-size:12px;margin:0 1px}

/* ---------- resources ---------- */
.res-icon{
  width:16px;height:16px;display:block;flex:0 0 16px;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.res-chip{display:inline-flex;align-items:center;gap:4px;margin:0 9px 0 0;font-size:12px;white-space:nowrap;vertical-align:middle;line-height:16px}
.res-chip .mono{font-size:12px}
.res-none{color:var(--text-dim);font-size:12px;font-style:italic}
.bits{font-family:"SFMono-Regular",Menlo,Consolas,monospace;color:#fff}

/* ---------- cost footer ---------- */
.cost-foot{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);
}
.cost-drop > summary{
  font-size:12px;color:var(--text-dim);list-style:none;display:inline-flex;gap:5px;align-items:center;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;
}
.cost-drop > summary::-webkit-details-marker{display:none}
.cost-drop > summary:before{content:"▸";display:inline-block;transition:transform .12s}
.cost-drop[open] > summary:before{transform:rotate(90deg)}
.cost-drop > summary:hover{color:#fff}
.cost-body{padding-top:8px}
.cost-row{
  display:flex;gap:10px;align-items:center;padding:3px 0;font-size:12px;
}
.cost-row .cost-label{flex:0 0 138px;color:var(--text-dim)}
.cost-row .cost-val{flex:1 1 auto;text-align:left}
.has-tip > .cost-label{border-bottom:1px dotted var(--text-dim);cursor:help;display:inline-block;flex:0 0 138px}

/* Resources row doubles as the raw dropdown */
.res-drop > summary{list-style:none;cursor:pointer}
.res-drop > summary::-webkit-details-marker{display:none}
.res-drop > summary .caret{display:inline-block;transition:transform .12s;color:var(--text-dim)}
.res-drop[open] > summary .caret{transform:rotate(90deg)}
.res-drop > summary:hover .cost-label{color:#fff}
.res-drop .raw-body{padding:2px 0 2px 12px}
.res-drop .raw-body .cost-label{flex:0 0 126px}

.tip-cost{border-top:1px solid var(--border-soft);margin-top:8px;padding-top:6px;font-size:12px}
.tip-upkeep{width:80px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
.tip-upkeep .res-chip{margin:0}
.tip-break td{font-size:12px;padding:6px 4px;vertical-align:top}
.tip-break tbody tr{border:none}
.tip-break tbody tr + tr td{border-top:1px solid var(--border-soft)}
.tip-break .u{color:#fff;white-space:nowrap}
</style>
</head>
<body>

<div class="topbar">
  <h1>Warcalc Lite 1.0 <button class="caret-btn" id="btnTools" title="Import / export presets" aria-expanded="false">›</button></h1>
  <div class="battle-presets">
    <button class="bp-btn" id="btlCopy" title="Copy the whole battle as a code  (shift-click for the long form)">copy</button>
    <button class="bp-btn" id="btlLink" title="Copy a link that loads this battle">link</button>
  </div>
  <span class="spacer"></span>
  <div class="battle-presets">
    <span class="bp-lab">battle</span>
    <select id="bpSel" class="bp-sel"><option value="">—</option></select>
    <button class="bp-btn" id="bpLoad" title="Load this battle">load</button>
    <button class="bp-btn" id="bpSave" title="Save both sides as a battle">save</button>
    <button class="bp-btn" id="bpDel" title="Delete this battle">del</button>
  </div>
</div>

<div class="panel" id="toolsPanel" style="display:none">
  <div class="panel-head"><h2>Presets</h2><span class="spacer"></span>
    <span class="small muted" id="toolsCount"></span></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-xs" id="expArmies">Export army presets (JSON)</button>
    <button class="btn btn-xs" id="expBattles">Export battle presets (JSON)</button>
    <button class="btn btn-xs" id="expAll">Export everything</button>
    <button class="btn btn-xs btn-info" id="impBtn">Import JSON…</button>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
    <span class="spacer"></span>
    <button class="btn btn-xs btn-danger" id="wipeSaves">Wipe saved data</button>
  </div>
  <div class="small muted" style="margin-top:8px">
    Everything is stored in this browser only. Autosave keeps your current battle across reloads.
  </div>
</div>

<!-- ============ FORCES ============ -->
<div class="grid2">
  <div class="panel">
    <div class="panel-head">
      <h2>Attackers</h2>
      <span class="badge badge-danger" id="atkCount">0</span>
      <span class="spacer"></span>
      <div class="army-presets">
        <select class="ap-sel" data-ap-sel="attacker"><option value="">preset…</option></select>
        <button class="bp-btn" data-ap-load="attacker" title="Load this army">load</button>
        <button class="bp-btn" data-ap-save="attacker" title="Save this side as an army preset">save</button>
        <button class="bp-btn" data-ap-copy="attacker" title="Copy the attackers as a code  (shift-click for the long form)">copy</button>
        <button class="bp-btn" data-ap-del="attacker" title="Delete this army preset">del</button>
      </div>
      <span class="v-div">|</span>
      <button class="btn btn-xs" data-add="attacker">Add unit</button>
      <button class="btn btn-xs" data-clear="attacker">Clear</button>
    </div>
    <table class="force-table">
      <thead><tr>
        <th class="col-sprite">Unit</th><th class="col-type">Type</th><th class="col-weapon">Weapon</th>
        <th class="col-armor">Armor</th><th class="col-size">Size</th><th class="col-train" title="Training">Tr<span class="tr-sw"><button type="button" data-tr-step="attacker" data-step="-1" title="Whole army −1 training">−</button><button type="button" data-tr-step="attacker" data-step="1" title="Whole army +1 training">+</button></span></th><th class="col-del"></th>
      </tr></thead>
      <tbody id="tbodyAttacker"></tbody>
    </table>
    <div class="cost-foot" id="costAttacker"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Defenders</h2>
      <span class="badge badge-info" id="defCount">0</span>
      <span class="spacer"></span>
      <div class="army-presets">
        <select class="ap-sel" data-ap-sel="defender"><option value="">preset…</option></select>
        <button class="bp-btn" data-ap-load="defender" title="Load this army">load</button>
        <button class="bp-btn" data-ap-save="defender" title="Save this side as an army preset">save</button>
        <button class="bp-btn" data-ap-copy="defender" title="Copy the defenders as a code  (shift-click for the long form)">copy</button>
        <button class="bp-btn" data-ap-del="defender" title="Delete this army preset">del</button>
      </div>
      <span class="v-div">|</span>
      <button class="btn btn-xs" data-add="defender">Add unit</button>
      <button class="btn btn-xs" data-clear="defender">Clear</button>
    </div>
    <table class="force-table">
      <thead><tr>
        <th class="col-sprite">Unit</th><th class="col-type">Type</th><th class="col-weapon">Weapon</th>
        <th class="col-armor">Armor</th><th class="col-size">Size</th><th class="col-train" title="Training">Tr<span class="tr-sw"><button type="button" data-tr-step="defender" data-step="-1" title="Whole army −1 training">−</button><button type="button" data-tr-step="defender" data-step="1" title="Whole army +1 training">+</button></span></th><th class="col-del"></th>
      </tr></thead>
      <tbody id="tbodyDefender"></tbody>
    </table>
    <div class="cost-foot" id="costDefender"></div>
  </div>
</div>

<!-- ============ RUN ============ -->
<div class="panel">
  <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
    <div style="width:150px">
      <label for="defBonus">Defender bonus</label>
      <select id="defBonus"><option value="Yes">Yes</option><option value="No">No</option></select>
    </div>
    <button class="btn btn-success" id="btnRun" style="padding:7px 22px;font-size:14px">Resolve battle</button>
    <button class="btn" id="btnClearResults" style="padding:7px 16px;font-size:14px">Clear</button>
  </div>
</div>

<!-- ============ RESULTS ============ -->
<div id="results"></div>
<div id="tip"></div>

<!-- ============ IMPORT ============ -->
<div class="panel">
  <div class="panel-head"><h2>Import units</h2></div>
  <textarea id="txtImport" spellcheck="false" placeholder="an army code &#8212; 3F3F&#10;a battle code &#8212; +3F3F-9kQw2&#10;&#10;or the long form:&#10;4_ACFU_Nope&#10;Cavalry&#10;ACFU&#10;Nope&#10;Size: 200&#10;Training: 20&#10;&#10;or a whole nation page, copied off the screen&#10;&#10;or preset JSON, as the Export buttons write it"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-xs" id="btnImportAtk">Import to attackers</button>
    <button class="btn btn-xs" id="btnImportDef">Import to defenders</button>
    <span class="v-div">|</span>
    <button class="btn btn-xs btn-info" id="btnImportBattle">Import battle</button>
  </div>
</div>

<script>
"use strict";

/* ===================================================================
   1. DEFINITIONS  (mirrors $forcetypes / $weapontypes / $armortypes)
   =================================================================== */

const FORCE_TYPES = {Cavalry:1, Tanks:2, Pegasi:3, Unicorns:4, Naval:5, Alicorns:6};
const TYPES = {1:"cavalry", 2:"tanks", 3:"pegasi", 4:"unicorns", 5:"naval"};

const gearCost = (kind, key) =>
  (kind === "weapon" ? WEAPON_COST : ARMOR_COST)[key] || {bits:0, res:{}};

const bits = n => money(n);

function addRes(into, from, mult){
  Object.entries(from || {}).forEach(([k,v])=>{ into[k] = (into[k]||0) + v*(mult ?? 1); });
  return into;
}

/* replace crafted parts with what they are actually made of */
function toRaw(res){
  const out = {};
  let craftBits = 0;
  Object.entries(res).forEach(([k,v])=>{
    const rec = CRAFT[k];
    if (rec){ addRes(out, rec.res, v); craftBits += rec.bits * v; }
    else out[k] = (out[k]||0) + v;
  });
  return {res: out, craftBits};
}

function resIcon(key){
  const r = RESOURCES[key];
  if (!r) return esc(key);
  return `<img class="res-icon" src="${r.icon}" alt="${esc(r.name)}" title="${esc(r.name)}">`;
}

function resChips(res){
  const keys = RES_ORDER.filter(k=>res[k]);
  const extra = Object.keys(res).filter(k=>!RESOURCES[k] && res[k]);
  if (!keys.length && !extra.length) return `<span class="res-none">none</span>`;
  return keys.concat(extra).map(k=>
    `<span class="res-chip">${resIcon(k)}<span class="mono">${res[k]}</span></span>`).join("");
}

/* ===================================================================
   2. SPRITES
   Same filename scheme overview.php uses:
   images/{lowertype}/w-{armor_id}-{weapon_id}.png
   Scrounged gear is id 0 on both axes, so unequipped units land on w-0-0.png.
   Anything that 404s is replaced with a question mark.
   =================================================================== */
const IMG_BASE = "https://4clop.org/images/";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function spritePath(type, weapon, armor){
  return `${IMG_BASE}${type.toLowerCase()}/w-${ARMOR_IDS[armor]}-${WEAPON_IDS[weapon]}.png`;
}

function buildSprite(type, weapon, armor, big, meta){
  const tip = typeof tipAttrs === "function"
    ? tipAttrs(type, weapon, armor, meta?.size, meta?.training) : "";
  return `<img class="sprite${big ? " sprite-lg" : ""}" src="${esc(spritePath(type, weapon, armor))}"
    alt="${esc(type)} — ${esc(label(weapon))} / ${esc(label(armor))}" loading="lazy"
    ${tip} onerror="this.replaceWith(spriteMissing(this))">`;
}

function spriteMissing(img){
  const span = document.createElement("span");
  span.className = "sprite sprite-missing" + (img.classList.contains("sprite-lg") ? " sprite-lg" : "");
  span.textContent = "?";
  Object.entries(img.dataset).forEach(([k, v])=>{ span.dataset[k] = v; });
  return span;
}

/* ===================================================================
   3. ROW MANAGEMENT
   =================================================================== */

let rowSeq = 0;

function makeRow(side, data){
  const tr = document.createElement("tr");
  tr.dataset.side = side;
  tr.dataset.id = ++rowSeq;

  const typeOpts = (side === "defender"
    ? ["Cavalry","Tanks","Pegasi","Unicorns","Naval","Alicorns"]
    : ["Cavalry","Tanks","Pegasi","Unicorns","Naval"]);

  tr.innerHTML = `
    <td class="col-sprite"><span class="spriteSlot"></span></td>
    <td class="col-type"><select class="type">
      ${typeOpts.map(t=>`<option value="${t}">${t}</option>`).join("")}
    </select></td>
    <td class="col-weapon"><select class="weapon"><option value="">—</option></select></td>
    <td class="col-armor"><select class="armor"><option value="">—</option></select></td>
    <td class="col-size"><input type="number" class="size" min="1" value="${data?.size ?? 1}"></td>
    <td class="col-train"><input type="number" class="training" min="0" max="20" value="${data?.training ?? 0}"></td>
    <td class="col-del"><button class="btn btn-danger btn-xs del" title="Remove unit">×</button></td>`;

  const typeSel = tr.querySelector(".type");
  const wSel = tr.querySelector(".weapon");
  const aSel = tr.querySelector(".armor");

  typeSel.addEventListener("change", ()=>{ fillLoadout(typeSel.value, wSel, aSel); paintRow(tr); });
  wSel.addEventListener("change", ()=>paintRow(tr));
  aSel.addEventListener("change", ()=>paintRow(tr));
  tr.querySelector(".training").addEventListener("input", ()=>paintRow(tr));
  tr.querySelector(".size").addEventListener("input", ()=>paintRow(tr));
  tr.querySelector(".del").addEventListener("click", ()=>{ tr.remove(); refreshCounts(); });

  document.getElementById(side === "attacker" ? "tbodyAttacker" : "tbodyDefender").appendChild(tr);

  typeSel.value = (data && data.type) || "Cavalry";
  fillLoadout(typeSel.value, wSel, aSel);
  wSel.value = (data && data.weapon) || "ScroungedWeapons";
  aSel.value = (data && data.armor)  || "ScroungedArmor";
  if (!wSel.value) wSel.selectedIndex = 0;
  if (!aSel.value) aSel.selectedIndex = 0;
  paintRow(tr);
  refreshCounts();
  return tr;
}

function fillLoadout(type, wSel, aSel){
  wSel.innerHTML = ""; aSel.innerHTML = "";
  const set = LOADOUTS[type];
  if (!set){
    wSel.innerHTML = '<option value="">—</option>';
    aSel.innerHTML = '<option value="">—</option>';
    return;
  }
  set.weapons.forEach(w=>wSel.add(new Option(label(w), w)));
  set.armor.forEach(a=>aSel.add(new Option(label(a), a)));
}

function paintRow(tr){
  const type = tr.querySelector(".type").value;
  const weapon = tr.querySelector(".weapon").value || "ScroungedWeapons";
  const armor = tr.querySelector(".armor").value || "ScroungedArmor";
  const training = tr.querySelector(".training").value;
  const size = tr.querySelector(".size").value;
  const slot = tr.querySelector(".spriteSlot");

  // keep the same <img> when only size/training moved — avoids a sprite reload
  const cur = slot.querySelector("[data-tip-t]");
  if (type && cur && cur.dataset.tipT === type && cur.dataset.tipW === weapon && cur.dataset.tipA === armor){
    cur.dataset.tipSize = size;
    cur.dataset.tipTrain = training;
  } else {
    slot.innerHTML = type
      ? buildSprite(type, weapon, armor, false, {size, training})
      : `<span class="muted small">—</span>`;
  }
  refreshCosts();
}

function refreshCounts(){
  document.getElementById("atkCount").textContent =
    document.querySelectorAll("#tbodyAttacker tr").length + " units";
  document.getElementById("defCount").textContent =
    document.querySelectorAll("#tbodyDefender tr").length + " units";
  refreshCosts();
}

/* ===================================================================
   3b. COST SUMMARY per side
   =================================================================== */

/* tooltips whose body is arbitrary html live in this registry, keyed by
   data-tip-key, so we never have to shove markup through an attribute */
const TIPS = new Map();
let tipSeq = 0;
function regTip(html, ns){
  const k = (ns || "k") + (++tipSeq);
  TIPS.set(k, html);
  return k;
}
function clearTips(ns){
  [...TIPS.keys()].forEach(k=>{ if (k.startsWith(ns)) TIPS.delete(k); });
}

function sideCosts(side){
  const rows = readSide(side);
  let hire = 0, gearBits = 0;
  const upkeep = {}, gearRes = {};
  const items = [];

  rows.forEach(u=>{
    const n = Math.max(0, u.size);            // every cost is per troop
    const uc = UNIT_COST[u.type] || {hire:0, upkeep:{}};
    hire += uc.hire * n;
    addRes(upkeep, uc.upkeep, n);

    const w = gearCost("weapon", u.weapon), a = gearCost("armor", u.armor);
    const gb = (w.bits + a.bits) * n;
    gearBits += gb;
    addRes(gearRes, w.res, n); addRes(gearRes, a.res, n);

    items.push({u, n, w, a,
      res: addRes(addRes({}, w.res, n), a.res, n),
      gbits: gb,
      hire: uc.hire * n,
      upkeep: addRes({}, uc.upkeep, n)});
  });

  const raw = toRaw(gearRes);
  return {rows, items, hire, upkeep, gearBits, gearRes,
          rawRes: raw.res, craftBits: raw.craftBits};
}

function breakdownTip(title, items, cell, countFmt){
  if (!items.length) return `<div class="tip-title">${esc(title)}</div>
    <div class="small muted" style="margin-top:4px">No units yet.</div>`;
  const count = countFmt || (it=>"×" + it.n);
  const rows = items.map(it=>`<tr>
      <td class="u">${esc(it.u.type)} <span class="muted mono">${count(it)}</span>
        <div class="small muted">${esc(label(it.u.weapon))} / ${esc(label(it.u.armor))}</div></td>
      <td style="text-align:right">${cell(it)}</td></tr>`).join("");
  return `<div class="tip-title">${esc(title)}</div>
    <table class="tip-break" style="margin-top:6px">${rows}</table>`;
}

function renderCosts(side){
  const el = document.getElementById(side === "attacker" ? "costAttacker" : "costDefender");
  if (!el) return;
  const c = sideCosts(side);

  const hireTipKey = regTip(breakdownTip("Raise army — money cost", c.items, it=>
    `<span class="bits">${money(it.hire)}</span>`
  ) + `<div class="tip-cost">Total <span class="bits">${money(c.hire)}</span></div>`, "cost");

  const upkeepTipKey = regTip(breakdownTip("Upkeep — per 12 hours", c.items,
    it=>resChips(it.upkeep)), "cost");

  const gearTipKey = regTip(breakdownTip("Equipment — money cost", c.items, it=>
    `<span class="bits">${money(it.gbits)}</span>` +
    `<div class="small muted mono">${esc(label(it.u.weapon))} ${money(it.w.bits * it.n)} · ${esc(label(it.u.armor))} ${money(it.a.bits * it.n)}</div>`
  ) + `<div class="tip-cost">Total <span class="bits">${money(c.gearBits)}</span></div>`, "cost");

  const resTipKey = regTip(breakdownTip("Equipment — resource cost", c.items, it=>resChips(it.res)), "cost");

  const rawTipKey = regTip(breakdownTip("Equipment — raw resource cost", c.items, it=>{
    const r = toRaw(it.res);
    return resChips(r.res) + (r.craftBits
      ? `<div class="small muted mono">+ ${money(r.craftBits)} crafting</div>` : "");
  }) + `<div class="tip-cost">Crafting fees <span class="bits">${money(c.craftBits)}</span></div>`, "cost");

  const hasUnits = c.rows.length > 0;
  const tip = k => hasUnits ? ` class="cost-row has-tip" data-tip-key="${k}"` : ` class="cost-row"`;
  const prevMain = el.querySelector("details.cost-drop");
  const prevRaw  = el.querySelector("details.res-drop");
  const openMain = prevMain ? prevMain.open : false;
  const openRaw  = prevRaw  ? prevRaw.open  : false;

  el.innerHTML = `
    <details class="cost-drop"${openMain ? " open" : ""}>
      <summary>Costs</summary>
      <div class="cost-body">
        <div${tip(hireTipKey)}>
          <span class="cost-label">Raise army</span>
          <span class="cost-val bits">${money(c.hire)}</span>
        </div>
        <div${tip(upkeepTipKey)}>
          <span class="cost-label">Upkeep / 12 h</span>
          <span class="cost-val">${resChips(c.upkeep)}</span>
        </div>
        <div${tip(gearTipKey)}>
          <span class="cost-label">Equipment ${BIT}</span>
          <span class="cost-val bits">${money(c.gearBits)}</span>
        </div>
        ${resourceBlock({

function readSide(side){
