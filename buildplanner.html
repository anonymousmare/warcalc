<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLOP Build Planner</title>
<style>
/* the house look, lifted from Warcalc's Grey theme */
:root{
  color-scheme:dark;
  --bg:#272b30;
  --text:#c8c8c8;
  --text-dim:#8b9198;
  --sunken:#1c1e22;
  --raised:#2e3338;
  --border:#1c1e22;
  --border-soft:rgba(0,0,0,.6);
  --strong:#fff;
  --accent:#4ab9db;
  --def:#74cae3;
  --btn-default-a:#484e55; --btn-default-b:#313539;
  --btn-success-a:#78cc78; --btn-success-b:#53be53;
  --btn-info-a:#74cae3;    --btn-info-b:#4ab9db;
  --btn-danger-a:#f17a77;  --btn-danger-b:#ec4d49;
  --btn-ink:#fff; --btn-shadow:0 -1px 0 rgba(0,0,0,.4);
  --btn-default-ink:var(--btn-ink); --btn-default-shadow:var(--btn-shadow);
  --input-bg:#fff; --input-ink:#22262a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --head-font:var(--font);
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  --pos:#78cc78; --neg:#f17a77;
}

/* ===================== themes =====================
   The same six as Warcalc, picked from the gear and shared with it through
   the warcalc.theme key, so a pick in either one carries to the other */
[data-theme] body{min-height:100vh;background-repeat:no-repeat}
[data-theme] :where(button,select){font-family:var(--font)}
@font-face{font-family:"Lovelt";src:url("https://files.catbox.moe/h1xvtm.ttf") format("truetype");font-display:swap}
/* the resource colours are drawn for a dark page, so on the light themes the
   readouts keep the theme's own background and the colours go darker instead */
:is([data-theme="white"],[data-theme="applejack"],[data-theme="rainbow"]) :is(.oc-lab,.bl-name,.net-name,.tip-name){
  color:color-mix(in srgb,var(--res,var(--text-dim)) 58%,#000)}
[data-theme="white"]{--pos:#2e8b2e;--neg:#c9302c}
/* the game's sprites are drawn for a dark page and their pale parts vanish on a light one,
   so the light themes ring each in a soft halo of their own ink, as Warcalc does */
[data-theme="white"]{--icon-edge:drop-shadow(0 0 .5px rgba(0,0,0,.5)) drop-shadow(0 1px 1px rgba(0,0,0,.15))}
[data-theme="applejack"]{--icon-edge:drop-shadow(0 0 .6px rgba(77,42,18,.9)) drop-shadow(0 1px 1px rgba(77,42,18,.35))}
[data-theme="rainbow"]{--icon-edge:drop-shadow(0 0 .6px rgba(6,58,148,.9)) drop-shadow(0 1px 1px rgba(6,58,148,.35))}
.res-ic{filter:var(--icon-edge,none)}
[data-theme="applejack"]{--pos:#4f6b1f;--neg:#a8321a}
[data-theme="rainbow"]{--pos:#13803a;--neg:#d42020}

/* ---- White: Bootstrap 3 with its gradients ---- */
:root[data-theme="white"]{
  color-scheme:light;
  --bg:#fff; --text:#333; --text-dim:#777; --strong:#333;
  --sunken:#f5f5f5; --raised:#fff; --border:#ddd; --border-soft:rgba(0,0,0,.15);
  --btn-default-a:#fff; --btn-default-b:#e0e0e0;
  --btn-success-a:#5cb85c; --btn-success-b:#419641;
  --btn-info-a:#5bc0de;    --btn-info-b:#2aabd2;
  --btn-danger-a:#d9534f;  --btn-danger-b:#c12e2a;
  --btn-ink:#fff; --btn-shadow:0 -1px 0 rgba(0,0,0,.2);
  --btn-default-ink:#333; --btn-default-shadow:0 1px 0 #fff;
  --input-bg:#fff; --input-ink:#555;
  --accent:#428bca; --def:#2a7fa8;
}
[data-theme="white"] .tabstrip{background-image:linear-gradient(#fff,#f8f8f8);border-bottom-color:#e7e7e7;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 5px rgba(0,0,0,.075)}
[data-theme="white"] .panel{box-shadow:0 1px 2px rgba(0,0,0,.05)}
[data-theme="white"] .panel > .panel-head:first-child{margin:-14px -14px 12px;padding:9px 14px;border-radius:3px 3px 0 0;
  background-image:linear-gradient(#f5f5f5,#e8e8e8);border-bottom-color:#ddd}
[data-theme="white"] .well{background-image:linear-gradient(#e8e8e8,#f5f5f5);border-color:#dcdcdc;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.05),0 1px 0 rgba(255,255,255,.1)}
[data-theme="white"] .btn{border-color:#ccc}
[data-theme="white"] :is(.btn-success,.btn-danger){border-color:rgba(0,0,0,.18)}
[data-theme="white"] .tab.active{background-image:linear-gradient(#ebebeb,#f3f3f3);box-shadow:inset 0 3px 9px rgba(0,0,0,.075)}

/* ---- Black: Bootswatch Cyborg ---- */
:root[data-theme="black"]{
  color-scheme:dark;
  --bg:#060606; --text:#888; --text-dim:#6f6f6f; --strong:#fff;
  --sunken:#151515; --raised:#222; --border:#282828; --border-soft:#282828;
  --btn-default-a:#424242; --btn-default-b:#424242;
  --btn-success-a:#77b300; --btn-success-b:#77b300;
  --btn-info-a:#93c;       --btn-info-b:#93c;
  --btn-danger-a:#c00;     --btn-danger-b:#c00;
  --btn-shadow:none; --btn-default-shadow:none;
  --input-bg:#fff; --input-ink:#555;
  --accent:#2a9fd6; --def:#2a9fd6;
}
[data-theme="black"] .tabstrip{background:#060606;border-bottom-color:#282828}
[data-theme="black"] .panel{border-color:#282828}
[data-theme="black"] .btn{border-color:transparent}
[data-theme="black"] :is(.btn,.badge){border-radius:4px}
[data-theme="black"] .tab.active{border-bottom-color:#2a9fd6}

/* ---- Optimal: black, pink and a little glow ---- */
:root[data-theme="optimal"]{
  color-scheme:dark;
  --font:"Times New Roman",Times,serif; --head-font:"Lovelt","Times New Roman",serif; --font-size:15px;
  --bg:#000; --text:#fff; --text-dim:#c9a3c9; --strong:#fff;
  --sunken:#000; --raised:#000; --border:#ff9fff; --border-soft:rgba(255,159,255,.45);
  --btn-default-a:#000; --btn-default-b:#000;
  --btn-success-a:#000; --btn-success-b:#000;
  --btn-info-a:#000;    --btn-info-b:#000;
  --btn-danger-a:#000;  --btn-danger-b:#000;
  --btn-shadow:none; --btn-default-shadow:none;
  --input-bg:#000; --input-ink:#fff;
  --accent:#ff9fff; --def:#a9d8ff;
}
[data-theme="optimal"] h2{color:#ff9fff;font-weight:400}
[data-theme="optimal"] .tabstrip{background:#000;border-bottom-color:#ff9fff;box-shadow:0 .25rem .5rem rgba(255,159,255,.25)}
[data-theme="optimal"] .tab.active{border-bottom-color:#ff9fff}
[data-theme="optimal"] .tab-brand{color:#ff9fff}
[data-theme="optimal"] .panel{border-radius:.25rem;box-shadow:0 .25rem .5rem 0 #ff9fff}
[data-theme="optimal"] .well{border-color:#ff9fff;box-shadow:0 0 .5rem .01rem rgba(255,159,255,.5)}
[data-theme="optimal"] :is(select,textarea){border-color:#fff}
[data-theme="optimal"] textarea::placeholder{color:#5b375b}
[data-theme="optimal"] :is(.btn,.badge){border:1px solid #ff9fff;box-shadow:0 0 .5rem .05rem rgba(255,159,255,.5)}
[data-theme="optimal"] .btn:hover{background-image:none;background-color:#5b375b;filter:none}
[data-theme="optimal"] .btn:active{background-image:none;background-color:#ff9fff;color:#000}
[data-theme="optimal"] .btn-danger{border-color:#fff;box-shadow:0 0 .25rem .1rem rgba(255,255,255,.5)}
[data-theme="optimal"] .btn-success{background-image:none;background-color:#5b375b}
[data-theme="optimal"] .badge-info{color:#a9d8ff;border-color:#a9d8ff;box-shadow:0 0 .4rem rgba(169,216,255,.5)}
[data-theme="optimal"] ::selection{background:#ff9fff;color:#000}

/* ---- Applejack: Sweet Apple Acres, parchment on barn wood ---- */
:root[data-theme="applejack"]{
  color-scheme:light;
  --font:"Caudex",Georgia,"Times New Roman",serif; --head-font:"Rye","IM Fell English SC",Georgia,serif;
  --bg:#eadfae; --text:#2f2115; --text-dim:#7a5a36; --strong:#4d2a12;
  --sunken:#f4dfad; --raised:#fff2d1; --border:#bd823a; --border-soft:rgba(141,88,40,.38);
  --btn-default-a:#f7e5bf; --btn-default-b:#c99b62;
  --btn-success-a:#81994c; --btn-success-b:#546b2d;
  --btn-info-a:#5d86b3;    --btn-info-b:#2f5b8a;
  --btn-danger-a:#d45e34;  --btn-danger-b:#9f2f18;
  --btn-ink:#fff9df; --btn-shadow:0 -1px 0 rgba(52,28,9,.45);
  --btn-default-ink:#2b190b; --btn-default-shadow:0 1px 0 rgba(255,250,226,.7);
  --input-bg:#fffaf0; --input-ink:#2f2115;
  --accent:#c24a27; --def:#2f5f8f;
}
[data-theme="applejack"] body{background:
  radial-gradient(circle at 11% 38%,rgba(170,77,34,.45) 0 3px,transparent 4px),
  radial-gradient(circle at 87% 39%,rgba(170,77,34,.45) 0 3px,transparent 4px),
  linear-gradient(90deg,#b7cfb8 0%,#d9e5c7 14%,#eadfae 30%,#eadfae 70%,#d9e5c7 86%,#b7cfb8 100%) #eadfae}
[data-theme="applejack"] h2{color:#a73620;font-weight:400;letter-spacing:.02em;text-shadow:0 1px 0 #fff2c7}
[data-theme="applejack"] .tabstrip{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),
  linear-gradient(#6b3d1a,#4d2a12);border-bottom:2px solid #2c170a;box-shadow:0 3px 8px rgba(54,29,8,.32);
  --text-dim:#e3c690;--strong:#fff2d1;--border-soft:rgba(0,0,0,.4)}
[data-theme="applejack"] .tab{font-family:"Rye",Georgia,serif;font-weight:400}
[data-theme="applejack"] .tab.active{border-bottom-color:#e2734a}
[data-theme="applejack"] .panel{border-width:2px;border-color:#bd823a;
  box-shadow:inset 0 0 0 2px rgba(255,250,226,.7),0 6px 16px rgba(61,35,10,.22)}
[data-theme="applejack"] .panel-head{border-bottom:2px dashed #c17732}
[data-theme="applejack"] .well{background-color:#f4dfad;border-color:#bd823a}
[data-theme="applejack"] .btn{border-color:#7d562d;box-shadow:inset 0 1px 0 rgba(255,255,220,.35),0 2px 0 rgba(52,28,9,.3)}
[data-theme="applejack"] .btn-success{border-color:#37491c}
[data-theme="applejack"] .btn-danger{border-color:#64230f}
[data-theme="applejack"] ::selection{background:#c24a27;color:#fff2d1}

/* ---- Rainbow Dash: sky, clouds and twenty percent cooler ---- */
:root[data-theme="rainbow"]{
  color-scheme:light;
  --font:"Trebuchet MS",Verdana,Arial,sans-serif; --head-font:"Trebuchet MS",Verdana,Arial,sans-serif;
  --mono:"Courier New",Courier,monospace;
  --bg:#b9e8ff; --text:#063a94; --text-dim:#3d6db5; --strong:#052c7c;
  --sunken:#e5f8ff; --raised:#f1fbff; --border:#72b6f1; --border-soft:rgba(29,105,199,.28);
  --btn-default-a:#eff8ff; --btn-default-b:#9bd8ff;
  --btn-success-a:#7ee08b; --btn-success-b:#38b54c;
  --btn-info-a:#b08cff;    --btn-info-b:#8e55ff;
  --btn-danger-a:#ff8f8f;  --btn-danger-b:#ec4040;
  --btn-ink:#fff; --btn-shadow:0 1px 1px rgba(5,44,124,.55);
  --btn-default-ink:#063a94; --btn-default-shadow:0 1px 0 rgba(255,255,255,.8);
  --input-bg:#fff; --input-ink:#063a94;
  --accent:#ff4fc8; --def:#1d69c7;
}
[data-theme="rainbow"] body{background:
  linear-gradient(180deg,rgba(255,255,255,.62),transparent 120px),
  radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.9) 0 8%,transparent 8.4%),
  radial-gradient(ellipse at 78% 12%,rgba(255,255,255,.7) 0 10%,transparent 10.5%),
  linear-gradient(180deg,#b9e8ff,#6eb9f6 1400px,#d9f8ff 2600px) #d9f8ff}
[data-theme="rainbow"] .tabstrip{background:linear-gradient(#d9ecff,#8fbff5 58%,#6da5ed);border-bottom:3px solid;
  border-image:linear-gradient(90deg,#ee4144,#f37033,#fdf6af,#62bc4d,#1e98d3,#672f89) 1;
  --text-dim:#1b3c72;--strong:#052c7c}
[data-theme="rainbow"] .tab,[data-theme="rainbow"] .tab-brand{font-weight:700}
[data-theme="rainbow"] .tab:hover,[data-theme="rainbow"] .tab.active{text-shadow:0 1px 0 rgba(255,255,255,.8)}
[data-theme="rainbow"] .tab.active{border-bottom-color:#ff4fc8}
[data-theme="rainbow"] .tab-brand{font:400 10px/1 "Press Start 2P","Courier New",monospace;color:#102d66}
[data-theme="rainbow"] .panel{border:2px solid #72b6f1;border-radius:8px;background:rgba(239,250,255,.92);
  box-shadow:0 4px 14px rgba(11,79,160,.28),inset 0 0 0 2px rgba(255,255,255,.78)}
[data-theme="rainbow"] .panel > .panel-head:first-child{margin:-12px -12px 12px;padding:6px 10px;border-radius:6px;
  border:1px solid #8bd0ff;background:linear-gradient(#7cc9ff,#3f96e9);
  --text:#fff;--text-dim:#e5f8ff;--strong:#fff;--border-soft:rgba(5,44,124,.35)}
[data-theme="rainbow"] .panel > .panel-head:first-child h2{color:#fff;text-transform:uppercase;font-weight:700;letter-spacing:.02em;
  text-shadow:-1px -1px 0 #2066c3,1px -1px 0 #2066c3,-1px 1px 0 #2066c3,1px 1px 0 #2066c3,0 2px 0 #174d9a}
[data-theme="rainbow"] h2{color:#1d69c7;font-weight:700}
[data-theme="rainbow"] .well{border:2px solid #9bd8ff;border-radius:6px}
[data-theme="rainbow"] .btn{border-color:#4d8bdc;border-radius:6px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.6)}
[data-theme="rainbow"] :is(select,textarea){border-color:#74aeea}
[data-theme="rainbow"] ::selection{background:#ff4fc8;color:#fff}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--font-size,14px)/1.45 var(--font);padding:20px}
h2{margin:0;font-size:19px;font-weight:500;color:var(--strong);letter-spacing:.01em;font-family:var(--head-font)}
p{margin:0}
[hidden]{display:none!important}

/* ---------- tab strip ---------- */
.tabstrip{
  display:flex;align-items:stretch;gap:2px;
  margin:-20px -20px 14px;padding:0 16px;
  height:30px;background:var(--sunken);border-bottom:1px solid var(--border-soft);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip > *{flex:0 0 auto}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-dim);font:500 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;
  padding:0 14px;cursor:pointer;
}
.tab:hover{color:var(--strong)}
.tab.active{color:var(--strong);border-bottom-color:var(--accent)}
.tab-brand{
  display:flex;align-items:center;gap:2px;color:var(--text-dim);font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding-right:10px;margin-right:6px;
  border-right:1px solid var(--border-soft);
}
.gear-btn{
  background:none;border:none;color:var(--text-dim);cursor:pointer;
  padding:0 2px 0 6px;display:inline-flex;align-items:center;line-height:0;
}
.gear-btn svg{width:22px;height:22px;transition:transform .2s}
.gear-btn:hover,.gear-btn.open{color:var(--strong)}
.gear-btn.open svg{transform:rotate(60deg)}

/* ---------- surfaces ---------- */
.panel{background:var(--raised);border:1px solid var(--border);border-radius:4px;padding:14px;min-width:0}
.panel-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border-soft);
}
.well{background:var(--sunken);border:1px solid var(--border-soft);border-radius:4px}
.spacer{flex:1 1 auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:720px){.split{grid-template-columns:1fr}}
#toolsPanel{margin-bottom:14px}

/* ---------- controls ---------- */
.btn{
  display:inline-block;border:1px solid var(--border-soft);border-radius:4px;
  padding:5px 12px;font-size:13px;font-weight:500;color:var(--btn-default-ink);cursor:pointer;
  text-shadow:var(--btn-default-shadow);
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.btn:hover{filter:brightness(1.14)}
.btn:active{filter:brightness(.9)}
.btn:focus-visible{outline:2px solid var(--def);outline-offset:1px}
.btn-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.btn-danger{background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b))}
.btn-success,.btn-danger{color:var(--btn-ink);text-shadow:var(--btn-shadow)}
.badge{
  display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600;color:var(--btn-default-ink);
  text-shadow:var(--btn-default-shadow);border:1px solid var(--border-soft);white-space:nowrap;
  background-image:linear-gradient(to bottom,var(--btn-default-a),var(--btn-default-b));
}
.badge-success{background-image:linear-gradient(to bottom,var(--btn-success-a),var(--btn-success-b))}
.badge-info{background-image:linear-gradient(to bottom,var(--btn-info-a),var(--btn-info-b))}
.badge-success,.badge-info{color:var(--btn-ink);text-shadow:var(--btn-shadow)}
.alert{
  margin-bottom:14px;border-radius:4px;padding:10px 12px;border:1px solid var(--border-soft);color:var(--btn-ink);
  text-shadow:var(--btn-shadow);background-image:linear-gradient(to bottom,var(--btn-danger-a),var(--btn-danger-b));
}
.alert code{font-family:var(--mono);background:rgba(0,0,0,.2);padding:0 4px;border-radius:3px}
.hk-toggle{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);cursor:pointer;white-space:nowrap}
.hk-toggle:hover{color:var(--text)}
select{background:var(--input-bg);color:var(--input-ink);border:1px solid var(--border-soft);border-radius:3px;
  width:auto;padding:1px 4px;font-size:12px}

textarea,#out{display:block;width:100%;min-height:420px;margin:0;padding:8px 10px;font:12.5px/1.45 var(--mono)}
textarea{background:var(--input-bg);color:var(--input-ink);border:1px solid var(--border-soft);border-radius:3px;resize:vertical}
textarea:focus,#out:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* the column: the count that gets copied, then the building it belongs to,
   for looking at only — the label never goes into the copy */
#out{color:var(--strong);overflow:auto;font-variant-numeric:tabular-nums}
.oc-row{display:flex;gap:14px;min-height:1.45em;white-space:nowrap}
.oc-n{min-width:5ch;text-align:right}
.oc-lab{font-family:var(--font);font-size:12px;font-weight:600;user-select:none;-webkit-user-select:none;
  color:var(--res, var(--text-dim))}
.oc-row.zero .oc-n{color:var(--text-dim)}
.oc-row.zero .oc-lab{opacity:.5}
/* where the disabled block starts: a rule on screen, six blank rows in the copy */
.oc-div{display:flex;align-items:center;gap:8px;margin:10px 0 8px;user-select:none;-webkit-user-select:none;
  font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.oc-div::before,.oc-div::after{content:"";flex:1 1 auto;border-top:1px solid var(--text-dim);opacity:.45}
.oc-div::before{flex:0 0 12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%)}

/* ---------- planner: nations as manila envelopes ---------- */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;padding:8px 2px}
.env{
  --env:#d6b47a;
  position:relative;display:block;width:100%;aspect-ratio:3/2;padding:0;border:none;border-radius:5px;cursor:pointer;
  font:inherit;color:#2a2620;text-align:left;
  background:
    repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),
    linear-gradient(color-mix(in srgb,var(--env) 88%,#fff),var(--env));
  box-shadow:0 1px 0 color-mix(in srgb,var(--env) 60%,#000),0 6px 14px rgba(0,0,0,.35);
  transition:transform .12s ease,box-shadow .12s ease;
}
.env:hover{transform:translateY(-3px) rotate(-.5deg);box-shadow:0 1px 0 color-mix(in srgb,var(--env) 60%,#000),0 10px 20px rgba(0,0,0,.4)}
.env:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* the flap, and the string-tie button at its point */
.env::before{
  content:"";position:absolute;left:0;right:0;top:0;height:46%;border-radius:5px 5px 0 0;
  background:color-mix(in srgb,var(--env) 84%,#000);
  clip-path:polygon(0 0,100% 0,100% 16%,56% 100%,44% 100%,0 16%);
}
.env::after{
  content:"";position:absolute;left:50%;top:46%;width:11px;height:11px;margin:-6px 0 0 -6px;border-radius:50%;
  background:color-mix(in srgb,var(--env) 55%,#7a1f12);box-shadow:0 1px 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.env-label{
  position:absolute;left:11%;right:11%;bottom:12%;padding:5px 9px 6px;border-radius:2px;
  background:#f6f1e2;box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(-1deg);
  display:flex;flex-direction:column;gap:1px;min-width:0;
}
.env-name{font:700 14px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env-sub{font:11px/1.2 var(--font);color:#7a7060}
/* the empty slot that makes a new one */

.slip{

}
.slip:hover{transform:translateY(-2px)}
.slip:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .pt-name{white-space:normal;line-height:1.2}.pt-head > span{letter-spacing:.02em;font-size:9.5px}}

</style>
<script>
/* the theme goes on before anything paints. Same list and key as Warcalc */
const THEMES = {grey:"Grey", white:"White", black:"Black", optimal:"Optimal", applejack:"Applejack", rainbow:"Rainbow Dash"};
const THEME_FONTS = {
  applejack:"https://fonts.googleapis.com/css2?family=Rye&family=Caudex:ital,wght@0,400;0,700;1,400&display=swap",
  rainbow:"https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
};
const LS_THEME = "warcalc.theme";
function applyTheme(t){
  if (!THEMES[t]) t = "grey";
  if (t === "grey") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  const href = THEME_FONTS[t];
  if (href && !document.querySelector(`link[data-theme-font="${t}"]`)){
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href; l.dataset.themeFont = t;
    document.head.appendChild(l);
  }
  return t;
}
try{ applyTheme(JSON.parse(localStorage.getItem(LS_THEME))); }catch(e){}
</script>

<script>
// the colour of what each building makes (or, for the shops, what it sells)
const RES = {
  oil:"#FF0000", copper:"#FF6A00", apples:"#B6FF00", energy:"#00FFFF", pies:"#FF00DC", cider:"#FFD800",
  coffee:"#FF6A00", gasoline:"#0094FF", gems:"#00FF21", tungsten:"#808080", plastics:"#00FF21",
  drugs:"#FF006E", toys:"#FFFFFF", forbidden:"#C342FF", serum:"#FFFFFF",
  machinery:"#0094FF", precision:"#C342FF", composites:"#FFFFFF"
};
// [game name, resource] in the spreadsheet's order; null marks a group break (blank row in the sheet)
const LAYOUT = [
  ["Basic Copper Mine","copper"],["Mechanized Copper Mine","copper"],["Gem Mine","gems"],["Tungsten Mine","tungsten"],null,
  ["Basic Apple Orchard","apples"],["Mechanized Apple Farm","apples"],["Coffee Farm","coffee"],["Drug Farm","drugs"],null,
  ["Basic Oil Well","oil"],["Mechanized Oil Well","oil"],["Oil Fracker","oil"],null,
  ["Cider Production Facility","cider"],["Energy Collector","energy"],["Oil Combustion Facility","energy"],["Gasoline Combustion Facility","energy"],
  ["Gasoline Refinery","gasoline"],["Plastics Factory","plastics"],["Przewalskian Plastics Factory","plastics"],["Toy Factory","toys"],null,
  ["Bakery","pies"],["Bar","cider"],["Coffee Shop","coffee"],["Statue","copper"],["Toy and Candy Shop","toys"],["Video Arcade","energy"],["Mall"],null,
  ["Basic Factory","machinery"],["Advanced Factory","precision"],["DNA Extraction Facility","composites"],["Barracks","composites"],null,
  ["Moon Worship Center","cider"],["Sun Worship Center","coffee"],null,
  ["Lunar Environmental Facility","cider"],["Solar Environmental Facility","coffee"],["Forbidden Research Facility","forbidden"],["Alicornification Facility","serum"]
];
// the sheet's disabled section is the same list without the buildings that never get
// switched off, so it ends on Forbidden Research
const NEVER_DISABLED = new Set(["Lunar Environmental Facility", "Solar Environmental Facility", "Alicornification Facility"]);
const DISABLED_LAYOUT = LAYOUT.filter(e => !e || !NEVER_DISABLED.has(e[0]));
// alternate names the game uses for the same building
const ALIASES = {
  "mechanized apple orchard": "Mechanized Apple Farm",
  "przewalskian advanced plastics factory": "Przewalskian Plastics Factory",
  "toy & candy shop": "Toy and Candy Shop",
  // the energy collector goes by what it collects; both kinds share the one row
  "solar collector": "Energy Collector",
  "tidal collector": "Energy Collector"
};
const norm = s => s.trim().replace(/\s+/g, " ").toLowerCase();
const KNOWN = new Map();
LAYOUT.forEach(e => { if (e) KNOWN.set(norm(e[0]), e[0]); });

// DNA facilities carry the species they extract ("DNA Extraction Facility - C. Zebrica");
// every one of them counts toward the single DNA row
function lookup(key) {
  if (key.startsWith("dna extraction facility")) return "DNA Extraction Facility";
  return KNOWN.get(key) || ALIASES[key];
}

const $ = id => document.getElementById(id);
const inp = $("in"), out = $("out");
let column = "";

// a count line: "Plastics Factory	35", or with some switched off, "Plastics Factory	35 (4 disabled)".
// The first number is every building of that kind, the disabled ones included
const COUNT_LINE = /^(.*?)[\t ]+([\d,]+)(?:\s*\(\s*([\d,]+)\s+disabled\s*\))?$/i;
const num = s => parseInt(s.replace(/,/g, ""), 10);

// Either the building list on its own, or the whole nation page (Ctrl+A, Ctrl+C):
// when there is a "Buildings" heading, only the count lines straight under it are read
function buildingLines(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim());
  const head = lines.findIndex((l, i) => /^buildings$/i.test(l) && COUNT_LINE.test(lines[i + 1] || ""));
  if (head < 0) return lines.filter(Boolean);
  const out = [];
  for (const l of lines.slice(head + 1)) {
    if (!l) continue;
    if (!COUNT_LINE.test(l)) break;
    out.push(l);
  }
  return out;
}

function parse(text) {
  const counts = new Map(), off = new Map(), unknown = [];
  let n = 0;
  for (const line of buildingLines(text)) {
    const m = line.match(COUNT_LINE);
    if (!m) { unknown.push(line); continue; }
    const name = lookup(norm(m[1]));
    if (!name) { unknown.push(m[1].trim()); continue; }
    counts.set(name, (counts.get(name) || 0) + num(m[2]));
    if (m[3]) off.set(name, (off.get(name) || 0) + num(m[3]));
    n++;
  }
  return { counts, off, unknown, n };
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// one pass of the layout: the copied counts, and the rows shown beside them
function block(counts, layout) {
  const lines = []; let rows = "", total = 0;
  for (const e of layout) {
    if (!e) { lines.push(""); rows += '<div class="oc-row"></div>'; continue; }
    const v = counts.get(e[0]) || 0; total += v;
    lines.push(String(v));
    const res = e[1] ? ` style="--res:${RES[e[1]]}"` : "";
    rows += `<div class="oc-row${v ? "" : " zero"}"><span class="oc-n">${v}</span>`
          + `<span class="oc-lab"${res}>${esc(e[0])}</span></div>`;
  }
  return { lines, rows, total };
}

// the disabled block sits six blank rows below the main one in the sheet
const DISABLED_GAP = 6;

function render() {
  const { counts, off, unknown, n } = parse(inp.value);
  const all = block(counts, LAYOUT), dis = block(off, DISABLED_LAYOUT);
  column = [...all.lines, ...Array(DISABLED_GAP).fill(""), ...dis.lines].join("\n");
  out.innerHTML = all.rows + `<div class="oc-div">Disabled · ${dis.total.toLocaleString()}</div>` + dis.rows;
  $("parsed").textContent = n + " parsed";
  $("total").textContent = all.total.toLocaleString() + " buildings";
  const err = $("errors");
  if (unknown.length) {
    err.className = "alert";
    err.innerHTML = "These lines weren't recognised and were skipped: " + unknown.map(u => "<code>" + esc(u) + "</code>").join(", ");
    err.hidden = false;
  } else err.hidden = true;
}

inp.addEventListener("input", render);
$("clear").addEventListener("click", () => { inp.value = ""; render(); inp.focus(); });
$("copy").addEventListener("click", () => {
  const toast = $("toast");
  const done = msg => { toast.textContent = msg; toast.hidden = false; clearTimeout(done.t); done.t = setTimeout(() => toast.hidden = true, 1400); };
  // only the counts are copied; without the clipboard API they go through a scratch textarea
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = column; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    done(ok ? "Copied" : "Couldn't copy");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(column).then(() => done("Copied"), fallback);
  } else fallback();
});

const toolsBtn = $("btnTools"), toolsPanel = $("toolsPanel");
toolsBtn.addEventListener("click", () => {
  const open = toolsPanel.hidden;
  toolsPanel.hidden = !open;
  toolsBtn.classList.toggle("open", open);
  toolsBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
{
  const sel = $("themeSel");
  sel.innerHTML = Object.entries(THEMES).map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  sel.value = document.documentElement.dataset.theme || "grey";
  sel.addEventListener("change", () => {
    const t = applyTheme(sel.value);
    try { localStorage.setItem(LS_THEME, JSON.stringify(t)); } catch (e) {}
  });
}

render();

/* ===================== planner =====================
   Each nation is an envelope holding what it Has: the spreadsheet column from the
   Buildings tab pasted back in, read by position, and from that its net per tick */

// [key, name, colour, image file] in the game's resource order
const PLAN_RES = [
  ["oil", "Oil", "#FF0000", "Oil"],
  ["copper", "Copper", "#FF6A00", "Copper"],
  ["apples", "Apples", "#B6FF00", "Apples"],
  ["energy", "Energy", "#00FFFF", "Energy"],
  ["vparts", "Vehicle Parts", "#FF0000", "Vehicle Parts"],
  ["mparts", "Machinery Parts", "#0094FF", "Machine Parts"],
  ["pies", "Pies", "#FF00DC", "Pie"],
  ["cider", "Cider", "#FFD800", "Cider"],
  ["coffee", "Coffee", "#FF6A00", "Coffee"],
  ["gasoline", "Gasoline", "#0094FF", "Gasoline"],
  ["gems", "Gems", "#00FF21", "Gems"],
  ["tungsten", "Tungsten", "#808080", "Tungsten"],
  ["plastics", "Plastics", "#00FF21", "Plastics"],

const resImg = img => `<img class="res-ic" src="${IMG_BASE}${encodeURIComponent(img)}.png" alt="" loading="lazy">`;
const RES_BY_KEY = Object.fromEntries(PLAN_RES.map(r => [r[0], r]));

// what one working building makes (+) and burns (−) every tick, from the game's own descriptions
const TICK = {
  "Basic Copper Mine": { copper: 5 },
  "Mechanized Copper Mine": { copper: 8, energy: -1 },
  "Gem Mine": { gems: 3, coffee: -1, energy: -1 },
  "Tungsten Mine": { tungsten: 4, cider: -1, energy: -1 },
  "Basic Apple Orchard": { apples: 5 },
  "Mechanized Apple Farm": { apples: 8, energy: -1 },
  "Coffee Farm": { coffee: 5, energy: -1 },
  "Drug Farm": { drugs: 10 },
  "Basic Oil Well": { oil: 5 },
  "Mechanized Oil Well": { oil: 8, energy: -1 },
  "Oil Fracker": { oil: 20, energy: -2 },
  "Cider Production Facility": { cider: 5, apples: -5, energy: -1 },
  "Energy Collector": { energy: 1 },
  "Oil Combustion Facility": { energy: 12, oil: -8 },
  "Gasoline Combustion Facility": { energy: 12, gasoline: -8 },
  "Gasoline Refinery": { gasoline: 8, oil: -10 },
  "Plastics Factory": { plastics: 4, oil: -4, energy: -1 },
  "Przewalskian Plastics Factory": { plastics: 5, oil: -4, energy: -1 },
  "Toy Factory": { toys: 3, plastics: -1, energy: -1 },
  "Bakery": { pies: 3, apples: -2, energy: -1 },
  "Bar": { cider: -3, pies: -1 },
  "Coffee Shop": { coffee: -3, pies: -1 },
  "Toy and Candy Shop": { apples: -4, pies: -4, toys: -4 },
  "Video Arcade": { energy: -5, pies: -1 },
  "Mall": { vparts: -5, mparts: -2, toys: -5, coffee: -5, cider: -5, gems: -2, apples: -5, pies: -5, gasoline: -5, energy: -10 },
  "Basic Factory": { energy: -1 },
  "Advanced Factory": { energy: -2 },
  "DNA Extraction Facility": { apples: -1 },
  "Moon Worship Center": { cider: -2, energy: -6 },
  "Sun Worship Center": { coffee: -2, energy: -6 },
  "Lunar Environmental Facility": { energy: -5 },
  "Solar Environmental Facility": { energy: -5 },
  "Forbidden Research Facility": { forbidden: 1 }
};

// sat a tick from each working building: [per building, how many before the environment
// starts to object, divisor]. Past the soft cap it costs roundup((n − cap)² / divisor) more,
// cut by 10% for every environmental facility
const SAT = {
  "Basic Copper Mine": [-2, 10, 10], "Mechanized Copper Mine": [-1, 20, 5], "Gem Mine": [-1, 7, 5], "Tungsten Mine": [-1, 7, 5],
  "Basic Apple Orchard": [-2, 10, 10], "Mechanized Apple Farm": [-1, 20, 5], "Coffee Farm": [-1, 15, 10],
  "Basic Oil Well": [-2, 10, 10], "Mechanized Oil Well": [-1, 20, 5], "Oil Fracker": [-2, 5, 5],
  "Oil Combustion Facility": [-2, 5, 5], "Plastics Factory": [-1, 7, 5], "Przewalskian Plastics Factory": [-1, 1, 5],
  "Bakery": [1], "Bar": [10], "Coffee Shop": [10], "Statue": [1], "Toy and Candy Shop": [30], "Video Arcade": [10], "Mall": [50],
  "Basic Factory": [-1, 20, 10], "Advanced Factory": [-1, 5, 5], "DNA Extraction Facility": [0, 1, 1], "Barracks": [0, 1, 1]
};

// what each government does: flat sat, superpower relations, GDP multiplier [normally, at max sat],
// the divisor on the empire penalty, and what it eats every tick. The two ascension stages
// carry their own upkeep here rather than on the Alicornification Facility
const GOVS = {
  "Loose Despotism":  { gdp: [1, 2] },
  "Democracy":        { sat: 15, se: -3, nlr: 2, gdp: [1, 2.5], upkeep: { gasoline: 20, vparts: 2 } },
  "Repression":       { se: 2, nlr: -3, gdp: [2, 2], upkeep: { gasoline: 10 } },
  "Decentralization": { sat: 30, se: -3, nlr: 4, gdp: [1, 3], upkeep: { gasoline: 50, vparts: 5 } },
  "Authoritarianism": { se: 4, nlr: -3, gdp: [2.5, 2.5], upkeep: { gasoline: 10, mparts: 3 } },
  "Oppression":       { se: 6, nlr: -3, gdp: [3, 3], empireDiv: 3, upkeep: { gasoline: 10, mparts: 5 } },
  "Independence":     { sat: 50, se: -3, nlr: 6, gdp: [1, 3.5], upkeep: { gasoline: 40, vparts: 4 } },
  "Alicorn Elite":    { gdp: [6, 6], empireDiv: 3, upkeep: { energy: 100, apples: 50 } },
  "Transponyism":     { gdp: [8, 8], empireDiv: 3, upkeep: { energy: 300, apples: 150 } }
};
const ECONOMIES = {
  "Poorly Defined":   {},
  "Free Market":      { se: -3, nlr: 1, upkeep: { coffee: 6 } },
  "State Controlled": { se: 1, nlr: -3, upkeep: { cider: 6 } }
};
const DEFAULT_GOV = "Loose Despotism", DEFAULT_ECON = "Poorly Defined";

const ENV_COLOURS = ["#d6b47a", "#b98a5b", "#c4574c", "#d98a3d", "#e0c44c", "#7fa65a",
                     "#4f9c97", "#5b86c4", "#8a6bbf", "#d27fb0", "#8d9096", "#3c3f45"];
const MANILA = ENV_COLOURS[0];
const isColour = c => /^#[0-9a-f]{6}$/i.test(c || "");

const LS_NATIONS = "buildplanner.nations";
let nations = [];
try { nations = JSON.parse(localStorage.getItem(LS_NATIONS)) || []; } catch (e) {}
if (!Array.isArray(nations)) nations = [];
const saveNations = () => { try { localStorage.setItem(LS_NATIONS, JSON.stringify(nations)); } catch (e) {} };
const nationName = n => n.name.trim() || "Untitled";

// The Has box takes the Buildings tab's column back, read by row: the main block, six
// blank rows, then the disabled block. A paste of the game's own list works too
function parseHas(text) {
  if (/[a-z]/i.test(text)) {
    const { counts, off, unknown } = parse(text);
    return { counts, off, warn: unknown.length ? "Skipped: " + unknown.join(", ") : "", note: "Read as a paste from the game" };
  }
  const counts = new Map(), off = new Map();
  const lines = text.replace(/^(\s*\n)+/, "").replace(/\s+$/, "").split(/\r?\n/).map(s => s.trim());
  if (!lines[0]) return { counts, off, warn: "", note: "" };
  let shifted = false; const bad = [];
  const read = (layout, from, into) => layout.forEach((e, i) => {
    const s = lines[from + i] || "";
    if (!e) { if (s) shifted = true; return; }
    if (!s) return;
    const v = s.replace(/[,\s]/g, "");
    if (!/^\d+$/.test(v)) { bad.push(s); return; }
    if (+v) into.set(e[0], +v);
  });
  read(LAYOUT, 0, counts);
  const disStart = LAYOUT.length + DISABLED_GAP;
  for (let i = LAYOUT.length; i < disStart; i++) if (lines[i]) shifted = true;
  read(DISABLED_LAYOUT, disStart, off);
  const warn = [];
  if (shifted) warn.push("A number sits where a blank row should be, so the paste looks shifted. Copy the whole column from the top.");
  if (bad.length) warn.push("Not numbers: " + bad.slice(0, 5).join(", "));
  if (lines.length > disStart + DISABLED_LAYOUT.length) warn.push("Rows past the disabled block were ignored.");
  const note = lines.length <= LAYOUT.length ? "No disabled block, so everything counts as switched on" : "";
  return { counts, off, warn: warn.join(" "), note };
}

const sumMap = m => [...m.values()].reduce((a, b) => a + b, 0);

// Everything one tick does for a nation, from its working buildings and its government:
// each resource's makers and users, and where its sat, GDP and relations come from
function nationModel(n, counts, off) {
  const gov = GOVS[n.gov] || GOVS[DEFAULT_GOV], econ = ECONOMIES[n.econ] || ECONOMIES[DEFAULT_ECON];
  const govName = GOVS[n.gov] ? n.gov : DEFAULT_GOV, econName = ECONOMIES[n.econ] ? n.econ : DEFAULT_ECON;
  const has = name => counts.get(name) || 0;
  const off1 = name => Math.min(off.get(name) || 0, has(name));
  const on = name => has(name) - off1(name);

  const res = {};
  const R = k => res[k] || (res[k] = { made: 0, used: 0, makers: [], users: [] });
  for (const [name, per] of Object.entries(TICK)) {
    const c = on(name); if (!c) continue;
    for (const [k, a] of Object.entries(per)) {
      const v = a * c, r = R(k);
      if (v > 0) { r.made += v; r.makers.push([name, c, v]); } else { r.used -= v; r.users.push([name, c, v]); }
    }
  }
  for (const [src, label] of [[gov, govName], [econ, econName]])
    for (const [k, a] of Object.entries(src.upkeep || {})) { const r = R(k); r.used += a; r.users.push([label, 0, -a]); }

  // sat: [label, count, value, of which environmental]
  const sat = [];
  const envCut = 0.9 ** (has("Lunar Environmental Facility") + has("Solar Environmental Facility"));
  let disabled = 0;
  for (const e of LAYOUT) {
    if (!e) continue;
    disabled += off1(e[0]);
    const s = SAT[e[0]], c = on(e[0]);
    if (!s || !c) continue;
    const [per, cap, div] = s;
    const env = cap != null && c > cap ? Math.round(Math.ceil((c - cap) ** 2 / div) * envCut) : 0;
    if (per * c - env) sat.push([e[0], c, per * c - env, env]);
  }
  if (disabled) sat.push(["Disabled buildings", disabled, -disabled, 0]);
  if (gov.sat) sat.push([govName, 0, gov.sat, 0]);
  const army = Math.max(0, Math.floor(+n.army || 0)), empire = Math.max(1, Math.floor(+n.empire || 1));
  if (army > 20) sat.push(["Army past 20 units", army - 20, -Math.ceil((army - 20) / 2), 0]);
  if (empire > 1) sat.push([`Empire of ${empire} nations`, 0, -Math.ceil((empire - 1) ** 2 * 20 / (gov.empireDiv || 1)), 0]);
  if (n.maxSat) sat.push(["Kept spare to hold max sat", 0, -30, 0]);

  // GDP, in thousands of bits
  const gdpParts = [["Base", 0, 50], ["Mall", on("Mall"), on("Mall") * 250],
                    ["Basic Factory", on("Basic Factory"), on("Basic Factory") * 10],
                    ["Advanced Factory", on("Advanced Factory"), on("Advanced Factory") * 20]].filter(p => p[2]);
  const mult = gov.gdp[n.maxSat ? 1 : 0];

  // relations with the Solar Empire and the New Lunar Republic
  const rep = (worship, side) => [
    ["Drug Farm", on("Drug Farm"), -on("Drug Farm")],
    ["Forbidden Research Facility", on("Forbidden Research Facility"), -15 * on("Forbidden Research Facility")],
    [worship, on(worship), on(worship)],
    [govName, 0, gov[side] || 0],
    [econName, 0, econ[side] || 0]
  ].filter(p => p[2]);

  const total = parts => parts.reduce((a, p) => a + p[2], 0);
  const se = rep("Sun Worship Center", "se"), nlr = rep("Moon Worship Center", "nlr");
  return {
    res, sat, satTotal: total(sat), gdpParts, gdpBase: total(gdpParts), mult, gdp: total(gdpParts) * mult,
    se, seTotal: total(se), nlr, nlrTotal: total(nlr), govName, econName
  };
}

const fmt = n => n.toLocaleString();
const cls = v => v > 0 ? " pos" : v < 0 ? " neg" : "";
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));

const envGrid = $("envGrid");

         + `<span class="env-sub">${fmt(total)} building${total === 1 ? "" : "s"}</span></span></button>`;
  }).join("") + `<button class="env env-new" type="button" id="envNew" title="New nation"><b>+</b><span>New nation</span></button>`;
}

let current = null;
const nName = $("nName"), nHas = $("nHas");

function renderSwatches() {
  const c = isColour(current.color) ? current.color.toLowerCase() : MANILA;
  const custom = !ENV_COLOURS.includes(c);

function renderNation() {
  const { counts, off, warn, note } = parseHas(current.has || "");
  const total = sumMap(counts), totalOff = sumMap(off);
  $("nHasBadge").textContent = fmt(total) + " buildings" + (totalOff ? ` · ${fmt(totalOff)} off` : "");
  const hn = $("nHasNote");
  hn.textContent = warn || note || (current.has ? "" : "Paste the column the Buildings tab copies.");
  hn.className = "has-note" + (warn ? " warn" : "");
  hn.hidden = !hn.textContent;

  // what it has, in the sheet's order and groups, leaving out what it has none of
  let rows = "", gap = false;
  for (const e of LAYOUT) {
    if (!e) { gap = !!rows; continue; }
    const v = counts.get(e[0]); if (!v) continue;
    if (gap) { rows += '<div class="bl-gap"></div>'; gap = false; }
    const o = off.get(e[0]);
    rows += `<div class="bl-row"><span class="bl-n">${fmt(v)}</span>`
          + `<span class="bl-name"${e[1] ? ` style="--res:${RES[e[1]]}"` : ""}>${esc(e[0])}</span>`
          + (o ? `<span class="bl-off">${fmt(o)} off <span class="bl-on">(${fmt(Math.max(0, v - o))})</span></span>` : "") + "</div>";
  }
  $("nBuildings").innerHTML = rows;

  const m = nationModel(current, counts, off);
  tips.clear();
  const stat = (key, label, value, text) =>
    `<div class="stat well" tabindex="0" data-tip="${key}"><span class="stat-k">${label}</span>`
    + `<span class="stat-v${key === "gdp" ? "" : cls(value)}">${text}</span></div>`;
  $("nStats").innerHTML = stat("sat", "Sat", m.satTotal, signed(m.satTotal))
    + stat("gdp", "GDP", m.gdp, fmt(m.gdp) + "k")
    + stat("se", "Solar Empire", m.seTotal, signed(m.seTotal))
    + stat("nlr", "New Lunar Republic", m.nlrTotal, signed(m.nlrTotal));
  tips.set("sat", tipSat(m));
  tips.set("gdp", tipGdp(m));
  tips.set("se", tipParts("Solar Empire relations", m.se, m.seTotal));
  tips.set("nlr", tipParts("New Lunar Republic relations", m.nlr, m.nlrTotal));

  $("nNets").innerHTML = PLAN_RES.map(([k, label, col, img]) => {
    const r = m.res[k] || { made: 0, used: 0, makers: [] }, net = r.made - r.used;
    tips.set(k, tipMade(label, col, img, r));
    return `<div class="net${r.made || r.used ? "" : " idle"}" style="--res:${col}" tabindex="0" data-tip="${k}">`
         + `${resImg(img)}`
         + `<span class="net-name">${label}</span>`
         + `<span class="net-val${cls(net)}">${signed(net)}</span></div>`;
  }).join("");
  renderSlips({ counts, off }, m);
  hideTip();
}

/* ---- hover cards ---- */
const tips = new Map();
const tipRow = (name, count, value, extra) =>
  `<div class="tip-row"><span>${esc(name)}${count ? ` <span class="n">×${fmt(count)}</span>` : ""}</span>`
  + `<span class="v">${value}</span><span class="p">${extra || ""}</span></div>`;

// what makes a resource, before anything eats it, and each maker's share
function tipMade(label, col, img, r) {
  let h = `<div class="tip-head" style="--res:${col}">${resImg(img)}`
        + `<span class="tip-name">${label}</span><span class="tip-total">${fmt(r.made)} made a tick</span></div>`;
  if (!r.made) return h + `<div class="tip-none">Nothing here makes ${label.toLowerCase()}.</div>`;
  for (const [name, c, v] of [...r.makers].sort((a, b) => b[2] - a[2])) {
    const pct = v / r.made * 100;
    h += tipRow(name, c, "+" + fmt(v), pct < 1 ? "<1%" : Math.round(pct) + "%")
       + `<div class="tip-bar" style="--res:${col};width:${pct}%"></div>`;
  }
  return h;
}
function tipSat(m) {
  let h = `<div class="tip-head"><span class="tip-name">Sat</span><span class="tip-total">${signed(m.satTotal)} a tick</span></div>`;
  if (!m.sat.length) return h + '<div class="tip-none">Nothing here moves sat.</div>';
  const gains = m.sat.filter(p => p[2] > 0).sort((a, b) => b[2] - a[2]);
  const losses = m.sat.filter(p => p[2] < 0).sort((a, b) => a[2] - b[2]);
  const sum = ps => ps.reduce((a, p) => a + p[2], 0);
  const list = ps => ps.map(([name, c, v, env]) => tipRow(name, c, signed(v))
    + (env ? `<div class="tip-row"><span class="sub">${fmt(env)} of that from the environment</span></div>` : "")).join("");
  if (gains.length) h += `<div class="tip-sec">Gains ${signed(sum(gains))}</div>` + list(gains);
  if (losses.length) h += `<div class="tip-sec">Losses ${signed(sum(losses))}</div>` + list(losses);
  return h;
}
function tipGdp(m) {
  return `<div class="tip-head"><span class="tip-name">GDP</span><span class="tip-total">${fmt(m.gdp)}k a tick</span></div>`
    + m.gdpParts.map(([name, c, v]) => tipRow(name, c, fmt(v) + "k")).join("")
    + `<div class="tip-sec">× ${m.mult} for ${esc(m.govName)}</div>`;
}
function tipParts(title, parts, t) {
  return `<div class="tip-head"><span class="tip-name">${title}</span><span class="tip-total">${signed(t)} a tick</span></div>`
    + (parts.length ? parts.map(([name, c, v]) => tipRow(name, c, signed(v))).join("")
                    : '<div class="tip-none">Nothing here moves it.</div>');
}

const tipEl = $("tip");
let tipFor = null;
function showTip(el) {
  const html = tips.get(el.dataset.tip);
  if (!html) return;
  if (tipFor) tipFor.classList.remove("tip-on");
  tipFor = el; el.classList.add("tip-on");
  tipEl.innerHTML = html; tipEl.hidden = false;
  // under the thing it explains, or above it when there's no room, and never off the side
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  const x = Math.min(Math.max(8, r.left), innerWidth - t.width - 8);
  const y = r.bottom + 6 + t.height <= innerHeight - 8 ? r.bottom + 6 : Math.max(8, r.top - 6 - t.height);
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
function hideTip() {
  if (tipFor) tipFor.classList.remove("tip-on");
  tipFor = null; tipEl.hidden = true;
}
document.addEventListener("mouseover", ev => { const el = ev.target.closest("[data-tip]"); if (el && el !== tipFor) showTip(el); });
document.addEventListener("mouseout", ev => {

document.addEventListener("focusin", ev => { const el = ev.target.closest("[data-tip]"); if (el) showTip(el); });

// the slip papers Grand Strategy hands out
const PAPERS = {
  coal:  { paper: "#25282c", ink: "#d6d3cc" },
  ember: { paper: "#30251f", ink: "#e0cfbd" },
  wine:  { paper: "#321f27", ink: "#e3ccd4" },
  moss:  { paper: "#1f2b24", ink: "#cddfd2" },
  navy:  { paper: "#1c2531", ink: "#cbd9e7" },
  plum:  { paper: "#292233", ink: "#dbd0eb" },
  ash:   { paper: "#33373c", ink: "#e2e2e2" }
};
const PAPER_CYCLE = ["wine", "navy", "moss", "ember", "plum", "ash", "coal"];
const paperStyle = pl => { const c = PAPERS[pl.paper] || PAPERS.coal; return `--paper:${c.paper};--ink:${c.ink}`; };
const planName = pl => pl.name.trim() || "Untitled plan";
const BIT = "฿";

// the plan's Want and Disabled columns; a row nobody typed in follows Has, and the
// disabled count never runs past what the plan has of that building
const planWant = (pl, has, n) => pl.want && Number.isFinite(pl.want[n]) ? pl.want[n] : has.counts.get(n) || 0;
const planOffTyped = (pl, has, n) => pl.off && Number.isFinite(pl.off[n]) ? pl.off[n] : has.off.get(n) || 0;
function planCounts(pl, has) {
  const counts = new Map(), off = new Map();
  for (const e of LAYOUT) {
    if (!e) continue;
    const w = planWant(pl, has, e[0]);
    if (w) counts.set(e[0], w);
    const o = Math.min(planOffTyped(pl, has, e[0]), w);
    if (o) off.set(e[0], o);
  }
  return { counts, off };
}

function planCost(has, want, prze) {
  const h = n => has.get(n) || 0, w = n => want.get(n) || 0;
  const builds = {};
  for (const n of Object.keys(BUILD)) builds[n] = Math.max(0, w(n) - h(n));
  for (const [n, b] of Object.entries(BUILD)) if (b.from) builds[b.from] = Math.max(0, w(b.from) - h(b.from) + builds[n]);
  let bits = 0, sat = 0, count = 0;
  const res = {}, lines = [];
  for (const e of LAYOUT) {
    if (!e || !builds[e[0]]) continue;
    const b = BUILD[e[0]], n = builds[e[0]];
    const each = Array.isArray(b.bits) ? b.bits[prze ? 1 : 0] : b.bits;
    bits += each * n; sat += (b.sat || 0) * n; count += n;
    for (const [k, a] of Object.entries(b.res || {})) res[k] = (res[k] || 0) + a * n;
    lines.push([e[0], n, each * n]);
  }
  return { bits, res, sat, count, lines };
}

// the rows a plan changes, in the sheet's order: [building, change in count, change in how many are off]
function planDiff(has, want) {
  const out = [];
  for (const e of LAYOUT) {
    if (!e) continue;
    const n = e[0];
    const d = (want.counts.get(n) || 0) - (has.counts.get(n) || 0);
    const o = (want.off.get(n) || 0) - Math.min(has.off.get(n) || 0, has.counts.get(n) || 0);
    if (d || o) out.push([n, d, o]);
  }
  return out;
}

const shortBits = n => {
  const a = Math.abs(n);
  for (const [u, suf] of [[1e9, "bil"], [1e6, "mil"], [1e3, "k"]])
    if (a >= u) return +(n / u).toFixed(a / u >= 100 ? 0 : a / u >= 10 ? 1 : 2) + suf;
  return fmt(n);
};

/* ---- the slips under a nation ---- */
function renderSlips(has, now) {
  const plans = current.plans || [];
  $("nPlans").innerHTML = plans.map(pl => {
    const want = planCounts(pl, has), after = nationModel(current, want.counts, want.off);
    const diff = planDiff(has, want), cost = planCost(has.counts, want.counts, current.prze);
    const row = (l, v, c) => `<div class="slip-l${c ? " " + c : ""}"><span>${l}</span><span class="v">${v}</span></div>`;
    const swing = (label, a, b, f) => a === b ? "" : row(label, `<span class="was">${f(a)} →</span> <span class="${cls(b - a).trim()}">${f(b)}</span>`);
    const resRows = PLAN_RES.map(([k, label, , img]) => {
      const r0 = now.res[k], r1 = after.res[k];
      const a = r0 ? r0.made - r0.used : 0, b = r1 ? r1.made - r1.used : 0;
      return swing(`${resImg(img)} ${label}`, a, b, signed);
    }).join("");
    return `<div class="slip" role="button" tabindex="0" data-plan="${esc(pl.id)}" style="${paperStyle(pl)}">
      <div class="slip-name">${esc(planName(pl))}</div>
      <div class="slip-meta">${diff.length ? `${diff.length} change${diff.length === 1 ? "" : "s"}` : "no changes yet"}</div>
      <div class="slip-cut"></div>
      ${diff.map(([n, d, o]) => (d ? row(`<span class="q ${cls(d).trim()}">${signed(d)}</span>${esc(n)}`, "") : "")
        + (o ? row(`<span class="q ${cls(-o).trim()}">${fmt(Math.abs(o))}</span>${esc(n)} ${o < 0 ? "switched on" : "switched off"}`, "") : "")).join("")
        || '<div class="slip-none">Same as Has</div>'}
      <div class="slip-cut"></div>
      ${cost.count ? row(`<span class="bit">${BIT}</span> Total`, fmt(cost.bits), "slip-tot") : '<div class="slip-none">Nothing to build</div>'}
      ${PLAN_RES.filter(r => cost.res[r[0]]).map(([k, label, , img]) => row(`${resImg(img)} ${label}`, fmt(cost.res[k]))).join("")}
      <div class="slip-cut double"></div>
      <div class="slip-sub">A tick after</div>
      ${swing("Sat", now.satTotal, after.satTotal, signed) + swing("GDP", now.gdp, after.gdp, v => fmt(v) + "k")
        + swing("Solar Empire", now.seTotal, after.seTotal, signed) + swing("New Lunar Republic", now.nlrTotal, after.nlrTotal, signed)
        + resRows || '<div class="slip-none">No change</div>'}
    </div>`;
  }).join("") + `<button class="slip slip-new" type="button" id="planNew"><b>+</b><span>New plan</span></button>`;
}

// the table is drawn once when the plan opens, so typing in it never loses its place
function renderPlanTable() {

          + `<input type="number" min="0" step="1" inputmode="numeric" data-col="off" class="pt-off" value="${planOffTyped(plan, has, e[0])}" aria-label="Disabled ${esc(e[0])}">`

function markRows(has) {

// a cleared box goes back to what Has says
$("pTable").addEventListener("change", ev => {
  const r = ev.target.closest("[data-b]"), col = ev.target.dataset.col;
  if (!r || !col || ev.target.value.trim() !== "") return;
  const has = parseHas(current.has || "");
  ev.target.value = col === "want" ? planWant(plan, has, r.dataset.b) : planOffTyped(plan, has, r.dataset.b);
});
$("pReset").addEventListener("click", () => { plan.want = {}; plan.off = {}; saveNations(); renderPlanTable(); renderPlanCalc(); });

let showDiff = true;
try { showDiff = localStorage.getItem("buildplanner.planDiff") !== "0"; } catch (e) {}
$("pNets").addEventListener("click", ev => {
  if (!ev.target.closest(".diff-tog")) return;
  showDiff = !showDiff;
  try { localStorage.setItem("buildplanner.planDiff", showDiff ? "1" : "0"); } catch (e) {}
  ev.target.closest(".diff-tog").setAttribute("aria-expanded", showDiff);
  $("pNets").querySelector("tr.diff").classList.toggle("hidden", !showDiff);
});

function renderPlanCalc(has = parseHas(current.has || "")) {
  const want = planCounts(plan, has);
  const now = nationModel(current, has.counts, has.off), after = nationModel(current, want.counts, want.off);
  tips.clear();
  const half = (key, side, v, f, colour) =>
    `<div class="stat-half" tabindex="0" data-tip="${key}"><small>${side}</small><span class="stat-v${colour ? cls(v) : ""}">${f(v)}</span></div>`;
  const stat = (key, label, a, b, f, colour) =>
    `<div class="stat stat2 well"><span class="stat-k">${label}</span><div class="stat-halves">`
    + half("h-" + key, "Has", a, f, colour) + half("p-" + key, "Want", b, f, colour) + "</div></div>";
  const k = v => fmt(v) + "k";
  $("pStats").innerHTML = stat("sat", "Sat", now.satTotal, after.satTotal, signed, true)
    + stat("gdp", "GDP", now.gdp, after.gdp, k)
    + stat("se", "Solar Empire", now.seTotal, after.seTotal, signed, true)
    + stat("nlr", "New Lunar Republic", now.nlrTotal, after.nlrTotal, signed, true);
  for (const [pre, m] of [["h-", now], ["p-", after]]) {
    tips.set(pre + "sat", tipSat(m));
    tips.set(pre + "gdp", tipGdp(m));
    tips.set(pre + "se", tipParts("Solar Empire relations", m.se, m.seTotal));
    tips.set(pre + "nlr", tipParts("New Lunar Republic relations", m.nlr, m.nlrTotal));
  }

  const net = r => r ? r.made - r.used : 0;
  const cell = (key, v, sign) => `<td tabindex="0"${key ? ` data-tip="${key}"` : ""} class="${v ? cls(v).trim() : "zero"}">${v ? sign(v) : "0"}</td>`;
  let head = '<tr><th></th>', rh = '<tr><th scope="row">Has</th>', rw = '<tr><th scope="row">Want</th>';
  let rd = `<tr class="diff${showDiff ? "" : " hidden"}"><th scope="row"><button type="button" class="diff-tog" aria-expanded="${showDiff}">Difference</button></th>`;
  for (const [key, label, col, img] of PLAN_RES) {
    const r0 = now.res[key] || { made: 0, used: 0, makers: [] }, r1 = after.res[key] || { made: 0, used: 0, makers: [] };
    tips.set("h-" + key, tipMade(label, col, img, r0));
    tips.set("p-" + key, tipMade(label, col, img, r1));
    const a = net(r0), b = net(r1);
    head += `<th title="${label}">${resImg(img)}</th>`;
    rh += cell("h-" + key, a, signed);
    rw += cell("p-" + key, b, signed);
    rd += `<td class="${b - a ? cls(b - a).trim() : "zero"}">${b - a ? signed(b - a) : "·"}</td>`;
  }
  $("pNets").innerHTML = `<div class="ptab-wrap"><table class="ptab"><col class="lab"><thead>${head}</tr></thead><tbody>${rh}</tr>${rw}</tr>${rd}</tr></tbody></table></div>`;

  const cost = planCost(has.counts, want.counts, current.prze);
  const line = (l, v, c) => `<div class="cost-l${c ? " " + c : ""}">${l}<span class="v">${v}</span></div>`;
  $("pCost").innerHTML = !cost.count ? '<p class="cost-none">Nothing to build. Raise a Want above its Has and the bill shows here.</p>'
    : line(`<span class="bit">${BIT}</span> Bits`, fmt(cost.bits), "cost-tot")
    + PLAN_RES.filter(r => cost.res[r[0]]).map(([k, label, , img]) => line(`${resImg(img)} ${label}`, fmt(cost.res[k]))).join("")
    + `<div class="cost-sub">${fmt(cost.count)} to build</div>`
    + cost.lines.map(([n, c, b]) => line(`${esc(n)} <span class="n" style="color:var(--text-dim)">×${fmt(c)}</span>`, shortBits(b))).join("");
  hideTip();
}

pName.addEventListener("input", () => { plan.name = pName.value; saveNations(); document.title = planName(plan) + " · " + nationName(current); });
$("pPrze").addEventListener("change", ev => { current.prze = ev.target.checked; saveNations(); renderPlanCalc(); });
const toNation = () => go("#planner/" + current.id);
$("pBack").addEventListener("click", toNation);
$("pNation").addEventListener("click", toNation);
$("pDelete").addEventListener("click", () => {
  if (!confirm(`Delete ${planName(plan)}? This can't be undone.`)) return;
  current.plans = current.plans.filter(x => x !== plan); saveNations();
  toNation();
});

/* views: Buildings at the bare address, the envelopes at #planner, one nation at #planner/<id> */
const views = { buildings: $("viewBuildings"), planner: $("viewPlanner"), nation: $("viewNation"), plan: $("viewPlan") };
function show(view) {
  for (const [k, el] of Object.entries(views)) el.hidden = k !== view;
  document.querySelectorAll(".tab[data-view]").forEach(t =>
    t.classList.toggle("active", t.dataset.view === (view === "nation" || view === "plan" ? "planner" : view)));
}
// popstate and hashchange can both fire for one step back, so a nation already
// open is left alone rather than refilled under the cursor
function route() {
  const m = location.hash.match(/^#planner(?:\/([^/]+)(?:\/([^/]+))?)?$/);
  const next = m && m[1] ? nations.find(n => n.id === decodeURIComponent(m[1])) || null : null;
  const nextPlan = next && m[2] ? (next.plans || []).find(p => p.id === decodeURIComponent(m[2])) || null : null;
  if (nextPlan) {
    if (nextPlan !== plan || views.plan.hidden) {
      current = next; plan = nextPlan;
      if (!plan.want) plan.want = {};
      if (!plan.off) plan.off = {};
      $("pNation").textContent = nationName(current);
      $("pEnv").style.setProperty("--env", isColour(current.color) ? current.color : MANILA);
      pName.value = plan.name; $("pPrze").checked = !!current.prze;
      renderPapers(); renderPlanTable(); renderPlanCalc(); show("plan");
      document.title = planName(plan) + " · " + nationName(current);
      window.scrollTo(0, 0);
    }
    return;
  }
  plan = null;
  if (next) {
    if (next !== current || views.nation.hidden) {
      current = next;
      nName.value = current.name; nHas.value = current.has || "";
      fillGov(); renderSwatches(); renderNation(); show("nation");
      document.title = nationName(current) + " · CLOP Build Planner";
      window.scrollTo(0, 0);
    }
    return;
  }
  current = null; hideTip();
  document.title = "CLOP Build Planner";
  if (m) { renderGrid(); show("planner"); } else show("buildings");
}
function go(hash) {
  const url = hash || location.pathname + location.search;
  if ((location.hash || "") !== hash) history.pushState(null, "", url);
  route();
}
document.querySelectorAll(".tab[data-view]").forEach(t =>
  t.addEventListener("click", () => go(t.dataset.view === "planner" ? "#planner" : "")));
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();
</script>

</body>
</html>
